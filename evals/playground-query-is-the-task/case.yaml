# Guardrail: inputs that define the requested query remain part of the submission.
# Baseline 015b1b9c2 and the configuration/case paragraph both passed 2/2;
# this guards the distinction between inspection cases and the user's task data.
description: playground-query-is-the-task
metadata:
  purpose: 'Playground: task data belongs in the submitted configuration when the user is choosing that
    data.'
  tags:
  - playground
vars:
  prompt: |
    Make a Leaf query explorer. The user wants to define the production alert query:
    choose an event stream, add or remove filters, edit filter values, and reorder
    them. The preview shows the records the selected query matches. Copy and
    submit must instruct an agent to implement exactly that query.
    Read packages/playground/instructions/author.md inside the leaf skill's base
    directory. Reply with HTML and a page module; the page directory is not
    reachable here. Use a placeholder for the result-table renderer.
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-playground-instructions
  value: file://reference-read.cjs
  config:
    path: skills/leaf/packages/playground/instructions/author\.md
- type: llm-rubric
  metric: task-data-is-submitted
  value: |
    Pass if stream selection and the complete ordered filters remain part of the
    submitted playground configuration, using controls and/or registered
    contributors, and the derived instruction specifies the chosen query.
    Fail if stream or filter edits are treated as disposable preview cases and
    omitted from the submitted task. The user must be able to add, remove, edit,
    and reorder filters.
