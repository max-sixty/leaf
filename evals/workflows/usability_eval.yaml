      transform: context.metadata.texts?.["release-note"] ?? ''
    - type: llm-rubric
      metric: draft_kept_user_words
      value: The release note says merchants need no code changes.
      transform: context.metadata.texts?.["release-note"] ?? ''
    - type: llm-rubric
