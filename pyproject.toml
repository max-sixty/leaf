# The developer's environment, not the plugin's.
#
# What leaf itself needs is declared in `interact.py`'s PEP 723 header and
# resolved by `uv` through the host's own index — that is what lets the plugin
# install with no build step and no venv, and this file does not change it. What
# `uv.lock` pins below is the developer's reproducibility; the payload carries
# floors and no lock of its own, per the root `CLAUDE.md`.
#
# What is here is what the *suite* needs: that same set, because the tests load
# `interact.py` by path and so import its dependencies into their own process,
# plus the browser driver, pytest, and what `scripts/` imports. The scripts are
# stdlib-only bar the demo recorder, and that one runs here rather than carrying
# a header and a lock of its own: it is a developer's tool like the suite, not
# payload like `interact.py`, so one environment covers both and there is one
# place to bump.
#
# The overlap is a mirror, not a second source of truth. A dependency
# `interact.py` gains and this file doesn't fails the suite on the next run with
# an ImportError, so the two cannot drift quietly — which is the only kind of
# drift worth defending against.
#
# `uv.lock` beside it pins the whole resolution, so a run installs what was last
# tested rather than whatever released this morning, and `setup-uv` has a file to
# key its cache on.

[project]
name = "leaf"
version = "0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-xdist>=3",
  "playwright>=1.49",
  "axe-playwright-python>=0.1.4",
  # scripts/record-demo.py, which draws its frames.
  "pillow>=11",
  # Mirrors interact.py's PEP 723 header, per the note above.
  "click>=8",
  "jsonschema>=4",
  "tinycss2>=1.4",
]

# Nothing here is built or installed as a package; the repo is scripts and a
# plugin payload, and this project exists to name their environment.
[tool.uv]
package = false

# The suite is round trips through a real browser rather than computation, so tests
# shard independently: every test gets its own tmp_path, XDG homes, and server.
# The site module is one load group because its module-scoped build and host are the
# shared setup; everything else stays individually balanced. Chromium launches once
# per worker for the run.
# Two workers cap the browser load when suites overlap.
# `-n0` to debug a single test.
[tool.pytest.ini_options]
addopts = "-n 2 --dist loadgroup"
markers = ["nightly: complete browser or site integration; `--run-nightly` runs it"]
# A stuck test prints every thread's stack, then exits its test process. This is a hang
# guard, not a performance assertion; ordinary slow tests still have three minutes.
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true
