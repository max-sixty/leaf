reaction on the page:
  event:
    kind: comment
    token: '+1'
  told:
    - when: {"required": ["token"]}
      text: >-
        A reaction is a mark, not a question. Read the token and the `means` its
        package gives, if any, and act on it if it calls for a change; reply only
        if its meaning is unclear. Once the page reflects it, close it with `leaf
        resolve <page> --to <event-id>`. It never blocks publishing a version, and
        it does not wait on an answer.

reply:
  event:
    kind: reply
    obligation:
