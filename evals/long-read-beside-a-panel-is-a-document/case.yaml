# Added when page-authoring.md began teaching a workspace as a screen the reader moves
# through rather than scrolls (notes/chrome-and-covers.md): a long read beside a panel
# kept in view is a document, a sidebar page whose aside sticks, and not a workspace.
# Scored 5 of 5 on both the base (67f6dd75d) and the change: it guards the choice
# rather than separating the two wordings.
description: long-read-beside-a-panel-is-a-document
metadata:
  purpose: 'A long read beside a panel the reader keeps in view is a `layout-sidebar` page whose aside
    sticks, not a workspace: a workspace is a screen moved through rather than scrolled.'
  tags:
  - layout
vars:
  prompt: |
    Write a Leaf page for the user to review the design document for a new rate limiter
    before Thursday's meeting. The document runs to eight sections (Goals, Non-goals,
    Token buckets, Per-tenant limits, Burst handling, Storage, Rollout, Open risks), each
    several paragraphs, and the user reads it top to bottom on a desktop monitor. Beside
    it, in view the whole time, they want your verdict (approve with two changes), the
    two changes, and the three questions you need them to answer.

    Write each section's paragraphs as placeholders of a few sentences. The page
    directory is not reachable from here, so reply with the complete `index.html`,
    rather than writing a file.
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-page-authoring
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/page-authoring\.md
- type: regex
  metric: sidebar-page
  value: <main[^>]*class="[^"]*\blayout-sidebar\b
- type: llm-rubric
  metric: judgment
  value: |
    Read the HTML. Pass only if all of these hold. `main` is a `layout-sidebar` page, not
    a `layout-workspace`, and the eight sections are its body, read in the page's own
    scroll rather than in a pane or other box that scrolls on its own. The verdict, the
    two changes and the three questions are in the `aside`, and the block holding them
    stays in view as the body scrolls: it is `position: sticky` with `top: var(--lf-top)`.
