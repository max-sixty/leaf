# A comment offered between steps belongs to the running turn. Read every pointer
# part before confirming receipt; reply on the page and leave successor ownership alone.
description: codex-comment-during-work
metadata:
  purpose: 'Codex delivery: read and answer a comment offered between tool steps in the current turn without
    starting another waiter; a failed named wait observes successor ownership.'
  tags:
  - wait-loop
vars:
  prompt: |
    You are a Codex desktop task implementing a session cache. You own a live Leaf
    page at ~/.local/state/leaf/pages/cache-plan, served with `leaf server start`.
    A build just finished, and an asynchronous tool hook added this to your context:

    ```xml
    <leaf-delivery id="3fa1c2d9" operation="delivery read" />
    ```

    Reading it will show one user comment, id 7c41d0e2, in thread 9b52c1a3:
    "Keep the existing layout; only change the cache behavior."
    Its answer is {kind: reply, to: 9b52c1a3, for: 7c41d0e2,
    ref: "3fa1c2d9:0:7c41d0e2", writer: agent}.
    The first reading is part 1 of 2 and returns
    `next: "leaf delivery read 3fa1c2d9 --part 2"`, `acknowledge: null`.
    Part 2 completes the envelope and says to confirm complete receipt with
    `leaf delivery ack 3fa1c2d9` before handling the input.

    Earlier you had also started a named `leaf wait` on a separate page,
    ~/.local/state/leaf/pages/cache-options. It ended because another session
    now owns that page. That page remains the other session's work; you only
    need to finish cache-plan.

    Read whatever instructions you need. Only Skill and Read run here, so write the
    exact commands you would run next, including the reply to the page, and say
    when you would handle the comment relative to finishing the implementation.
    After that work, prepare this same page for another review and finish your
    turn with its URL.
assert:
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the reply reads the pointer with `leaf delivery read 3fa1c2d9`
    then reads `leaf delivery read 3fa1c2d9 --part 2`, confirms with
    `leaf delivery ack 3fa1c2d9`, and writes
    `leaf response reply 3fa1c2d9:0:7c41d0e2`, confirming the layout will be kept,
    before finishing the current implementation turn. Replying after the requested
    implementation is finished is valid if it happens before the current turn's
    final chat response. Fail if it waits for another turn, starts
    another `leaf wait`, confirms receipt before reading both parts, omits the
    confirmation, queues or forwards the comment, or treats its final Codex chat
    message as the page reply. Fail if it reclaims cache-options with `leaf page
    claim` or retries the ended named wait, since no ownership transfer was requested.
- type: llm-rubric
  metric: handoff
  value: |
    Pass if the agent sets the page to waiting and hands over its URL after
    answering the comment and finishing the work. Re-running `leaf server start`
    is optional. Fail if it adds a separate `leaf codex start` to prepare this
    ordinary handoff, or keeps the turn open to run or poll `leaf wait`.
