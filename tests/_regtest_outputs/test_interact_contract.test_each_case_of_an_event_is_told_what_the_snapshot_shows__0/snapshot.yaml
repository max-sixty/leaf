pick inside a thread over App Server:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: turn
  told:
    - text: >-
        The user already sees the action applied.
    - text: >-
        Your turn's first and final messages are the reply, and `leaf thread reply`
        refuses this event. Before your first tool call, open with a short message
        to the user: the answer, or what you are about to do. Leaf streams it into
        the thread at once, and later working messages stay in Codex. Finish the
        reply in your final message: the answer, or what changed and where it appears.
        The reply leaves the thread on its anchor.
    - text: >-
        Your reply renders as Markdown, so show code or markup in a fenced block.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

resolve:
  event:
    kind: resolve
  told:
    - text: >-
        The user closed the thread. You owe nothing on it.

unresolve:
  event:
    kind: unresolve
  told:
    - text: >-
        The user reopened a closed thread. The reopening owes nothing of its own;
        if the thread's latest user message was never answered, `leaf thread read
        <page> <thread-id>` shows the `answer` its workflow still owes.

done:
  event:
    kind: done
  told:
    - text: >-
        The user approved the page's sign-off. The page stays open: keep it watched,
        and its status working, while you do what the approval unblocks.

request:
  event:
    kind: request
    answer:
      kind: receipt
  told:
    - text: >-
        The user asked you to run an operation the page's package defines; the package's
        guidance says what the operation means and what to check before running
        it: `leaf page guidance <page>` lists its audiences, and the one that runs
        requests, such as `coordinator`, is the guide to read. The request id, with
        the page, identifies it: after an interruption, check whether it already
        ran before acting.
    - text: >-
        Say what it will do with `leaf status <page> working "<what it does, in
        a line>"`, run it at most once, then record its outcome with exactly one
        `leaf experimental receipt <page> <request-id> succeeded|failed --text "…"`.
        The receipt does not change the page: refresh any data the page shows, update
        `index.html` to reflect the result, and stamp it if it is worth a note.

undo:
  event:
    kind: undo
  told:
    - text: >-
        The user took back the gesture that `undoes` names. Treat the two as cancelling
        out: do not answer or record the withdrawn gesture. Undoing an action that
        answered or closed a thread reopens that thread.

report:
  event:
    kind: report
  told:
    - text: >-
        A worker reported provisional state for a page widget, which the page shows
        until a stamped version answers it. Answer it in a stamped version before
        the page ends: write the reported state into the markup, or mark the element
        `overruled` and say why in the version note. A version that leaves the widget
        as it was leaves the report standing, and `version check` refuses one whose
        markup contradicts the report without answering it.

error:
  event:
    kind: error
  told:
    - text: >-
        The page's runtime reported a failure the user saw. Fix the page or widget
        and save the fix. It is a diagnostic: reply only if the user asked about
        it.
