# Added with the pre-handover reading by a subagent that has none of the author's notes.
# A triage page written from five research subagents' reports had a heading answering
# the author's own research question and chips that resolve only from the reports; the
# author's own glance at the screens passed it. This case checks that an author with a
# clean render check hands the reading to a reader without its notes. Measured when
# added: the reader grader passed 0 of 3 on the instructions before the change (the one run
# that read page-authoring.md read the screens itself) and 3 of 3 after; one run after
# answered without reading page-authoring.md and so failed the case.
# The contents review also tests navigation from the opening at desktop and phone widths.
description: record-read-without-the-notes
metadata:
  purpose:
    Before handover, a record page is read by a subagent given only the user's request and the
    screens.
  tags:
    - review
    - handover
vars:
  prompt:
    "You're partway through a Leaf task. The user asked: \"review all outstanding tend\nitems, with\
    \ enough info on each that I can whizz through them, in a /leaf\". You\nsent five research subagents\
    \ out, one per batch of items, and wrote the page from\ntheir reports: a 21-item queue, one `lf-ask` per\
    \ item, with header chips summarising the\ncounts and a section on the shared Codex blocker. It's\
    \ a record the user will work\nthrough over the next few days.\n\n`leaf page check ~/.local/state/leaf/pages/tend-open-items\
    \ --render` just passed:\n\n  \u2713 index.html: renders clean in Chrome, light and dark at 1200x900\
    \ and 540x720\n    screens to read before handing the page over, in ~/.local/state/leaf/screens/tend-open-items-f18529c2b8a7:\n\
    \      1200px-1.png \u2026 1200px-2.png: desktop\n      1200px-obligation-1.png \u2026 1200px-obligation-8.png:\
    \ desktop, each press of `m` from the top, at the next open obligation, the first 8 of the page's open obligations\n\
    \      1920px-1.png \u2026 1920px-2.png: the widest window\n      390px-1.png \u2026 390px-4.png:\
    \ phone\n\nThe page includes a contents outline and a full review-history section.\n\nThe research reports are still in your context. Say what you do between this check\nand\
    \ handing the URL to the user, step by step, and who does each step.\n"
assert:
  - type: llm-rubric
    metric: reader-without-the-notes
    value: |
      Pass only if the reply hands a reading of the page to a separate reader, such as a
      subagent, that is given the user's request and the saved screens (or the rendered
      page) and is deliberately not given the author's research reports or notes, and
      has it report what it could not follow; and the author then fixes what it reports
      before handing over. Fail if the only reading is the author's own, or if the
      reader is handed the research reports or the author's notes.
  - type: llm-rubric
    metric: opening-navigation
    value: |
      Pass only if the author tests the contents navigation from the page's opening at
      both desktop and phone widths, reaching a later section before scrolling through
      the article to find the navigation. The test may be delegated to the independent
      reader. A generic instruction to test navigation, inspect screenshots, or press
      `a` through the obligations does not establish this opening-view check.
variants:
  # From session 2dbc39a0, which wrote 24 decisions from a TODO survey's report and
  # handed the page over after `page check` alone. One recommended a playground's
  # "Show, then take" plus "Say what z takes"; the user asked "how am I supposed to know
  # what [that] means??", and of others "what was the policy change??" and "what is the
  # current status of clipboard permissions??". Since 2026-10-01 about 30 of ~610
  # decisions on the user's pages drew such a question. In replays of that session,
  # graded blind on seven recurring decisions, base left 18 of 36 unanswerable without
  # a question; rewording page-authoring.md's rule on unread sources left 11 of 25;
  # the two runs that had a reader without the notes left 1 of 10. Base at be8d0f9f0
  # handed over after the check (0 of 3); the reader step scored 3 of 3.
  decision-page:
    metadata:
      purpose:
        Before handover, a page that puts decisions on On me has them read by a subagent
        given none of the author's notes or sources, and the author explains or cuts what
        it couldn't answer.
    vars:
      prompt: |
        You're partway through a Leaf task. The user asked: "Make a Leaf showing
        decisions we can make to a) make progress with some of our todos / notes or b)
        remove them". A subagent surveyed TODO.md and the notes, and you wrote the page
        from its report: 24 decisions, each an `lf-ask` holding an `lf-options`, grouped
        into removals, parked notes and decisions that unblock work. The user will
        answer them once and you'll make the changes in one pull request.

        `leaf page check ~/.local/state/leaf/pages/todo-decisions` just passed with no
        findings. The survey report is still in your context.

        Say what you do between this check and handing the URL to the user, step by
        step, and who does each step.
    assert:
      - type: llm-rubric
        metric: decisions-read-without-the-notes
        value: |
          Pass only if, before handing the page over, the reply has a separate reader,
          such as a subagent, read the page's decisions while deliberately given none of
          the survey report, notes or the author's other sources, and report which
          decisions it couldn't answer without asking what something is or does; and the
          author then explains or cuts what it reports before handing over. Fail if the
          page goes to the user after the page check and the author's own reading alone,
          or if the reader is handed the report or notes.
