# Reconstructed from issue #1841 and a local hosted replay on 2026-10-05. Both
# ended with invalid source and an automatic final reply rejected after the model
# turn was over. The replay put authored content inside the empty lf-activity.
# This is a guard, not a separating measurement: the read-only eval loads the
# normal Leaf skill on both arms, while hosted disables it. The live hosted
# journey separately checks execution with the hosted model and tool transcript.
# The prompt names no reference path, so each arm selects its own shipped contract.
# The guard then asked for `leaf page check` before the final reply. Replying fast
# came first after that (2026-10-20): the final reply checks the saved edit itself
# and a refusal starts a correction turn, so the guard now asks for no check before
# the final reply. Base 124fb8de2 ran the check 2 of 2 on Codex.
description: app-server-edit-before-final
metadata:
  purpose: "App Server: a turn that saved a page edit ends with its final reply, which checks the edit."
  tags:
    - app-server
    - revision
vars:
  prompt: |
    You are the agent for a public leaf.page session, with its page directory as
    your working directory. The harness started this turn from a leaf_delivery
    whose only event has answer {kind: reply, writer: turn,
    ref: "62af9e31:0:release-comment", to: release-comment, for: release-comment}. The user's comment is: "Release a8fe0702
    passed its deployment checks. Record that on the board, and tell me when it's
    done." You already sent the opening message and saved an index.html edit
    adding the release to the board. A shell read confirmed the hash is present.
    The hosted harness serves the page and handles its status, so run no server,
    watcher or status operation. No checkpoint was requested.

    Read the contract and write the remaining steps you would take before ending
    the turn. Only reading instructions runs here; show any commands you would
    run and then the final reply.
assert:
  - type: llm-rubric
    metric: replies-without-a-check
    value: The remaining workflow ends the turn with its final reply and runs no leaf page check, plain or with --render, before it. Fail if it proposes any page check before the final reply.
  - type: llm-rubric
    metric: keeps-final-reply-owner
    value: The final chat reply leaves recording the turn's answer to the hosted harness. It does not propose posting that final answer with leaf thread reply. A warning against that command is allowed.
