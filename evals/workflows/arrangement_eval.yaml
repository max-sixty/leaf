preference: 'A standing preference for all my pages from now on: I read them in a window about
  900px wide, beside my editor. At that width, keep the page''s summary, status, contents or
  queue beside the main content rather than stacked above or below it.'
reachable: A labeled control whose content is out of view, such as a collapsed section, an unselected
  item or a scroll region's remainder, counts as reachable but costs the user a step; content
  cut off with no visible way to reach it does not count.
widths:
  laptop:
    viewport:
    - 1440
    - 900
    description: a 1440px laptop window
  narrow:
    viewport:
    - 900
    - 900
    description: a 900px window
  short:
    viewport:
    - 900
    - 600
    description: a short 900px by 600px window
  phone:
    viewport:
    - 390
    - 844
    description: a 390px phone
prompts:
  first:
    leaf: |-
      Use the Leaf skill ($leaf in Codex; leaf:leaf in Claude Code) for this page. $LEAF is its launcher, {payload}/bin/leaf. Check the page with `$LEAF page check {page} --render`, fix findings and stamp it.

      Write the page at {page}/index.html and hand it over to me in my browser. Produce a finished record with readable evidence and the choices or
      navigation the request needs. You may use the browser tooling available on this
      machine.

      The user's request follows.

      {request}
    html: |-
      Build with ordinary HTML, CSS and JavaScript. No Leaf instructions, widgets or runtime are available. Check your output in the browser and fix findings.

      Write the page at {page}/index.html; I'll open it in my browser. Reply with one line naming the path, and I'll answer here. Produce a finished record with readable evidence and the choices or
      navigation the request needs. You may use the browser tooling available on this
      machine.

      The user's request follows.

      {request}
  preference: '{preference} Please revise the page to follow it.'
  comment: 'On {target}: {text}'
  apply:
    page: 'I''ve made my decisions on the page. Apply them: update the page so it records them
      as final.'
    copied: |-
      I've made my decisions on the page, and this is what it gave me to copy:

      {copied}

      Apply them: update the page so it records them as final.
    typed: |-
      {typed}

      Apply them: update the page so it records them as final.
  reading: |-
    {situation} For each item below, give one of its listed values, or
    "undecided" where nothing says.

    {items}
  reading_applied: |-
    A user had an assistant build a page, made decisions on it and asked the assistant to update the page so it records them as final. Read the page's files:
    {listed}

    and the assistant's answers at {answer}. Say what the page's files now record as the final decision. The answers may tell you where to look, but what they claim counts only where the files show it.
  reading_decision: 'Read the Leaf skill at {payload}/skills/leaf/SKILL.md. The page at {page}
    has been reviewed by a user who made decisions on it. Read its current state: what did the
    user decide? Don''t edit the page or serve it.'
cases:
  document:
    inputs:
      comment:
        target: the recommendation's ask of the database owners
        quotes:
        - the database owners to say whether 55% peak CPU is acceptable
        - whether 55% peak CPU is acceptable
        - 55% peak CPU
        text: The database owners are Mei Tanaka's team. Name them here and ask for their answer
          by Wednesday, the day before the decision.
        applied: Mei Tanaka
      decision:
        task: 'As the platform team, decide the review''s question: choose option 1, staying
          on managed Redis and shortening the TTL to 7 days.'
        typed: 'We''ve decided: stay on managed Redis and shorten the TTL to 7 days.'
        chosen:
          option: stay on managed Redis, 7-day TTL
        values:
          option:
          - stay on managed Redis, 7-day TTL
          - Postgres
          - stateless tokens with a revocation list
      reveal: ''
    assert:
    - &phase_1_quality
      type: javascript
      metric: phase-1-quality
      value: file://../dev/leaf_dev/authoring_assertion.mjs
      config:
        phase: 1
        rubric: >-
          At every declared width, the page preserves the substantive information needed for the
          user's task, makes its evidence readable and reachable, and provides the decisions or
          navigation the request requires.
    - &phase_2_quality
      type: javascript
      metric: phase-2-quality
      value: file://../dev/leaf_dev/authoring_assertion.mjs
      config:
        phase: 2
        rubric: >-
          At every declared width, the page preserves the substantive information needed for the
          user's task, makes its evidence readable and reachable, and provides the decisions or
          navigation the request requires.
    - &phase_3_quality
      type: javascript
      metric: phase-3-quality
      value: file://../dev/leaf_dev/authoring_assertion.mjs
      config:
        phase: 3
        rubric: >-
          At every declared width, the page preserves the substantive information needed for the
          user's task, makes its evidence readable and reachable, and provides the decisions or
          navigation the request requires. The requested comment change appears in the relevant
          item or passage.
    - &phase_4_quality
      type: javascript
      metric: phase-4-quality
      value: file://../dev/leaf_dev/authoring_assertion.mjs
      config:
        phase: 4
        rubric: >-
          At every declared width, the page preserves the substantive information needed for the
          user's task, makes its evidence readable and reachable, and provides the decisions or
          navigation the request requires. The page preserves the final decisions the user
          supplied.
    - &phase_2_preference
      type: javascript
      metric: phase-2-preference
      value: file://../dev/leaf_dev/authoring_assertion.mjs
      config:
        phase: 2
        required_widths: [narrow, short]
        rubric: >-
          At both 900px window heights, the page follows the standing preference quoted in the
          output: summary, status, contents or queue remains beside the main content.
    - &comment_answered
      type: llm-rubric
      metric: comment-answered
      value: Pass only if the author's answer to the user's comment, which the output quotes,
        tells the user that the change the comment asked for is made.
  dashboard:
    inputs:
      comment:
        target: the follow-up to confirm the timeout change with the payments team
        quotes:
