version: 2

# The uv entry watches the repository's Python lock. Its runtime packages are what
# an install of leaf actually resolves — a bump there changes what every harness
# runs — and the dev group is the suite's; the lock records both.
#
# The npm entry watches the root `package.json`, which names every JavaScript
# package the committed browser output is built from: the browser framework build's
# page payload and every bundle `build/vendor.py` makes. The dependency-bundles
# workflow rebuilds its generated output and updates the same PR. `esbuild` is left out: it is
# the tool every bundle shares rather than payload, so it moves when a bundle needs
# it rather than on every release.
#
# Grouped so each ecosystem opens one PR a week rather than one per dependency;
# on a repo this size the review cost of a group is the same as a single bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: esbuild
    groups:
      dependencies:
        patterns: ["*"]
