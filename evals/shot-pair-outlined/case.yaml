# Added with lf-shot's `outlines`, which a pair must ask for. Against the PR's earlier
# wording, where every pair drew outlines unless it set `no-outlines`, no base run
# could write `outlines` (0 of 3) and every candidate run did (3 of 3); the judgment
# passed in both arms. So it measures that the instructions names the attribute, which a
# page now needs for its outlines.
description: shot-pair-outlined
metadata:
  purpose:
    "Source files and media: a pair whose change is local asks for `outlines`, so the
    page marks where it is."
  authoring: true
  tags:
    - evidence
vars:
  prompt: |
    You are writing a Leaf page for the user about a restyle of the orders dashboard's
    header, on branch dashboard-header. Your notes:

    Header. The header was a white bar with a small title. It is now a dark bar with a
    larger title and a health chip beside it. Nothing below the header changed.

    A probe captured the dashboard at 1100x760 on main and on the branch, both
    against the same fixture data. The captures are:

        evals/shot-pair-outlined/captures/before.png  (main)
        evals/shot-pair-outlined/captures/after.png   (the branch)

    Write the Leaf page's section on the header, with its before/after pair.
assert:
  - type: javascript
    metric: pair-outlined
    value: file://capture-pair.cjs:outlinedPair
  - type: agent-rubric
    metric: captures-in-order
    transform: "JSON.stringify({html: output, captures: context.metadata.capture_evidence})"
    value: file://capture-order.txt
  - type: llm-rubric
    metric: judgment
    value: |
      Between the captures only the header changed: a white bar with a small title
      became a dark bar with a larger title and a green "Healthy" chip. Read the reply.
      Pass if the HTML shows the pair as one lf-shot and its prose or alt describes that
      change. Fail if it leaves the pair out, or describes a change below the header.
