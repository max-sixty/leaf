<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support queue</title>
<style>
:root { color-scheme: light; font: 17px/1.5 system-ui, sans-serif; color: #18242c; background: #f4f6f7; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(100% - 32px, 1000px); margin: 28px auto; }
h1 { font-size: 1.8rem; line-height: 1.2; }
h2 { font-size: 1.25rem; }
section, details, article { background: white; border: 1px solid #c4ced4; border-radius: 8px; padding: 16px; margin: 16px 0; }
summary, button, select, input { cursor: pointer; }
summary { font-weight: 650; }
button, select { font: inherit; padding: 8px 12px; border: 1px solid #81929e; border-radius: 5px; background: white; color: inherit; }
button:focus-visible, summary:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1769aa; outline-offset: 3px; }
button[aria-pressed="true"] { background: #dcebf6; border-color: #1769aa; }
label { display: block; margin-top: 12px; }
table { border-collapse: collapse; text-align: left; }
th, td { border: 1px solid #b5c1c8; padding: 10px; vertical-align: top; }
th { background: #eaf0f3; }
small { color: #465a68; }
output { display: block; margin: 16px 0; font-weight: 650; }
.queue { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 16px; }
nav { display: grid; align-content: start; gap: 8px; }
nav button { text-align: left; }
#ticket { margin-top: 0; }
@media (max-width: 650px) { .queue { grid-template-columns: 1fr; } }

</style>
</head>
<body>
<main>
<h1>Support queue</h1>
<p>Work through each ticket and choose its outcome.</p>
<div class="queue">
<nav aria-label="Tickets"><button type="button" data-ticket="SUP-81" aria-pressed="true">SUP-81 · Acorn Studio</button>
<button type="button" data-ticket="SUP-82" aria-pressed="false">SUP-82 · Birch Transport</button>
<button type="button" data-ticket="SUP-83" aria-pressed="false">SUP-83 · Cedar College</button></nav>
<article id="ticket" aria-live="polite"></article>
</div>
</main>
<script>
const tickets = [
  {
    "id": "SUP-81",
    "name": "Acorn Studio",
    "summary": "Duplicate monthly charge",
    "evidence": "The second $48 payment has not been refunded. Both charges settled on 2 October.",
    "recommendation": "Refund the duplicate $48 charge."
  },
  {
    "id": "SUP-82",
    "name": "Birch Transport",
    "summary": "Exports stop before completion",
    "evidence": "Export job JOB-723 fails at the last multipart upload. Release 4.12 fixes bug LF-9921; Birch's region still runs 4.11.",
    "recommendation": "Escalate to engineering for the 4.12 rollout."
  },
  {
    "id": "SUP-83",
    "name": "Cedar College",
    "summary": "Former member's token remained active",
    "evidence": "The member was removed Friday. Their API token still worked Sunday; support revoked it at 07:40 today.",
    "recommendation": "Escalate to security engineering."
  }
];
const decisions = {};
function show(id) {
  const ticket = tickets.find((item) => item.id === id);
  document.querySelectorAll("[data-ticket]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.ticket === id)));
  document.querySelector("#ticket").innerHTML = '<h2>' + ticket.id + ' · ' + ticket.name + '</h2><p>' + ticket.summary + '</p><p>' + ticket.evidence + '</p><p><strong>Suggested:</strong> ' + ticket.recommendation + '</p><label for="decision">Outcome for ' + ticket.id + '</label><select id="decision"><option value="">Choose an outcome</option><option>Refund</option><option>Fix</option><option>Escalate to engineering</option><option>Close</option></select><output id="record"></output>';
  const select = document.querySelector("#decision");
  select.value = decisions[id] || "";
  const record = document.querySelector("#record");
  record.textContent = decisions[id] ? id + ": " + decisions[id] : "No outcome chosen.";
  select.addEventListener("change", () => {
    decisions[id] = select.value;
    record.textContent = select.value ? id + ": " + select.value : "No outcome chosen.";
  });
}
document.querySelectorAll("[data-ticket]").forEach((button) => button.addEventListener("click", () => show(button.dataset.ticket)));
show(tickets[0].id);
</script>
</body>
</html>
