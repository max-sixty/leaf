# The user ends most threads with a last word and then Resolve, seconds apart. Their
# resolve takes the thread off their list and changes nothing the agent owes, so no
# event of its own arrives: the delivery carries their message alone, in a thread its
# context shows as resolved by the user. The session does the work and answers at the
# message's `answer.ref`, and the answer goes into the closed thread. The failure it
# invites is reading the resolved thread as the request taken back: no work and no
# answer, or the session's own resolve in place of one. The `thanks` variant is the
# control: a last word that asks for nothing is ended without work. Whether to bring
# the closed thread back is the session's call (`leaf thread reopen`): the answer the
# user asked for stays quiet, and in the `no-badge` variant, where the request can't be
# carried out as asked, the user is told on their list. In the two `told-` variants the
# resolve lands after the delivery, so the session first hears of it from the record its
# reply prints: it reopens the thread for the request it could not carry out, and
# leaves it closed for the one it did. In `turn-no-badge` a Codex turn's final message
# is the reply, which prints the session no record, so it posts the request it could
# not carry out by command; `turn-done`, its control, leaves an answer that delivers
# what was asked to the final message. The envelope is as `freeze_delivery` writes it
# for a hook, or with `turn_replies` for those two, handling included, with ids, page,
# claim and times substituted.
description: resolved-request-stays-owed
