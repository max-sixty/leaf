schema_version: '1.0'
name: landed-work-goes-on-the-page
description: "Delegated work's result: a worker's finished fix goes on the page with its captures, and the thread report links to it rather than carrying the work."
tags:
- threads
execution:
  prompt: |
    You own a live Leaf page, the user's review surface, at
    ~/.local/state/leaf/pages/checkout-review. Its section `ask-save-button` proposes a
    fix: enabled Save in the accent colour, disabled Save at 40% opacity.

    Earlier the user commented in thread 5e1a9c02 on that section: "is the proposal to
    hide Save when it's disabled? I'd rather it stayed visible". You replied that Save
    stays visible and that you were building the fix. The user then asked you to reopen
    the thread to tell them when the work has finished, and resolved it. You handed the
    build to a background subagent.

    The subagent has just finished. Its report:

    "Built on branch `save-button-states` (`9229ca877`), pushed, no PR. Enabled Save now
    uses the accent colour; disabled Save is 40% opacity and keeps its focus ring.
    Checked at 1440px in light and dark. Captures, same viewport and state:
    ~/.tmp/save-button/before.png, ~/.tmp/save-button/after.png,
    ~/.tmp/save-button/after-dark.png."

    Write the exact commands you run now, in order, including the full text of any page
    edit and any thread message. Nothing here can run them, so reply with the commands.
graders:
- name: loads-leaf
  type: tool_used
  tool: Skill
  input_match: leaf
- name: reads-conversation-loop
  type: tool_used
  tool: Read
  input_match: conversation-loop
- name: registers-captures
  type: regex
  pattern: leaf page media\b[^\n]*save-button/(before|after)
  flags: i
- name: judgment
  type: llm
  criteria: |
    Read the commands. Pass only if both hold. First, before any thread message about
    the finished work, the page itself is revised to show the result: the captures are
    registered with `leaf page media` and displayed in the page's HTML (an `lf-shot`
    pair or images), and the section no longer reads as an open proposal. Second,
    the thread message (`leaf thread reply ... --to 5e1a9c02` or equivalent) says
    briefly what changed and links the page section that shows it with a fragment link
    such as `(#ask-save-button)`. Fail if the capture paths or the full report appear only in
    the thread message, or if the page is not revised.
