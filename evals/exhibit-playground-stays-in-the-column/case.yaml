# Guardrail for surface-page-takes-the-window: a playground that is one exhibit in a
# document keeps the document's column, and the page is not turned into a workspace.
# Claude Code: base 9/9 (c20bf406f twice, c71562813 once), candidate 9/9.
description: exhibit-playground-stays-in-the-column
metadata:
  purpose: "Arranging a page: a document read top to bottom keeps its reading flow, with the retry-policy playground beside the explanation it supports."
  tags:
    - layout
    - playground
vars:
  prompt: |
    Write a Leaf page reviewing last week's checkout outage for the payments team, who
    will read it top to bottom before Friday's review. It has seven sections: Summary,
    Timeline, Impact, Root cause, What went well, What went badly, and Actions. Write
    each section's paragraphs as placeholders of a few sentences. In Root cause, the
    retries that amplified the outage are the point: include a playground where the
    reader tunes the retry policy's base delay, multiplier and maximum attempts, sees
    the resulting retry schedule against the 30-second outage window, and submits the
    policy to adopt.

    Read references/page-authoring.md and packages/playground/instructions/author.md
    inside the leaf skill's base directory. The page directory is not reachable from
    here, so reply with the complete `index.html`, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the HTML. Pass if the seven sections can be read top to bottom in order,
      with the retry-policy playground within Root cause beside the explanation it
      supports. Fail if the page makes the reader switch views to follow that sequence
      or separates the playground from its explanation. Judge the reading flow, not
      the presence of a particular Layout class or width attribute.
