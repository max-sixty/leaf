# https://pre-commit.com/
#
# Two files no hook may write, for the same kind of reason: neither is authored here, so
# a hook's edit lands on a copy whose source it left alone.
#
# The vendored bundles are upstream's bytes, re-fetched by scripts/vendor-*.sh; a
# formatted copy conflicts on the next fetch.
#
# examples/gallery.html is generated by scripts/gallery.py out of the sibling examples,
# and a hook editing it puts the two out of step until someone reruns the script. It is
# stated here rather than on each hook because the rule is the file's: prettier reflowed
# the wrapper, typos corrected a word inside an embedded example, and trailing-whitespace
# would strip the single space that is a blank context line in a diff. A spelling or
# whitespace hook reads as too small to break anything, which is exactly why the
# per-hook form kept missing one. The right order for a change to the corpus is the
# hooks first, gallery.py last.
exclude: ^(skills/leaf/(assets/vendor|packages/.*/vendor)/|examples/gallery\.html$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # JavaScript and HTML. Not CSS, where it splits theme.css's grouped rules one per
  # line, and not markdown, where it strips the indent off a list item's continuation
  # lines. HTML is safe because every whitespace-significant body on a page is inside a
  # <pre>, which is the one thing prettier's own table reads as untouchable; a bare
  # custom element's body it would reflow into a paragraph, stylesheet be damned.
  #
  # Format through this hook (`pre-commit run prettier`), not a bare `npx prettier`:
  # an unpinned prettier disagrees with the rev below about `</pre>` placement and
  # rewrites every authored example.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [javascript, html]
  # Parse every JavaScript module and enforce the runtime import graph. The browser
  # loader proves that named imports exist; this owns syntax and forbidden edges.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0]
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
