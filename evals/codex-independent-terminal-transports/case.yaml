# Added during the concurrency survey: the separate App Server recipe must let
# two terminal tasks coexist without manually assigning fixed ports.
# On 2026-10-02, the fixed-port baseline passed 0/1 and the private-socket
# candidate passed 1/1; this is one measured contrast, not an error-rate estimate.
description: codex-independent-terminal-transports
metadata:
  purpose:
    "Codex terminal setup: separate App Server and CLI processes remain independent across
    simultaneous task pairs."
  tags:
    - harness-codex
    - concurrency
vars:
  prompt: |
    I am starting two independent Codex terminal tasks on the same machine. For
    each task, I want App Server in one shell and its remote terminal client in
    another shell, and the task will use Leaf. I need the exact startup commands
    and how the task starts its Leaf delivery loop. Read the Leaf instructions
    you need, then give the commands for each pair and explain how I connect the
    right client to its server. Only Skill and Read run here.
assert:
  - type: llm-rubric
    metric: independent-transports
    value: |
      Pass only if the commands allocate a fresh private Unix socket directory for
      each App Server, rather than sharing a fixed socket or requiring the user to
      allocate fixed ports. Each remote client uses the endpoint printed or passed
      from its own server shell. The task connects its Leaf page using the same endpoint through inherited
      LEAF_CODEX_APP_SERVER (or the baseline codex start --app-server). Each
      task retains its own transport; a shared endpoint is insufficient.
      The commands must start App Server and the remote terminal client separately,
      as requested. A single leaf codex launch command does not satisfy that request.
