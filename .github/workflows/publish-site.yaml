name: publish-site

# Every product and example route uses the canonical Python Leaf server behind one
# Cloudflare Worker origin. The container image copies the exact site build verified
# here; deployment therefore cannot publish one document while serving another.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      # The whole skill payload: the site serves a vendored layer, and that is merged
      # from the kernel and bundled package alike — a change to either
      # is a change to what a visitor loads.
      - 'skills/leaf/**'
      - 'bin/leaf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'example-previews.json'
      - 'scripts/example_data.py'
      - 'scripts/example_assets.py'
      - 'scripts/preview.py'
      - 'scripts/site.py'
      - 'worker/**'
      - 'Dockerfile.website'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-deploy
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Deploy public Leaf pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A Containers deploy activates the Worker before its image rollout necessarily
      # finishes. Prove the public route has crossed both boundaries before calling the
      # deployment successful; --retry-all-errors also covers the first-deploy 404/5xx
      # window while Cloudflare provisions the application and custom domain.
      #
      # The per-attempt cap has to outlast the slowest answer a busy seat produces
      # rather than a healthy one. While every container slot is held, a seat request can
      # hang with no bytes at all: run 34088384337 aborted twenty-seven attempts that way
      # at ten seconds, while the four that did answer returned 500 within 1.4-5.7s.
      # Probes taken minutes later, with the window still busy, took ~11.5s to return
      # "Maximum number of running container instances exceeded", which ten seconds cuts
      # off. Both probes send the one session cookie and the Worker keys the container on
      # the session alone, so they share a seat rather than taking one each.
      #
      # --retry-max-time is what bounds the loop, because --retry counts attempts rather
      # than time: 31 attempts at 25s plus their delays is ~17.9 min per probe, and two
      # of those overrun the job's 30-minute timeout, which would end the step as a
      # runner kill rather than as the curl error this step exists to report. Ten minutes
      # per probe keeps the whole step inside the job with the patience each attempt
      # gained.
      - name: Verify public Leaf pages
        run: |
          COOKIE="__Host-leaf-page=$(openssl rand -hex 16)"
          curl --fail --silent --show-error \
            --cookie "$COOKIE" \
            --retry 30 --retry-all-errors --retry-delay 10 \
            --max-time 25 --retry-max-time 600 \
            https://leaf.page/api/state \
            | jq --exit-status \
              '.publication.kind == "product" and .claims == []'
          curl --fail --silent --show-error \
            --cookie "$COOKIE" \
            --retry 30 --retry-all-errors --retry-delay 10 \
            --max-time 25 --retry-max-time 600 \
            https://leaf.page/examples/design-decision/api/state \
            | jq --exit-status \
              '.publication.kind == "example" and .claims == []'
