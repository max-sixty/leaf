name: publish-site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      # The whole skill payload: the site serves a vendored layer, and that is merged
      # from the integrated assets and the bundled widgets alike — a change to either
      # is a change to what a visitor loads.
      - 'plugins/leaf/skills/leaf/**'
      - 'scripts/site.py'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # No browser: the examples go up as the files they are, drawn in the reader's
      # own. `uv` is the whole of what the build needs, for `page init` and the check
      # each example passes on the way past.
      - name: 🖼 Build site
        run: scripts/site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/site/
          retention-days: 1

  deploy-site:
    needs: build-site
    runs-on: ubuntu-24.04

    # Don't attempt to publish if on a fork
    if: ${{ github.repository_owner == 'max-sixty' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
