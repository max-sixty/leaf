# From session 786842ae, whose design page argued for its pick and asked questions
# only the pick raised. Main at d088065f5 failed 0 of 3; the authoring-asks.md
# paragraph on pages for choosing an approach passed 4 of 4.
schema_version: '1.0'
name: approach-page-leaves-the-choice-open
description: "Asks: a page for the user to choose an approach is built around that choice, not the author's pick, and asks nothing that only the pick raises."
tags:
- asks
execution:
  prompt: |
    You are in a Leaf design session. Two reviews came back on how a section's inline
    choice (Next / Later / Drop) and a summary board could share one decision, and
    your last chat reply said:

    > Both reviews reject the board-specific binding. What varies is who owns the
    > decision:
    > - A, the picker: `lf-options` keeps the fact; the board card is a view that
    >   sends the picker's `choose`. Smallest step, and the first reviewer's pick.
    >   Order within a column would need ownership to move later.
    > - B, the board: the card's column is the fact; the section's Ask is answered by
    >   another widget's action, which needs cross-owner Asks.
    > - C, the section: the section's `lf-ask` carries `value` and `rank` fields,
    >   Next / Later / Drop are declared once as a scale, and the picker and card are
    >   both views. One drop is one event. Needs a scale element, a `set` verb and a
    >   view relation. The second reviewer's pick.
    > - D, a record set: data-only rows hold the fields and everything else views
    >   them. Best when the user adds tasks; needs cross-owner Asks.
    >
    > Every approach needs the same generic view relation.
    > I'd take C: the fact belongs to the subject it is about. Under C two things
    > stay open: whether order within a column matters on these pages yet, and
    > whether `lf-ask` carries the fields or a new `lf-item` element does.
    >
    > 📌 Choose the shared-state design before building. I'd build C.

    The user replied: "Great, can we make a full Leaf page that explains this and
    shows tradeoffs / any other options"

    Write the page. The page directory is not reachable from here, so reply with the
    `<main>` element's HTML rather than writing a file. Figures may be placeholders
    such as `<figure id="owners-figure"><svg class="drawing" viewBox="0 0 680 300"></svg></figure>`.
graders:
- name: loads-leaf
  type: tool_used
  tool: Skill
  input_match: leaf
- name: reads-authoring-asks
  type: tool_used
  tool: Read
  input_match: authoring-asks
- name: has-asks
  type: regex
  pattern: <lf-ask\b
  flags: i
- name: judgment
  type: llm
  criteria: |
    Read the HTML as the user, who has to choose which approach Leaf builds. Pass
    only if all of these hold:
    1. There is an `lf-ask` whose question is which approach (who owns the decision)
       to build, and its options include A, C and D at least.
    2. No `lf-ask` asks a question that presupposes C, such as whether `lf-ask` or a
       new `lf-item` carries the fields, or how C's rank or scale should work. An Ask
       on whether order within a column matters passes only if the page presents it
       as an input to choosing the approach rather than as a detail of C. The page
       may mention C's open questions without asking them.
    3. The `h1` and the `h2` headings do not state C (the section or subject owning
       the decision) as the conclusion. "The fact belongs on the subject it is
       about", "Let the section own it" and "Three more options, all weaker than C"
       fail this; a heading naming the question, a finding every approach shares, or
       an approach by name passes, and so does one that gives C as the author's
       recommendation ("Why I'd take C"). The lede fails only if it presents C as
       the plan rather than as a recommendation among the approaches.
    4. No open section (outside a `<details>` or an option) elaborates C alone, such
       as C's markup or C's vocabulary, without the same treatment of the other
       approaches.
    Fail if any one of these does not hold.
