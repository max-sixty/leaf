# A session's focus-indication playground assembled each preset from a treatment per
# surface; three of one preset's marks stacked in the same gutter and the user called
# the presets "disastrous". A preset that leaves a value its appearance depends on
# unset makes its treatment depend on the configuration tried before it; the presets
# paragraph on whole designs addresses it.
# Also guards realistic candidate copy: comparison labels belong around the diff,
# while the diff retains product text.
# And guards the other side of playground-controls-stand-by-their-item: controls that
# change every line of the diff stay in the rail rather than beside one line.
# The rubric judges physical placement, including separation inherited from the base
# layout, rather than both marks being near the left edge, a reading that calls a
# gutter sign and code-edge bar with a rendered 4px gap a collision. It grades
# breadth, predictable settings and coherent paint, not fixed control/preset counts
# or several changed values per preset. The rail check exempts the
# selectable-candidates choice control, which stands in the preview as author.md
# requires. Item 2 lets a preset leave the candidate choice (`format`) unset, as
# author.md's own example preset does.
description: playground-presets-are-whole-designs
metadata:
  purpose:
    "Playground: controls span every part the user may vary, and each preset is one composed design
    whose settings produce a coherent, predictable treatment."
  page: [playground]
  tags:
    - playground
vars:
  prompt: |
    You are in a Leaf design session for a code-review tool. Its diff view marks a
    changed line in four places at once: a `+`/`-` sign in the gutter, a tint on the
    line, a 3px bar at the line's left edge, and a highlight on the changed words.
    Reviewers say it looks noisy.

    The user asked: "Do a full study of how the diff could mark changes, the whole
    spectrum from small tweaks (colour, weight, which marks show, how the gutter sign
    and bar sit together) to an overhaul. Put it in a playground I can play with."

    Write the page's playground: the `lf-ask` with its `lf-playground`, and the
    candidates' CSS. The preview can be a short static diff of about six lines.
assert:
  - type: llm-rubric
    metric: realistic-product-copy
    value: |
      Pass if the simulated diff uses plausible product content and copy,
      without text describing its demo/mock/sketch status or the design
      exercise. Comparison labels, tuning controls, and explanations outside the
      simulated diff are fine. Example code and ordinary code comments are fine.
      Fail if authoring commentary replaces or augments the simulated product UI.
  - type: llm-rubric
    metric: judgment
    value: |
      Read the playground's controls, its presets, and the CSS they switch. Pass only
      if all of these hold:
      1. The controls support the requested exploration, from modest changes to
         a substantially different treatment of the gutter sign, line tint, left
         bar and word highlight. They do not collapse the study to one fixed look.
      2. Presets provide coherent starting points for that exploration. Each sets
         every value its appearance depends on, so its intended treatment does not
         depend on which configuration the user tried before it. Settings unrelated
         to that treatment may retain their values. A preset needn't set the
         control that picks which candidate to build when every candidate shows
         the preset's settings at once.
      3. Apart from a preset that reproduces today's diff as the baseline, no preset
         turns on two marks that the CSS draws in the same place for the same line,
         or a line tint and word highlight in the same hue and strength, unless
         the CSS merges them into one mark or visibly separates them. Judge the
         actual geometry: a sign in a gutter column and a bar in a separate code
         column with space between their paint are visibly separated, even when
         both are near the line's left edge. Separation can come from shared base
         layout rules as well as rules specific to a preset.
      Fail if any one of these does not hold.
  - type: llm-rubric
    metric: page-wide-controls-in-the-rail
    value: |
      Pass only if every `lf-playground-control` that sets how the diff is marked is
      written as a direct child of `lf-playground`, so it stands in the rail, since
      each such control changes how every line of the diff is marked. A choice control
      whose choices hold the candidate previews themselves belongs inside
      `lf-playground-preview`, as the playground's instructions require, and does not
      fail this check. Fail if any other `lf-playground-control` is written inside
      `lf-playground-preview`, such as beside one diff line or inside one candidate.
