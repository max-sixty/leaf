# From session 78ca368e. A rewording of what is now "Show the subject" drew an SVG of the Save
# button beside its captures in 2 of 3 runs and was reverted; main passed 3 of 3.
description: visual-change-uses-captures
metadata:
  purpose:
    "Show the subject, guardrail: a visible change with before/after captures shows the
    captures and draws nothing beside them."
  authoring: true
  tags:
    - draw
    - guardrail
vars:
  prompt: |
    You are writing a Leaf page for the user about a button fix. Your notes:

    Finding. The Save button's disabled state was the same grey as its enabled state, so
    users clicked it and nothing happened. The fix paints enabled Save in the accent colour
    and disabled Save at 40% opacity.

    Decision. Approve the new states, or keep the old ones.

    Captures, same viewport and state:
    - evals/visual-change-uses-captures/captures/before.png: the form with Save disabled and enabled, before (1200x700)
    - evals/visual-change-uses-captures/captures/after.png: the same, after (1200x700)

    Write the Leaf page with the finding and the decision.
assert:
  - type: javascript
    metric: pair-in-one-lf-shot
    value: file://capture-pair.cjs:pair
  - type: agent-rubric
    metric: captures-in-order
    transform: "JSON.stringify({html: output, captures: context.metadata.capture_evidence})"
    value: file://capture-order.txt
  - type: llm-rubric
    metric: draws-nothing
    value:
      Pass only if the finding draws nothing beside its captures. Fail if the page adds an
      inline SVG, an lf-diagram, or an HTML mockup of the button or form. Showing one capture
      again on its own elsewhere is fine.
variants:
  # For "placed-widgets-draw": a visual review's run is data only its module reads,
  # including focus rectangles that have to fall inside both captures. Asked for "a
  # Leaf visual review" without naming the package, 3 of 3 Claude Code authors paired
  # the captures in lf-shot instead, so the request names it; this measures whether
  # the widget draws once chosen, not whether an author finds it.
  visual-review:
    metadata:
      purpose: "Every widget an agent places in a visual review draws without
        reporting an error."
      tags:
        - checks
        - draws
    vars:
      prompt: |
        Make me a review of the Save button fix with Leaf's visual-review package, so
        I can approve each state on its own.

        The fix paints enabled Save in the accent colour and disabled Save at 40%
        opacity; before it, both states were the same grey, so users clicked a
        disabled Save and nothing happened. Review two cases from one pair of
        captures: the Unchanged card, where Save is disabled, and the Edited card,
        where Save is enabled.

        Captures, taken in Chrome 141 at 1200x700 on 2026-10-22 at 14:05 UTC with the
        settings form open and one field edited:
        - evals/visual-change-uses-captures/captures/before.png: base revision 4f1c2e9
        - evals/visual-change-uses-captures/captures/after.png: candidate revision 9ab03d7

        Neither revision is deployed anywhere I can open.
    assert:
      - type: python
        metric: widgets-draw
        value: file://../dev/leaf_dev/page_draws.py
