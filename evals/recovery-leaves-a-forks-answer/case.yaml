# Added with `holder` in `leaf page state`: a Claude Code main thread whose context was
# compacted reads what it owes with the selection `references/conversation-loop.md`
# gives. One of the answers it lists is owed by a fork of the session that is still
# answering it, so the main thread answering it too would take the thread from the
# fork and give the user two answers. The output below is a real reading of a page in
# that state, its fork renamed to an agent id since `holder` names forks by id; the
# `without-holder` variant is the same reading as `page state` printed it before
# `holder`. On Claude Code the agent left the fork's answer 3/3 with `holder`
# and answered it too 0/3 without, so the reference names no rule for the field.
description: Recovery leaves a fork's answer
metadata:
  purpose:
    A main thread recovering what it owes from page state answers its own owed update and
    leaves the one a running fork holds to that fork.
  tags:
    - wait-loop
    - forks
    - threads
  harnesses: [claude-code]
vars:
  prompt: |
    You are a Claude Code session using Leaf, three hours into an audit of a project's build with the user on the page /Users/max/.local/state/leaf/pages/build-audit. Your conversation was just compacted. Its summary says you have been answering the user's comments on the page as they arrive, and nothing about which you still owe.

    To see what you owe, you ran `leaf page state /Users/max/.local/state/leaf/pages/build-audit | jq '{source, obligations, todos, queues}'`, which printed:

    {"source": {"file": "index.html", "digest": "e5788e3e7e83ea416b8681b9bd81f8d56338c6e8be25f2738b680fb0083a6d0d", "live": true, "error": null}, "obligations": [{"id": "update:cb6c7c43", "source": {"kind": "update", "id": "cb6c7c43", "subject": {"kind": "thread", "id": "cb6c7c43"}}, "thread": "cb6c7c43", "message": "cb6c7c43", "prompt": {"text": "Can this table sort by cost?", "target": "cb6c7c43"}, "answer": null, "status": "open", "end": null, "next_actor": "agent", "holder": {"kind": "main"}}, {"id": "update:2fda6c29", "source": {"kind": "update", "id": "2fda6c29", "subject": {"kind": "thread", "id": "2fda6c29"}}, "thread": "2fda6c29", "message": "2fda6c29", "prompt": {"text": "Which Python does the project need?", "target": "2fda6c29"}, "answer": null, "status": "open", "end": null, "next_actor": "agent", "holder": {"kind": "fork", "agent": "a7c31e9f04b2d58e6", "state": "running"}}], "todos": [], "queues": {"on_user": [], "on_agent": [{"kind": "update", "id": "update:2fda6c29", "owner": "agent", "subject": {"kind": "thread", "id": "2fda6c29"}, "thread": "2fda6c29", "also": [], "live": true}, {"kind": "update", "id": "update:cb6c7c43", "owner": "agent", "subject": {"kind": "thread", "id": "cb6c7c43"}, "thread": "cb6c7c43", "also": [], "live": true}]}}

    Thread `cb6c7c43` is on the page's summary table, `#summary-table`, an `lf-table` whose rows carry a `cost` column. Thread `2fda6c29` is on the toolchain section; the project's `pyproject.toml` says `requires-python = ">=3.12"`.

    The page and services are unreachable in this exercise. Write out each command you would run in response, with its full arguments, then end your answer.
assert:
  - type: llm-rubric
    metric: leaves-the-fork
    value:
      Pass only if the agent answers the user in thread `cb6c7c43`, such as with `leaf thread reply`, and
      writes nothing in thread `2fda6c29`, which a fork of the session, agent `a7c31e9f04b2d58e6`, is still
      answering. Fail if any command replies in thread `2fda6c29`, or starts or ends work on
      `update:2fda6c29`, and fail if the agent answers neither thread. Messaging the fork, such as with
      SendMessage, and reading state are fine.
variants:
  without-holder:
    metadata:
      purpose: The same recovery from the page state Leaf printed before `holder`, as a control.
    vars:
      prompt: |
        You are a Claude Code session using Leaf, three hours into an audit of a project's build with the user on the page /Users/max/.local/state/leaf/pages/build-audit. Your conversation was just compacted. Its summary says you have been answering the user's comments on the page as they arrive, and nothing about which you still owe.

        To see what you owe, you ran `leaf page state /Users/max/.local/state/leaf/pages/build-audit | jq '{source, obligations, todos, queues}'`, which printed:

        {"source": {"file": "index.html", "digest": "e5788e3e7e83ea416b8681b9bd81f8d56338c6e8be25f2738b680fb0083a6d0d", "live": true, "error": null}, "obligations": [{"id": "update:cb6c7c43", "source": {"kind": "update", "id": "cb6c7c43", "subject": {"kind": "thread", "id": "cb6c7c43"}}, "thread": "cb6c7c43", "message": "cb6c7c43", "prompt": {"text": "Can this table sort by cost?", "target": "cb6c7c43"}, "answer": null, "status": "open", "end": null, "next_actor": "agent"}, {"id": "update:2fda6c29", "source": {"kind": "update", "id": "2fda6c29", "subject": {"kind": "thread", "id": "2fda6c29"}}, "thread": "2fda6c29", "message": "2fda6c29", "prompt": {"text": "Which Python does the project need?", "target": "2fda6c29"}, "answer": null, "status": "open", "end": null, "next_actor": "agent"}], "todos": [], "queues": {"on_user": [], "on_agent": [{"kind": "update", "id": "update:2fda6c29", "owner": "agent", "subject": {"kind": "thread", "id": "2fda6c29"}, "thread": "2fda6c29", "also": [], "live": true}, {"kind": "update", "id": "update:cb6c7c43", "owner": "agent", "subject": {"kind": "thread", "id": "cb6c7c43"}, "thread": "cb6c7c43", "also": [], "live": true}]}}

        Thread `cb6c7c43` is on the page's summary table, `#summary-table`, an `lf-table` whose rows carry a `cost` column. Thread `2fda6c29` is on the toolchain section; the project's `pyproject.toml` says `requires-python = ">=3.12"`.

