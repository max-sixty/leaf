# An eyebrow and heading make one navigation destination with hgroup.
# Measures whether shipped authoring instructions express a complete title boundary
# rather than relying on a pixel offset or making eyebrow text part of the heading.
description: grouped-title-address
metadata:
  purpose: "Stable anchors: a title and its eyebrow share one addressed group."
  tags:
    - authoring
    - navigation
vars:
  prompt: |
    Write a Leaf report with the eyebrow "Eval consolidation" above the page
    title "One catalog, with short cases and complete workflows". The eyebrow
    belongs to the title and they should have one stable link destination, so
    following the title link brings the eyebrow too. Keep the heading's text
    alone as its outline label. Include three substantial sections about one
    case catalog, complete workflows, and comparable evidence, with an ordinary
    contents outline. Reply with the complete index.html; the page directory
    is not reachable from here.
assert:
  - type: llm-rubric
    metric: grouped-title
    value: |
      Pass only if the eyebrow and the title are one addressed destination: an
      `hgroup` carrying an `id` holds a `<p>` with "Eval consolidation" before the
      `h1`, and the `h1`'s text is exactly "One catalog, with short cases and
      complete workflows", so the heading alone labels the outline. Fail if the
      eyebrow stands outside that group or inside the `h1`, or if the group has no
      id and only the `h1` or another wrapper carries one.

variants:
  # A handover used a plain paragraph for its status above the title. The default
  # theme is supplied.
  status-label:
    description: grouped-title-address/status-label
    metadata:
      purpose: A status and date above a new title stands in the title's hgroup as the
        theme's eyebrow without the markup being requested.
    vars:
      now: "2026-10-09T18:00:00-07:00"
      prompt: >-
        Write a short Leaf handover for the On Me contract change. Use the title
        "On Me lists everything the agent needs from you". Put "Implemented locally
        · October 9, 2026" directly above the title. Explain that On Me contains
        every current request for the user, an empty On Me means nothing is needed from
        them, and On Claude can still contain the agent's work. Include a short verification
        paragraph: focused Python and browser checks passed. There is no decision to collect
        here. The page has already been initialized with the default Leaf layer; delivery
        supplies its theme and runtime. The page directory is outside this read-only environment.
        Reply with the complete authored index.html.
    assert:
      - type: llm-rubric
        metric: shared-label
        value: |
          Pass only if "Implemented locally · October 9, 2026" stands directly above
          the title as the eyebrow the theme styles, a `<p>` holding just that text
          before the `h1` in the title's `<hgroup>`. Fail if it stands outside that
          group, carries a page-styled class of its own, or is part of the heading.
