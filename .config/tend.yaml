bot_name: leaf-agent

# Everything in this repo runs through `uv` (CLAUDE.md): the suite is
# `uv run pytest tests`, and `leaf` itself is a PEP 723 script that resolves its
# own dependencies. `setup-uv` is where the agent gets uv, on the same unpinned
# action `ci.yaml` uses, so both take a uv new enough to read `uv.lock`'s
# revision; `uv sync --frozen` warms `.venv` so the sandbox
# inherits it rather than resolving from scratch on every run, and installs the
# lock as written so a run can't leave lockfile churn in the branch it opens.
setup:
  - uses: astral-sh/setup-uv@v7
  # setup-uv publishes uv by appending its toolcache directory to $GITHUB_PATH,
  # which the agent's sandbox PATH does not inherit. Every command this file
  # counts on was therefore `uv: command not found` inside a session — the
  # suite, and `bin/leaf` itself — so a run could neither test a fix nor drive
  # the CLI it was editing. /usr/local/bin is on the sandbox's PATH, so a link
  # there hands the agent the same uv these steps and `ci.yaml` use. A link
  # rather than a `sandbox_path:` entry because the toolcache directory carries
  # uv's version, and this action is deliberately unpinned: a path written here
  # would come apart on the next uv release, silently and in exactly this way.
  - run: ln -sf "$(command -v uv)" /usr/local/bin/uv
  - run: uv sync --frozen

workflows:
  ci-fix:
    watched_workflows:
      - ci
      # A red `publish-site` leaves <https://leaf.page/> stale on whatever it
      # last built, which is invisible from the repo — worth a fix PR.
      - publish-site
