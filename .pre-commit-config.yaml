# https://pre-commit.com/
#
# Captures and generated files no hook may write: neither is authored here, so
# a hook's edit lands on a copy whose source it left alone.
#
# The vendored bundles are what scripts/vendor.py fetches and builds; a formatted
# copy conflicts on the next run of it.
#
# examples/corpus.html is generated by scripts/corpus.py out of the sibling examples,
# and a hook editing it puts the two out of step until someone reruns the script. The PR
# walkthrough patch is an exact GitHub data capture; its spaces are source evidence too.
# This is stated here rather than on each hook because the rule is the file's: prettier
# reflowed the wrapper, typos corrected a word inside an embedded example, and
# trailing-whitespace would strip the single space that is a blank context line in a
# diff. A spelling or whitespace hook reads as too small to break anything, which is
# exactly why the per-hook form kept missing one. The right order for a change to the
# corpus is the hooks first, corpus.py last.
# Experiment outputs are raw evidence, including empty stdout from failed runs.
# Keep their bytes; lint the authored commands and findings, not the captures.
exclude: ^(skills/leaf/(assets/vendor|packages/.*/vendor)/|examples/(corpus\.html|pr-walkthrough\.patch)$|notes/mcp-apps/experiments/[0-9]+/(results/|output\.txt$))

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # JavaScript and HTML. Not CSS, where it splits theme.css's grouped rules one per
  # line, and not markdown, where it strips the indent off a list item's continuation
  # lines. HTML is safe because every whitespace-significant body on a page is inside a
  # <pre>, which is the one thing prettier's own table reads as untouchable; a bare
  # custom element's body it would reflow into a paragraph, stylesheet be damned.
  #
  # Format through this hook (`pre-commit run prettier`), not a bare `npx prettier`:
  # an unpinned prettier disagrees with the rev below about `</pre>` placement and
  # rewrites every authored example.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [javascript, html]
  # Parse every JavaScript module and enforce the runtime import graph. The browser
  # loader proves that named imports exist; this owns syntax and forbidden edges.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0]
      # The evaluation-order rule's verdict on an unchanged runtime module can change
      # when another module's imports do, so a staged runtime file lints the whole
      # directory.
      - id: eslint
        alias: eslint-runtime
        name: eslint (the runtime cycle)
        files: ^skills/leaf/assets/runtime/
        pass_filenames: false
        args: [--max-warnings=0, skills/leaf/assets/runtime]
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  # GitHub accepts `concurrency.queue`, which tend's generated workflows set, but
  # this pin's schema does not know the key yet and there is no route out by
  # bumping: rhysd/actionlint#657 is open, the fix (#661) was closed unmerged, and
  # v1.7.12 is still the latest release. `.github/actionlint.yaml`, which
  # `uvx tend@latest init` now writes, ignores that one false positive under a glob
  # scoped to the generated files, so the same key in a workflow this repo owns
  # still fails.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # actionlint already shellchecks the `run:` blocks in the workflows above. This
  # covers the shell outside them, starting with bin/leaf, which every install
  # executes.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
