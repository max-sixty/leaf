# The summary hint from real conversation events and their wait delivery.

delivery:
  format: leaf-delivery-v2
  id: <delivery>
  created_at: <time>
  batches:
    - page: <page>
      through_seq: 14
      conversations:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 3
            actions: 0
          messages:
            - id: event-2
              seq: 2
              author: user
              text: >-
                Which rollout?
            - id: event-6
              seq: 6
              author: user
              text: >-
                Rollout consideration 4.
            - id: event-7
              seq: 7
              author: agent
              text: >-
                Rollout consideration 5.
            - id: event-8
              seq: 8
              author: user
              text: >-
                Rollout consideration 6.
            - id: event-9
              seq: 9
              author: agent
              text: >-
                Rollout consideration 7.
            - id: event-10
              seq: 10
              author: user
              text: >-
                Rollout consideration 8.
            - id: event-11
              seq: 11
              author: agent
              text: >-
                Rollout consideration 9.
            - id: event-12
              seq: 12
              author: user
              text: >-
                Rollout consideration 10.
          summaries: []
          summary_hint:
            from: event-2
            through: event-11
            operation: >-
              conversation summarize
            instruction: >-
              Consider summarizing this older exchange. Read the original messages
              in the suggested range first; keep the newer exchange outside the
              summary.
          actions: []
      handling:
        h1: >-
          Acknowledge this delivery before anything else, by your host contract's
          route where it leaves acknowledgement to you: until then the user's message
          reads Sent or Queued rather than Picked up.
        h2: >-
          The user answered in a thread; the batch's `conversations` carries the
          thread's context, and `leaf conversation read <page> <conversation-id>`
          reads its history in pages.
        h3: >-
          If this event's conversation has a null `title` in the batch's `conversations`,
          name it with `leaf conversation title <page> <conversation-id> --text
          "<a few words>"`, so the thread panel lists its subject rather than its
          opening words.
        h4: >-
          This event's thread has grown long, and its entry in the batch's `conversations`
          carries a `summary_hint`. Once you have replied, summarize the range the
          hint names, as the Leaf skill's `references/conversation-threads.md`,
          "Summarize a long discussion", says.
        h5: >-
          Answer with `leaf reply <page> --for <event-id>`. In a Codex task Leaf
          observes over App Server, your final message is the reply instead, and
          `leaf reply` refuses the event. Where you answer with `leaf reply`, reply
          before any other work, including the work this event asks for: give the
          answer, or say what you are about to do and where the result will appear.
          Once that work lands, report it with `leaf reply <page> --to <address>
          --initiates`, where `<address>` is the event's `obligation.response.to`.
          `leaf reply` checks any saved page edit and makes it live before posting.
          If a revision removes what the thread is anchored on, move the thread
          in the reply that reports it with `--section <id>` (narrowed by `--quote`
          or `--part` if needed), or `--detach` it if its subject has left the page.
          Add `--awaits` only if your reply's prose asks the user something. Your
          reply renders as Markdown, so show code or markup in a fenced block.
      events:
        - kind: reply
          author: user
          parent: event-2
          text: >-
            What do you recommend now?
          id: event-14
          ts: <time>
          seq: 14
          subject:
            kind: conversation
            id: event-2
          conversations: [event-2]
          handling: [h1, h2, h3, h4, h5]
          obligation:
            as_of_seq: 14
            response:
              kind: reply
              to: event-14
              for: event-14
