comment a newer message answers through:
  event:
    kind: comment
  told: []

suggestion:
  event:
    kind: comment
    suggestion: true
    answer:
      kind: reply
      writer: agent
  told:
    - when: {"required": ["suggestion"], "properties": {"suggestion": {"const": true}}}
      text: >-
        A suggestion proposes exact replacement text. Apply it verbatim, or reply
        with your reason for declining.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
