name: publish-site

# The static site and the canonical Python example server share one Cloudflare
# Worker origin. The container image copies the exact site build verified here;
# deployment therefore cannot publish one document while serving another.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      # The whole skill payload: the site serves a vendored layer, and that is merged
      # from the kernel and bundled package alike — a change to either
      # is a change to what a visitor loads.
      - 'skills/leaf/**'
      - 'scripts/site.py'
      - 'worker/**'
      - 'Dockerfile.website'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-deploy
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Deploy site and example server
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
