# Internal maintainer diagnostics from the 2026-10-10 recording-viewer review.
# Timing distinguished Sol from Opus/Fable in static calibration; image movement
# was the easier sensitivity control. Candidate tasks never state the diagnosis.
# Candidate requests are frozen independently of the private scoring targets.
# A sample is a fresh review, not a continuation of the historical authoring session.
cases:
  recording-times:
    source_files:
      - "{candidate}.html"
      - assets/timeline.esm.js
    prompt: |
      Review this browser-recording viewer before it is handed to a reader.
      The reader needs to understand the sequence and timing of the recorded
      inputs, compare nearby inputs, and reach the named outcomes.
      Identify consequential usability problems you can substantiate from
      the supplied evidence. For each finding, explain the observation,
      its effect on that task, and any uncertainty. Do not assume there is
      a defect, and do not invent interactions you did not observe.
  recording-stepping:
    source_files:
      - "{candidate}.html"
      - "{candidate}.js"
      - assets/widget-api.js
      - assets/scene.svg
    prompt: |
      Review this browser-recording viewer before it is handed to a reader.
      The reader needs to inspect the recorded application while stepping
      forward and backward through actions and the frames between them.
      Identify consequential usability problems you can substantiate from
      the supplied evidence. For each finding, explain the observation,
      its effect on that task, and any uncertainty. Do not assume there is
      a defect, and do not invent interactions you did not observe.
  # 2026-10-27 message Copy work: three misses the user found after the author's
  # own checks and cold reviews. One request and task covers all three.
  message-copy-placement:
    source_files: &thread-source
      - "{candidate}.html"
    prompt: &thread-prompt |
      Review this comment thread before it is handed to a reader. Its latest
      change answers the user's request for "a very subtle floating copy
      button for each message in a thread, so it can be copied as markdown".
      The reader needs to read the thread, copy any one message, rewrite
      their own messages, and use the thread's own actions.
      Identify consequential usability problems you can substantiate from
      the supplied evidence. For each finding, explain the observation,
      its effect on that task, and any uncertainty. Do not assume there is
      a defect, and do not invent interactions you did not observe.
  later-message-controls:
    source_files: *thread-source
    prompt: *thread-prompt
  controls-after-a-press:
    source_files: *thread-source
    prompt: *thread-prompt
