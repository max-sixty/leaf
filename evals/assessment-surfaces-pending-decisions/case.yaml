            </table></div></details>
            <p class="boundary">These are planned boundaries, not proven standalone patches. #49 and #50 share parts of <code>lf-diff.js</code>, anchor travel and thread seating. Extract semantic hunks and run composition checks; do not copy those files whole or create duplicate owners to make the split easier.</p>
          </section>
          <section id="companion-queue">
            <h2>Independent companion extracts</h2>
            <p>These remain independent of the deferred draft work; #58 is deferred at your request. Keep each behavior independently reviewable; small changes on unrelated surfaces do not form one UI-polish PR.</p>
            <details><summary>Separate scopes for inspection, review tools, chrome and thread presentation</summary><div class="scopes"><table id="companion-map">
              <thead><tr><th>Extract</th><th>Owners and proof</th></tr></thead>
              <tbody>
