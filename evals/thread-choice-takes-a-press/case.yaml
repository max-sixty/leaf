        You'd open the pull request and merge it once CI passes, but you need the user's
        permission before opening it.

        The page and services are unreachable in this exercise. Write out the command you would
        run to answer the user's comment, with the full text of the reply and any markup, then
        end your answer.
    assert:
      - type: llm-rubric
        metric: permission-in-the-reply
        value: |
          Pass only if the reply asks permission to open the pull request with a widget
          in `--markup` whose options take the action or leave things as they are, such
          as `lf-options` with "Open the pull request" and "Keep it on the branch". Fail
          if it asks only in words, even with `--obligation`, or opens the pull request
          without asking.
      - type: llm-rubric
        metric: asked-once
        value: |
          Pass unless a reply that carries a widget asking for permission also passes
          `--obligation`. A reply without such a widget passes this metric.
      - *markup-accepted
  open-question:
    metadata:
      purpose: A question whose answer the agent can't list stays in words, with --obligation.
    vars:
      prompt: |
