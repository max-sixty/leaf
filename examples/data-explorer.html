<!doctype html>
<html lang="en">
  <head>
    <title>Shape a release query</title>
    <meta
      name="description"
      content="Choose releases for a report: add filters, check the matching rows, and ask the agent to build the query."
    />
    <style>
      release-query-explorer {
        display: grid;
        gap: var(--sp-3);
        min-width: 0;
      }

      .query-toolbar,
      .query-row,
      .query-row-actions {
        display: flex;
        flex-wrap: wrap;
        /* Wrapped rows keep each button's reach, which stands past its face
           under a finger, clear of the row above it. */
        gap: max(var(--sp-2), 2 * var(--lf-reach-room)) var(--sp-2);
        align-items: center;
      }

      .query-toolbar {
        justify-content: space-between;
      }

      .query-row {
        --lf-block-frame: 1;
        padding: var(--sp-2);
        border: 1px solid var(--border-2);
        border-radius: var(--r-sm);
        background: var(--card);
      }

      .query-row > label {
        display: grid;
        gap: var(--sp-1);
        min-width: 8rem;
        color: var(--ink-2);
        font: 600 var(--t-6) / 1.2 var(--sans);
      }

      .query-row-actions {
        margin-inline-start: auto;
      }

      .query-result-count {
        margin: 0;
        color: var(--ink-2);
        font: 650 var(--t-5) / 1.3 var(--sans);
      }

      /* A table on the stage takes the stage's width; its frame scrolls it when the
         stage is narrower than its columns. */
      .query-results {
        display: table;
        table-layout: fixed;
        width: 100%;
        min-width: 30rem;
      }

      .query-table-frame {
        min-width: 0;
        overflow-x: auto;
        padding-bottom: 15px;
        --lf-block-frame: 1;
      }

      @media (max-width: 42rem) {
        .query-row > label,
        .query-row-actions {
          flex: 1 1 100%;
          margin-inline-start: 0;
        }
      }
    </style>
    <script type="module">
      import {
        generatedElement,
        keepsText,
        layoutChanged,
        offer,
        offerAction,
        once,
        setChildren,
        whileInterfaceConnected,
      } from "/runtime/widget-api.js";

      const RELEASES = [
        { service: "Checkout", region: "europe", risk: 72, owner: "payments" },
        { service: "Catalog", region: "europe", risk: 31, owner: "discovery" },
        { service: "Ledger", region: "americas", risk: 84, owner: "payments" },
        { service: "Search", region: "asia", risk: 46, owner: "discovery" },
        { service: "Fraud", region: "europe", risk: 91, owner: "risk" },
        { service: "Identity", region: "americas", risk: 38, owner: "platform" },
      ];
      const DEFAULT_FILTERS = {
        rows: [
          { id: "filter-1", field: "region", operator: "is", value: "europe" },
          { id: "filter-2", field: "risk", operator: "above", value: "40" },
        ],
        order: ["filter-1", "filter-2"],
      };

      function matches(release, row) {
        const actual = release[row.field];
        if (row.operator === "above") return Number(actual) > Number(row.value);
        if (row.operator === "contains")
          return String(actual).toLowerCase().includes(row.value.toLowerCase());
        return String(actual).toLowerCase() === row.value.toLowerCase();
      }

      function labelledSelect(name, label, values, selected, changed) {
        const wrapper = document.createElement("label");
        wrapper.append(document.createTextNode(label));
        const select = offer("select", "");
        select.name = name;
        for (const [value, words] of values) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = words;
          option.selected = value === selected;
          select.append(option);
        }
        select.addEventListener("change", () => changed(select.value));
        wrapper.append(select);
        return wrapper;
      }

      customElements.define(
        "release-query-explorer",
        class extends HTMLElement {
          #playground = null;
          #filters = null;
          #rows = null;
          #results = null;
          #count = null;
          #rowEls = new Map();
          #listed = "";

          connectedCallback() {
            if (!once(this)) return;
            this.#build();
            whileInterfaceConnected(this, {
              declare: () => this.#initialize(),
              connect: () => this.#playground.subscribe(() => this.#render()),
            });
          }

          #build() {
            const toolbar = document.createElement("div");
            toolbar.className = "query-toolbar";
            toolbar.append(
              document.createTextNode("Releases must match every filter."),
            );
            const add = offerAction("word", "query-add", "Add filter");
            add.addEventListener("click", () => {
              const state = this.#filters.get();
              const next =
                Math.max(
                  0,
                  ...state.rows.map((row) => Number(row.id.split("-").at(-1))),
                ) + 1;
              const id = `filter-${next}`;
              this.#filters.set({
                rows: [
                  ...state.rows,
                  { id, field: "owner", operator: "is", value: "platform" },
                ],
                order: [...state.order, id],
              });
              queueMicrotask(() =>
                this.querySelector(`[data-filter-id="${id}"] input`)?.focus(),
              );
            });
            toolbar.append(add);
            this.#rows = document.createElement("div");
            this.#rows.className = "query-rows";
            this.#count = document.createElement("p");
            this.#count.className = "query-result-count";
            this.#count.setAttribute("aria-live", "polite");
            this.#results = document.createElement("tbody");
            const table = document.createElement("table");
            table.className = "query-results";
            table.innerHTML =
              "<thead><tr><th>Service</th><th>Region</th><th class='num'>Risk</th><th>Owner</th></tr></thead>";
            table.append(this.#results);
            const tableFrame = document.createElement("div");
            tableFrame.className = "query-table-frame";
            tableFrame.append(table);
            // The module writes every word here: the filter rows label controls, and the
            // rest is the explorer speaking.
            for (const box of [toolbar, this.#count, tableFrame])
              generatedElement(box, { says: true });
            generatedElement(this.#rows, { says: false });
            this.append(toolbar, this.#rows, this.#count, tableFrame);
          }

          #initialize() {
            this.#playground = this.closest("lf-playground");
            this.#filters = this.#playground.registerContributor(
              "filters",
              DEFAULT_FILTERS,
              this,
            );
            this.#playground.registerInstructionProvider((values) => {
              const rows = values.filters.order.map((id) =>
                values.filters.rows.find((row) => row.id === id),
              );
              const conditions = rows
                .map((row) => `${row.field} ${row.operator} ${row.value}`)
                .join(" and ");
              const filterTask = conditions
                ? `Require ${conditions}`
                : "Apply no filters";
              return `Implement the release query in release-report.sql. ${filterTask}. Return at most ${values.limit} matching releases in source order, and show the query plus its result-table test.`;
            });
          }

          #update(id, field, value) {
            const state = this.#filters.get();
            this.#filters.set({
              ...state,
              rows: state.rows.map((row) =>
                row.id === id ? { ...row, [field]: value } : row,
              ),
            });
          }

          #move(id, offset) {
            const state = this.#filters.get();
            const from = state.order.indexOf(id);
            const to = from + offset;
            if (to < 0 || to >= state.order.length) return;
            const order = [...state.order];
            [order[from], order[to]] = [order[to], order[from]];
            this.#filters.set({ ...state, order });
          }

          #remove(id) {
            const state = this.#filters.get();
            const index = state.order.indexOf(id);
            this.#filters.set({
              rows: state.rows.filter((row) => row.id !== id),
              order: state.order.filter((rowId) => rowId !== id),
            });
            queueMicrotask(() => {
              const rows = this.querySelectorAll(".query-row");
              const next = rows[Math.min(index, rows.length - 1)];
              (
                next?.querySelector("input") ?? this.querySelector(".query-add")
              ).focus();
            });
          }

          // Each filter keeps its row across renders, so the value being typed keeps its
          // caret, and a render writes only what moved: a label, an end of the list, or
          // the order.
          #row(row) {
            const known = this.#rowEls.get(row.id);
            if (known) return known;
            const { id } = row;
            const element = document.createElement("div");
            element.className = "query-row";
            element.dataset.filterId = id;
            const field = labelledSelect(
              `${id}-field`,
              "Field",
              [
                ["region", "Region"],
                ["risk", "Risk"],
                ["owner", "Owner"],
              ],
              row.field,
              (value) => this.#update(id, "field", value),
            );
            const operator = labelledSelect(
              `${id}-operator`,
              "Operator",
              [
                ["is", "is"],
                ["above", "is above"],
                ["contains", "contains"],
              ],
              row.operator,
              (value) => this.#update(id, "operator", value),
            );
            const valueLabel = document.createElement("label");
            valueLabel.append(document.createTextNode("Value"));
            const input = offer("input", "", undefined, "text");
            input.name = `${id}-value`;
            input.value = row.value;
            input.addEventListener("input", () =>
              this.#update(id, "value", input.value),
            );
            valueLabel.append(input);
            const actions = document.createElement("div");
            actions.className = "query-row-actions";
            const up = offerAction("word", "small");
            const down = offerAction("word", "small");
            const remove = offerAction("word", "small");
            up.addEventListener("click", () => this.#move(id, -1));
            down.addEventListener("click", () => this.#move(id, 1));
            remove.addEventListener("click", () => this.#remove(id));
            actions.append(up, down, remove);
            element.append(field, operator, valueLabel, actions);
            const made = {
              element,
              field: field.querySelector("select"),
              operator: operator.querySelector("select"),
              input,
              up,
              down,
              remove,
            };
            this.#rowEls.set(id, made);
            return made;
          }

          #render() {
            const state = this.#filters.get();
            const byId = new Map(state.rows.map((row) => [row.id, row]));
            const last = state.order.length - 1;
            const shown = state.order.map((id, index) => {
              const row = byId.get(id);
              const made = this.#row(row);
              if (made.field.value !== row.field) made.field.value = row.field;
              if (made.operator.value !== row.operator)
                made.operator.value = row.operator;
              if (made.input.value !== row.value) made.input.value = row.value;
              keepsText(made.up, `Move filter ${index + 1} up`);
              keepsText(made.down, `Move filter ${index + 1} down`);
              keepsText(made.remove, `Remove filter ${index + 1}`);
              made.up.toggleAttribute("disabled", index === 0);
              made.down.toggleAttribute("disabled", index === last);
              return made.element;
            });
            for (const id of this.#rowEls.keys())
              if (!byId.has(id)) this.#rowEls.delete(id);
            setChildren(this.#rows, shown);
            const values = this.#playground.values;
            const filtered = RELEASES.filter((release) =>
              state.order.every((id) => matches(release, byId.get(id))),
            ).slice(0, values.limit);
            const listed = JSON.stringify(filtered);
            if (listed !== this.#listed) {
              this.#listed = listed;
              this.#results.replaceChildren(
                ...filtered.map((release) => {
                  const row = document.createElement("tr");
                  for (const value of Object.values(release)) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    if (typeof value === "number") cell.className = "num";
                    row.append(cell);
                  }
                  return row;
                }),
              );
            }
            keepsText(
              this.#count,
              `${filtered.length} ${filtered.length === 1 ? "release" : "releases"} shown`,
            );
            layoutChanged(this);
          }
        },
      );
    </script>
  </head>
  <body>
    <main class="layout-workspace density-working" id="release-query-workspace">
      <header><h1>Shape a release query</h1></header>
      <lf-ask id="release-query-ask" data-width="available">
        <h2>Which release query should the agent build?</h2>
        <lf-playground
          id="release-query-playground"
          contract="data-explorer-values"
          submit-label="Build query"
        >
          <lf-playground-control
            name="limit"
            label="Maximum results"
            kind="range"
            value="4"
            min="1"
            max="6"
            step="1"
          ></lf-playground-control>
          <lf-playground-preset label="Up to 4 results">
            <lf-playground-setting for="limit" value="4"></lf-playground-setting>
          </lf-playground-preset>
          <lf-playground-preset label="Up to 6 results">
            <lf-playground-setting for="limit" value="6"></lf-playground-setting>
          </lf-playground-preset>
          <lf-playground-preview id="release-query-preview">
            <release-query-explorer
              id="release-query-explorer"
            ></release-query-explorer>
          </lf-playground-preview>
          <lf-playground-output id="release-query-instruction">
            Implement the default release query in <code>release-report.sql</code> and
            show the query plus its result-table test.
          </lf-playground-output>
        </lf-playground>
      </lf-ask>
    </main>
  </body>
</html>
