# Claude Code's and Pi's hooks confirm the inline envelope they hand over, so the
# update reads Delivered as the hook runs instead of after the model's first call,
# and the model runs no `leaf delivery ack` of its own. It guards on both Codex and
# Claude Code. Opus 5.5's safeguards can refuse a Claude Code run whose prompt asks
# for each tool call with its full JSON input, so it asks for the commands
# instead. The envelope is frozen with `freeze_delivery`: answers name `parent` and
# `responds`, the format is `leaf-delivery/52`, and ids, page, claim and times are
# substituted. The handling is left empty. It is written as the hook writes it
# (`json_block`).
description: claude-hook-delivery-needs-no-ack
metadata:
  purpose: "A Claude hook delivery arrives confirmed: run no acknowledgement command, and name the update's work first."
  tags: [wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:

    ```json
    {
     "format": "leaf-delivery/52",
     "id": "dc81eabb",
     "created_at": 1791448199.576215,
     "acknowledge": null,
     "batches": [
      {
       "page": "/tmp/review",
       "claim": null,
       "through_seq": 2,
       "threads": [
        {
         "id": "comment-a",
         "title": null,
         "anchor": null,
         "detached_from": null,
         "rewritten_from": null,
         "resolved": null,
         "elided": {
          "messages": 0,
          "actions": 0
         },
         "messages": [],
         "summaries": [],
         "actions": []
        }
       ],
       "handling": {},
       "events": [
        {
         "kind": "comment",
         "author": "user",
         "revision": 1,
         "text": "Please revise the opening to name the owner.",
         "id": "comment-a",
         "attention": true,
         "ts": "2026-10-08T01:29:59.412-07:00",
         "seq": 2,
         "subject": {
          "kind": "thread",
          "id": "comment-a"
         },
         "threads": [
          "comment-a"
         ],
         "answer": {
          "kind": "reply",
          "parent": "comment-a",
          "responds": "comment-a",
          "ref": "dc81eabb:0:comment-a",
          "writer": "agent"
         }
        }
       ]
      }
     ]
    }
    ```

    The page is already served. Only Skill and Read run here, so write out, in order, each command you would run
    before starting the requested revision. Then end your answer.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if no written command acknowledges or confirms the delivery (`leaf
      delivery ack` or `leaf delivery read`), and a written
      command takes the comment's work in hand before any edit, with a line saying
      what the work is: `leaf task start /tmp/review comment-a --text "<a line>"`, or a
      progress message `leaf thread reply dc81eabb:0:comment-a --ephemeral
      --text "<a line>"`. Fail if a command starts `leaf wait`. Reading instructions
      or page state first is fine.
