name = "leaf-website"
account_id = "ece2539b9b32ab59dd74aa6b6285e5db"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat_do_not_populate_process_env"]
workers_dev = false

[assets]
directory = "../.tmp/site-assets"
binding = "ASSETS"
run_worker_first = true

[vars]
AGENT_PREWARM = "true"

[secrets]
required = ["OPENAI_API_KEY"]

[[containers]]
# Cloudflare keys a container application to its Durable Object namespace, and a
# namespace can hold only one. Wrangler matches the deployed application by name and
# otherwise derives it from `<worker>-<class_name>`, so the v2 class rename below asked
# it to create a second application against the namespace the first one already holds —
# DURABLE_OBJECT_ALREADY_HAS_APPLICATION. Naming the standing application keeps the
# deploy on the modify path. Renaming it would mean deleting the application first,
# which drops every seated reader session.
name = "leaf-website-leafexamplesession"
class_name = "LeafWebsiteSession"
image = "../Dockerfile.website"
# Product routes give every browser a private Leaf session. The container runs Codex
# App Server as well as Leaf, so the smallest interactive instance is `basic`; `lite`
# provides only 1/16 vCPU and 256 MiB. Cloudflare's account limit fits 6,000
# concurrent basic instances; reserve ten slots for the standing dev application.
max_instances = 5990
instance_type = "basic"
# A visible tab's news stream keeps an active session alive. During a release,
# Cloudflare may still replace it after this bounded drain window; website state is
# explicitly ephemeral until it has a durable page-directory store.
rollout_active_grace_period = 600

[[durable_objects.bindings]]
name = "PAGES"
class_name = "LeafWebsiteSession"

[[analytics_engine_datasets]]
binding = "WEBSITE_EVENTS"
dataset = "leaf_website_events"

[[ratelimits]]
name = "SOURCE_AGENT_RATE_LIMITER"
namespace_id = "34302"

  [ratelimits.simple]
  limit = 20
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeafExampleSession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

[observability]
enabled = true

[[routes]]
pattern = "leaf.page"
custom_domain = true

# One standing remote environment for testing an arbitrary checkout before it reaches
# main. Production remains the top-level environment used by publish-site.yaml. The
# developer command always names `--env dev`, so it cannot omit its target and replace
# leaf.page by accident. Bindings are repeated because Wrangler environments
# intentionally do not inherit them.
[env.dev]
name = "leaf-website-dev"
workers_dev = true
routes = []

  [env.dev.assets]
  directory = "../.tmp/site-assets"
  binding = "ASSETS"
  run_worker_first = true

  [env.dev.vars]
  AGENT_PREWARM = "true"

  [env.dev.secrets]
  required = ["OPENAI_API_KEY"]

  [[env.dev.containers]]
  name = "leaf-website-dev-leafexamplesession"
  class_name = "LeafWebsiteSession"
  image = "../Dockerfile.website"
  max_instances = 10
  instance_type = "basic"
  rollout_active_grace_period = 600

  [[env.dev.durable_objects.bindings]]
  name = "PAGES"
  class_name = "LeafWebsiteSession"

  [[env.dev.analytics_engine_datasets]]
  binding = "WEBSITE_EVENTS"
  dataset = "leaf_website_events_dev"

  [[env.dev.ratelimits]]
  name = "SOURCE_AGENT_RATE_LIMITER"
  namespace_id = "34302"

    [env.dev.ratelimits.simple]
    limit = 20
    period = 60

  [[env.dev.migrations]]
  tag = "v1"
  new_sqlite_classes = ["LeafExampleSession"]

  [[env.dev.migrations]]
  tag = "v2"
  renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

  [env.dev.observability]
  enabled = true
