# Work a background worker carries past the turn is held as a task on the user's
# thread, since the reply settles the comment and a `working` claim lapses with the
# turn. Scores conversation-loop.md, "Long-running work". In `waits-in-turn` the
# turn stays open while the worker runs, and the panel's status shows the to-do's
# work only once the agent starts the to-do; the reply's text, which says what is
# under way, pulls toward treating the status as already written. In `moves-on`
# the agent hands the work to a worker and turns to other items it has started,
# whose status line pulls it toward leaving the to-do unstarted and the worker
# unbriefed about the page.
description: todo-outlasts-the-turn
metadata:
  purpose:
    "Conversation loop: work a background worker carries past the turn gets a to-do on the
    thread it answers, beside the reply, and the to-do is ended once the result lands."
  tags:
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf page at
    ~/.local/state/leaf/pages/design, served with `leaf server start`. A delivery
    just brought one user comment, id 7c41d0e2, opening thread 7c41d0e2 on the
    banner: "Make the banner quieter, and drop its border." Its answering answer is `{kind: reply, writer: agent, ref: "7f20c3d9:0:7c41d0e2"}`.

    The rebuild takes about twenty minutes, so you start a background subagent on it
    and will end your turn while it runs. Its result will wake a later turn, in which
    you will stamp version 4 with the quieter banner.

    Only Skill and Read run here, so write out,
    in order, each command you would run on the page in this turn, and then each one
    you would run in the later turn after stamping version 4.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if, in this turn, the commands answer 7c41d0e2 with `leaf thread
      reply` carrying `--todo "<title>"` for the rebuild; and if, in the later turn,
      they include `leaf task end` naming that to-do (the reply's id) with outcome
      `done` and a detail pointing at version 4. Starting the comment or the to-do alongside is fine. Fail if no to-do is
      opened, if the to-do is opened only in the later turn, or if it is never ended.
variants:
  waits-in-turn:
    metadata:
      purpose:
        "Conversation loop: while a worker carries a to-do's work and the turn waits
        on it, the panel's status shows the agent's line for that work."
    vars:
      prompt: |
        You are a Claude Code session driving a live Leaf page at
        ~/.local/state/leaf/pages/model, served with `leaf server start`. A delivery
        just brought one user comment, id 4be0c1d2, opening thread 4be0c1d2 on the
        parameter table: "S is assumed at 4k. Fit it from my sessions instead." Its
        answer is `{kind: reply, writer: agent, ref: "9b4c55e1:0:4be0c1d2"}`.

        The fit takes about twenty minutes, so you start a background subagent on it
        and reply to the comment. You stay in this turn while it runs, checking for
        its commit about once a minute with `bash wait_commit.sh`, which waits up to a
        minute. Six minutes in, Leaf's hook delivers another comment, id 7a19e3f0, on
        the chart's caption: "Why 3.3k here?" Its answer is
        `{kind: reply, writer: agent, ref: "9b4c55e1:0:7a19e3f0"}`, and you can answer
        it from the page. The subagent commits twelve minutes after that.

        Only Skill and Read run here, so write out, in order, each command you would
        run in this turn, from answering 4be0c1d2 until the subagent commits, the
        polls included.
    assert:
      - type: llm-rubric
        metric: status-shows-the-work
        value: |
          Pass only if, from the reply on 4be0c1d2 until the first poll, the
          commands leave the fit in hand on the page under the agent's own line for
          it. Where 4be0c1d2 is answered with a `--todo` reply (or a to-do is opened
          for the fit another way), a start on that to-do with a line saying what is
          running comes before the first poll: `leaf task start` naming it (for a
          `--todo` reply, the reply's id), or a progress line (`--ephemeral`) on
          4be0c1d2's reference after the `--todo` reply, which starts the to-do. Where 4be0c1d2 instead stays unanswered until the
          commit, a progress line on it (`--ephemeral`, or `leaf task start` on
          4be0c1d2) before the first poll does the same. Starting again later, such
          as after answering 7a19e3f0, is fine. Fail if 4be0c1d2 is answered before
          the first poll and no start on the fit's to-do follows, so the only words on
          the page about the fit are the reply's text, or if 4be0c1d2 is answered
          `--done` before the subagent commits.
  moves-on:
    metadata:
      purpose:
        "Conversation loop: while a background worker carries a to-do's work and the
        agent moves on to other items, the to-do shows a line of its own and the
        worker's brief carries the reference it posts its progress on."
    vars:
      prompt: |
        You are a Claude Code session driving a live Leaf page at
        ~/.local/state/leaf/pages/forks, served with `leaf server start`. Earlier in
        this turn the user picked "Merge them" on widget merge-prs, action 145fff29,
        and you ran `leaf task start ~/.local/state/leaf/pages/forks 145fff29 --text
        "merging #6488"`; that merge is still running in your shell.

        Leaf's hook has just delivered two comments. Comment 2c666806, on the
        "after" example of PR #6502: "but then does this repeat itself? it has the
        option cards already". Its answer is
        `{kind: reply, writer: agent, ref: "9b4c55e1:0:2c666806"}`. Comment df8e7d6f,
        on the page: "consider splitting this page into parts so we can more easily
        navigate it". Its answer is
        `{kind: reply, writer: agent, ref: "9b4c55e1:0:df8e7d6f"}`.

        You have checked: yes, the example repeats each option's reason that its
        cards already show, in 6 of 8 eval runs. The fix is a guidance change that
        says each option once, on its card, scored against `main`; drafting and
        scoring it takes about twenty minutes, so you will answer 2c666806 now and
        hand the fix to a background subagent. While it runs you will finish the
        merges and split the page yourself, then answer df8e7d6f.

        Only Skill and Read run here, so write out, in order, each command you would
        run on the page in this turn until df8e7d6f is answered, and the brief you
        would give the subagent.
    assert:
      - type: llm-rubric
        metric: promise-shows-its-work
        value: |
          Pass only if 2c666806 is answered without `--done` (a `--todo` reply, or a
          to-do opened for the fix another way), and before the commands turn to the
          merges or the split, a start on the fix's to-do with a line saying what is
          running follows: `leaf task start` naming the to-do (for a `--todo` reply,
          the reply's id), or a progress line (`--ephemeral`) on 2c666806's
          reference after the `--todo` reply, which starts the to-do. Starting other
          items afterwards is fine. Fail if the fix's only words on the page are the
          answer's text, or if 2c666806 is answered `--done`.
      - type: llm-rubric
        metric: worker-reports-on-the-promise
        value: |
          Pass only if the subagent's brief names the page and either 2c666806's
          reference or the fix's to-do, and asks the subagent to post on it, as it
          works, a line saying what it is doing (a progress reply or a
          `leaf task start`). Ending the to-do from the brief is fine but not
          required. Fail if the brief leaves the page out, or leaves the subagent no
          way to show its progress on the fix's to-do or thread.
