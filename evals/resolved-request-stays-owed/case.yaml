assert:
  - type: llm-rubric
    metric: request-stays-owed
    value: |
      Pass only if the session treats the user's message as a request it still owes:
      it does or plans the CLAUDE.md work, and a written command answers the message
      at its reference, `leaf thread reply c41d07e2:0:9be2f4a1` with a declaration
      such as `--done`, `--obligation` or `--todo`. A progress line first
      (`--ephemeral`, or `leaf task start`) is fine, and so is reading the page or
      CLAUDE.md first. Fail if it reads the resolve as cancelling the request and
      does no work or writes no answer, if `leaf thread resolve` stands in place of
      the answer, or if it reopens the thread with `leaf thread unresolve` or asks
      the user to reopen it.
