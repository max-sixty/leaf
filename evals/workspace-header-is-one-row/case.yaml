# Added with the one-row workspace header (#1301). Base at cd1d37b0d 0 of 3 (one run
# put a lede in the header), the change 3 of 3.
# takes-working-density added with `density-working`, which the workspace template now
# writes beside the Layout class.
description: workspace-header-is-one-row
metadata:
  purpose: 'Writing a workspace: its header takes the window''s height before the panes do, so it holds
    the title and the page''s status and nothing a pane could hold.'
  tags:
  - layout
vars:
  prompt: |
    Write a Leaf page for the user as a workspace. It reviews 14 flaky tests from last
    week's CI: a list of the tests on the left, ordered by how often each failed, and on
    the right the selected test's failure log excerpt with a choice of what to do with it
    (quarantine, fix now, or delete). Three are already quarantined and five fail more
    than half the time; the page should say so. The user reads it on a laptop at about
    1280 by 800, and asked you to explain in a sentence or two what the page is for and
    what you will do once they have chosen.

    The page directory is not reachable from here, so reply with the complete
    `index.html`, rather than writing a file.
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-page-authoring
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/page-authoring\.md
- type: llm-rubric
  metric: judgment
  value: |
    Read the HTML. Pass only if `main` has class `layout-workspace` and its `header`
    holds the title and, at most, the page's status as short chips or one short line of
    them (for example `.tag` spans saying how many are quarantined or fail often): no
    paragraph explaining the page, no eyebrow, no lede, no legend or instructions. The
    sentence or two the user asked for must still be on the page, inside a pane or
    region of the body (for example at the top of the list pane or the detail pane).
    Fail if the header holds a lede or explanatory paragraph, or if the explanation was
    dropped from the page entirely.
- type: javascript
  metric: takes-working-density
  value: file://text-regex.cjs
  config:
    pattern: <main\b[^>]*\bclass=["'][^"']*\bdensity-working\b
    flags: i
    negate: false
