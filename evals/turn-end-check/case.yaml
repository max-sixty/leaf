# The turn-end check (`src/leaf/agents/clerk.py`), replayed on a short conversation written
# for each decision its prompt asks about, each with a guardrail whose right answer
# names nothing. Run every case with `uv run leaf-dev eval run 'turn-end-check*'
# --harness claude-code`; inputs, labels and rubrics are in
# workflows/fork_eval.yaml.
description: Turn-end check
metadata:
  purpose: A fork at a clean turn end names nothing.
  tags: [workflow, forks, asks]
  harnesses: [claude-code]
  conditions: [leaf]
  executor: leaf_dev.fork_eval
  scenario: clean
variants:
  ask-question:
    metadata:
      scenario: ask-question
      purpose: A decision between two answers the agent's last reply left to the user goes On Me as a choice of them.
  ask-choice:
    metadata:
      scenario: ask-choice
      purpose: A three-way decision the agent's reply left to the user, with its advice, goes On Me as a choice of the three with the advised one marked.
  ask-permission:
    metadata:
      scenario: ask-permission
      purpose: A merge the agent's reply leaves to the user, telling them to run a command in the session for it, goes On Me as a choice to merge or hold off, since the agent merges on their word.
  ask-permission-named:
    metadata:
      scenario: ask-permission-named
      purpose: A merge the agent's closeout names by number and by code is asked by what the change does, so the user can decide from the card alone.
  ask-step:
    metadata:
      scenario: ask-step
      purpose: A command only the user can run, which the agent asked them to run, goes On Me as a step offering its outcomes as a choice, in a new thread beside a closed ask on another subject.
  ask-follow-up:
    metadata:
      scenario: ask-follow-up
      purpose: A step the agent asks again after the user closed its thread goes in that thread.
  ask-step-done:
    metadata:
      scenario: ask-step-done
      purpose: A command the user ran and confirmed since is left out.
  stale-omission:
    metadata:
      scenario: stale-omission
      purpose: A fact the work added, which the page doesn't mention and nothing contradicts, is no stale finding.
  ask-on-me:
    metadata:
      scenario: ask-on-me
      purpose: A question the reply asks, which an On Me item already holds, isn't asked again.
  ask-held:
    metadata:
      scenario: ask-held
      purpose: A choice the user answered with a question, which the agent restates in chat, isn't asked again, since the page still holds it for the agent's answer.
  ask-answered:
    metadata:
      scenario: ask-answered
      purpose: A question the user answered in chat since is left out.
  stale-edit:
    metadata:
      scenario: stale-edit
      purpose: A lede the work has overtaken is named stale, and its few-word fix lands on the page.
  stale-rewrite:
    metadata:
      scenario: stale-rewrite
      purpose: A section the user dropped in chat is named stale, with no edit, since removing it needs more than a few words.
  stale-passed-on:
    metadata:
      scenario: stale-passed-on
      purpose: A stale passage Leaf's earlier message already passed on is left out.
  stale-lead:
    metadata:
      scenario: stale-lead
      purpose: Finished work the page still tells as news, while the question the work moved on to waits below it, is named stale.
  stale-lead-current:
    metadata:
      scenario: stale-lead-current
      purpose: A page rewritten around the new question, its finished work folded into a record, has nothing stale.
  settled:
    metadata:
      scenario: settled
      purpose: An On Me question the user answered in chat is named settled.
  settled-open:
    metadata:
      scenario: settled-open
      purpose: An On Me question the user's chat message touches without answering is left alone.
  unshown:
    metadata:
      scenario: unshown
      purpose: Background work the agent promised to report on, which no page shows, is named unshown.
  unshown-shown:
    metadata:
      scenario: unshown-shown
      purpose: Background work the page shows started, and a watcher serving the agent's own check, are left out.
  overtaken-correction:
    metadata:
      scenario: overtaken-correction
      purpose: A reply contradicting the agent's own earlier reply, both standing, is named overtaken.
  overtaken-news:
    metadata:
      scenario: overtaken-news
      purpose: A reply bringing the result the agent's earlier reply promised overtakes nothing.
  overtaken-awaited:
    metadata:
      scenario: overtaken-awaited
      purpose: A reply bringing the news the agent's unanswered question waited on overtakes nothing.
  overtaken-question:
    metadata:
      scenario: overtaken-question
      purpose: A thread question the user answered there, whose subject later work completed with no reply there, is named overtaken.
