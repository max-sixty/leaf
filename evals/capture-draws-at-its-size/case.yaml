# From session 498a60e2, whose page showed seven floating-panel captures taken at device
# scale 1 and drawn at their pixel size, soft on the user's high-density screen, with
# one width and height typed onto all seven although two files were shorter, which
# stretched them. Leaf now sizes page images from their files and reads a `@2x` mark;
# this case asks whether an author captures sharp images and lets Leaf size them.
# Cold, it did not tell the arms apart: base 19571ceb5 and the candidate each passed 3
# of 3. Every base run captured at scale 2 and typed width="540" height="260" from the
# size the prompt gives; every candidate run named its captures `@2x` and typed none,
# which is the change the instruction makes.
description: capture-draws-at-its-size
metadata:
  purpose:
    "Source files and media: an interface capture is taken at two device pixels per
    CSS pixel and drawn at the size it had on screen, with no hand-typed size that
    could misstate its shape."
  tags:
    - evidence
vars:
  prompt: |
    You are writing a Leaf page that asks the user where an app's side panel should
    draw the agent's plan. Read "Source files and media" in
    `references/authoring-evidence.md` under the skill's base directory first.

    The panel is a 540 by 260 CSS pixel box, `.side-panel`, at the bottom of a
    1200x900 window of a local app at http://127.0.0.1:8000/. Show two captures of it
    side by side, one per candidate: `?sketch=a` (the plan heads the agent's list)
    and `?sketch=b` (the plan has its own tab). You will take them with a Python
    Playwright script.

    The page directory is not reachable from here, so reply with the script, the
    commands you would run to add the captures to the page, and the section's HTML
    fragment, rather than writing files. Use `/media/<name>` for each image you would
    register.
assert:
  - type: llm-rubric
    metric: sharp-capture
    value: |
      Read the script, commands and HTML. Pass only if the script captures at two
      device pixels per CSS pixel (a browser context with device_scale_factor=2 or
      deviceScaleFactor 2), and the page will draw each capture at its on-screen size
      of about 540 CSS pixels wide: either the captured files are named with an
      `@2x` mark (such as `panel-a@2x.png`) before they are added, or each `<img>`
      has a width of 540. Fail if the captures are taken at device scale 1 (the
      default when no scale is set), or if any `<img>` carries a width and height
      whose ratio differs from the capture's 540 by 260.
