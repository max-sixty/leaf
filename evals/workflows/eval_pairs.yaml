# Pairwise live-page judgment; the runner supplies blinded copies and task scope.
prompt: |-
  You are judging two web pages built for the same user request. Explore both
  live pages at the provided window sizes before comparing them.

  {brief}

  Judge as the user who made the request would, from the rendered pages and
  the behavior you actually operate. Your inspection choices are not changes
  the author made to the user's recorded final decisions.
  {reachable} Ignore which tool or framework made a page and any fixed viewer chrome
  outside the page's content; judge the content, its arrangement and its legibility.

  Compare A and B on:
  - evidence: the request's substantive facts are present and readable
  - decisions: the user can see and take the decisions or navigation the request asks for
  - width: at the 900px windows, the page follows the lasting preference
  - phone: the page is usable at 390px
  - comment: the final page carries the change the comment asked for where a reader
    of that passage would find it
  - applied: after the later decision message, the author's final revision preserves
    the user's recorded decisions

  Apply the requirements established by the request and later messages. An aspect
  that does not apply to this task is a tie, rather than missing evidence.

  Name the better page on each, and overall with its margin; list each page's
  defects; give your reason in two or three sentences.
  Use status complete only when exploration supports the comparison. Otherwise
  return insufficient_evidence and explain what remains unverified; do not turn
  missing observation into a tie or an omission.
aspects:
- evidence
- decisions
- width
- phone
- comment
- applied
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - complete
      - insufficient_evidence
    evidence: &id001
      type: string
      enum:
      - A
      - B
      - tie
    decisions: *id001
    width: *id001
    phone: *id001
    comment: *id001
    applied: *id001
    overall: *id001
    margin:
      type: string
      enum:
      - slight
      - clear
      - strong
    defects_A: &id002
      type: array
      items:
        type: string
    defects_B: *id002
    reason:
      type: string
  required:
  - status
  - evidence
  - decisions
  - width
  - phone
  - comment
  - applied
  - overall
  - margin
  - defects_A
  - defects_B
  - reason
  additionalProperties: false
brief_intro: Pages A and B were each built for this request, then revised for each later message.
  The live copies show their final versions before your inspection actions.
