    attention: |-
      Leaf needs attention:
      - /path/to/page: 1 acknowledged user move with no answer (`leaf thread reply <page> --for 1946b466`).
      - /path/to/page: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

