        })()
          </pre></lf-chart>
          <details id="residual-shape"><summary>Size, interfaces and validation</summary>
            <p>The patch contains roughly +5,500/−300 test lines, +2,900/−1,250 runtime and support lines, +550/−180 generated lines and +80/−35 documentation lines. Generated files include styles, event declarations and examples; they move with their inputs.</p>
            <p>The external contracts change how widgets read held drafts and resolve a source with its label. Drawing v4 adds per-stroke coverage; recheck its protocol change against current main when extracting. The drawing producer, schema, browser/Python readers and generated declarations must land together.</p>
            <p><strong>Validation:</strong> The recorded integrated-head validation at <code>05a5008b3</code> passed 383 runtime checks. The integration also passed 109 framework checks, focused model and browser checks, Worker types, generated-output checks and independent review. The follow-up main batch covered URL validation, scoped tally navigation, sidebar continuity and widget highlights. Inline diff arrival, commenting and reconnect are covered by a regression and the restored live filename sample.</p>
            <p>The three live samples below passed their native journeys and light/dark render gates at that checkpoint. Those checks establish the integrated branch and examples; they do not establish the future reconstructed extracts.</p>
          </details>
        </section>

        <section id="open-work">
          <h2>Weaknesses and unfinished cases</h2>
          <p>The main risk is the overlap between drawing anchors, source travel and thread seating. A file-based split would cut across those contracts. Move semantic changes with all their producers, consumers and tests.</p>
          <ul>
            <li id="drawing-coordinate-blocker"><strong>#43 · Mixed drawing coordinates:</strong> a stroke spanning a sticky filename and scrolling code cannot yet follow both correctly. Resolve the coordinate model before landing #49.</li>
            <li id="thread-recovery-blocker"><strong>#42 · Thread recovery:</strong> the Threads panel needs a distinct return to the inline discussion as well as its source passage. Recovery after the last filtered match disappears still needs validation.</li>
          </ul>
          <h3>What merging the whole branch would leave undone</h3>
          <p>A single merge would leave #42 and #43 open while combining several guarantees that have not been reviewed as separate deliveries. Keep draft recovery deferred until annotations make drafts easy to find, and keep drawing v4 behind its known blocker.</p>
        </section>

        <details id="later-scopes"><summary>Later extract boundaries: drawings, continuity and companion fixes</summary>
          <section id="large-boundaries">
            <h2>Keep the two larger guarantees coherent</h2>
            <p><strong>#49 · Drawing frames</strong> waits for the mixed-scroll fix #43. <strong>#50 · Inline reading continuity</strong> waits for the deferred draft integrity work #47. The proposed discussion presentation change (#58) is deferred.</p>
            <details><summary>Drawing and inline-continuity scope and blockers</summary><div class="scopes"><table id="large-boundary-map">
              <thead><tr><th>Extract</th><th>Keep together</th><th>Before landing</th></tr></thead>
              <tbody>
                <tr><td>#49 · Drawing frames</td><td>Drawing v4 producer and registry schema, with the protocol version reconciled against current main; JS/Python reading; per-stroke coverage and projection; ink, pictures and transcript; measured-region source travel; marked-span discussion placement. Update generated event declarations and corpus from their inputs.</td><td>Resolve #43: one continuous stroke cannot currently follow a sticky filename and independently scrolling code. Exercise capture → draft → send → replay → source return, reflow, resize, nested scroll, separate pen lifts and missing coverage. Do not split the wire format from its consumers or add a temporary compatibility shim.</td></tr>
                <tr><td>#50 · Inline reading continuity</td><td>After #47: retain explained allocations in authored page seats and widget outlets when a conversation moves or is removed; preserve surviving cards and the current editor. Release them on disclosure, offscreen retirement or deliberate navigation. Main already owns withdrawn-root notices in the Threads panel through <a href="https://github.com/max-sixty/leaf/pull/2387">PR #2387</a>; keep that owner. Move the surface-specific HeldNews, ThreadSeat and diff-outlet lifecycle together. Keep drawing-specific passage coverage in #49.</td><td>Test removal while writing, sibling survival, refusal, source replacement, moved-discussion routing through current <code>openThread</code>, and newer user intent. Use recorded journeys: endpoint images cannot establish reading continuity. Do not substitute stale nodes for current destinations.</td></tr>
