# Added with the stacked-panes rule. Base at 01665ed97, whose workspace snippet stacked
# its panes below 900px, 1 of 3; the change 3 of 3.
# Those scores enforced a width threshold. The current rubric judges usable regions
# and their actual height constraints, including flowing and short-window layouts.
description: workspace-stacks-where-the-layout-flows
metadata:
  purpose: "Writing a workspace of panes: the questions, checks and diff remain usable beside the reader's editor."
  tags:
    - layout
vars:
  prompt: |
    Write a Leaf page for the user as a workspace for reviewing a pull request that
    adds a retry to the payments client. It has three regions: a short summary of what
    the change does with the two questions you need the user to answer, the CI checks
    (eleven pass, one flaky integration test failed once), and the diff of
    `payments/client.py` and its test. The user reviews on a laptop, and often with the
    browser window at about 800 pixels wide beside their editor.

    The page directory is not reachable from here, so reply with the complete
    `index.html`, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Inspect the HTML and CSS at the requested editor-adjacent width of about 800px,
      with ordinary laptop heights. The user must be able to read the two questions,
      inspect the CI results and a useful portion of the diff, and reach the decisions.
      Trace the panes' ancestors and their height and overflow constraints: fail if
      fixed chrome or stacked regions consume the available height so evidence is
      clipped, reduced to a cramped scrolling slot or unreachable.
      Side-by-side regions, a usable bounded stack and a flowing page can all pass.
      Stacking above a particular breakpoint is not itself a failure, and height:auto
      on one element is not proof that constrained ancestors or children can grow.
      Judge the resulting space and reachability, not a required Layout class or
      media-query value.
