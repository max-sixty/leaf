<!doctype html>
<html lang="en">
  <head>
    <title>Inspect a proposed project layout</title>
    <meta
      name="description"
      content="Explore an independent file listing by folder or search without opening file contents."
    />
  </head>
  <body>
    <main class="layout-column">
      <h1 id="proposed-project">Inspect a proposed project layout</h1>
      <p id="layout-guide">
        Expand folders or search for a path. This directory overview shows the proposed
        structure and change status; it has no file contents.
      </p>
      <lf-file-tree
        id="proposed-files"
        source="proposed-layout"
        aria-label="Proposed project layout"
        data-height="360"
      ></lf-file-tree>
    </main>
  </body>
</html>
