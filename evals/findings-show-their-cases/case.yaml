# A worker's survey returns counts over records it read, such as forks' asks that
# break a form rule, with ids, one clipped example and a file holding every record.
# An author can carry the counts and ids onto the page and leave every case off it,
# so the user meets "3 of the 7 asks broke the rule" with nothing to check it against
# and has to ask for an example. The request quotes the user's standing word budget,
# which pulls toward cutting the cases rather than placing them a disclosure away.
description: Live fork asks survey
metadata:
  purpose: "A count over records shows a real case beside it, and the rest of the
    cases it counts a disclosure away, while the answer and the decision still lead
    the page."
  authoring: true
  tags:
    - evidence
vars:
  prompt: file://findings-show-their-cases/request.md
assert:
  - type: llm-rubric
    metric: shows-a-case
    value: |
      The page reports that real forks' asks break the form rules, such as 3 of the 7
      asks since both rules landed, or 15 of the newest 24. Pass only if, at or near
      that claim, the page shows the actual words of at least one real ask that breaks a
      rule, as the forks wrote it in `fork-asks/choice24.json` or as the worker's report
      quotes it: whole, or excerpted with the question and a sentence it shares a
      paragraph with kept intact, marked up or not, on arrival or one disclosure away
      from the claim. Fail if the claim stands only on counts, event ids, a summary of
      the rules, an invented or eval example, or a rewrite with no original beside it. A
      widget that names a `source`, such as a patch or code view, draws its text from
      the page's data, which this HTML doesn't carry: count it as showing the material
      its markup and labels say it holds.
  - type: llm-rubric
    metric: cases-reachable
    value: |
      Pass if a reader can read on the page, in their actual words from
      `fork-asks/choice24.json`, every failing ask behind at least one of the page's
      counts: for the 7 since both rules landed, `e3d07595` ("since #6530 moved the
      tests to Playwright 1.65.2…"), `3bf598fd` ("keeps a comment on the item its words
      stand in…") and `8d23a17a` ("Should I merge PR #6574 once its rework passes…");
      for the newest 24, the 15 the report counts. They may stand openly or behind a
      disclosure, tab or similar. Fail if the failing asks behind every count appear
      only as ids, titles, counts, one example or a path to the file. A widget that
      names a `source`, such as a patch or code view, draws its text from the page's
      data, which this HTML doesn't carry: count it as showing the material its markup
      and labels say it holds.
  - type: llm-rubric
    metric: answer-leads
    value: |
      Pass if a reader arriving at the page meets the answer to the user's question
      (live forks break the rules too) and the decision on taking the fix before reading
      through raw asks: asks shown on arrival are few enough to read as examples, and
      any longer set sits behind a disclosure or tab, or after the answer and the
      decision. Fail if raw asks fill the page ahead of the answer or the decision, or
      if the page leaves out either.
