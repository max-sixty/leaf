  resume:
    inputs:
      prompts:
      - |-
        Another session was working with me on the Leaf page at {page}, and it has
        ended. You're picking the page up. Don't change anything yet: first tell me where it
        stands. Start your reply with these three lines, then add anything else I should
        know:

        Date: <the cutover date the page shows me now>
        Approach: <how traffic will move to the new index>
        Next: <what needs doing next>

        This session is headless: nobody can open a browser or answer you during it, so don't start a server or wait for feedback.
      - |-
        Go ahead and do what needs doing next. Check the page and stamp the new version
        when it's ready. This session is headless: nobody can open a browser or answer you during it, so don't start a server or wait for feedback.
      fixture: resume
    assert:
    - type: llm-rubric
      metric: date
      value: The message reports 21 October as the cutover date the page currently shows.
        Reporting 3 November as the current date fails; mentioning it as an unsaved or proposed
        change is fine.
      transform: context.metadata.texts?.["reply-1"] ?? ''
    - type: llm-rubric
      metric: approach
      value: The message says traffic moves to the new index tenant by tenant, in groups of
        tenants.
      transform: context.metadata.texts?.["reply-1"] ?? ''
    - type: llm-rubric
      metric: next_batch
      value: Among what needs doing next, the message includes the request to drop the batch
        size from 500 to 200.
      transform: context.metadata.texts?.["reply-1"] ?? ''
    - type: llm-rubric
      metric: next_pick
      value: Among what needs doing next, the message includes taking in the user's pick of
        the tenant-by-tenant approach, such as marking it chosen on the page. Treating how
        traffic moves as still undecided fails.
      transform: context.metadata.texts?.["reply-1"] ?? ''
