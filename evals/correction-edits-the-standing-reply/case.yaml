# Added with the threads.md paragraph that sends a correction of the agent's own
# unanswered reply into that reply by `leaf thread edit` (#5724), at a maintainer's
# request to score it. The deliveries are real, frozen by `leaf.delivery` from a
# scratch page at the commit that adds this case, with the page path rewritten;
# regenerate them to score a change to the handling they carry. The default context
# is the correction the paragraph is for; `promised-result` and `delivered-update`
# are the two cases it keeps as new replies. Scores threads.md, "Progress messages",
# its paragraph on correcting a message.
# Not yet run through `leaf-dev eval run`: the CI session that added it couldn't sign in
# a nested Claude Code. Fresh Opus 5.5 subagents given these prompts and only base's
# or head's `skills/leaf`, graded by hand against these rubrics: the default context
# base 0/3 (each posted a new reply, two also editing) and head 3/3; the other two
# contexts 2/2 on both arms.
description: correction-edits-the-standing-reply
metadata:
  purpose: A correction of the agent's own reply, while it is still the thread's latest
    message and unanswered, goes into that reply by edit; a promised result and the
    answer to a delivered update stay new replies.
  tags:
    - threads
vars:
  now: "2026-11-09T00:45:00-08:00"
  prompt: |
    You are a Claude Code session using Leaf, an hour into a checkout-latency investigation page with the user at /Users/max/.local/state/leaf/pages/checkout-latency.


    Earlier this turn, Leaf's prompt hook handed you this complete inline delivery:

