name: ci

# Every event runs the runtime, browser-framework and bundle gates; the Python suite's
# selection follows the test tiers, the directories under `tests/`
# (`tests/conftest.py`, `TIERS`):
# - a pull request runs `model`, `process` and `smoke`, plus the `browser` and
#   `journeys` tests it edits, and the website gate;
# - a push to main adds `browser`;
# - the daily schedule and a manual dispatch run every test, and their summary lists
#   the tests over their directory's budget.
# Relevant pushes to main run the website gate in publish-site before deploy.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

# Only a pull request cancels its own earlier run. A push to main keeps its run: a red
# branch is judged against the base SHA's result, and the next merge must not end a
# suite partway through. tend-ci-fix answers a failed run on main and never a
# cancelled one, so a cancellation goes unreported. Nothing outside a pull request
# shares a workflow group; the test job owns each event's queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    concurrency:
      # One push suite at a time: it holds a runner for over an hour, and GitHub's
      # concurrency pool is per-account, shared with the other repos here. A running
      # suite is never cancelled, because that hour would be lost; a newer commit
      # replaces the pending entry instead, under GitHub's default `queue: single`, so a
      # busy main gets the suite on its tip rather than working through commits already
      # superseded. Superseded pending entries are recorded as cancelled runs, and #296
      # accepted that cost for the same reason.
      #
      # The daily schedule has a slot of its own. It is the only run of the `nightly`
      # tier, and while it shared the push queue (#751) the next merge replaced it
      # before it reached a runner. A dispatch keeps a slot per ref. It is the control a
      # session runs against a base SHA, and two sessions judging two branches need
      # both answers; behind main's queue either one would be replaced by the next
      # merge before it ever started. A pull request keeps a slot per number.
      group: ${{ format('{0}-test-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.event_name) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1
      # py-spy's sampling rate, which `leaf-dev suite-profile` reads to turn samples
      # into minutes.
      PY_SPY_RATE: 2

    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base:
      # the second commit is what `--changed-since` below diffs against.
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright, and
      # the phone contract uses WebKit, and native send-flash paint uses Firefox.
      - name: Install Chromium headless shell, WebKit and Firefox
        run: uv run playwright install --with-deps chromium webkit firefox --only-shell

      - name: Install the Linux browser font contract
        run: sudo apt-get install -y fonts-dejavu

      # Where the Python suite's time goes. BSD process accounting records each
      # process's CPU as it exits, so the run's CPU reads back by command afterwards;
      # py-spy samples the stacks of every Python process the run starts, waits
      # included, so wall time reads back by function. py-spy reads a process it did
      # not start only where Yama allows any same-user trace. The package's daily cron
      # job would restart accounting onto its own file at 06:25 UTC, ending the
      # suite's record partway through any run that crosses that time.
      - name: Install the suite's profilers
        run: |
          sudo apt-get install -y acct
          sudo rm /etc/cron.daily/acct
          sudo sysctl -w kernel.yama.ptrace_scope=0
          uvx py-spy@0.4.2 --version

      - name: Fetch pinned image assets
        run: uv run leaf-dev fetch-assets

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      # The bundles build from the installed lock, so a rebuild reproduces the
      # tracked bytes exactly and any difference is a lock nobody rebuilt from.
      - name: Check bundles, browser, runtime, Worker and eval assertions
        run: pnpm run check

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Hooks rewrite what they flag, so they run in a worktree of their own: a rewrite
      # must not reach the Python tests and website build reading this checkout.
      - name: 🔍 Pre-commit hooks
        id: lint
        background: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          uv run --project "$GITHUB_WORKSPACE" pre-commit run --all-files --show-diff-on-failure --color=always

      # The synchronous gates fail before Python spends its runner time.
      # The runner's four vCPUs sat ~41% idle under two workers; four left 7% idle
      # but slowed each test 1.3–1.46×, so three take the idle share without
      # saturating the deadlines browser tests wait under.
      - name: 🧪 Python tests
        id: python-tests
        background: true
        # The profilers write beside the junit report: `cpu-by-command.txt` is `sa`'s
        # table of every process that ran meanwhile, and `stacks.txt` holds one line
        # per distinct stack and sample count, rooted at its process, for
        # `leaf-dev suite-profile`, speedscope or flamegraph.pl. py-spy follows the
        # process tree from `uv run` once it has a child, and stops when it exits. Its
        # cost scales with the rate: 20 Hz took 10% of a run's CPU, 5 Hz 4.5%. At 2 Hz
        # each worker's stack is still sampled 7,200 times an hour.
        # Accounting is machine-wide, so it runs only where the suite is the only work
        # meanwhile: a pull request builds the website beside it.
        run: |
          mkdir -p .tmp/test-results
          # Fail normally before the six-hour job deadline, which cancels the run
          # and never summons tend-ci-fix. Leave time for termination, profiles,
          # uploads and the website gates.
          # Keep the shell alive through INT while pytest and py-spy finalize. Shell
          # background jobs inherit INT ignored, so reset it at both child entries.
          timeout --verbose --signal=INT --kill-after=1m 5h bash -euo pipefail <<'SUITE' > >(tee .tmp/test-results/output.log) 2>&1
          trap '' INT
          export PYTHONUNBUFFERED=1
          # Each worker charges its tests' CPU to a cgroup of its own under this one
          # (`dev/leaf_dev/commands/suite_profile.py`). Owning it lets the workers make and join
          # theirs without root, and this shell joins it so pytest starts inside.
          export SUITE_PROFILE_CGROUP=/sys/fs/cgroup/leaf-suite
          sudo mkdir "$SUITE_PROFILE_CGROUP"
          sudo chown -R "$(id -u)" "$SUITE_PROFILE_CGROUP"
          echo $$ | sudo tee "$SUITE_PROFILE_CGROUP/cgroup.procs" >/dev/null
          accounting=${{ github.event_name != 'pull_request' }}
          if $accounting; then
            sudo touch /var/log/account/suite
            sudo accton /var/log/account/suite
          fi
          env --default-signal=INT uv run pytest tests -n 3 -v --junitxml=.tmp/test-results/results.xml \
            ${{ github.event_name == 'pull_request' && '--changed-since HEAD^1' || github.event_name == 'push' && '--run-main' || '--run-nightly' }} &
          tests=$!
          until pgrep -P "$tests" >/dev/null || ! kill -0 "$tests" 2>/dev/null; do
            sleep 0.1
          done
          env --default-signal=INT uvx py-spy@0.4.2 record --pid "$tests" --subprocesses --idle --nonblocking \
            --function --rate "$PY_SPY_RATE" --format raw --output .tmp/test-results/stacks.txt &
          profiler=$!
          wait "$tests" && status=0 || status=$?
          # A profile that failed fails the job, keeping pytest's own failure status.
          wait "$profiler" && profiled=0 || profiled=$?
          if [ "$profiled" -ne 0 ]; then
            echo "::error::py-spy exited with $profiled"
            [ "$status" -ne 0 ] || status=1
          fi
          if $accounting; then
            sudo accton off
            sudo chmod a+r /var/log/account/suite
            sa -a -c -i /var/log/account/suite > .tmp/test-results/cpu-by-command.txt
          fi
          exit "$status"
          SUITE

      # The website build can overlap Python; Docker must wait because its host
      # interface changes interrupt Chrome's loopback requests in browser tests.
      - name: Build website
        if: github.event_name == 'pull_request'
        run: uv run leaf-dev site

      # wait runs even when the build fails. Propagate both results and finish
      # Python's artifacts before Docker or the unconditional upload below.
      - name: Wait for lint and Python tests
        wait: [lint, python-tests]

      - name: Check website deployment
        if: github.event_name == 'pull_request'
        run: |
          pnpm --dir .. exec wrangler --cwd worker deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker

      - name: Measure the bundled release in a browser
        if: github.event_name == 'pull_request'
        run: uv run leaf-dev verify-site website-worker

      - name: Summarize where the suite's time went
        if: (success() || failure()) && hashFiles('.tmp/test-results/results.xml') != ''
        run: |
          uv run leaf-dev suite-profile .tmp/test-results | tee .tmp/test-results/summary.txt
          { echo '```'; cat .tmp/test-results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/test-results/
            .tmp/thread-snapshots/runs/
          if-no-files-found: ignore
          retention-days: 30
