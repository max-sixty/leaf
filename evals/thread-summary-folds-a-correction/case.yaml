# Scores threads.md, "Correct a message" with "Summarize a long discussion": a
# correction the agent already posted as a new reply folds, with the reply it
# corrects, under one summary that gives the current answer in a few sentences. Both
# replies wait on the user, as replies that ask them to try a result do. Scores
# proposed commands, not execution.
description: thread-summary-folds-a-correction
metadata:
  purpose:
    A reply and the correction posted after it fold into one summary much shorter than
    the two, giving the answer as it now stands.
  tags:
    - threads
vars:
  prompt: |
    You own a live Leaf page at ~/.local/state/leaf/pages/flaky-warmup, about why
    test_cache_warmup fails on CI. Thread fix-thread reads, in order; this is its
    complete history:

    fix-one (user): "Which fix do you recommend? And does either change what production sees at startup?"
    fix-two (agent, waiting on the user): "I'd **await the warmup in `start()`**. It's three lines, the race can't happen by construction, and nothing else changes.

    - **Startup.** The warmup fills 10,000 queries from yesterday's log. On the staging pod it takes 180–220 ms, so a pod reaches `start()`'s return about 200 ms later than today.
    - **Readiness.** The readiness probe has `initialDelaySeconds: 5` and checks every 10 s, and a pod's whole startup measured 1.4 s on staging (1.6 s with the await), so the probe passes as before.
    - **The lock** would avoid the startup delay, but every cache read would take the lock until the fill finishes: about forty lines, and a second place for the race to come back.

    The change is on the branch `await-warmup`; run the staging rollout when you're ready to try it."
    fix-three (agent, waiting on the user): "A correction to my last reply: the probe doesn't wait for `start()` at all. `/healthz` is served by the HTTP server, which `main.py` starts before it calls `cache.start()`, so a pod reports ready as soon as it listens, warm or not.

    My staging runs passed only because the first probe came after the 5 s delay, by which time the warmup had finished. Under load, a slow `top_queries` call could take longer than that, and the pod would take traffic cold.

    So I added one line to the `/healthz` handler on `await-warmup`: it returns 503 until the cache's `warm` flag is set. The branch's tests pass, including a new one for the 503. The staging rollout is still yours to run."

    The user hasn't answered either reply. Leaf's turn-end check has just told you:
    "In thread fix-thread, the reply fix-two says the readiness probe passes as
    before. You then corrected that in a second, separate reply, fix-three, and the
    user hasn't answered either. Bring the thread current as Leaf's guidance for
    threads has you do."

    Work out the next turn. Nothing here can execute writes, so give the
    CLI commands you would run, in order,
    with the full text of any replies or other content you would write.
assert:
  - type: llm-rubric
    metric: one-short-current-answer
    value: |
      Pass only if the proposed commands write exactly one thread summary on the
      flaky-warmup page whose range runs from fix-two through fix-three, and post no
      new reply in fix-thread. The summary's prose must give the answer as it now
      stands: awaiting the warmup in `start()`, with `/healthz` returning 503 until the
      cache is warm, on the branch `await-warmup`, and the staging rollout left to
      the user. It must not say the probe passes unchanged. It must also be much
      shorter than fix-two and fix-three together, a few sentences or a short list
      that says where they landed rather than retelling each reply; a summary that
      restates most of both replies' detail does not pass.
