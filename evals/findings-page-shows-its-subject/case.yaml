# From session 848900aa. Its survey of Leaf's cascade layers went to the user as prose,
# a table and options written as code, though every finding was which tier a kind of
# CSS lands in and what it can beat; the page pointed at the tier diagram on How it Works
# instead of showing one. The user: "but there are no diagrams, it's a block of text",
# and asked that a Leaf whose request says nothing about its form show diagrams or
# images. Run cold, base 1518bc9bf read page-authoring.md and drew the tiers in 3 of 3,
# and its options' change in 2 of 2, so this case guards the default rather than
# reproducing the failure. Replaying the session from just before it wrote the page
# reproduced it: base showed the tiers in 4 of 15 pages; SKILL.md's picture default and
# code-as-effect rule, over four wordings, in 12 of 17, the committed wording 4 of 4.
# On 2026-10-24, rendered review exposed a format false-negative: ranked tier lists
# conveyed precedence, and inset specimens showed the proposal's consequences.
# The relationship/consequence rubrics below passed saved HEAD 0/1 and the revised
# authoring workflow 2/2 on saved output; these are content regrades, not an
# estimate of reliability. Earlier rubric scores remain in scratch.
description: CSS cascade survey
metadata:
  purpose: "Show the subject: a findings page whose request names no form shows what its
    findings are about in a picture on the page, not only in prose, tables and code."
  authoring: true
  tags:
    - drawing
vars:
  prompt: |
    Earlier the user asked: "let's do a survey of our various levels of CSS impl, add a
    section / diagram to our How it Works section. Our primary consideration should be
    how users would want to override various parts -- i.e. for a layout, for a page, for
    a package/widget". You wrote that section, with its tier diagram, and it is merged
    (#2796) and live at https://leaf.page/how-it-works/#styles.

    The user now asks: "ok, no great stress. Where can I see the survey? How do we do vs
    the intention?"

    Your notes from the survey. Each row was checked by building a page with
    `leaf-dev probe` and reading the computed style.

    Intent (root AGENTS.md, layer.py, layouts.css, page-sheets.js, packages.md): the
    user's word overrides Leaf's defaults; a page has the last word on its own content
    but not on Leaf's controls; a package refines through tokens or rules of its own.

    Cascade, lowest first: `lf-reset` (form-control clearing), `lf-base` (the kernel
    theme, every package's theme.css, theme packages included, and each widget's
    sheet, scoped to its tags), `lf-layouts` (layouts.css), `lf-shadow`, `lf-state`
    (retirement and other semantic state), then the page's own unlayered `<style>`.
    Chrome stays unlayered above all of it.

    | Override | What happens | Against intent |
    | --- | --- | --- |
    | A page restyles its content, widgets or Layout | its `<style>` and its own `@layer` blocks beat every Leaf tier | holds |
    | A page dresses its own `button` | Leaf's controls keep their face unless the selector names them | holds |
    | A page restyles a widget's shadow tree | only inherited tokens and exported `::part`s cross | holds |
    | A package styles its own widget | works with `:scope` | holds |
    | A package adjusts a Layout | only through the tokens the Layout reads (`--col`, `--page-pad-*`); any rule loses, whatever its specificity | gap |
    | A theme package restyles another package's widget | tokens work; an equally specific rule loses to the widget's scoped rule whatever the order | gap |

    | Rule | Where | Computed |
    | --- | --- | --- |
    | `body.site-page main { padding-top: 28px }` | site theme package, lf-base | 72px, the Layout's value |
    | `lf-card:not(.nope) { padding-left: 26px }` | test theme package, same specificity as the board's rule, later | 10px, the board's value |
    | `@scope (lf-card) { :scope:is(lf-card) { padding-right: 22px } }` | test theme package | 22px, the only form that wins |

    The site rule dated from #763; #1246 moved Layouts above lf-base nine days later and
    nothing noticed it had stopped applying, for 2½ weeks.

    Open decision for the user: should a theme package (one declaring no widgets) get
    its own tier between `lf-layouts` and `lf-state`, so it acts like a page's `<style>`
    on every page (your recommendation; a broad rule like `button {}` would then beat
    widget controls, so it likely needs page-sheets.js's narrowing; not prototyped), or
    keep tokens and a mirrored `@scope` as the package route, as the docs now say?

    Write the survey as a Leaf page.
assert:
  - type: llm-rubric
    metric: shows-the-subject
    value: |
      The survey's findings are about where each kind of CSS sits in Leaf's cascade and
      which tiers it can or cannot beat. Pass only if the page itself gives the reader
      an inspectable ordering or arrangement that communicates precedence and places
      page, theme-package and widget-package rules within it. A clearly ranked list,
      table, spatial sketch or diagram can do this when direction, membership and
      placement communicate the relationships. A mere inventory of tier names or
      disconnected descriptions of individual rules does not. The reader should be
      able to locate the reported override gaps in that representation without
      reconstructing the cascade from surrounding prose or following an external link.
  - type: llm-rubric
    metric: options-show-the-change
    value: |
      Find the obligation deciding whether theme packages get their own tier. Pass only
      if the comparison makes the alternatives' consequences inspectable: where theme
      rules would gain authority and what changes or stays the same for the page's
      appearance. A representation of tier placement and reach can do this, as can
      concrete current/proposed visual results with nearby text locating the authority
      change and its limits. The comparison may be shared or sit inside the options;
      it need not repeat a tier stack in each. Descriptions of benefits or CSS syntax
      alone do not show the result. Preserve the distinction between observed current
      behavior and an illustrative, unimplemented proposal.
variants:
  next-opportunities:
    # From session 01a166a1-4914-7ee0-8926-080b8cf24446. The source agent appended
    # prose-only proposals to an existing diagnostics report after reading guidance.
    # This seeded continuation preserves that report and synthesizes its research
    # notes; it is not a full trace replay of the source's code investigation.
    # On 2026-10-24, the same fixture/request/rubrics passed HEAD Sol 0/1 and the
    # revised content model Sol 0/1, Opus 1/1. Preserved standalone experiments
    # established the context contrast; they are not additional recurring cases.
    # A later fresh-context workflow produced an adequate Sol continuation, but
    # an early read of an older scratch artifact limits that causal comparison.
    # Subsequent structural cuts again produced prose-only continuations. Rendered
    # review matters: scores can miss useful specimens or accept misleading ones.
    metadata:
      authoring: false
      executor: leaf_dev.usability_eval
      scenario: next-opportunities-existing-report
      conditions: [leaf]
      purpose:
        "A continuation of a prose research report makes proposed visible behavior
        inspectable while preserving what is measured, proposed and still untested."
