# From a findings page that put each section's claim, figure and demo above a bare
# question (#1322). Base at 64186bcb9 put them all above the Ask (0 of 3); the change
# put the figure inside it and the demo after it (3 of 3).
# Its prompts no longer tell the agent to read the registry entries: without them,
# base ee04a60be opened the Ask with a paragraph rather than a heading (0 of 3), and
# stating the heading in authoring-decisions.md fixed it (3 of 3).
description: record-asks-hold-their-premise
metadata:
  purpose:
    "Asks: on a record page, an `lf-ask` about a finding holds the finding's claim and its distinguishing
    figure inside the lf-ask, and a tall live demo follows it."
  tags:
    - asks
vars:
  prompt: |
    You are writing a Leaf page that records six focus gaps you found in a chat
    widget, one section per gap, each putting a question to the user. Write the
    section for this gap.

    Your notes:
    - Finding: a second message sent from a task's own message box starts a second
      thread instead of continuing the first.
    - Measured: after the first send, focus stays in the task's box, so the next
      message the user writes becomes a new thread under the task. Two sends make two
      threads.
    - The user decides where the user should continue after a send from the task's
      box: in the new thread's reply box (your proposal), or in the task's box as today.
    - You already drew a before/after figure with the two threads today beside one
      thread proposed. Include it verbatim as
      `<figure id="seat-figure"><svg class="drawing" viewBox="0 0 680 272"></svg></figure>`.
    - You also built a live demo the user can operate: two numbered steps, then
      `<lf-sample id="seat-sample" label="practice plan"><template data-sample><!-- demo page --></template></lf-sample>`,
      which renders about 700px tall at desktop width.

    The page directory is not reachable from here, so reply with the section's HTML
    fragment rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the HTML fragment as a user who presses `m`, which puts the `lf-ask`'s
      heading at the top of the screen with everything above it out of view. Pass only
      if all of these hold:
      1. There is one `lf-ask` whose first child is a heading stating the question.
      2. `<figure id="seat-figure">` stands inside that `lf-ask`, before its `lf-options`.
      3. The `lf-ask` itself says what happens today: focus stays in the task's box, so a
         second send makes a second thread. Wording may differ; a restatement counts, and
         so does an option that states it.
      4. The numbered steps and `<lf-sample id="seat-sample">` come after the
         `lf-options`, not before the `lf-ask` or between its heading and its options.
      Fail if the figure or the numbered steps and demo stand before the `lf-ask`, with
      the `lf-ask` holding little more than the question and its options.
variants:
  # From session 498a60e2, whose decision on plan context put its two captures in a
  # table above the options, so nothing tied each capture to its option. The user
  # asked "why aren't the images within the options?" At 11930a381 base put both
  # captures in their options 2/3 and widened the group 0/3; the change did both 6/6.
  option-captures:
    metadata:
      purpose: "Choices: each option's capture stands inside that option, today's in the option that keeps it, at a width it can be read."
    vars:
      prompt: |
        Write the decision section of a Leaf page about drawing an agent's plan in
        Leaf's floating panel. The user decides whether each item on their On me list
        should carry a muted line naming the plan goal and step it belongs to, such
        as "Ship the reconnect fix · step 3 of 5". You recommend adding the line.

        You captured the panel's On me view both ways from the same page and log,
        at 2x, each 540 CSS pixels wide:
        - `/media/5c2f172f22c9e701.png`, 540 by 259: On me today, with "How should
          retries back off" and its choices, and "Try the build" with Done.
        - `/media/1caf95f363a5d13d.png`, 540 by 297: the same list with each item
          headed "Ship the reconnect fix, step 3 of 5" and "step 4 of 5".

        The page directory is not reachable here, so reply with the section's HTML.
    assert:
      - type: llm-rubric
        metric: captures-in-options
        value: |
          Pass only if the decision offers adding the line and leaving On me as it
          is, and each capture's `<img>` stands inside the `lf-option` whose choice
          it shows: the capture with the plan line inside the option that adds it,
          and today's capture inside the option that leaves On me as it is. Fail if
          either capture stands outside the `lf-options`, such as in a table or
          figure before or after it, even when an option also refers to it.
      - type: llm-rubric
        metric: captures-readable
        value: |
          Pass only if the `lf-options` element holding the captures carries
          `data-width="wide"` or `data-width="available"`. Width on a figure, image
          or table inside an option does not widen the option, so it fails, as does
          a group with no `data-width`.
  compact-values:
    metadata:
      purpose: "Choices: a value that names the whole outcome stays a compact label."
    vars:
      prompt: |
        Write the decision section of a Leaf incident record. The user must choose
        how long to retain diagnostic captures: one day, seven days or thirty days.
        Every capture contains the same fields and has the same access controls;
        only the automatic deletion time differs. The choice is still open. The
        page directory is not reachable here, so reply with the section's HTML.
    assert:
      - type: llm-rubric
        metric: compact-values
        value: |
          The decision offers one day, seven days and thirty days, initially
          undecided, as mutually exclusive alternatives. Each option identifies its
          duration using a compact label, with no explanatory paragraph, repeated
          fact chips, drawing or other padding inside that option. A concise shared
          premise outside the options is fine. Pass equivalent duration wording.
  # From Codex 01a15575-517e-7782-949b-334241bda993: eight findings preceded
  # identical Apply/Keep forms. Start before authoring: the user supplied no template.
  cleanup-review:
    metadata:
      purpose: "On me: a cleanup review carries each proposal's reason, evidence and concrete outcomes at its answering destination."
    vars:
      prompt: |
        The user asked: "Do a full review for anything else that we don't need /
        overly hard-codes." The review is complete. Write the review page so the
        user can decide which independent changes to apply.

        Your verified findings:
        - #1 Thread-reference validation is tied to one widget. The registry declares
          thread references for any widget with that capability, but the target check
          lives in the suggestion-only loop. An independently declared proposal accepts
          a missing thread; the identical suggestion correctly refuses it. Recommend
          validating references by the declared capability, keeping suggestion nesting
          rules with suggestions. This restores the shared guarantee for custom packages.
        - #2 TypeScript has a second package inventory. Compiler path aliases list
          vendor directories but expose only the default package's widget directory.
          A temporary importer under the actual configuration cannot resolve existing
          playground and trace modules; the default board resolves. This is a limit
          on new typed imports, not a checked-in build failure. Recommend deriving
          paths from discovered package directories, retaining the runtime facade alias.
        - #3 Product routes repeat document filenames. All eight current routes follow
          index → / and every other stem → /stem/. An isolated new top-level document
          is omitted and navigation composition raises KeyError until another row is
          added. Recommend discovering docs/*.html and computing routes, keeping the
          navigation bar authored. Future top-level documents would publish by default;
          nested package documents would stay excluded.
        - #4 Startup and runtime repeat the text-input rule. Their input-type lists
          currently match, but a comment requires updating both copies. No keyboard
          failure was observed. Recommend putting the predicate in the existing
          early-script contract, preserving behavior without a new startup request.
        - #5 The developer corpus uses a positive file list. It includes five of six
          top-level developer pages; a costly thread-panel gallery is the sole current
          exclusion. Recommend discovering pages and stating that exclusion explicitly.
          Current membership stays the same; future galleries would enter by default.
        - #6 A package-coverage test guesses package IDs by normalizing visible labels.
          Renaming only Playwright to Playwright traces breaks it with every package
          and link unchanged. Recommend a structured identity on each authored card,
          keeping the coverage assertion while letting visible wording vary.
        - #7 Thread folding silently drops orphan replies to support older Leaf logs.
          Current admission keeps the parent in force; the older-state test bypasses
          admission. The project requires no compatibility with old persisted records.
          Recommend direct parent lookup and removing that obsolete test tail. Admitted
          logs behave the same; corrupt logs surface an error instead of losing replies.
        - #8 Catalog discovery defines a separate HTML parser for one link selector,
          although SourceDocument is already imported. Its parse tree returns the same
          fifteen active entries in the same order, excluding commented cards.
          Recommend using that tree and deleting the one-off parser; curation stays authored.

        Write the page from this material. No code has changed. The page directory
        is not reachable here, so reply with the complete main element's HTML.
    assert:
      - type: llm-rubric
        metric: arrival-context
        value: |
          Treat each decision's lf-ask (or its answering widget if unframed) as the
          arrival destination; everything before it is out of view. Pass only if
          each proposal has its issue and checked evidence inside the decision that
          covers it. A shared decision for clear-cut proposals must explain each. For
          example, #1 carries the missing-thread contrast and #3 the new-document
          omission. The route and developer-corpus decisions must expose their
          future-discovery defaults. A heading that merely asks Apply #N does not
          supply the premise.
      - type: llm-rubric
        metric: concrete-outcomes
        value: |
          Pass only if every decision explains what applying and retaining each
          proposal means within that decision. For #1 distinguish validating every
          declaring widget from keeping suggestion-only validation; for #3 distinguish
          discovering top-level documents from maintaining explicit route registration.
          Each option's label or title must name its proposal's concrete outcome;
          generic Apply / Keep labels fail even with an informative shared premise
          or option body. Generic descriptions such as "Implement the change
          described above" cannot substitute for concrete consequences. Each
          decision must offer explicit acceptance and rejection, initially
          undecided. Independent proposals can be grouped only when the group
          explains why each is clear-cut.
  # From session 2dbc39a0, which wrote 24 decisions from a TODO survey's report and
  # the TODO lines it cites, without opening the notes behind them. One recommended a
  # playground's "Show, then take" plus "Say what z takes"; the user asked "how am I
  # supposed to know what [that] means??", and of another "what was the policy
  # change??". Since 2026-10-01 about 30 of ~610 decisions on the user's pages drew
  # such a question. The case gives the agent only what that session had read. Given
  # the notes' contents as well, base explained both names. At be8d0f9f0 base failed
  # 3 of 3 in two runs, each time on the calibration decision's unexplained policy
  # change and in 2 of the last 3 on an unexplained "Show, then take". A rewording of
  # page-authoring.md's rule on unread sources also failed 3 of 3.
  unseen-names:
    metadata:
      purpose: "Asks: a decision relies on no name the user would have to look up in sources they haven't read."
    vars:
      prompt: |
        The user asked: "Make a Leaf showing decisions we can make to a) make
        progress with some of our todos / notes or b) remove them"

        A subagent surveyed TODO.md and returned this report:

        > **A7. How far back `z` reaches (L160)**
        > - Where it stands: the playground in `notes/undo-reach/` already recommends
        >   "Show, then take" plus "Say what z takes".
        > - Recommend: accept it, building "Say what z takes" first. It is small,
        >   Show-then-take needs it anyway, and it alone tells the user what `z` is
        >   about to undo.
        >
        > **L699 "Calibrate agent-driven UI diagnosis" (removable, medium)**
        > - `notes/agent-driven-ui-quality.md` is untouched since 2026-10-06 (`5ee3fee86`).
        > - The Tend policy change it proposes was never adopted in `running-tend`.
        > - `/ui-sweep` and the 2026-10-20 bad-pages eval now measure what it proposed.

        You read the two TODO.md items it cites:

        > - **Decide how far back `z` reaches.** `z` takes back the user's newest gesture
        >   however old, so on a page left for weeks it can reopen a thread resolved then,
        >   below the fold, and nothing puts back what an undo took. The
        >   [undo-reach playground](notes/undo-reach/README.md) compares limits on that reach
        >   with additions such as redo and a panel of the user's changes, and waits on the
        >   user's pick.
        >
        > - **Calibrate agent-driven UI diagnosis.** Try one known miss and one intentional or
        >   invalid control with a bounded explorer and cold user. The
        >   [quality brief](notes/agent-driven-ui-quality.md) also proposes a Tend acceptance-policy
        >   change; review that proposal with its owner before changing the policy.

        The page will hold about twenty decisions; write these two now. The
        repository isn't reachable from here, so reply with the two sections' HTML.
    assert:
      - type: llm-rubric
        metric: names-the-user-knows
        value: |
          Grade the HTML. The user is the project's maintainer. They know its
          commands, skills and widgets, but they have read neither the subagent's
          report nor the notes, the playground or these TODO lines, and don't
          remember what the notes propose. Read each lf-ask as that user, arriving at
          it with the rest of the page out of view. Pass only if each decision can be
          answered from its own lf-ask: every name it takes from those sources is
          described where the decision uses it, or the decision doesn't rely on it.
          1. Undo: an option or recommendation naming "Show, then take", "Say what
             z takes" or another playground design says what that design does.
          2. UI calibration: an option or reason that rests on "the policy change"
             or the pilot says what it would change or do.
          Fail if a decision leans on a name the user would have to look up to
          choose, such as recommending "Show, then take" without saying what it
          does, or offering to keep "the Tend policy change" without saying what it
          is.
  # From session 6f5623e3, which had just diagnosed why agents built a second drawing
  # path for lf-diff (#3174) and drafted wording to stop it. Asked to "shade things
  # like 'never'", it put a keep-or-soften decision on each of three absolutes, with
  # one-line options such as "Closes the exception the triage agent used, at the
  # sentence it read". The user wrote "there's not nearly enough context here, this
  # is a bad question!" on two of them. The prompt carries the reply the session had
  # just sent, whose shorthand the decisions reused. Stated this plainly, base writes
  # richer decisions than the session did, but at 41754cb35 still left out what
  # keeping each absolute costs (tradeoff-stated 1/3 on Claude Code, 1/2 on Codex);
  # asking for each option's cost, the recommended one's included, made it 3/3 and
  # 2/2. Both arms still lean on "the triage agent" and "the evals" undescribed
  # (names-described 0/3 and 0/3), as unseen-names also fails on both.
  absolutes-in-a-draft:
    metadata:
      purpose: "Asks: a decision on a wording says what each choice would change in a case the user can picture, what the recommended one costs, and who any agent or run it cites was."
    vars:
      prompt: |
        You have been diagnosing, for the user, why agents nearly landed a Leaf
        prototype for issue #3174. The prototype made `lf-diff` draw a patch's rows
        (file headers, hunk separators, line rows, unhighlighted) itself before first
        paint, at the metrics Pierre (the diff library the widget delegates to) uses,
        so nothing moves when Pierre's highlighted drawing replaces it: +850 / −445
        lines, a second drawing path beside Pierre's. A later measurement found that
        main already first-paints the raw patch in a plain `<pre>` at about the right
        height and shifts only 10 px when Pierre's drawing arrives.

        Your notes from the diagnosis:
        - The triage agent read Leaf's AGENTS.md "Use dependencies" ("writes a
          mechanism itself only when existing ones can't meet a concrete
          requirement") and treated "Pierre draws after first paint" as such a
          requirement.
        - You drafted wording for CLAUDE.md and Leaf's AGENTS.md (diffs below) and
          scored it with evals that replay the triage decision. Until the wording
          said "even in a plain or partial form", Codex kept proposing to draw the
          rows unhighlighted in an `x-initial` script that reuses Pierre's own
          structural code, and argued that wasn't a copy.

        Your last reply to the user, sent a few minutes ago:

        > I've added the protection in three places: your global development
        > principles, Leaf's own principles (which Tend's Codex reviewer applies), and
        > the Leaf render check that misled every agent about how big the problem was.
        > Evals show it fixes the recommendation to land the prototype. It only partly
        > fixes the earlier triage decision.
        >
        > **Speed slipped through the dependency exception.** CLAUDE.md lets you build
        > your own for "a requirement its model lacks", and Leaf's "Use dependencies"
        > says the same for "a concrete requirement". Agents read "Pierre loads after
        > first paint" as such a requirement.
        >
        > - Codex keeps proposing an unhighlighted first-paint layout of the rows, on
        >   the condition that it reuses Pierre's own structural code.

        The drafted diffs:

        ```diff
        --- a/.claude/CLAUDE.md
        +++ b/.claude/CLAUDE.md
        @@ #### Canonical Homes
           dependency's own output, such as a results table of mostly empty cells; fix the setup
        -  rather than hiding that output behind your own.
        +  rather than hiding that output behind your own. Speed never justifies a second
        +  implementation. Where a dependency or module delivers too late or too slowly, make
        +  that path earlier or faster, or size what shows while it runs; don't reproduce its
        +  output ahead of it, even in a plain or partial form.
        --- a/AGENTS.md
        +++ b/AGENTS.md
        @@ ## Fix the underlying issue
        -suggests the shared boundary is still unsettled.
        +suggests the shared boundary is still unsettled. Reproducing a dependency's or
        +module's output ahead of it so a result shows sooner, even in a plain or partial
        +form, leaves the delay in place and adds a second implementation that must keep
        +agreeing with the first. Make that path earlier or faster, or reserve the room
        +it will need, as "Responsiveness" does for the server's reading.
        @@ ### Use dependencies
         behavior and integration, and writes a mechanism itself only when existing ones
        -can't meet a concrete requirement. In the browser, use the platform's layout,
        +can't meet a concrete requirement; arriving too late isn't one ("Fix the
        +underlying issue"). In the browser, use the platform's layout,
        ```

        The user then wrote: "make a leaf that has the diffs on

        shade things like "never""

        You are writing that page. The diff sections are done. The page shades
        three absolutes, "never", "even in a plain or partial form" and "arriving
        too late isn't one", and puts a decision to the user on each. You'd keep
        all three. Write the section holding the three decisions. The
        page directory is not reachable here, so reply with the section's HTML.
    assert:
      - type: llm-rubric
        metric: tradeoff-stated
        value: |
          Grade the HTML. The user is the project's maintainer and knows Leaf and its
          agents. They answer each of the three decisions later from their On me list,
          with only that decision in view. Pass only if each decision lets them weigh
          the choice for reasons it states:
          1. It says what the shaded words change, through a case they can picture:
             an agent action the words would rule out or allow, such as drawing a
             diff's rows unhighlighted before Pierre loads. Quoting the sentence
             alone fails.
          2. It says what keeping the absolute costs: what it would also forbid or
             make harder that could be wanted, or the risk it carries. A decision
             whose options state only what the recommended choice gains fails.
      - type: llm-rubric
        metric: names-described
        value: |
          Grade the HTML. The user is the project's maintainer and knows Leaf and its
          agents. They skimmed the reply quoted in the prompt a few minutes earlier,
          but answer each decision later from their On me list, with only that
          decision in view, and don't recall the evals or the triage. Pass only if
          every agent, run or earlier argument a decision leans on is described where
          it is used. "The exception the triage agent used", "the skeleton Codex
          proposed" or "the evals" without saying what they were fails.
