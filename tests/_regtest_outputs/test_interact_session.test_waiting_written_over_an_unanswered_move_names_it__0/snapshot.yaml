# The waiting status command names unanswered work until the reply settles it.

before reply:
  exit: 0
  status:
    state: waiting
    detail: >-
      pick one
    after: 1
  note: |
    1 user move with no answer (`leaf thread reply <page> --for event-1`); the page reads waiting once each has one

after reply:
  exit: 0
  status:
    state: waiting
    detail: >-
      pick one
    after: 2
  note: ''
