# Two pages carry distinct debts and one shared answering instruction.

Stop:
  hookSpecificOutput:
    hookEventName: Stop
    additionalContext: |-
      Leaf needs attention:
      - <first-page>: 1 acknowledged user update with no answer (`leaf response reply <answer.ref>` for c1).
      - <second-page>: 1 acknowledged user update with no answer (`leaf response reply <answer.ref>` for c2).

      Each update takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf page state <page> <id>`.
