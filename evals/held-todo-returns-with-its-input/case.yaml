# A to-do the agent holds with `--waiting-on` reads Waiting on <what> until the
# agent starts it, and Leaf reads nothing from the words, so nothing but the agent's
# memory brings the work back when the wait ends. Late in a long session that memory
# is the earlier turns, which a compaction may have dropped. Each delivery from the
# page lists such to-dos under `held`. Here the user presses Done on the choice the
# held to-do waits on, in a delivery that carries no thread of the to-do's, so only
# `held` names it; the control's input is a question elsewhere on the page, which
# frees nothing. The envelopes are the real delivery's shape at the commit that adds
# this case; a handling change is scored by regenerating them with each wording.
description: held-todo-returns-with-its-input
metadata:
  purpose:
    "Conversation loop: input that ends what a held to-do waits on brings the to-do
    back, so the agent takes its work up without remembering it; input that ends
    nothing leaves it held."
  tags:
    - wait-loop
    - threads
