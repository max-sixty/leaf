# Watches agents use `leaf task plan` on a served page rather than describe it. The
# live task lays out a job of four steps, one the user's pick, then reshapes it;
# `resume` hands over a page whose remaining work is recorded only in an ended
# session's plan. An agent can open to-dos and write no plan, or write it after the
# first step, passing its JSON as an argument with an unknown state; the instructions
# say to plan before the first step, that the outline is read from stdin, and which
# states a step takes.
description: Plan
metadata:
  purpose: Record the page's work as one plan before starting, keep it current as
    steps finish and the user reshapes the job, and hand back a finished page.
  tags:
    - workflow
  conditions:
    - leaf
  executor: leaf_dev.usability_eval
  scenario: plan-live
variants:
  resume:
    metadata:
      scenario: plan-resume
      purpose: Recover the remaining work from an ended session's plan, finish it,
        and keep that plan current.
