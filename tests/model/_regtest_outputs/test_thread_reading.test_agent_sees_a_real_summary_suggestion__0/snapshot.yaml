# The summary hint from real thread events and the delivery an explicit wait prints.

delivery:
  format: leaf-delivery/15
  id: <delivery>
  created_at: <time>
  acknowledge: >-
    If the output was cut off, reread it with `leaf delivery read <delivery>` and
    follow any `next` commands. Then, before any other work, start `leaf wait --ack
    <delivery>` as the next background task, which confirms this delivery and waits
    for the next. If you forward the delivery instead of handling it, acknowledge
    once it arrives where you sent it.
  batches:
    - page: <page>
      claim: <claim-session>
      through_seq: 9
      threads:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 0
            actions: 0
          messages:
            - id: event-2
              seq: 2
              author: user
              text: >-
                Which rollout?
            - id: event-3
              seq: 3
              author: agent
              text: >-
                Rollout consideration 1.
            - id: event-4
              seq: 4
              author: user
              text: >-
                Rollout consideration 2.
            - id: event-5
              seq: 5
              author: agent
              text: >-
                Rollout consideration 3.
            - id: event-6
              seq: 6
              author: user
              text: >-
                Rollout consideration 4.
          summaries: []
          summary_hint:
            from: event-2
            through: event-5
          actions: []
      handling:
        h1: >-
          The batch's `threads` holds the thread's context; `leaf page state <page>
          <thread-id>` reads its full history.
        h2: >-
          The thread has no title yet. Name its subject with `--title "<a few words>"`
          on your reply.
        h3: >-
          This thread's entry in the batch's `threads` has a `summary_hint`: an
          earlier range of messages worth summarizing. As you answer, follow the
          Leaf skill's `references/threads.md`, "Summarize a long discussion". The
          hint needs no separate answer.
        h4: >-
          If the event asks for work, first post one line in its thread saying what
          you will do, before any other command, even a read: `leaf response reply
          <answer.ref> --ephemeral --text "<what you will do, in a line>"`. Then
          do the work, put the result on the page with what shows it (captures,
          a figure, the numbers), and answer with `leaf response reply <answer.ref>
          --done --file reply.md`: what changed, in a sentence or two, linking the
          section that shows it. If the event asks for no work, answer it with that
          reply at once. The reply checks your saved page edit and makes it live
          before posting. Mark an answer that promises work beyond this turn `--todo
          "<what you owe>"` instead of `--done`. To ask the user something back,
          put the question in an `lf-ask` in `--markup`.
        h5: >-
          Your reply renders as Markdown in a narrow column: give each point its
          own short paragraph or list item, link a page section as `[its name](#section-id)`,
          and fence code or markup.
      events:
        - attention: true
          kind: reply
          author: user
          parent: event-2
          text: >-
            What do you recommend now?
          id: event-9
          ts: <time>
          seq: 9
          subject:
            kind: thread
            id: event-2
          threads: [event-2]
          handling: [h1, h2, h3, h4, h5]
          answer:
            kind: reply
            parent: event-9
            responds: event-9
            ref: <delivery>:0:event-9
            writer: agent
