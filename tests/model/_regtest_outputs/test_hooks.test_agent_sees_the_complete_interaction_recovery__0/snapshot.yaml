# Complete agent-facing outputs through real hooks, wait and thread reply commands.
# Only page paths, event/delivery/attempt and claim identities, and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

idle before pickup:
  exit: 1
  stdout: ''
  stderr:
    - error: >-
        1 event nobody has picked up, so the page cannot close yet. Leaf's hook
        puts them in your context at your next turn.
      findings: []

the watch wakes the session: >-
  <page> has new input; Leaf's prompt hook puts it in your context with this notification

delivered at prompt:
  instruction: >-
    Leaf has new input for your turn. Read this complete delivery before answering.
  delivery:
    format: leaf-delivery/15
    id: <delivery>
    created_at: <time>
    acknowledge: null
    batches:
      - page: <page>
        claim: <claim-session>
        through_seq: 3
        threads:
          - id: event-3
            title: null
            anchor: null
            detached_from: null
            resolved: null
            elided:
              messages: 0
              actions: 0
            messages: []
            summaries: []
            actions: []
        handling:
          h1: >-
            The thread has no title yet. Name its subject with `--title "<a few
            words>"` on your reply.
          h2: >-
            If the event asks for work, first post one line in its thread saying
            what you will do, before any other command, even a read: `leaf thread
            reply <answer.ref> --ephemeral --text "<what you will do, in a line>"`.
            Then do the work, put the result on the page with what shows it (captures,
            a figure, the numbers), and answer with `leaf thread reply <answer.ref>
            <declaration> --file reply.md`: what changed, in a sentence or two,
            linking the section that shows it. If the event asks for no work, answer
            it with that reply at once. The reply checks your saved page edit and
            makes it live before posting. The declaration says whose move your answer
            leaves, which delivering what was asked doesn't settle. `--obligation`
            when it is the user's: it leaves them a decision, or something to try
            or review before making one, or asks them for an answer or permission.
            That puts your answer on their On me list until they reply or resolve
            the thread, even where the decision itself is already there. Where your
            answer asks a question of its own whose answers you can list, such as
            which of two ways to proceed or whether to take an action, put them
            in `--markup` in place of `--obligation`, as `<lf-options id="…" choose>`
            holding an `<lf-option id="…">` for each answer: the user answers with
            a press, and the choice waits on them by itself (`references/threads.md`,
            "Ask for a pick"). `--todo "<what you owe>"` when it is yours, promising
            work beyond this turn. `--done` when it leaves nobody a move.
          h3: >-
            Your reply renders as Markdown in a narrow column: give each point its
            own short paragraph or list item, link a page section as `[its name](#section-id)`,
            and fence code or markup.
        events:
          - attention: true
            kind: comment
            author: user
            revision: 1
            text: >-
              Add the camera first.
            id: event-3
            ts: <time>
            seq: 3
            subject:
              kind: thread
              id: event-3
            threads: [event-3]
            handling: [h1, h2, h3]
            answer:
              kind: reply
              parent: event-3
              responds: event-3
              ref: <delivery>:0:event-3
              writer: agent
  attention: ''

acknowledged at stop: null

the watch wakes the session to remind it: >-
  <page> has an update still owed an answer; Leaf's prompt hook names it in your
  context with this notification

reminded at prompt:
  hookSpecificOutput:
    hookEventName: UserPromptSubmit
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 acknowledged user update with no answer (`leaf thread reply <delivery>:0:event-3`).

      `leaf page state <page>` lists what is owed, and `leaf page state <page> <message>` reads a thread's history.
      Read these unanswered updates and their exact answer references:
      ```xml
      <leaf-delivery id="<delivery>" operation="delivery read" />
      ```

idle before answer:
  exit: 1
  stdout: ''
  stderr:
    - error: >-
        1 acknowledged user update with no answer (`leaf thread reply <delivery>:0:event-3`);
        answer before closing. `leaf page state <page>` lists what is owed, and
        `leaf page state <page> <message>` reads a thread's history.
      findings: []

answer:
  kind: reply
  author: agent
  agent: Claude
  session: s1
  parent: event-3
  text: >-
    I will add the camera first.
  responds: event-3
  attempt: <attempt>
  revision: 1
  id: event-7
  attention: false
  ts: <time>
  seq: 7

answered at stop: null
