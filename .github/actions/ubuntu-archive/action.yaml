name: Use Ubuntu's own archive
description: Point apt at archive.ubuntu.com and security.ubuntu.com only, instead of the runner cloud's regional mirror and the image's Microsoft repository.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # The image lists its cloud's regional mirror first (Azure's or AWS's,
        # configure-apt-sources.sh in actions/runner-images), and either can keep
        # transferring too slowly to trigger apt's inactivity timeout. Keep only
        # archive.ubuntu.com and security.ubuntu.com, which it lists after it.
        # https://github.com/actions/runner-images/issues/12949
        sudo sed -i -E '\#://[^/]+\.archive\.ubuntu\.com/#d' /etc/apt/apt-mirrors.txt
        # The image also adds packages.microsoft.com, which serves nothing CI
        # installs, and a 403 from it fails every `apt-get update`, Playwright's
        # `--with-deps` included.
        sudo find /etc/apt/sources.list.d -type f -exec grep -q 'packages\.microsoft\.com' {} \; -delete
