# Added with `holder` in `leaf page state`: a Claude Code main thread whose context was
# compacted recovers what it owes from `activity.obligations`
# (`references/conversation-loop.md`). One of the answers it lists is held by a fork of
# the session that is still answering it, so the main thread answering it too would
# take the thread from the fork and give the user two answers. The page state below
# is a real reading of a page in that state; the `without-holder` variant is the same
# reading as `page state` printed it before `holder`.
# With `holder`: the agent left the fork's answer 3/3 on head and 3/3 on base, whose
# instructions don't name the field, so the reference gained no sentence for it.
# Without it (`without-holder`, head): it answered the fork's message too, 0/3.
description: Recovery leaves a fork's answer
metadata:
  purpose:
    A main thread recovering what it owes from page state answers its own owed update and
    leaves the one a running fork holds to that fork.
  tags:
    - wait-loop
    - forks
    - threads
  harnesses: [claude-code]
vars:
  prompt: |
    You are a Claude Code session using Leaf, three hours into an audit of a project's build with the user on the page /Users/max/.local/state/leaf/pages/build-audit. Your conversation was just compacted. Its summary says you have been answering the user's comments on the page as they arrive, and nothing about which you still owe.

    To recover what you owe, you ran `leaf page state /Users/max/.local/state/leaf/pages/build-audit | jq '{activity: {obligations: .activity.obligations}, threads, queues}'`, which printed:

    {"activity": {"obligations": [{"id": "update:cb6c7c43", "answer": {"kind": "reply", "parent": "cb6c7c43", "responds": "cb6c7c43", "ref": "acf31890:0:cb6c7c43"}, "holder": {"kind": "main"}}, {"id": "update:2fda6c29", "answer": {"kind": "reply", "parent": "2fda6c29", "responds": "2fda6c29", "ref": "72dd408d:0:2fda6c29"}, "holder": {"kind": "fork", "name": "leaf-2fda6c29", "state": "running"}}]}, "threads": [{"id": "cb6c7c43", "title": "Sorting the summary table", "anchor": null, "detached_from": null, "resolved": null, "unread": [], "attention": {"kind": "waiting", "reason": "workflow", "workflow": "cb6c7c43"}, "holder": {"kind": "main"}}, {"id": "2fda6c29", "title": "Python version", "anchor": null, "detached_from": null, "resolved": null, "unread": [], "attention": {"kind": "waiting", "reason": "workflow", "workflow": "2fda6c29"}, "holder": {"kind": "fork", "name": "leaf-2fda6c29", "state": "running"}}], "queues": {"on_user": [], "on_agent": [{"kind": "update", "id": "update:2fda6c29", "owner": "agent", "subject": {"kind": "thread", "id": "2fda6c29"}, "thread": "2fda6c29", "also": [], "live": true}, {"kind": "update", "id": "update:cb6c7c43", "owner": "agent", "subject": {"kind": "thread", "id": "cb6c7c43"}, "thread": "cb6c7c43", "also": [], "live": true}]}}

    Each thread holds one message from the user. In `cb6c7c43`, on the summary table: "Can this table sort by cost?" The table is the page's `#summary-table`, an `lf-table` whose rows carry a `cost` column. In `2fda6c29`, on the toolchain section: "Which Python does the project need?" The project's `pyproject.toml` says `requires-python = ">=3.12"`.

    The page and services are unreachable in this exercise. Write out each command you would run in response, with its full arguments, then end your answer.
assert:
  - type: llm-rubric
    metric: leaves-the-fork
    value:
      Pass only if the agent answers the user in thread `cb6c7c43`, such as with `leaf thread reply` and the
      ref `acf31890:0:cb6c7c43`, and writes nothing in thread `2fda6c29`, which a fork of the session named
      `leaf-2fda6c29` is still answering. Fail if any command replies in thread `2fda6c29`, uses the ref
      `72dd408d:0:2fda6c29`, or starts or ends work on it, and fail if the agent answers neither thread.
      Messaging the fork, such as with SendMessage, and reading state are fine.
variants:
  without-holder:
    metadata:
      purpose: The same recovery from the page state Leaf printed before `holder`, as a control.
    vars:
      prompt: |
        You are a Claude Code session using Leaf, three hours into an audit of a project's build with the user on the page /Users/max/.local/state/leaf/pages/build-audit. Your conversation was just compacted. Its summary says you have been answering the user's comments on the page as they arrive, and nothing about which you still owe.

        To recover what you owe, you ran `leaf page state /Users/max/.local/state/leaf/pages/build-audit | jq '{activity: {obligations: .activity.obligations}, threads, queues}'`, which printed:

        {"activity": {"obligations": [{"id": "update:cb6c7c43", "answer": {"kind": "reply", "parent": "cb6c7c43", "responds": "cb6c7c43", "ref": "acf31890:0:cb6c7c43"}}, {"id": "update:2fda6c29", "answer": {"kind": "reply", "parent": "2fda6c29", "responds": "2fda6c29", "ref": "72dd408d:0:2fda6c29"}}]}, "threads": [{"id": "cb6c7c43", "title": "Sorting the summary table", "anchor": null, "detached_from": null, "resolved": null, "unread": [], "attention": {"kind": "waiting", "reason": "workflow", "workflow": "cb6c7c43"}}, {"id": "2fda6c29", "title": "Python version", "anchor": null, "detached_from": null, "resolved": null, "unread": [], "attention": {"kind": "waiting", "reason": "workflow", "workflow": "2fda6c29"}}], "queues": {"on_user": [], "on_agent": [{"kind": "update", "id": "update:2fda6c29", "owner": "agent", "subject": {"kind": "thread", "id": "2fda6c29"}, "thread": "2fda6c29", "also": [], "live": true}, {"kind": "update", "id": "update:cb6c7c43", "owner": "agent", "subject": {"kind": "thread", "id": "cb6c7c43"}, "thread": "cb6c7c43", "also": [], "live": true}]}}

        Each thread holds one message from the user. In `cb6c7c43`, on the summary table: "Can this table sort by cost?" The table is the page's `#summary-table`, an `lf-table` whose rows carry a `cost` column. In `2fda6c29`, on the toolchain section: "Which Python does the project need?" The project's `pyproject.toml` says `requires-python = ">=3.12"`.

