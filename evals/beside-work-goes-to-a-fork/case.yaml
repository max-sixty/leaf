# A Claude Code session gets a thread message whose work, a lookup in the repository,
# could run beside the change the session is partway through. Leaf marks nothing: the
# session judges who does the work. The rule is in `references/harness-claude-code.md`,
# "Subagents": give work that touches and awaits nothing of the session's to a fork in
# the background, which answers it itself, start the message, since the line fork's
# working line doesn't start it, and send the thread's later messages to a fork. The
# failures it invites are doing the work inline, which holds up both the user and the
# session's change, and skipping the start because the thread already shows a working
# line. Each context is the hook's output as Leaf writes it (`hook_transport.carry_turn`
# through `delivery.inline_context`), rendered from `delivery.handled` with the kernel
# registry's clauses, its ids, page and claim substituted. The `later`
# variant is the thread's next message after the fork answered. The `next-turn`
# variant is a turn opened for a message in another thread while the fork still works
# on the message the session started, which Leaf names nowhere then
# (`activity.start_holds`); the failure it invites is starting that message again or
# doing its work. `fork-ended` is Leaf's reminder once the fork has ended without
# answering, which the session answers or puts to work again. The subject can't run
# the Agent tool, so it writes the operations out.
description: beside-work-goes-to-a-fork
metadata:
  purpose:
    A thread message whose work can run beside the session's own goes to a fork the
    session spawns in the background, which answers it, the session starts it, and the
    thread's later messages go to a fork too.
  tags:
    - wait-loop
    - forks
    - threads
  harnesses: [claude-code]
