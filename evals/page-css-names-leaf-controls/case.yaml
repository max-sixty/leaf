schema_version: '1.0'
name: page-css-names-leaf-controls
description: "Restyling Leaf's controls: a page rule reaches the controls a widget builds only when it names the widget or Leaf's class, so a request about those controls is answered by naming them, not with a bare element rule."
tags:
- theme
execution:
  prompt: |
    You are revising a Leaf page for the user. It has a triage board
    (`<lf-board id="triage">` with three columns of cards) and, below it, an Ask whose
    answer is an `<lf-options id="next-step" choose>` with three options. The page's own
    `<style>` is empty.

    The user commented on the board: "The buttons on the board and the pick buttons in
    the question are too small for me to hit on my trackpad. Make those bigger. Leave
    the rest of the page as it is."

    The page directory is not reachable from here, so reply with the complete `<style>`
    element the page needs, rather than writing a file.
graders:
- name: loads-leaf
  type: tool_used
  tool: Skill
  input_match: leaf
- name: reads-page-authoring
  type: tool_used
  tool: Read
  input_match: page-authoring
- name: judgment
  type: llm
  criteria: |
    Read the CSS. Pass only if every rule meant to enlarge the board's and the options'
    controls selects them through the widget or Leaf's own vocabulary: its selector
    names `lf-board`, `lf-options`, `lf-option`, or a Leaf class such as `.lf-btn` or
    `.lf-pick` (an `lf-` class), alone or with a descendant such as `button`. Fail if
    the enlargement relies on a selector that names no widget and no `lf-` class, such
    as a bare `button`, `[role="button"]`, `main button`, or `input`, since Leaf's page
    CSS reaches the controls a widget builds only through a selector that names the
    widget. Also fail if it changes the page-wide type scale or every surface (for
    example `:root` font size, or a size token that the whole page reads) when the user
    asked to leave the rest of the page as it is.
