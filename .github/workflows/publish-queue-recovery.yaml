name: publish-queue-recovery

# A publish job's execution timeout does not bound its wait for a runner. Keep
# recovery outside the deployment's concurrency group and Cloudflare environment.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Release abandoned publish queue entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-queue-recovery.mjs
