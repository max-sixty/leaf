# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

no watcher:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up, so the page cannot idle yet. Leaf's hook puts them in your context at your next turn.

wait wakes the session: |
  <page> has new input; Leaf's prompt hook puts it in your context with this notification

delivered at prompt:
  instruction: >-
    Leaf delivered this input into your turn and confirmed it, so the user's moves
    read Picked up.
  delivery:
    format: leaf-delivery-v3
    id: <delivery>
    created_at: <time>
    carrier: hook
    acknowledge: null
    batches:
      - page: <page>
        through_seq: 2
        threads:
          - id: event-2
            title: null
            anchor: null
            detached_from: null
            resolved: null
            elided:
              messages: 0
              actions: 0
            messages: []
            summaries: []
            actions: []
        handling:
          h1: >-
            This event's thread has no title yet: name it with `leaf thread title
            <page> <thread-id> --text "<a few words>"`, so the thread panel lists
            its subject rather than its opening words.
          h2: >-
            When the event asks for work, name that work before any other, including
            reading the source it concerns: `leaf status <page> working "<the work,
            in a line>" --on <address>`, where `<address>` is the event's `answer.to`.
            The move then reads Working, and the line stands beside the thread and
            in the banner until you answer. Do the work and put its result on the
            page, with whatever shows it (captures, a figure, the numbers), then
            answer with `leaf thread reply <page> --for <event-id>`: what changed,
            in a sentence or two, linking the section that shows it. When the event
            asks for no work, as a question may not, answer it with that reply at
            once. The page carries the work, and the thread only the conversation
            about it. `leaf thread reply` checks any saved page edit and makes it
            live before posting. If a revision removes what the thread is anchored
            on, move the thread in the reply that reports it with `--section <id>`
            (narrowed by `--quote` or `--part` if needed), or `--detach` it if its
            subject has left the page. Add `--awaits` only if your reply's prose
            asks the user something.
          h3: >-
            Your reply renders as Markdown, so show code or markup in a fenced block.
        events:
          - kind: comment
            author: user
            revision: 1
            text: >-
              Add the camera first.
            id: event-2
            ts: <time>
            seq: 2
            subject:
              kind: thread
              id: event-2
            threads: [event-2]
            handling: [h1, h2, h3]
            answer:
              kind: reply
              to: event-2
              for: event-2
  attention: |-
    Leaf needs attention:
    - <page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`).
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

    Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

acknowledged at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`).

    Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

idle before answer:
  exit: 1
  output: |
    1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`); answer before idling. Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

answer: |
  replied in event-2

answered at stop: null
