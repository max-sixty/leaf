# Tools own their exclusions; only hooks without native ignore configuration
# filter here. Re-stage any files a formatter rewrites.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Generated output, source patches and captured evidence keep their bytes.
        exclude: &verbatim ^((browser/vendor|packages/.*/vendor)/|examples/pr-walkthrough\.patch$|evals/ui-review-detection/fixtures/)|\.patch$
      - id: end-of-file-fixer
        exclude: *verbatim
      - id: check-yaml
        # pnpm writes its lockfile as two documents: pnpm itself, then the dependencies.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        exclude: *verbatim
      - id: check-added-large-files
        exclude: ^((browser/vendor|packages/.*/vendor)/|examples/pr-walkthrough\.patch$|evals/ui-review-detection/fixtures/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  # The JavaScript each TypeScript module compiles to (build/typescript.mjs), written
  # before the formatter and linters read it.
  - repo: local
    hooks:
      - id: typescript-outputs
        name: compiled TypeScript modules
        language: system
        entry: node build/typescript.mjs
        pass_filenames: false
        files: '^(browser|packages)/.*\.ts$|^(build/typescript\.mjs|oxfmt\.config\.ts|package\.json|pnpm-lock\.yaml)$'
  # Keep the formatter version pinned, at the version package.json pins for the
  # TypeScript build's formatting: its releases change the layout they print.
  # It skips the files it doesn't format and those `oxfmt.config.ts` ignores.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        language: node
        additional_dependencies: [oxfmt@0.79.0]
        entry: oxfmt --no-error-on-unmatched-pattern
        types: [text]
        require_serial: true
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0, --no-warn-ignored]
  - repo: local
    hooks:
      - id: record-types
        name: generated Python record types
        language: system
        entry: uv run leaf-dev generate record-types --check
        pass_filenames: false
        files: '^(src/leaf/|dev/leaf_dev/commands/generate/record_types\.py$|pyproject\.toml$|uv\.lock$)'
      # Claude Code re-attaches only a skill's first 20,000 characters after a
      # compaction, so past that a session loses the skill's tail without knowing.
      # These are the skills long interactive sessions load.
      - id: skill-size
        name: skills a compaction keeps whole
        language: system
        entry: >-
          sh -c 'status=0; for f; do n=$(wc -c < "$f" | tr -d " ");
          if [ "$n" -gt 19500 ]; then echo "$f: $n bytes, past what a compaction keeps;
          move an occasion'"'"'s procedure into references/"; status=1; fi; done;
          exit $status' --
        files: ^(\.claude/skills/developing-leaf|skills/leaf)/SKILL\.md$
      - id: ty
        name: ty
        language: system
        entry: uv run ty check
        pass_filenames: false
        files: '(\.(py|pyi)$|(^|/)pyproject\.toml$|^uv\.lock$)'
      # Whole-graph check, in the package order `.config/importlinter.ini` keeps; files only
      # wakes it.
      - id: import-linter
        name: import-linter
        language: system
        entry: uv run lint-imports .config/importlinter.ini
        pass_filenames: false
        files: '^(src/leaf/.*\.py|\.config/importlinter\.ini|pyproject\.toml|uv\.lock)$'
      # Whole-graph check; files only wakes it. Install independently of pnpm setup.
      - id: dependency-cruiser
        name: dependency-cruiser
        language: node
        additional_dependencies: [dependency-cruiser@18.3.1]
        entry: >-
          depcruise --config .config/dependency-cruiser.mjs --output-type err browser/runtime
        pass_filenames: false
        files: ^(browser/(leaf\.js|runtime/.*\.js)|\.config/dependency-cruiser\.mjs)$
      # JavaScript's vulture: the modules, exports and types nothing reads, and
      # import cycles (`.config/knip.js`). Whole-tree; files only wakes it.
      - id: knip
        name: knip
        language: node
        additional_dependencies: [knip@6.44.1]
        entry: knip --config .config/knip.js --no-progress
        pass_filenames: false
        files: '\.(js|mjs|cjs|ts)$'
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  # Pin upstream's native parallel-step support until it is released. This also
  # checks wait targets:
  # https://github.com/rhysd/actionlint/pull/695
  - repo: https://github.com/rhysd/actionlint
    rev: bf6b9188a5fd7b4e7b7d244a865a60165bdc6783
    hooks:
      - id: actionlint
  # actionlint shellchecks workflow run blocks; this covers standalone scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
