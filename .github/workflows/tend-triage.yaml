name: tend-triage
# Keep the selected IDs visible before matrix jobs exist, including while queued.
run-name: triage ${{ inputs.issues || format('[{0}]', github.event.issue.number) }}
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issues:
        description: JSON array of issue numbers; use the triage-batch dispatch command to split large selections
        type: string
        required: true

# The whole batch holds the lane: overlapping events cannot multiply the cap.
concurrency:
  group: tend-triage
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false' && contains(github.event.issue.labels.*.name, 'tend-outage') == false && contains(github.event.issue.labels.*.name, 'tend-rate-limit') == false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - uses: max-sixty/tend/setup-runtime@0.3.23
      - name: Select current issues
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
          ISSUES: ${{ inputs.issues || format('[{0}]', github.event.issue.number) }}
          BOOKKEEPING_LABELS: '["tend-outage", "tend-rate-limit"]'
        run: |
          tend runtime triage-batch select

  triage:
    needs: select
    if: needs.select.outputs.issues != '[]'
    name: "triage #${{ matrix.issue }}"
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    env:
      TEND_ISSUE_NUMBER: ${{ matrix.issue }}
    steps:
      - uses: max-sixty/tend/setup-runtime@0.3.23
      - name: React with eyes
        run: |
          tend runtime reaction add
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ matrix.issue }}
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.TEND_BOT_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/setup
      - run: echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
        name: Export the Cloudflare log token for agents that read the logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ (github.workflow == 'tend-triage' || (github.event.issue && !github.event.issue.pull_request)) && secrets.CLOUDFLARE_API_TOKEN || '' }}

      - uses: max-sixty/tend/codex@0.3.23
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: yolo
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          model: gpt-6.1-sol
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            $triage ${{ matrix.issue }}

            The review's CI wait is off (`await_ci: false`).

      - name: Remove the eyes reaction
        if: always()
        run: |
          tend runtime reaction remove
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ matrix.issue }}
          BOT_NAME: leaf-agent
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
