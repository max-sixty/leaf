description: page-css-names-leaf-controls
metadata:
  purpose: "Restyling generated controls names the requested widgets in each selector,
    so the page's other controls and Leaf's chrome keep their faces."
  tags:
    - theme
vars:
  prompt: |
    You are revising a Leaf page for the user. It has a triage board
    (`<lf-board id="triage">` with three columns of cards) and, below it, an `lf-ask` whose
    answer is an `<lf-options id="next-step" choose>` with three options. The page's own
    `<style>` is empty.

    The user commented on the board: "The buttons on the board and the pick buttons in
    the question are too small for me to hit on my trackpad. Make those bigger. Leave
    the rest of the page as it is."

    The page directory is not reachable from here, so reply with the complete `<style>`
    element the page needs, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the CSS. Pass only if every enlargement rule names the requested board or
      options widget in its selector (by id or tag), so it reaches their controls and
      nothing else. Fail if a rule selects controls page-wide, such as a bare `button`
      or `.lf-ui`, which would also enlarge unrelated page controls, or if the CSS
      changes page-wide size tokens or the type scale when the user asked to leave the
      rest alone. A `data-controls` attribute neither helps nor hurts.
