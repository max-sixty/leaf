        or unblocks, and answer in that thread.

resolve:
  event:
    kind: resolve
  told:
    - text: >-
        The user closed the thread. You owe nothing on it.

unresolve:
  event:
    kind: unresolve
  told:
    - text: >-
        The user reopened a closed thread. The reopening owes nothing of its own;
        if the thread's latest user message was never answered, `leaf conversation
        read <page> <conversation-id>` shows the `answer` its workflow still owes.

done:
  event:
    kind: done
  told:
    - text: >-
        The user approved the page's sign-off. The page stays open: keep it watched,
        and its status working, while you do what the approval unblocks.

request:
  event:
    kind: request
    obligation:
      response:
        kind: receipt
  told:
    - text: >-
        The user asked you to run an operation the page's package defines; the package's
        guidance says what the operation means and what to check before running
        it: `leaf page guidance <page>` lists its audiences, and the one that runs
        requests, such as `coordinator`, is the guide to read. The request id, with
        the page, identifies it: after an interruption, check whether it already
        ran before acting.
    - text: >-
        Run it at most once, then record its outcome with exactly one `leaf receipt
        <page> <request-id> succeeded|failed --text "…"`. The receipt does not change
        the page: refresh any data the page shows, update `index.html` to reflect
        the result, and stamp it if it is worth a note.

undo:
  event:
    kind: undo
  told:
    - text: >-
        The user took back the gesture that `undoes` names. Treat the two as cancelling
        out: do not answer or record the withdrawn gesture. Undoing an action that
        answered or closed a thread reopens that thread.

report:
  event:
    kind: report
  told:
    - text: >-
        A worker reported provisional state for a page widget, which the page shows
        until a stamped version answers it. Answer it in a stamped version before
        the page ends: write the reported state into the markup, or mark the element
        `overruled` and say why in the version note. A version that leaves the widget
        as it was leaves the report standing, and `version check` refuses one whose
        markup contradicts the report without answering it.

error:
  event:
    kind: error
  told:
    - text: >-
        The page's runtime reported a failure the user saw. Fix the page or widget
        and save the fix. It is a diagnostic: reply only if the user asked about
        it.
