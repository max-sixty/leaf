    This is the section the comment is in, as revision 17 has it:

    ```html
    <section id="mark">
      <h2>The author already says which cell names the row</h2>
      <p id="mark-body">
        The agent that wrote your table wrote each key as
        <code>&lt;th scope="row"&gt;</code>, HTML's element for a row's name. Leaf's
        instructions have asked for that since 25 October, and authors follow it: in
        pages begun since, 659 of the 663 rows that open on a code name are written
        that way, up from 41 of 207 before. So the Key column needs no logic of
        Leaf's. A rule on that element keeps its name whole, and the server's mark was
        reading each cell's text to learn what the author had already said.
      </p>
      <p id="mark-other">
        That leaves a name in any other column, such as Declared by: 307 of the 970
        names in those pages. HTML has no element for it, so it breaks as before, in
        every browser. Chrome draws <code>lf-options</code> on two lines there today.
        Its author can keep it whole with one line of CSS, and your table then draws
        exactly as it did with the mark.
      </p>
