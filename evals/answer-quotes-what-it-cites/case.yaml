          alt="The same table with lf-options and lf-ask each on one line in Declared by, and the heading Declared by on one line." />
      </figure>
      <p id="mark-guidance">
        Leaf's instructions tell authors not to write that line, and I'm leaving them
        as they are. The wording dates from
        <a href="https://github.com/max-sixty/leaf/pull/4110">25 October</a>, when an
        author's <code>white-space: nowrap</code>, written for cells of issue numbers
        and reused on a column of prose, held that column 559px wide and left the
        status beside it a word to the line. Of the 182 pages with a table then, 23
        styled their cells' widths or wrapping. A row heading is different because the
        theme caps what it keeps whole, and an author's line has no cap.
      </p>
      <p id="mark-cost">
        So a name outside a row heading is the one place where neither the author nor
        Leaf acts. Of the 213 tables that have row headings, 3 keep a short name
        broken there in Firefox, and the mark left none. A rule in CSS that guesses
        those columns from structure does worse than leaving them: it pushed a column
        off <a href="/media/c2f3c4953302e4fb.png">one of your tables</a>, which is
        <a href="/media/868f2e6a1ac184fc.png">whole without it</a>.
      </p>
    </section>
    ```

    "That line" is the one line of CSS that `#mark-other` says an author can write and
    the figure shows: `td:nth-child(2) { white-space: nowrap; }` on the Declared by
    column. The guidance the paragraph means is in the checkout's copy of the Leaf skill;
    you read it earlier:

    ```
    $ sed -n 320,328p skills/leaf/references/page-authoring.md
    scroll in the box needs `max-width: none`. For a box that scrolls vertically, see
    `page-layout.md`, "Bounds and widths".

    Leaf fits an image or SVG to its container on every page. On a page that wears the
    reading face, as a themed page does (`package-themes.md`, "A page's theme"), Leaf
    also scrolls a `<pre>` wider than its container, and a table's columns size to their
    content, so leave its cells' widths and wrapping to Leaf too. A `<pre>` asks its
    container for no width, so a box that takes its width from its content can leave it
    ```

    The page and services are unreachable in this exercise. Write out the commands you
    would run, with the full text of the reply and of any page edit, then end your answer.
assert:
  - type: llm-rubric
    metric: quotes-its-source
    value: |
      Read only the reply that answers the user's comment: the text given to `leaf thread
      reply` for it, HTML included. Pass only if that reply quotes, word for
      word, the whole sentence of Leaf's authoring guidance it relies on, the one that
      ends "so leave its cells' widths and wrapping to Leaf too", as a quotation the user
      reads in the thread: a Markdown blockquote, a sentence in quotation marks, or a
      `<details>` block in the reply. A longer quotation that contains that sentence
      passes. Fail if the reply gives only a paraphrase, a shorter fragment, the file's
      name or a link to it, or leaves the quotation to the page.
  - type: not-regex
    metric: no-link-to-its-own-passage
    value: \]\(#mark-guidance[\s)]|href=[\"']#mark-guidance[\"']
  # A `<summary>` is a line of HTML that Markdown doesn't read, so backticks in it
  # show as typed; the quotation's file name invites them.
  - type: not-regex
    metric: summary-marks-code-in-html
    value: '<summary>(?:(?!</summary>)[\s\S])*`'
