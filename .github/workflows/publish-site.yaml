name: publish-site

# Every product and example route uses one build through a Cloudflare Worker origin:
# immutable documents and browser assets at the edge, and the canonical Python Leaf
# server for per-user API state.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "examples/**"
      # Browser source and packages compose what visitors load; Python and skill
      # instructions run the hosted agent.
      - "browser/**"
      - "packages/**"
      - "src/**"
      - "skills/leaf/**"
      # The hosted agent installs the complete prepared plugin, including its
      # harness registrations and skill discovery manifests.
      - "hooks/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills/developing-leaf/**"
      - ".claude/skills/ui-sweep/**"
      - "bin/leaf"
      - "pyproject.toml"
      - "uv.lock"
      - ".config/leaf-assets.json"
      # The site build and the deploy gate that verifies it are leaf_dev code.
      - "dev/**"
      - "worker/**"
      # The site build compiles the runtime through build.mjs, which loads the
      # rest of build/ (the bundle table, its entries and the registry generators).
      - "build/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-site.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new main push replaces an earlier publish even when it is stuck before a runner starts.
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    # Two steps own most of this budget. The deploy retries Cloudflare's `100146`
    # for up to 30 minutes after the first one. The verification step at the end
    # follows: `site verify`'s `--wait` spends up to 900 seconds, and the agent
    # journey after it adds a page verification, `agent_session`'s 180 seconds, the
    # turn's `TURN_LIMIT`, and the reload, whose presentation fails once it goes
    # `HANDOVER_DEADLINE_MS` without progress and whose revision follow takes
    # `SERVED_TIMEOUT_MS` — roughly 36 minutes. With the build and image push before
    # the deploy, the worst case nears 77 minutes. The job has to clear that, because
    # a cancelled job prints `exceeded the maximum execution time` in place of the
    # gate's own account of what the deployed page was doing.
    timeout-minutes: 80
    environment: release
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/ubuntu-archive

      - uses: astral-sh/setup-uv@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `site verify` and the journey drive the headless shell matching the locked
      # Playwright (`leaf_dev.browser`), not the runner's installed Chrome.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🖼 Build site
        run: |
          release=$(printf '%s:%s:%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -d' ' -f1)
          echo "LEAF_SITE_RELEASE=$release" >> "$GITHUB_ENV"
          LEAF_SITE_RELEASE="$release" uv run leaf-dev site build

      - name: Check website worker
        run: pnpm run check:worker

      # Exercise the bundled graph through the same Worker and container boundary
      # before a deployment can make it public.
      - name: Verify the bundled release locally in a browser
        run: uv run leaf-dev site verify website-worker

      - name: Deploy public Leaf pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./wrangler-deploy.sh

      # A real browser must see the requested build in the document, module graph, edge
      # projection, and a newly started container before this deployment is green.
      # `site verify`'s `--wait` owns the wait for the edge to serve it, and the agent
      # journey that follows runs the deployed turn alone rather than re-sampling
      # readings the wait settled.
      - name: Verify the exact public release in a browser
        # Capture APIRequestContext's Node sockets, including failures before a
        # Worker invocation exists. The preload emits only allowlisted metadata.
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/dev/leaf_dev/http_transport.cjs
        run: |
          release=$(jq --raw-output .release .tmp/site/_leaf/site.json)
          uv run leaf-dev site verify --release "$release" --wait 900
          uv run leaf-dev journey run https://leaf.page --release "$release"
