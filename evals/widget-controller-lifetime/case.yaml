# Guards semantic and data subscriptions across removal independently of native resources.
# One base/candidate run distinguished teardown/recreation from retained subscriptions.
# One run per arm retained the three lifecycle passes; only the candidate passed
# renderer-owned placement with shared datum provenance (20261006-135659-8dka43l3).
description: widget-controller-lifetime
metadata:
  purpose: A widget retains semantic and data subscriptions across removal and reinsertion.
  tags:
  - packages
  - lifecycle
vars:
  prompt: |
    Write the lifecycle methods for a Leaf package widget that displays its declared
    status and the availability of its status action. It can be removed temporarily
    and the same element reinserted later. While removed it should do no rendering;
    on return it should show the latest reading without duplicate callbacks.
    It also displays its declared external-data source named "builds" and the
    page's history. Those readings must catch up when it returns, even if the
    source revision and page state did not change while it was absent.

    Read the public references and use Leaf's supported semantic widget API. The
    widget also registers a native window resize listener to measure its local
    inspector; keep that listener active only while the element is connected.
    The external source contains a list of {id, label} build records. Show each label
    in a retained paragraph that users can comment on, following the same build across
    source replacements. Include the data-rendering method as well as the lifecycle
    methods; other rendering and measurement methods already exist.
assert:
- type: llm-rubric
  metric: controller-owner-lifetime
  value: |
    Pass only if the widget obtains widgetController(this) and registers its
    controller subscription once for the element, with no unsubscribe on disconnect
    or resubscribe on reconnect. It must rely on the controller to pause detached
    rendering and catch up on reinsertion. The native window resize listener must
    still be registered on connection and removed on disconnection; fail if all
    resources are treated as having the controller's lifetime.
- type: llm-rubric
  metric: subscription-owner-lifetime
  value: |
    Pass only if watchData(this, "builds", callback) and watchHistory(this, callback)
    are each registered once for the element. The widget must rely on those
    subscriptions to pause while detached and deliver the latest readings on return;
    it must not stop and recreate either subscription in the native connection
    callbacks. Rendering methods may be assumed to exist as the prompt allows.
- type: llm-rubric
  metric: renderer-owned-projection
  value: |
    Pass only if the data-rendering method places retained nodes itself and then calls
    projectData(root, datums, {snapshot}) with node/key descriptors, not a key function
    and render callback. Each build datum supplies identity: its id, and carries the
    delivered snapshot so comments follow that build with the correct source revision.
    Either setChildren or Leaf's public render with keyed repeat can own placement.
    Fail if projectData is asked to create or reconcile the paragraphs, or if the
    method replaces every paragraph on every update rather than retaining their nodes.
