# https://pre-commit.com/
#
# Captures and generated files no hook may write: neither is authored here, so
# a hook's edit lands on a copy whose source it left alone.
#
# The vendored bundles and the MCP App resource are what scripts/vendor.py fetches
# and builds; a formatted copy conflicts on the next run of it.
#
# examples/corpus.html is generated by scripts/corpus.py out of the sibling examples,
# and a hook editing it puts the two out of step until someone reruns the script. The PR
# walkthrough patch is an exact GitHub data capture; its spaces are source evidence too.
# One exclude for the file rather than one per hook, because the rule is the file's and
# a per-hook list misses whichever hook is added next. The right order for a change to
# the corpus is the hooks first, corpus.py last.
# Experiment outputs are raw evidence, including empty stdout from failed runs.
# Keep their bytes; lint the authored commands and findings, not the captures.
exclude: ^(skills/leaf/(assets/vendor|packages/.*/vendor|mcp-app)/|scripts/browser/generated/|examples/(corpus\.html|pr-walkthrough\.patch)$|notes/mcp-apps/experiments/[0-9]+/(results/|output\.txt$))

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # JavaScript and HTML. Not CSS, where it splits theme.css's grouped rules one per
  # line, and not markdown, where it strips the indent off a list item's continuation
  # lines. HTML is safe because every whitespace-significant body on a page is inside a
  # <pre>, which is the one thing prettier's own table reads as untouchable; a bare
  # custom element's body it would reflow into a paragraph, stylesheet be damned.
  #
  # Format through this hook (`pre-commit run prettier`), not a bare `npx prettier`:
  # an unpinned prettier disagrees with the rev below about `</pre>` placement and
  # rewrites every authored example.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [javascript, html]
  # Parse every JavaScript module and enforce the rules a module's own source answers:
  # which specifiers an owner may name, who may write the document root, who may
  # publish semantic state. The browser loader proves that named imports exist.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0]
  # The runtime import graph, which no per-file linter can see: cycles, the direct
  # edges that cross a boundary, and the transitive closures `.dependency-cruiser.mjs`
  # declares. Every rule reads the whole graph, so the hook takes no filenames and the
  # pattern below only wakes it. dependency-cruiser is not an eslint plugin, so it
  # needs a hook of its own, pinned here as every other tool in this file is.
  # `package.json` is the `scripts/browser/` build's manifest; the lint gate runs no
  # `npm ci`, so a tool pinned only there would never be installed.
  - repo: local
    hooks:
      - id: dependency-cruiser
        name: dependency-cruiser
        language: node
        additional_dependencies: [dependency-cruiser@18.3.1]
        entry: depcruise --output-type err skills/leaf/assets/runtime
        pass_filenames: false
        files: ^(skills/leaf/assets/(leaf\.js|runtime/.*\.js)|\.dependency-cruiser\.mjs)$
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  # actionlint's schema rejects `concurrency.queue`, which tend's generated
  # workflows set; `.github/actionlint.yaml` ignores that one key for those files.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # actionlint already shellchecks the `run:` blocks in the workflows above. This
  # covers the shell outside them, starting with bin/leaf, which every install
  # executes.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
