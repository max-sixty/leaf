name: publish-site

# Every product and example route uses one build through a Cloudflare Worker origin:
# immutable documents and browser assets at the edge, and the canonical Python Leaf
# server for per-user API state.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "examples/**"
      # Browser source, compiled kernel and packages compose what visitors load;
      # Python and skill instructions run the hosted agent.
      - "browser/**"
      - "dist/kernel/**"
      - "packages/**"
      - "src/**"
      - "skills/leaf/**"
      # The hosted agent installs the complete prepared plugin, including its
      # harness registrations and skill discovery manifests.
      - "hooks/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills/developing-leaf/**"
      - ".claude/skills/ui-sweep/**"
      - "bin/leaf"
      - "pyproject.toml"
      - "uv.lock"
      - "leaf-assets.json"
      # The site build and the deploy gate that verifies it are leaf_dev code.
      - "dev/**"
      - "worker/**"
      # The site build compiles the runtime through build.mjs, which loads the
      # rest of build/ (the bundle table, its entries and the registry generators).
      - "build/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile.website"
      - "Dockerfile.website.dockerignore"
      - ".github/workflows/publish-site.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new main push replaces an earlier publish even when it is stuck before a runner starts.
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    # The verification step at the end owns most of this budget: verify-site's
    # `--wait` spends up to 900 seconds, and the agent journey after it adds a page
    # verification, `agent_session`'s 180 seconds, the turn's `TURN_LIMIT`, and the
    # reload and its `TURN_PRESENTATION` wait — roughly 34 minutes, behind the
    # three the build, image push and deploy take. The job has to clear that, because
    # a cancelled job prints `exceeded the maximum execution time` in place of the
    # gate's own account of what the deployed page was doing.
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # verify-site and the journey drive the headless shell matching the locked
      # Playwright (`leaf_dev.browser`), not the runner's installed Chrome.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🖼 Build site
        run: |
          release=$(printf '%s:%s:%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -d' ' -f1)
          echo "LEAF_SITE_RELEASE=$release" >> "$GITHUB_ENV"
          LEAF_SITE_RELEASE="$release" uv run leaf-dev site

      - name: Check website worker
        run: pnpm run check:worker

      # Exercise the bundled graph through the same Worker and container boundary
      # before a deployment can make it public.
      - name: Verify the bundled release locally in a browser
        run: uv run leaf-dev verify-site website-worker

      - name: Build and push the exact container image
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          local_image="leaf-website:${LEAF_SITE_RELEASE}"
          repository="registry.cloudflare.com/ece2539b9b32ab59dd74aa6b6285e5db/leaf-website"
          remote_image="${repository}:${LEAF_SITE_RELEASE}"
          docker build --file ../Dockerfile.website --tag "$local_image" ..
          pnpm --dir .. exec wrangler --cwd worker containers push "$local_image"
          image=$(docker image inspect "$remote_image" --format '{{index .RepoDigests 0}}')
          case "$image" in
            "$repository"@sha256:*) ;;
            *) echo "Wrangler did not leave an immutable image digest: $image" >&2; exit 1 ;;
          esac
          sed -i 's|image = "../Dockerfile.website"|image = "'"$image"'"|' wrangler.toml
          grep --fixed-strings "image = \"$image\"" wrangler.toml

      - name: Deploy public Leaf pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir .. exec wrangler --cwd worker deploy --containers-rollout=immediate

      # Worker activation and container rollout are separate Cloudflare operations. A
      # real browser must see the requested build in the document, module graph, edge
      # projection, and a newly allocated container before this deployment is green.
      # verify-site's `--wait` owns that wait — rollout drains one container allocation
      # at a time, so a coherent sample is what ends it — and the agent journey that
      # follows runs the deployed turn alone rather than re-sampling readings the wait
      # settled.
      - name: Verify the exact public release in a browser
        # Capture APIRequestContext's Node sockets, including failures before a
        # Worker invocation exists. The preload emits only allowlisted metadata.
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/dev/leaf_dev/http_transport.cjs
        run: |
          release=$(jq --raw-output .release .tmp/site/_leaf/site.json)
          uv run leaf-dev verify-site --release "$release" --wait 900
          uv run leaf-dev journey https://leaf.page --release "$release"
