<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Leaf presentation</title>
    <style>
      :root {
  color-scheme: light dark;
  --app-paper: var(--color-background-primary, light-dark(#fbfaf7, #191918));
  --app-ink: var(--color-text-primary, light-dark(#1f2420, #f0f1ec));
  --app-muted: var(--color-text-secondary, light-dark(#667068, #aeb5af));
  --app-line: var(--color-border-secondary, light-dark(#d8ddd8, #424843));
  --app-accent: var(--color-text-info, light-dark(#176b45, #7bd6a5));
  font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  background: var(--app-paper);
  color: var(--app-ink);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  margin: 0;
  background: var(--app-paper);
}

body,
button,
textarea {
  font: inherit;
}

body {
  min-width: 0;
  color: var(--app-ink);
}

button {
  cursor: pointer;
}

.app {
  min-height: 220px;
  padding:
    var(--safe-top, 0px)
    var(--safe-right, 0px)
    var(--safe-bottom, 0px)
    var(--safe-left, 0px);
  background: var(--app-paper);
  color: var(--app-ink);
}

.app.page-mode {
  height: 100vh;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  overflow: hidden;
}

body:has(.page-mode) {
  height: 100%;
  overflow: hidden;
}

.bar {
  position: sticky;
  z-index: 2;
  top: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--app-line);
  background: color-mix(in srgb, var(--app-paper) 94%, transparent);
  backdrop-filter: blur(14px);
}

.mark,
.mark svg {
  display: block;
  width: 27px;
  height: 27px;
  flex: none;
}

.identity {
  min-width: 0;
  flex: 1;
}

.title-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.identity b,
.identity > small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.identity b {
  font-size: 13px;
}

.identity small {
  margin-top: 1px;
  color: var(--app-muted);
  font-size: 11px;
}

.stage {
  flex: none;
  border: 1px solid var(--app-line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--app-muted);
  font: 600 9px/1.4 var(--font-sans, system-ui);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.actions {
  display: flex;
  gap: 6px;
}

.btn {
  min-height: 30px;
  border: 1px solid var(--app-line);
  border-radius: 8px;
  padding: 4px 9px;
  background: transparent;
  color: inherit;
  font-size: 12px;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  border-color: var(--app-accent);
}

.btn:focus-visible,
textarea:focus {
  outline: 2px solid var(--app-accent);
  outline-offset: 1px;
}

.btn.primary {
  border-color: var(--app-accent);
  background: var(--app-accent);
  color: var(--app-paper);
}

.btn:disabled {
  cursor: default;
  opacity: 0.55;
}

.surface {
  min-width: 0;
  min-height: 170px;
}

.page-mode .surface {
  min-height: 0;
  position: relative;
}

#leaf-page {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  background: var(--app-paper);
}

#page-host {
  display: block;
  position: relative;
  z-index: 0;
  min-height: 170px;
  isolation: isolate;
}

#page-loading {
  position: absolute;
  inset: 0;
  display: grid;
  margin: 0;
  place-items: center;
}

.empty {
  padding: 36px 18px;
  color: var(--app-muted);
  text-align: center;
}

.composer {
  position: sticky;
  z-index: 3;
  bottom: 0;
  display: none;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--app-line);
  background: var(--app-paper);
}

.composer.open {
  display: grid;
}

.quote {
  color: var(--app-muted);
  font: 11px/1.35 var(--font-sans, system-ui);
}

textarea {
  width: 100%;
  min-height: 66px;
  resize: vertical;
  border: 1px solid var(--app-line);
  border-radius: 9px;
  padding: 9px 10px;
  background: color-mix(in srgb, var(--app-paper) 94%, var(--app-ink));
  color: inherit;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.status {
  display: none;
  margin: 10px 12px 0;
  border: 1px solid var(--app-line);
  border-radius: 9px;
  padding: 9px 10px;
  color: var(--app-muted);
  font-size: 12px;
  /* A refused anchor answers with the occurrences it found, one per line. */
  white-space: pre-line;
}

.status.show {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.status.error {
  border-color: #b94c45;
  color: light-dark(#8a2924, #ffaaa3);
}

[hidden] {
  display: none !important;
}

@media (max-width: 520px) {
  .bar {
    flex-wrap: wrap;
    gap: 6px;
  }

  .actions {
    gap: 4px;
  }

  .btn {
    padding-inline: 6px;
  }

  .identity {
    order: 2;
    flex-basis: 100%;
    padding-left: 37px;
  }

  .identity b {
    display: none;
  }
}

@media print {
  .bar,
  .status,
  .composer {
    display: none !important;
  }

  #page-host {
    min-height: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <header class="bar">
        <span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="leaf">
<!-- A leaf whose midrib is a page's left margin, with the text hanging off it:
     the name drawn as one shape. A single filled path — the paragraph is cut
     out of the blade as negative space, so the mark scales without stroke
     weights drifting. The two palettes are theme.css's accent pair, spelled
     out because a favicon cannot link a stylesheet.

     The whole mark is `lf-tone`, and that is a contract with the runtime:
     a served page paints this element in whatever colour the banner's dot is
     wearing, so the tab says what the leaf is doing (paintTab). A layer
     overriding this file keeps the class or the tab stops saying anything. -->
<style>
  .lf-tone { fill: #2f5480; }
  @media (prefers-color-scheme: dark) {
    .lf-tone { fill: #8fb0d8; }
  }
</style>

</svg></span>
        <span class="identity">
          <span class="title-line">
            <b id="title">Leaf</b>
            <span
              class="stage"
              title="Merged for installed testing; Leaf will decide whether to keep or expand this transport."
              >Experimental</span
            >
          </span>
          <small id="meta">Connecting to the host…</small>
        </span>
        <span class="actions">
          <button class="btn" id="comment-page" type="button">Comment</button>
          <button class="btn" id="browser" type="button" disabled>Full page</button>
          <button class="btn" id="snapshot" type="button" hidden>Snapshot</button>
          <button class="btn" id="refresh" type="button">Refresh</button>
          <button class="btn" id="fullscreen" type="button" hidden>Fullscreen</button>
        </span>
      </header>
      <div class="status" id="status" role="status" aria-live="polite">
        <span id="status-text"></span>
      </div>
      <section class="surface" id="surface">
        <p class="empty" id="page-loading" hidden>Opening the complete page…</p>
        <iframe
          id="leaf-page"
          title="Leaf page"
          referrerpolicy="no-referrer"
          hidden
        ></iframe>
        <div id="page-host"><p class="empty">Waiting for the Leaf page…</p></div>
      </section>
      <form class="composer" id="composer">
        <div class="quote" id="quote"></div>
        <textarea id="comment" placeholder="Comment on this page" required></textarea>
        <div class="composer-actions">
          <button class="btn" id="cancel" type="button">Cancel</button>
          <button class="btn primary" id="send" type="submit">Send comment</button>
        </div>
      </form>
    </main>
