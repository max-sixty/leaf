# From session e973f04e (2026-11-15, page margin-open-cost): over ten hours the page
# gained a section for each new request at its end. Its title and opening still told
# how the comment box stopped re-placing every pin (#6071, merged), while the question
# now waiting on the user, which change to build for the inputs #6, #9 and #12, stood
# last. The agent wrote that revision as an insert before `</main>`, with SKILL.md's
# "Whenever the user returns, the page should be the one you would write today" in
# context, and the turn-end check named nothing stale, since the opening's claims still
# held. The prompt replays that revision: the page as revision 10 left it, the user's
# chat request, and the findings the agent had. Claude Code, 2026-11-16, on the shipped
# instructions: 3/3 rewrote the title and opening and moved the finished work after the
# question, both when asked for the revised `<main>` and when asked only to put the
# findings on the page. So the instructions hold in a short context with the page in
# view. The session didn't apply them late in a long context, with the page out of view
# and two earlier revisions that each appended a section; this case carries none of
# those, and doesn't show which mattered. It guards the rule against a cut; the
# turn-end check's `stale-lead` case covers the session's miss.
description: opening-follows-the-work
metadata:
  purpose:
    "Keeping the page current: when the work moves to a new question, the revision
    rewrites the page's title and opening for where the work stands now, and the finished
    work it described shrinks to its outcome, rather than appending the new section after
    it."
  tags:
    - revisions
    - asks
vars:
  prompt: |
    You are a Claude Code session using Leaf, ten hours into a page with the user at
    /Users/max/.local/state/leaf/pages/margin-open-cost. Load the Leaf skill if it isn't in
    your context. You read the references it routes to at the start of the session and have
    revised the page ten times since, so act on this without reopening them.

    The session began with the user asking you to build 2B, item #2 of a list of inputs
    whose cost grows with the page, and to explain the results visually on a Leaf page. You
    built 2A instead, as the page explains, and it merged as #6071. Since then, at the
    user's direction, you built and merged #6095, so only the pin focus is on says where it
    stands, and #6104, the fix for #10, and looked into #4. Nothing on the page waits on the
    user.

    Then the user wrote in chat: "evaluate #12, #9, #6; review what changes we should make".
    You have finished measuring and changed no code. What you found:

    | Input | 8 sections | 256 sections | What grows |
    |---|---|---|---|
    | Tab on the questions page (#6) | 15.4 ms | 20.5 ms | 62 hit tests a press, each about 3× dearer |
    | A key in a diff's file filter, beside 256 questions (#9) | — | 65–74 ms | every pin placed again on each key |
    | A key, with a comment on each passage (#12) | 3.9 ms | 7.7 ms | a hit test; every margin entry collected again |
    | A wheel step on that page (#12) | 2.0 ms | 3.5 ms | the reading place's hit test |
    | Hover on that page (#12) | 1.1 ms | 2.6 ms | the hover's hit test |

    The budget for a keystroke or a wheel step is 8 ms; the Mac was loaded (load average
    15 to 30), so these hold within about 20%.

    - Hit tests (#6, #12): asking the browser what stands at a point costs 0.02 ms with 8
      sections, 0.065 ms with 256, and 0.021 again once all but 8 are hidden. Making the
      key badges unpositioned changes little, so the lever is how many asks an input makes.
      Tab makes 62: 30 as the preview looks for room, 27 as the key badges check that
      nothing covers them (five points each), and a few for the reading place.
    - Placing every pin again (#9): about 60 ms at 256 pins. Tab, hover, scroll and
      picking an option bring none. A widget saying it rearranged itself (`lf-layout`), any
      style, class or hidden write in the page, and a window resize each bring one, and the
      diff's file filter does both on every key.
    - Tab's fixed cost (#6): 15 ms even on the 8-section page: the preview 3 ms, the key
      badges 2.7, finding the command 2.5, the reading place 1.2.

    The changes you would offer, in the order you'd build them:

    - A. Keep pins through page changes (#9): on `lf-layout` or a write in the page,
      check each kept pin's subject (about 6 µs a pin) instead of placing every pin
      again. A filter key should drop from about 70 ms to a few. You'd start here: it is
      furthest over budget.
    - B. Fewer hit tests an input (#6, #12): key badges check one point instead of five,
      the reading place asks once an input at most, the preview samples fewer points.
      Tab's hit tests should fall from 4.9 ms to about 1 at 256.
    - C. Stop collecting every margin entry on each key (#12): first find which reading
      the keystroke changes.
    - D. Profile and cut Tab's fixed 15 ms (#6).

    The user reads the work on the page. This is the page's `<main>` as it stands:

    ```html
        <main class="layout-column">
          <hgroup id="title">
            <h1>Opening a comment box no longer re-places every pin</h1>
            <p>Item #2, its second half: the comment box on the asks bench page.</p>
          </hgroup>

          <p id="verdict">
            You picked <strong>2B</strong>: put the margin's pins in boxes anchored to each
            section, so the browser moves them when a comment box opens and the page grows.
            It can't work in Chromium: every anchored box is laid out again on every layout
            of the page, so 256 of them would add 6 to 14 ms to each keystroke into a field.
            So I built <strong>2A</strong>: each pin keeps its last placement and moves by
            however far its target moved, and only pins whose surroundings changed are
            placed again. Opening a comment box on the 256-section asks page now takes
            <strong>66 ms of main-thread CPU instead of 110</strong>, in
            <a href="https://github.com/max-sixty/leaf/pull/6071">#6071</a>, now merged.
          </p>

          <section id="b-measured">
            <h2>Why the browser can't move the pins (2B)</h2>
            <p>
              A probe added 256 boxes to the asks page's margin, each anchored by CSS to one
              section as 2B would, and timed one layout after a one-pixel change elsewhere.
              Each anchored box costs that layout 25 to 55 µs, whatever changed; the same
              boxes without an anchor cost nothing. The cost also grows with the page: 32
              anchored boxes cost 0.8 ms on the 32-section page and 1.8 ms on the
              256-section one. This is the cost that removed per-pin anchors once before, in
              <a href="https://github.com/max-sixty/leaf/pull/1890">#1890</a>.
            </p>
            <figure id="anchor-cost">
              <lf-chart id="anchor-cost-chart" data-height="220"><pre>({
      ariaLabel: "Time for one layout of the 256-section asks page after a one-pixel change, by what the margin holds: no anchored boxes 0.04 ms; 256 boxes without anchors 0.1 ms; 32 anchored boxes 1.79 ms; 256 anchored boxes positioned against the page 6.43 ms; 256 anchored boxes fixed to the window 13.96 ms.",
      marginLeft: 230,
      x: { label: "ms per layout", grid: true, domain: [0, 16] },
      y: { label: null, domain: ["no anchored boxes (today)", "256 boxes, no anchor", "32 anchored boxes", "256 anchored, page-placed", "256 anchored, window-fixed"] },
      marks: [
        Plot.barX([
          { what: "no anchored boxes (today)", ms: 0.04 },
          { what: "256 boxes, no anchor", ms: 0.1 },
          { what: "32 anchored boxes", ms: 1.79 },
          { what: "256 anchored, page-placed", ms: 6.43 },
          { what: "256 anchored, window-fixed", ms: 13.96 },
        ], { x: "ms", y: "what", fill: "var(--lf-series-1)" }),
        Plot.text([
          { what: "no anchored boxes (today)", ms: 0.04 },
          { what: "256 boxes, no anchor", ms: 0.1 },
          { what: "32 anchored boxes", ms: 1.79 },
          { what: "256 anchored, page-placed", ms: 6.43 },
          { what: "256 anchored, window-fixed", ms: 13.96 },
        ], { x: "ms", y: "what", text: (d) =&gt; `${d.ms} ms`, dx: 6, textAnchor: "start" }),
        Plot.ruleX([0]),
      ],
    })</pre></lf-chart>
              <figcaption>
                One layout of the 256-section page after a one-pixel change, by what the
                margin holds. 2B needs one anchored box per section, page-placed or
                window-fixed. Chromium 158; a change inside Leaf's own panel costs the same
                (13.6 and 6.9 ms).
              </figcaption>
            </figure>
          </section>

          <section id="rule" class="layout-flow">
            <h2>What a page change places again now (2A)</h2>
            <p>
              A <dfn>pin</dfn> is a comment's marker beside its target. Placing one reads the
              words and controls near its target, in a horizontal strip of the page from a
              pin's height above the target to a pin's height below: its <dfn>band</dfn>. Each
              placed pin keeps what it read. When the page's ResizeObserver reports boxes
              that changed size, a pin keeps its placement, and moves down by as much as its
              target, when all four hold:
            </p>
            <ul>
              <li>the boxes beside its target that its band met moved with the target;</li>
              <li>its band, where it stands now, meets no box it didn't meet before;</li>
              <li>no box that changed size reaches its band;</li>
              <li>
                no box holding its target changed width, or changed size with nothing inside
                saying where.
              </li>
            </ul>
            <p>Every other pin is placed again by reading the page, as before.</p>
            <figure id="bands" data-width="wide">
    <svg class="drawing" viewBox="0 0 720 410" role="img" aria-label="Two miniature pages. Left: a comment box opens in the patch at the top; the three sections below and everything beside their pins move down together, so each pin keeps its record and moves with its section. Right: words grow above a pin in the left column; the pin's target moves down, but the right column beside it stays where it was, with a button now level with the pin, so that pin is read and seated again.">
      <!-- the drawing's 58 lines, unchanged -->
    </svg>
              <figcaption>
                Blue squares are pins and the shaded strips their bands. Orange marks a band
                whose surroundings changed: the target moved down, the button beside it
                didn't, so that pin's record no longer describes where it stands.
              </figcaption>
            </figure>
          </section>

          <section id="cost">
            <h2>Open cost by page size</h2>
            <p>
              Main-thread CPU from the press on a patch line until the comment box is drawn,
              main and this change run alternately on this Mac, lowest of two rounds each.
              At 256 sections it falls from 110 to 66 ms, and the box is on screen 37 ms
              after the press instead of 82. The resize's own task, the part this change
              owns, fell from about 70 ms of script to 14. Comment, resolve and reply cost
              the same as before.
            </p>
            <lf-chart id="open-cost" data-height="260"><pre>({
      ariaLabel: "Main-thread CPU to open a comment box on the asks page, by number of sections. Main: 32.5, 37.6, 52.6, 74.3 and 109.7 ms at 8, 32, 64, 128 and 256 sections. This change: 27.9, 33.3, 36.1, 50.2 and 66.3 ms.",
      x: { label: "sections (log scale)", type: "log", base: 2, ticks: [8, 32, 64, 128, 256], tickFormat: (d) =&gt; String(d) },
      y: { label: "ms of main-thread CPU", grid: true, domain: [0, 120] },
      color: { legend: true, domain: ["main", "this change"], range: ["var(--lf-series-1)", "var(--lf-series-2)"] },
      marks: [
        Plot.lineY([
          { n: 8, ms: 32.5, arm: "main" },
          { n: 32, ms: 37.6, arm: "main" },
          { n: 64, ms: 52.6, arm: "main" },
          { n: 128, ms: 74.3, arm: "main" },
          { n: 256, ms: 109.7, arm: "main" },
          { n: 8, ms: 27.9, arm: "this change" },
          { n: 32, ms: 33.3, arm: "this change" },
          { n: 64, ms: 36.1, arm: "this change" },
          { n: 128, ms: 50.2, arm: "this change" },
          { n: 256, ms: 66.3, arm: "this change" },
        ], { x: "n", y: "ms", stroke: "arm", marker: "circle" }),
        Plot.text([
          { n: 256, ms: 109.7, arm: "main" },
          { n: 256, ms: 66.3, arm: "this change" },
        ], { x: "n", y: "ms", text: (d) =&gt; `${d.ms} ms`, dx: -8, dy: -10, textAnchor: "end" }),
        Plot.ruleY([0]),
      ],
    })</pre></lf-chart>
            <p>
              It still grows. Most of what remains in the resize's task at 256 sections is
              the pins' spoken names: each says how far down the page it stands (“…, 40
              percent down, …”), so any change in the page's height reads every pin's target
              again. You chose to have only the pin focus is on say where it stands, now
              merged in <a href="https://github.com/max-sixty/leaf/pull/6095">#6095</a>.
              Checking whether a pin can keep its placement costs about 6 µs a pin at 256
              sections, measured by Codex.
            </p>
            <p>
              <code>uv run leaf-dev bench asks --input open --input comment --input resolve
              --input reply --base --rounds 2 --profile</code>. Other sessions loaded the Mac
              (load average 17), which inflates both arms alike.
            </p>
          </section>

          <section id="limits">
            <h2>What it leaves, and what to weigh</h2>
            <ul>
              <li>
                <strong>The check grew from one condition to four.</strong> Codex's first two
                reviews found pins it kept wrongly: beside a column that didn't move, beside
                a box shrinking toward its foot, beside a box the band came to meet, and for
                comments pointed at a paragraph inside a section. Each is now a step of the
                browser test that fails when its condition is switched off, and the third
                review found no case that differs from placing every pin again. If pins
                start covering words after a page grows, suspect this check first.
              </li>
              <li>
                <strong>A box drawn outside the box holding it.</strong> An absolute box
                placed from elsewhere, or one a transform moves, can come beside a kept pin
                unread, and the pin stays over it until it is placed again. 2B had the same
                gap.
              </li>
              <li>
                <strong>Other page changes still place every pin.</strong> A style or class
                written in the page, a widget announcing it rearranged itself
                (<code>lf-layout</code>), a window resize or a scroll inside the page.
              </li>
              <li>
                <strong>Every pin is still touched.</strong> A resize reads each kept pin's
                target and a few neighbours, and moves every pin below the change with one
                style write each: small per pin, but it grows with the page.
              </li>
            </ul>
          </section>

          <section id="follow-ups">
            <h2>Two follow-ups you asked me to look at</h2>
            <p>
              <strong>#10, a pin left hidden after a jump.</strong> A pin waits hidden while
              its passage is in content the browser skips drawing until it nears the window
              (<code>content-visibility: auto</code>), such as a long text document's lines.
              Such a box keeps its size as it draws, so nothing told the margin to show the
              pin again: after a jump back with a key or the scrollbar, the pin stayed
              hidden beside its words. The margin now listens for the box saying it drew,
              merged in <a href="https://github.com/max-sixty/leaf/pull/6104">#6104</a>.
            </p>
            <p>
              <strong>#4, readings that grow with the page.</strong> Neither part is worth a
              mechanism. Picking which parts of the page may show words takes 0.06 ms at 256
              parts, and a wheel step in one text document of 16,000 lines takes 4.7 ms, with
              no growth the bench flags. The bench did flag another page: with a comment on
              each of 256 passages, a keystroke takes 7.7 ms against 3.9 at 8, near the 8 ms
              budget, and a wheel step 3.5 against 2.0. In the wheel step, part of the growth
              is a hit test that checks every margin pin; the rest is not yet traced.
            </p>
          </section>

        </main>
    ```

    Put what you found on the page. Show the change you would save to its `index.html`,
    either as an edit's old and new text or as the whole new `<main>`, then the chat reply
    you would send.
assert:
  - type: llm-rubric
    metric: opening-current
    value:
      "Read the page as the answer leaves it: the `<main>` above with the answer's edit applied, or the answer's new `<main>`. The work has moved on: the comment-box
      change (#6071, 2A in place of 2B) and its follow-ups have merged, and what waits on
      the user now is which of the changes for the inputs #6, #9 and #12 to build. Pass
      only if the page's title (its `h1`) and its opening, the text before its first
      section, present that state: they name the new findings or the choice among the
      changes, or say that this choice is what waits on the user. Fail if the `h1` is
      still about a comment box no longer re-placing every pin, or the opening still
      tells the 2B and 2A story as the page's news, even where a later section holds the
      new findings and the question. Fail if the answer gives no change to the page."
  - type: llm-rubric
    metric: finished-reduced
    value:
      "Read the page as the answer leaves it: the `<main>` above with the answer's edit applied, or the answer's new `<main>`. Pass only if the finished comment-box
      work (#6071, #6095, #6104 and the look at #4) reads as its outcome, out of the way
      of the open work: a short record of what landed placed after the new findings and
      the question, folded into a `<details>` without `open`, or cut. Fail if the
      sections on why 2B can't work, the 2A rule with its drawing, the open-cost chart
      and what 2A leaves all still stand in full ahead of the new findings. Fail if the
      answer gives no change to the page."
  - type: llm-rubric
    metric: open-choice
    value:
      "Read the page as the answer leaves it: the `<main>` above with the answer's edit applied, or the answer's new `<main>`. Pass only if it asks the user which of
      the changes to build as an open question, an `lf-options` or `lf-ask` that carries
      no `settled`, `restated` or `chosen`, offering at least the change that keeps pins
      through page changes (#9) and the one that makes fewer hit tests (#6, #12). Fail
      otherwise, or if the answer gives no change to the page."
