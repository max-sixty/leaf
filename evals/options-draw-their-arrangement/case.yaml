# A session's layout-shift page drew each section's figure above its Ask and wrote
# every option as a title, chips and a sentence, though the options differed in where
# a reply box sits. An lf-option entry and lf-options example that show text faces
# can lead agents to write options as text.
# reason-beside-options: registry examples that write the reason into the recommended
# card (`<em>My take: …</em>`) can lead agents to put it in the cards; the examples
# put the reason in the lf-ask's prose.
# The rubric names no tags, so spatial before/after text wireframes count as drawing
# both options. The reason rubric passes a bare `recommended` label, which is not an
# argument. The case is a probe given a page with its packages.
description: options-draw-their-arrangement
metadata:
  purpose:
    "Asks: when the alternatives differ in arrangement, each lf-option shows its own arrangement
    in a drawing, not only in words."
  page: []
  tags:
    - asks
    - drawing
vars:
  prompt: |
    Write a Leaf page that records the layout shifts left in Leaf's thread panel, one
    section per item, each ending in a question for the user. Start with the section
    for this item; the other items come later.

    Your notes:
    - Item #10: in the thread panel, an open card's reply box is the last thing in
      the card. When a reply arrives, the card grows into the panel's free room and
      carries the reply box down with it, 422px in the measured case, with the caret
      when the user is typing.
    - Chat apps keep the reply box fixed at the foot and grow the conversation above
      it. Leaf's margin cards already do: their reply row is sticky at the bottom.
    - The user decides where an open panel card's reply box sits:
      - pinned at the panel's foot, with replies growing into the room above it
        (your recommendation; later cards sit below the fold while a card is open);
      - after the messages, as today, with the stability rule counting a box's
        contents as its growth so the move is allowed.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Find the `lf-options` group that asks where the reply box sits. Pass only if
      every `lf-option` in it contains its own concrete spatial sketch showing
      where the reply box sits under that option. An image, SVG, diagram, HTML
      arrangement or textual wireframe can qualify when its spatial arrangement
      communicates the result. Fail if any option only describes its arrangement
      in prose, lists or chips, even when a figure showing both arrangements
      stands elsewhere in the section.
  - type: llm-rubric
    metric: reason-beside-options
    value: |
      Find why the author recommends pinning the reply box at the panel's foot. Pass
      only if that reason is prose outside every `lf-option`, such as a paragraph in
      the question's section before or after the `lf-options` group. Inside the cards, each
      option may state its own properties and consequences at a similar depth, such
      as where replies grow or what moves. Fail if any `lf-option` holds the author's
      argument for picking it, such as "My take: …", "I'd pick this", or "recommended
      because …", even when the same reason also appears outside, and fail if the
      reason is missing. A bare `recommended` label marks the pick without arguing
      for it, and passes.
