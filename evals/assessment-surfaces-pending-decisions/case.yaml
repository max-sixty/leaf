        </details>

        <section id="execution">
          <h2>How the next round should reach review</h2>
          <p>Use <code>05a5008b3</code> as the runtime source snapshot and refresh from current main before extracting. <a href="#discussion-choice">#58, the proposed discussion presentation redesign</a>, is deferred and is not an extraction target. Leave #47 and #48 in TODO until a visible draft annotation provides a direct return to the exact source element and saved edit; #50 remains behind #47.</p>
          <p>For each visible change, lead with matched before/after evidence using the same fixture, width and state. Use a recording when timing or movement matters, and put the live sample after its comparison. A full candidate page alone is insufficient.</p>
          <p>Run the extract’s acceptance journey, independent review and required landing gates. After each extract lands, update this source branch from main and remeasure what remains. The scrollbar and filter-field work remain with their dispatched chats.</p>
          <details><summary>Inspect the full remaining branch</summary><pre id="inspect-branch"><code>wt -C '/Users/maximilian/.codex/worktrees/07dc/leaf' step diff</code></pre></details>
        </section>

