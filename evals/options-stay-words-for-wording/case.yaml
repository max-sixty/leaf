# Guardrail for options-draw-their-arrangement: on the same layout-shift page, a choice
# between two messages differs only in wording, so its options stay words.
# Label placement is left to the author: the alternatives' factual difference is
# apparent from titles or labels, including candidate wording used as titles. The
# rubric accepts both title forms and rejects indistinguishable titles, a
# recommendation on the wrong option and an invented pick.
# The section may draw the 68px shift above the options while the options stay
# words; options-draw-nothing alone judges the drawing, so comparison-labels doesn't
# forbid a figure outside the options.
# options-draw-nothing passes a wording shown in its setting, such as each wording
# among the report's lines in a `<pre>`, as authoring-on-me.md's "a wording as it
# would appear" asks, and fails only a drawing.
# reason-beside-options: registry examples that write the reason into the recommended
# card (`<em>My take: …</em>`) can lead agents to put it in the cards; the examples
# put the reason in the question's prose.
# The case is a probe given a page with its packages.
description: options-stay-words-for-wording
metadata:
  purpose:
    "Asks: when the alternatives differ only in wording, each lf-option stays a title and a sentence,
    with no drawing."
  page: []
  tags:
    - asks
    - drawing
vars:
  prompt: |
    Write a Leaf page that records the layout shifts left in Leaf's widgets, one
    section per item, each ending in a question for the user. Start with the section
    for this item; the other items come later.

    Your notes:
    - Item #14: `leaf page check --render` will report a widget whose box changes
      size between first paint and presentation. It reports, and never fails the
      check.
    - The user decides what the report says. Two wordings:
      - "lf-diff grew 68px after it upgraded; give it its final size before
        upgrade." (your recommendation: it names the widget, the size and the fix);
      - "Layout shift at upgrade: lf-diff (68px)." (shorter, and matches the other
        render findings' form).
assert:
  - type: llm-rubric
    metric: options-draw-nothing
    value: |
      Pass only if each `lf-option` in the wording choice is words: its labels, a
      title and a sentence or two, with the wording itself as text or code. The
      wording may stand among the report's other lines as text, as in a `<pre>`,
      since that shows it as it would appear. Fail if any option holds a drawing of
      the report, such as an inline `<svg>`, an `<img>` or an `lf-diagram`.
  - type: llm-rubric
    metric: comparison-labels
    value: |
      Pass only if titles or comparison labels make the alternatives' factual
      distinction clear without reading their explanatory prose, for example actionable
      detail versus concise reporting. The candidate wording itself may supply the
      title when it shows that distinction.
      Labels need not duplicate information already supplied by titles, nor appear in
      a fixed order. Only the detailed, actionable wording carries `recommended`.
      Neither option has `selected`, since the user has not picked.
  - type: llm-rubric
    metric: reason-beside-options
    value: |
      Find why the author recommends the detailed wording. Pass only if that reason is
      prose outside every `lf-option`, such as a paragraph in the question's section before or
      after the `lf-options` group. Inside the cards, each option may state its own
      properties and consequences at a similar depth, such as naming the widget or
      matching the other findings' form. Fail if any `lf-option` holds the author's
      argument for picking it, such as "My take: …", "I'd pick this", or "recommended
      because …", even when the same reason also appears outside, and fail if the
      reason is missing. A bare `recommended` label marks the pick without arguing
      for it, and passes.
