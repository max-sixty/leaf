# Added with where a sidebar page stacks (#1363). Base at 4d8d08eca rebuilt the
# sidebar as its own grid to keep the track beside the body at 900px (0 of 3); the
# change 3 of 3. Later made to fail a sticky track: base at eee4a2d6d stuck the
# `aside` itself (0 of 3), the change 3 of 3. Since the Layout sticks and bounds the
# one block a track holds, it fails a page that writes its own sticking instead.
# The completed-log and live-stream contrast only guarded in the 2026-10-07
# scrolling-policy comparison: both wordings passed those choices on both harnesses.
# The source diagnostic distinguishes adjusting tracks from replacing the outer
# arrangement: page-layout.md permits track shares, gaps and internal composition,
# and test_a_sidebar_pages_track_stays_in_view_only_beside_the_body covers those shares.
# 2026-10-22 fresh-agent trials (3 per case): reuse 1/3 base, 3/3 owner wording;
# old property ban 0/3 both, scrolling 3/3 each. Source charts failed admission.
# Separate full-tool trials tied 2/2 at 900x900; no finished-page gain shown.
description: sidebar-page-at-900px
metadata:
  purpose:
    Author a completed rollout record, render and repair it, then revise it for the user's 900px
    reading window. Score the log and checklist at the run's centrally selected viewport;
    select the short or phone preset explicitly to inspect those layouts.
  tags:
    - layout
    - workflow
  executor: leaf_dev.arrangement_eval
  scenario: sidebar-page-at-900px
  conditions:
    - leaf
variants:
  instructions:
    description: sidebar-page-at-900px/instructions
    metadata:
      purpose:
        "A sidebar page read at 900px: the Layout already keeps its track beside the body there
        and keeps the one block it holds in view as the body scrolls, so the page puts the checklist
        in that block and uses the Layout's wrapping and shared track reading behavior."
      tags:
        - layout
      executor: null
      scenario: null
    vars:
      prompt: |
        Write a Leaf page for the user: the rollout of release 4.12. The body is a long event
        log from the completed rollout (40 entries, newest last) and a chart of the error
        rate; beside it, a short checklist of six release checks with their results, one
        of which is failing. The user keeps the page open in a window about 900px wide
        beside their editor, wants the
        checklist beside the log at that width, and wants it kept in view while they scroll
        down the log.

        The page directory is not reachable from here, so reply with the complete
        `index.html`, rather than writing a file.
    assert:
      - type: llm-rubric
        metric: judgment
        value: |
          Read the HTML and its `<style>`. Pass only if all of these hold. `main` has class
          `layout-sidebar` and the checklist is in its track. The page uses the Layout's
          outer arrangement for the body and checklist. Page CSS may adjust track shares,
          gaps, or the arrangement inside a region. Fail if it replaces the outer body/aside
          arrangement with a separate grid or flex system, disables the Layout's wrapping,
          or forces the regions to remain side by side when their content cannot fit.
          Width tuning alone is not a failure. The checklist is in one block, the track's only child
          element, which the Layout keeps in view as the log scrolls, so the page's CSS leaves
          that alone too: fail if it makes the track or a block inside it `position: sticky`, or
          sets the `top`, `height`, `max-height` or `overflow` of the track or its block.
      - type: llm-rubric
        metric: completed-log-in-document-flow
        value: |
          The completed rollout's forty-entry event log is read in the document's own
          scroll. Fail if its listing or a containing box uses data-bound, a vertically
          scrolling pane, or CSS height/max-height with overflow-y auto/scroll to bound
          it. Disclosure is allowed if opening it lets the log grow in document flow.
  live:
    description: sidebar-page-at-900px/live
    metadata:
      purpose:
        A bounded live stream can still follow incoming output while preserving a reader's earlier
        position.
      executor: null
      scenario: null
    vars:
      prompt: |
        Write a Leaf page for a release that is deploying now. Its run log gains
        lines throughout the deployment, newest last. The user watches new output
        while checking six release checks beside it, and sometimes goes back to
        read an earlier error while the run continues. Include the log's opening
        six lines as placeholders. The page is open beside their editor in a
        window about 900px wide.

        The page directory is not reachable here, so reply with the complete
        index.html rather than writing a file.
    assert:
      - type: llm-rubric
        metric: live-log-uses-shared-reading
        value: |
          The run log uses Leaf's bounded reading region, `data-bound="end"` on the
          log's element, which follows new output while the reader is at the end and
          holds their place when they scroll back. Fail if the log is unbounded, bound
          from the start, or bounded by a page-local CSS scroller or custom scroll
          handlers.
