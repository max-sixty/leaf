pick inside a thread over App Server:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: reply
      writer: turn
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
      text: >-
        Leaf streams your opening message into the thread and posts your final message
        as the reply, unless an explicit reply already answered this input. Before
        your first tool call, tell the user briefly the answer or what you are about
        to do; later working messages stay in Codex. End with the answer, or what
        changed and where it shows. For widgets, an ask awaiting the user (`--ask`),
        work promised beyond this turn (`--todo`), a title or moving the thread,
        reply explicitly with `leaf response reply <answer.ref>` (`references/threads.md`);
        it posts at once, and your final message is then not posted.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

resolve:
  event:
    kind: resolve
  told:
    - text: >-
        The user closed the thread. You owe no reply there; a to-do you opened on
        it stays open until you end it.

unresolve:
  event:
    kind: unresolve
  told:
    - text: >-
        The user reopened a closed thread. Reopening needs no separate answer; if
        the thread's latest user message was never answered, `leaf page state <page>
        <thread-id>` shows the `answer` still owed.

done:
  event:
    kind: done
  told:
    - text: >-
        The user approved the page's sign-off. The page stays open: keep watching
        it while you do the work the approval unblocks, and show that work as a
        to-do (`leaf task open <page> page "<the work>"`, then `leaf task start`).

Done on a to-do on the user:
  event:
    kind: todo_end
  told:
    - text: >-
        The user pressed Done on the to-do `todo`, which you opened with `--on user`.
        That ends it and owes no reply. Continue the work it was waiting for, reading
        the page if you need to see what they did; if you still need something from
        them, ask again.

undo:
  event:
    kind: undo
  told:
    - text: >-
        The user took back the gesture `undoes` names. Treat the two as cancelled:
        don't answer or record the withdrawn gesture. Undoing an action that answered
        or closed a thread reopens that thread.

report:
  event:
    kind: report
  told:
    - text: >-
        A worker reported provisional state for a page widget, which the page shows
        until a stamped version answers it. Before the page ends, answer it in a
        stamped version: write the reported state into the markup, or mark the element
        `overruled` and say why in the version note. Until then the report stays
        in force.

error:
  event:
    kind: error
  told:
    - text: >-
        The page's runtime reported a failure the user saw. Fix the page or widget
        and save the fix. Reply only if the user asked about it.
