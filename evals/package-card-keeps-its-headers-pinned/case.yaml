# Added with the runtime's restart of `--lf-top` on every box that scrolls, `hidden`
# included. A package card that rounds its corners with `overflow: hidden` becomes the
# scroller its sticky headers stick in, so they scroll off with the page; the default
# theme's option card did this until it moved to `overflow: clip`. Three Claude Code
# trials did not tell the wordings apart: base 3/3 and candidate 3/3 clipped the card
# without a scroll container, so the case guards.
description: package-card-keeps-its-headers-pinned
metadata:
  purpose: A package card that only clips its corners uses overflow clip, so sticky headers inside it pin to the page.
  tags:
  - packages
  - styles
vars:
  prompt: |
    I'm writing a Leaf package widget, lf-runlog, that shows a deploy's log grouped
    by step. Its shadow tree renders one card with 8px rounded corners and a 1px
    border; the step rows inside run edge to edge and their backgrounds must not
    poke out past the rounded corners. Each step is a group whose title row should
    stay in view while the user reads down that step's lines, the way a diff's file
    header does. A log can run to thousands of lines, so the card takes its full
    height and the page scrolls.

    Read the references you need and show the widget's shadow.css for the card, the
    step groups and their title rows. Return CSS in your reply.
assert:
- type: javascript
  metric: reads-module-authoring
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/module-authoring\.md
- type: llm-rubric
  metric: card-clips-without-scrolling
  value: |
    Pass only if no box between the page and the title rows sets overflow,
    overflow-x or overflow-y to hidden, auto or scroll: the card keeps its corners
    with `overflow: clip`, or by rounding the rows themselves, or another way that
    makes no scroll container. Fail if the card or a group sets `overflow: hidden`.
- type: llm-rubric
  metric: titles-stick-at-the-slot
  value: |
    Pass only if each title row is `position: sticky` at `top: var(--lf-top)` and
    has a stated height. Fail if it sticks at a fixed offset such as `top: 0` or a
    pixel value.
