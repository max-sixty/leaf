pick on the page:
  event:
    kind: action
    meaning:
      scope: page
    answer:
      kind: markup
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}}
      text: >-
        If you need clarification, ask in a thread on the picked option. To override
        the pick in a later version, mark the element `restated` and say why in
        the version note.
    - text: >-
        It answers the page's Ask, so the page shows it as waiting on you until
        the markup records it. Name the work it selects or unblocks with `leaf status
        <page> working "<the work, in a line>"` before starting it, then do it,
        write it in, and stamp a version.

option the user added:
  event:
    kind: action
    action: add
    meaning:
      scope: page
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"allOf": [{"not": {"required": ["answer"]}}, {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}}]}
      text: >-
        The log carries the action onto every later version, so the page keeps it
        without an edit.
    - when: {"allOf": [{"required": ["action"], "properties": {"action": {"const": "add"}}}, {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}}]}
      text: >-
        When you write it into the markup, the added option becomes an ordinary
        lf-option in the group, keeping the id and words the event gives.
    - when: {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}}
      text: >-
        If you need clarification, ask in a thread on the picked option. To override
        the pick in a later version, mark the element `restated` and say why in
        the version note.
    - when: {"not": {"required": ["answer"]}}
      text: >-
        This move owes no answer of its own: it answers no Ask, a later move on
        the same widget carries the answer, or it does not finish the answer yet,
        such as a pick before the Done its group waits for.

