# Usability tasks, live user rounds, fixture history, and native Promptfoo grading.
# Python owns page setup, harness execution, and deterministic evidence readings.
# Prompts substitute {page} and {work}. Each rounds list posts one batch of user
# moves: anchor names an element and quote, undoes: previous names the last move,
# parent: latest names the newest message, and {origin}/{line} describe the served
# page. Document-bound moves receive the served revision at execution.
fixtures:
  reading:
    stamp: Plan as authored
    status: Pick a cutover mode
  resume:
    initial_stamp: First plan
    rerun_comment: These rehearsal numbers are from before the mapping change. Rerun it and
      update the figure.
    rerun_quote: 4.1 million documents in 3 h 20 min
    rerun_stamp: Rehearsal rerun after the mapping change; ask how traffic moves
    rerun_answer: 'Reran it on 18 September after the mapping change: 4.3 million documents
      in 3 h 05 min. The page shows the new figure.'
    status: Pick how traffic moves to the new index
    batch_comment: Batches of 500 saturate the replica's disk queue. Drop to 200 and say why
      on the page.
    batch_quote: batches of 500
    original_date: scheduled for 21 October
    unsaved_date: scheduled for 3 November
    invalid_child: <p id="approach-deadline">Decide by Friday.</p>
  constructs:
    draft: |
      Release 4.2 moves card tokenization to the new vault. Merchants need no code changes. Rollout starts 12 November.
    stamp: Release 4.2 review
    status: Edit the release note
  board:
    stamp: Key rotation board
    status: Move cards as work changes
    moves:
    - unit: card-docs
      value: col-doing
      rank: 0i
    - unit: card-audit
      value: col-doing
      rank: 1i
    - unit: card-rotate
      value: col-done
      rank: '1'
    doing:
    - card-docs
    - card-inventory
    - card-audit
    - card-alerts
  package:
    stamp: September review
  shared-source:
    stamp: Parser workers
  mixed:
    stamp: Backfill plan
    status: Pick how the copy runs
  elided:
    stamp: Backfill schedule
    premise: the vacuum job now owns the ops window
cases:
  cold-report:
    inputs:
      prompts:
      - |-
        Write up these findings from yesterday's load test so I can skim them
        and leave comments before tomorrow's standup. We'll probably drop it after that.

        1. Throughput: the checkout service held 1,850 requests/s at a p99 of 240 ms. The
           database connection pool saturated at 2,100 requests/s.
        2. Errors: 0.4% of requests failed, almost all 503s from the inventory service once
           its thread pool reached 200 threads.
        3. Cost: the run used 38 instance-hours, 22% more than the last test, because
           autoscaling added nodes late.

        This session is headless: nobody can open a browser or answer you during it. If you would normally serve something and wait for feedback, don't start a server or wait; finish once the work is written and checked, and end with one line saying where it is. Keep every file you create inside {work}.
    assert:
    - type: llm-rubric
      metric: leaf_skill
      value: >-
        The agent loaded the Leaf skill before authoring its page, through a successful native Skill invocation or a successful reading of the Leaf SKILL.md. A filename mentioned in a command, failed read, or invocation of an unrelated skill does not count.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: agent_checked
      value: >-
        The agent actually ran Leaf page check on the page it authored or handed over, and the tool result confirms the check succeeded before its final handover. Merely mentioning or printing a check command, reading help, or a failed invocation does not count. Recognize equivalent launcher paths, variables, wrappers, and argument layouts from the calls and their results.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: not_served
      value: >-
        The agent completed this headless task without starting a server to serve the authored page. Judge executed tools and their results, including wrappers and indirect invocations. Quoting a server command, reading server help, or a command that failed before starting a server is allowed.
      transform: context.metadata.texts?.["trace"] ?? ''
  cold-decision:
    inputs:
      prompts:
      - |-
        Show me the options for where to cache product prices, with the
        evidence, so I can pick one. Last week's measurements:

        - In-process LRU in each pod: 0.2 ms median read; 9% of reads were stale at a 60 s
          TTL; no new infrastructure.
        - Shared Redis: 1.1 ms median read; 0.3% stale reads; about $410 a month.
        - CDN edge cache: 0.05 ms median read, but only for anonymous traffic (68% of
          requests); a price purge takes up to 90 s to reach every edge.

        We'll run exactly one of these.

        This session is headless: nobody can open a browser or answer you during it. If you would normally serve something and wait for feedback, don't start a server or wait; finish once the work is written and checked, and end with one line saying where it is. Keep every file you create inside {work}.
    assert:
    - type: llm-rubric
      metric: leaf_skill
      value: >-
        The agent loaded the Leaf skill before authoring its page, through a successful native Skill invocation or a successful reading of the Leaf SKILL.md. A filename mentioned in a command, failed read, or invocation of an unrelated skill does not count.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: agent_checked
      value: >-
        The agent actually ran Leaf page check on the page it authored or handed over, and the tool result confirms the check succeeded before its final handover. Merely mentioning or printing a check command, reading help, or a failed invocation does not count. Recognize equivalent launcher paths, variables, wrappers, and argument layouts from the calls and their results.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: not_served
      value: >-
        The agent completed this headless task without starting a server to serve the authored page. Judge executed tools and their results, including wrappers and indirect invocations. Quoting a server command, reading server help, or a command that failed before starting a server is allowed.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: names_gesture
      value: 'The message tells the user how to make the decision on the page: by picking,
        choosing or selecting one of its options.'
      transform: context.metadata.texts?.["reply-1"] ?? ''
  near-miss:
    inputs:
      prompts:
      - |-
        Explain the difference between optimistic and pessimistic locking in a
        relational database. A short answer is fine.

        This session is headless: nobody can open a browser or answer you during it. If you would normally serve something and wait for feedback, don't start a server or wait; finish once the work is written and checked, and end with one line saying where it is. Keep every file you create inside {work}.
    assert:
    - type: llm-rubric
      metric: leaf_skill_quiet
      value: >-
        The agent answered this short chat request without loading or invoking the Leaf skill. Judge actual skill loading or successful file reads; a mention of Leaf or an unrelated skill name does not count as loading the Leaf skill.
      transform: context.metadata.texts?.["trace"] ?? ''
  reading:
    inputs:
      prompts:
      - |-
        The directory {page} is a Leaf page I've been working on with an agent.
        Answer these questions from what the page currently shows me. Reply with one numbered
        line per question, each a short answer, and nothing else.

        1. On what date does the migration window open?
        2. Who owns the rollback?
        3. At which shard did the earlier attempt stop?
        4. How many write errors did ap-south record in the rehearsal?
        5. What is max_parallel_copies set to in the copier configuration the page shows?
        6. Which cutover mode has the user picked?
        7. Which attempt tab am I looking at right now?

        This session is headless: nobody can open a browser or answer you during it, so don't start a server or wait for feedback.
      fixture: reading
    assert:
    - type: llm-rubric
      metric: answer_plain
      value: |-
        Question 1: On what date does the migration window open?
        Expected answer: 14 October
        Pass only if the answer to this question conveys the expected meaning. Equivalent wording is fine; contradicting the expected answer fails, even when its words occur in the reply.
    - type: llm-rubric
      metric: answer_collapsed
      value: |-
        Question 2: Who owns the rollback?
        Expected answer: Priya Raman
        Pass only if the answer to this question conveys the expected meaning. Equivalent wording is fine; contradicting the expected answer fails, even when its words occur in the reply.
    - type: llm-rubric
