# From session 78ca368e. A rewording of what is now "Show the subject" drew an SVG of the Save
# button beside its captures in 2 of 3 runs and was reverted; main passed 3 of 3.
description: visual-change-uses-captures
metadata:
  purpose:
    "Show the subject, guardrail: a visible change with before/after captures shows the
    captures and draws nothing beside them."
  authoring: true
  tags:
    - draw
    - guardrail
vars:
  prompt: |
    You are writing a Leaf page for the user about a button fix. Your notes:

    Finding. The Save button's disabled state was the same grey as its enabled state, so
    users clicked it and nothing happened. The fix paints enabled Save in the accent colour
    and disabled Save at 40% opacity.

    Decision. Approve the new states, or keep the old ones.

    Captures, same viewport and state:
    - evals/visual-change-uses-captures/captures/before.png: the form with Save disabled and enabled, before (1200x700)
    - evals/visual-change-uses-captures/captures/after.png: the same, after (1200x700)

    Write the Leaf page with the finding and the decision.
assert:
  - type: javascript
    metric: pair-in-one-lf-shot
    value: file://capture-pair.cjs:pair
  - type: agent-rubric
    metric: captures-in-order
    transform: "JSON.stringify({html: output, captures: context.metadata.capture_evidence})"
    value: file://capture-order.txt
  - type: llm-rubric
    metric: draws-nothing
    value:
      Pass only if the finding draws nothing beside its captures. Fail if the page adds an
      inline SVG, an lf-diagram, or an HTML mockup of the button or form. Showing one capture
      again on its own elsewhere is fine.
variants:
  # The same captures as a visual review, whose cases live in a `visual-run` source
  # that plain page check never draws: the pair has to share a width and a focus
  # rectangle has to fall inside both images. Measures what
  # `widgets-draw-as-written` measures, here because this case holds the captures.
  review:
    metadata:
      purpose: A visual review of supplied captures draws as the agent wrote it.
      tags:
        - checks
        - widgets
    vars:
      prompt: |
        Set up a Leaf visual review (the visual-review package) of the Save button
        fix, with a case for each Save state, so I can approve each or leave feedback
        on it.

        The fix: the Save button's disabled state was the same grey as its enabled
        state, so users clicked it and nothing happened. Enabled Save is now the
        accent colour and disabled Save is at 40% opacity.

        Captures of /settings/notifications, the form with Save disabled (unchanged
        email) and enabled (edited email), taken by our capture job on 24 October at
        14:05 UTC in Chromium 141 at a 1200×700 viewport, device scale factor 1, light
        scheme, en-US, UTC. Base is revision 4f1c2a9 and the fix is 9b7e310; neither is
        deployed anywhere you can open.
        - evals/visual-change-uses-captures/captures/before.png
        - evals/visual-change-uses-captures/captures/after.png
    assert:
      - type: python
        metric: widgets-draw
        value: file://../dev/leaf_dev/draw_failures.py
  # The same captures stated at device scale 2, so a focus rectangle has to be given
  # in CSS pixels, half the image's: one read off the image's own pixels falls
  # outside it.
  review-scaled:
    metadata:
      purpose: A visual review of captures taken at device scale 2 draws as the agent wrote it.
      tags:
        - checks
        - widgets
    vars:
      prompt: |
        Set up a Leaf visual review (the visual-review package) of the Save button
        fix, with a case for each Save state, so I can approve each or leave feedback
        on it.

        The fix: the Save button's disabled state was the same grey as its enabled
        state, so users clicked it and nothing happened. Enabled Save is now the
        accent colour and disabled Save is at 40% opacity.

        Captures of /settings/notifications, the form with Save disabled (unchanged
        email) and enabled (edited email), taken by our capture job on 24 October at
        14:05 UTC in Chromium 141 at a 600×350 viewport, device scale factor 2, light
        scheme, en-US, UTC. Base is revision 4f1c2a9 and the fix is 9b7e310; neither is
        deployed anywhere you can open.
        - evals/visual-change-uses-captures/captures/before.png
        - evals/visual-change-uses-captures/captures/after.png
    assert:
      - type: python
        metric: widgets-draw
        value: file://../dev/leaf_dev/draw_failures.py
