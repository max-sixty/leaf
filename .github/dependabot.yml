version: 2

# The uv entry watches the repository's Python lock. Its runtime packages are what
# an install of leaf actually resolves — a bump there changes what every harness
# runs — and the dev group is the suite's; the lock records both.
#
# The npm ecosystem also supports pnpm: it watches the root `package.json` and
# `pnpm-lock.yaml`, which name the browser, Worker and eval dependencies. The
# dependency-bundles workflow rebuilds every committed browser bundle (`pnpm run
# build:browser`) and updates the same PR. The compilers, esbuild
# and Rolldown, are left out: upgrade them when a build needs it rather than
# regenerating the payload on every compiler release.
#
# Grouped so each ecosystem opens one PR a week rather than one per dependency;
# on a repo this size the review cost of a group is the same as a single bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # These names resolve to this workspace, not packages on PyPI. In particular,
    # trying to upgrade the root leaf package to PyPI's leaf breaks uv lock.
    ignore:
      - dependency-name: leaf
      - dependency-name: leaf-dev
      - dependency-name: leaf-website
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: esbuild
      - dependency-name: rolldown
    groups:
      dependencies:
        patterns: ["*"]
