name: ci

# Pull requests and main run the small landing gate. Pull requests also run the
# website gate; relevant pushes to main run that gate in publish-site before deploy.
# A green push to main, the daily schedule, and a manual dispatch each run the
# complete browser surface.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

# Only a pull request cancels its own earlier run. A push to main keeps its run: a red
# branch is judged against the base SHA's result, a cancellation reaches tend-ci-fix as
# something to fix, and with `nightly` in the run the next merge would end a complete
# suite partway through. Nothing outside a pull request shares a group, so the only
# queue here is the `nightly` job's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires this check by name.
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright, and
      # the phone contract uses its WebKit, the engine iPhone browsers run on.
      - name: Install Chromium headless shell and WebKit
        run: uv run playwright install --with-deps chromium webkit --only-shell

      - name: Install browser-build dependencies
        run: npm ci

      - name: 🧪 Core and browser-smoke tests
        run: uv run pytest tests -v --junitxml=.tmp/test-results/everyday.xml

      - name: Check committed browser framework
        run: npm run check:browser && npm run test:browser

      - name: Install website dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
        working-directory: worker

      - name: Build website
        if: github.event_name == 'pull_request'
        run: uv run scripts/site.py

      - name: 🧪 Website worker tests
        if: github.event_name == 'pull_request'
        run: |
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker

      - name: Measure the bundled release in Chrome
        if: github.event_name == 'pull_request'
        run: scripts/verify-site-local.sh

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-everyday-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/everyday.xml
          if-no-files-found: ignore
          retention-days: 30

  # The complete suite, including the nightly-marked modules that broad discovery
  # skips and the everyday `test` job therefore never reaches. A push to main runs it,
  # so a regression in one of them surfaces in the hour or two after it lands rather
  # than at the next morning's cron, and the failed run reaches tend-ci-fix.
  nightly:
    needs: [lint, test]
    # The schedule and a dispatch skip `lint` and `test`, and the default `success()`
    # gate would skip this job along with them, so read their results directly. The
    # guard names the two results that may proceed rather than excluding `failure`,
    # because an everyday gate that is cancelled rather than run concludes neither, and
    # a wedged one would otherwise send an hour of complete suite after it.
    # A red everyday gate skips this job too: it already names what to fix.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    concurrency:
      # One automatic suite at a time: it holds a runner for over an hour, and
      # GitHub's concurrency pool is per-account, shared with the other repos here. A
      # running suite is never cancelled, because that hour would be lost; a newer
      # commit replaces the pending entry instead, under GitHub's default
      # `queue: single`, so a busy main gets the suite on its tip rather than working
      # through commits already superseded. Superseded pending entries are recorded as
      # cancelled runs, and #296 accepted that cost for the same reason.
      #
      # A dispatch keeps a slot per ref, as it had before this job took a group of its
      # own. It is the control a session runs against a base SHA, and two sessions
      # judging two branches need both answers; behind main's queue either one would
      # be replaced by the next merge before it ever started.
      group: ${{ github.workflow }}-nightly-${{ github.event_name == 'workflow_dispatch' && github.ref || 'automatic' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install browser-build dependencies
        run: npm ci

      - name: Install Chromium headless shell and WebKit
        run: uv run playwright install --with-deps chromium webkit --only-shell

      - name: 🧪 Complete test suite
        run: uv run pytest tests --run-nightly -v --junitxml=.tmp/test-results/nightly.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/nightly.xml
          if-no-files-found: ignore
          retention-days: 30
