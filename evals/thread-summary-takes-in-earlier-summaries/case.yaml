        [summary sum-one, which you wrote earlier, covering cache-two through cache-six, label "Earlier discussion"]:
          "The ten-minute TTL was a guess from the feed cadence. Measured from the quote
          timestamp, the worst stale interval was fourteen minutes, so you chose five
          minutes, and the document records the measurement and its origin."
        cache-seven (user): "The status labels also need changing: warm sounds like a temperature."
        cache-eight (agent): "Changed them to Fresh and Expired, and updated the document."
        cache-nine (user): "Those labels work. Overnight, retries should continue until morning without paging anyone."
        cache-ten (agent): "Retries now continue until 07:00 and page no one. The document says so."
        cache-eleven (user): "Good. Now the dashboard: what should it show while the feed is down?"
        cache-twelve (agent): "A banner with the time the outage started, above the quote table."
        cache-thirteen (user, just delivered): "This thread has got long, so fold the settled part. Then: would that banner push the quote table below the fold on a laptop?"

