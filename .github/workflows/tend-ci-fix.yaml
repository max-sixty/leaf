name: tend-ci-fix
on:
  workflow_run:
    workflows: ["ci", "publish-site"]
    types: [completed]
    branches: ["main"]

jobs:
  fix-ci:
    if: github.repository_owner == 'max-sixty' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen

      - uses: max-sixty/tend/claude@0.1.22
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: leaf-agent
          model: opus
          sandbox_setup: |
            uv run playwright install chromium --only-shell
            uv run python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()"
          prompt: |
            /tend-ci-runner:ci-fix ${{ github.event.workflow_run.id }}
            - Run URL: ${{ github.event.workflow_run.html_url }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Commit message: ${{ github.event.workflow_run.head_commit.message }}
