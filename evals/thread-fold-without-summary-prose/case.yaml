# Added with optional summary labels and explicit empty summary text. This measures
# command selection from the shipped thread instructions, not automatic progress
# lifecycles or execution of the returned command.
# Against dd9304c34, each harness scored 0/1 by using the label as summary prose;
# the candidate scored 1/1 on each harness with --label and explicit empty --text.
# Reworded by #2329 (label "Previous progress messages", the reference's own
# example); at 3fe3eb0af it passed 1/1 on Claude Code.
description: thread-fold-without-summary-prose
metadata:
  purpose: Fold earlier progress messages under a requested label without summary prose, preserving their originals.
  tags:
  - threads
vars:
  prompt: |
    You own a live Leaf page at ~/.local/state/leaf/pages/layout-review.
    Thread layout-thread already contains these messages, in order:

    user-request (user): "Stop the reply box jumping when I switch drafts."
    progress-one (agent): "I'm checking what changes the reply box's height."
    progress-two (agent): "The label row changes height. I'm testing a fixed row."
    final-answer (agent): "The label row keeps its height now. Desktop and phone checked."

    Fold only the two progress messages behind a disclosure labeled "Previous
    progress messages". Do not add retrospective summary prose. Keep both originals
    retrievable and leave the user's request and final answer visible.

    Nothing here can execute writes. Read the relevant Leaf instructions, then
    reply with the exact one-line CLI command you would run.
assert:
- type: llm-rubric
  metric: folds-original-messages-without-prose
  value: |
    Pass only if the command is one `leaf thread summarize` on the layout-review
    page covering exactly the two progress messages (`--from progress-one` and
    `--through progress-two`), with `--label "Previous progress messages"` and an
    explicitly empty `--text` (`''` or `""`), so the originals fold behind the label
    with no summary prose. Any spelling of the launcher passes. Fail if the range
    takes in user-request or final-answer, or the label is given as summary text.
