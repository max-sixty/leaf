# The widget keyboard API playground used bare <pre><code> and packed several
# command fields onto each line. This case exercises a revision of that code display.
# The plain diagnostic output is the guardrail against treating every preformatted
# block as code.
description: source-code-readable
metadata:
  purpose:
    Source snippets declare their language and keep the code structure readable; literal output
    remains literal.
  tags:
    - authoring
    - code
vars:
  prompt: |
    Revise this section in our Leaf keyboard API design playground. Explain that each
    action is declared once, and that `commands(deck, decisions)` exposes the scope
    while keeping its action identity. Keep the explanation short. Include the code
    example and the diagnostic output below, and keep the code's behavior unchanged.

    <section id="api-design"><h2>One declared command, several places to use it</h2>
    <pre><code>const decisions = commandScope("In a classifier", [
      { id: "classify.pass", keys: ["ArrowLeft", "1"], control: pass,
        decision: "Pass", does: "Pass the active card",
        line: "pass", when: canClassify, run: () =&gt; pass.click() },
      { id: "classify.keep", keys: ["ArrowRight", "2"], control: keep,
        decision: "Keep", does: "Keep the active card",
        line: "keep", when: canClassify, run: () =&gt; keep.click() },
    ]);
    commands(deck, decisions);</code></pre>
    <p>Diagnostic output:</p>
    <pre><code>Scope: In a classifier
    Active commands: 2
    Result: ready</code></pre>
    </section>

    The page directory is not reachable from here, so reply with the revised HTML
    section rather than writing a file.
assert:
  - type: llm-rubric
    metric: readable-source
    value: |
      The JavaScript source is displayed in a syntax-highlighted Leaf code block:
      a pre/code with class="language-javascript", natively or inside an lf-code.
      Object fields and closing braces are broken onto
      consistently indented lines so each action's fields can be read individually.
      All the original command fields and behavior remain in the snippet. Fail if
      source stays uncolored or keeps several distinct object fields crammed onto
      each line. The diagnostic output remains uncolored and preserves its lines
      and exact values; it must not be mistaken for source code or rewritten.

# Text-edit reconstruction: require the binding that supplies line controls.
variants:
  current-work:
    metadata:
      purpose: A current-work update offers refreshable patch evidence without transcribing it.
    vars:
      prompt: |
        Prepare a short Leaf update on our current branch's work. The branch has
        three commits and uncommitted edits across twelve text files. Checks pass.
        The change consolidates request cancellation under one owner; explain
        that behavior and give Max a way to inspect the implementation while we
        continue revising it. Worktrunk is available. The page directory and
        repository are unavailable in this read-only task. Reply with the HTML
        section and the shell commands you would run to supply and later refresh
        its evidence. Do not invent source contents.
    assert:
      - type: llm-rubric
        metric: refreshable-patch
        value: |
          The section briefly explains the behavior change and includes a
          source-bound lf-diff. Commands select the whole branch's work including
          uncommitted edits, using wt step diff or an equivalent comparison, and
          supply the patch to leaf data set for the widget's source, either as a
          JSON string (for example via jq -Rs .) or through the optional
          leaf package run diff patch_manifest.py file-manifest producer.
          Refresh repeats capture into the same source id. Fail if the answer invents or transcribes patch contents,
          captures only the latest commit or only uncommitted edits, or requires
          rewriting the page's HTML for each refresh. Launcher spelling may be
          leaf or a resolved launcher path.
  text-edit:
    metadata:
      purpose:
        A report reviewing a wording change lets the reader see and comment on the exact
        edit.
    vars:
      prompt: |
        You are finishing a Leaf report about whether our test guidance should change. The session diagnosis, comparison trials and checks are complete. Current guidance reproduced the dense scroll grid in 0/2 successful decisions; the revised guidance chose representative states in 2/2. The source code is changed locally. Keep the explanation short and give the user the completed repair section of the report.

        The draft section is:

        <section id="repair"><h2>Added work must buy added coverage</h2><p>The existing rule asks whether an important contract warrants an expensive test. That does not resolve how much repeated evidence of the same contract to retain. The revised paragraph keeps the browser-boundary rule and asks which additional failure the additional work exposes.</p><details><summary>Current paragraph</summary><pre id="current-paragraph">Prove each contract at the lowest boundary that preserves it, and keep a browser test
        only where it proves boundaries working together. Every run of the suite pays for each
        test&#x27;s compute, so weigh that cost against how much the protected behavior matters
        before adding or keeping an expensive test: a long browser journey, a sweep across
        pages or widths, or a wide parametrization needs a contract important enough to pay
        for it. When a high-level browser test is slow, or fails on timing or geometry outside
        its contract, repair its arrangement or move its contract to the lower boundary.
        </pre></details><details open><summary>Revised paragraph — applied locally</summary><pre id="candidate-paragraph">Prove each contract at the lowest boundary that preserves it, and keep a browser test
        only where it proves boundaries working together. Before adding cases or steps, choose
        the smallest set that exposes distinct plausible failures beyond existing coverage.
        Retain a broad sweep only when its extra samples catch a failure that representative
        states or transitions miss; an investigation&#x27;s sampling grid is not itself a regression
        requirement. Every run pays for the test&#x27;s compute, so weigh the additional cost against
        the additional coverage. When a high-level browser test is slow, or fails on timing or
        geometry outside its contract, repair its arrangement or move its contract to the lower
        boundary.
        </pre></details><p>The local edit replaces one paragraph in tests/AGENTS.md.</p></section>

        The page directory is unavailable here. Reply with the final section HTML and any page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: exact-edit
        value:
          The report presents the change to tests/AGENTS.md as an exact unified patch through
          a source-bound lf-diff with commands supplying the patch. It captures the real Git diff
          for that file or supplies the exact removed and added text. A short explanation
          accompanies the evidence. Fail if it only displays two full paragraphs, invents a different
          edit, or adds an approval request not in the task.

  # Tool-output reconstruction (#6323): a page whose earlier samples were plain
  # <pre class="sample"> blocks, and a report quoting a tool's JSON rows on one line,
  # cut down with "…". Authors copied the plain samples' class, named no language and
  # packed several fields onto a line. The plain samples are what pulled them. A
  # reader reads each of these two objects field by field, so its fields go on lines
  # of their own; records-compared is the sibling where they don't.
  tool-output-json:
    metadata:
      purpose:
        JSON a tool returned reads as coloured code whose fields the reader can pick out,
        even where the page's other samples are plain text and the report quoted it
        packed.
    vars:
      prompt: |
        You are revising a Leaf page. Its lookup section holds a placeholder,
        `<p id="lookup-status">LOOKUP_STATUS</p>`, for work that has now reported; the
        report is below. Replace the placeholder with the section's status for the
        page's reader: what the change makes of a ticket in the tool's results, what the
        checks measured, and the one real row before and after.

        The page's style element and its other section, as they stand:

        ```html
        <style>
          pre.sample {
            font-size: 0.82em;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }
        </style>

        <section id="notice">
          <h2>The notice sent when a ticket changes</h2>
          <p id="notice-today">
            Today the agent is sent the change as one tagged line of text. It names who made the
            change and the new status, and says nothing of why the status changed.
          </p>
          <pre class="sample" id="notice-today-sample"><code>&lt;ticket-update id="T-48213" by="agent:refunds" at="2026-03-02T16:04:10Z" status="waiting-on-customer"&gt;
        Refund issued; asked the customer to confirm the amount.
        &lt;/ticket-update&gt;</code></pre>
          <p id="notice-proposed">
            The proposal adds the reason code the ticketing system already records, so the agent
            can tell a refund from a request for more detail without reading the note.
          </p>
          <pre class="sample" id="notice-proposed-sample"><code>&lt;ticket-update id="T-48213" by="agent:refunds" at="2026-03-02T16:04:10Z" status="waiting-on-customer" reason="refund-issued"&gt;
        Refund issued; asked the customer to confirm the amount.
        &lt;/ticket-update&gt;</code></pre>
        </section>
        ```

        The report:

        ````markdown
        Pushed: branch `lookup-whole-ticket`.

        **What changed**
        `lookup` now returns each ticket as the ticketing API returned it, plus `open_days`. It used to keep five fields of it, chosen by hand.

        **One real row**
        - Before: `{"id":"T-48213","customer":"cust_9f31…","status":"waiting-on-customer","updated":"2026-03-02T16:04:10Z","summary":"Refund for order 77120, charged twice… (212 chars)"}`
        - After: `{"id":…,"customer":{"id":"cust_9f31…","name":"Priya Nair","email":"priya@…","tier":"plus","locale":"en-GB"},"status":…,"updated":…,"summary":…,"assignee":{"id":"agent:refunds","kind":"AGENT"},"tags":["refund","order-77120"],"links":[{"type":"ORDER",…,"order":{"id":"77120","total":{"amount":"48.90","currency":"GBP"}}}],"channel":"EMAIL","open_days":3}`

        **Checks**
        - Asked which order a ticket was about, the agent named it in 0 of 3 trials before and 3 of 3 after.
        - A lookup of 50 tickets is 1.9 times the old size.
        ````

        The page directory is not reachable from here, so reply with the revised lookup
        section and any change to the style element.
    assert:
      - type: llm-rubric
        metric: json-reads-as-code
        value: |
          The before and after rows each appear in a pre/code with class="language-json"
          (natively or inside an lf-code), keeping every given value and each "…"
          exactly, and laid out so a reader can pick out each field: every top-level
          field starts a line of its own, and nested objects are indented. A nested
          object of two short scalar fields, such as the assignee's, may stay on one
          line. Fail if either row has no language class, uses the page's plain "sample"
          class without a language, puts two top-level fields on one line, or keeps a
          larger nested object, such as the customer, on one line. The existing notice
          samples may stay as they are.
  # Sibling of tool-output-json where the reader compares records rather than reading
  # one: five rows a tool returned with the same fields, where the bug is the type of
  # one field in some rows. Spread one field per line, the rows stand as five blocks
  # the reader has to cross-check; one row per line puts the field in a column.
  records-compared:
    metadata:
      purpose:
        JSON records the reader compares field by field stand one record per line, so
        each field reads down a column.
    vars:
      prompt: |
        You are writing a Leaf page for the user about a bug in our support agent's
        `lookup` tool: some rows carry `open_days` as a string rather than a number, so
        the agent's "older than a week" filter skips them. Tickets imported from the
        chat and phone systems store it as text; you haven't fixed that yet. Write the
        page's section that shows the bug in the tool's own output.

        Your subagent's report quoted the tool's result for `tag:refund`, as the tool
        returned it:

        ```
        [{"id":"T-48213","status":"waiting-on-customer","channel":"EMAIL","open_days":3},{"id":"T-48217","status":"open","channel":"CHAT","open_days":"1"},{"id":"T-48220","status":"open","channel":"EMAIL","open_days":12},{"id":"T-48231","status":"solved","channel":"PHONE","open_days":"0"},{"id":"T-48236","status":"open","channel":"CHAT","open_days":"9"}]
        ```

        The page directory is not reachable from here, so reply with the section HTML.
    assert:
      - type: llm-rubric
        metric: records-line-up
        value: |
          All five rows appear with every value exact, including the quotes that make
          three of the `open_days` values strings. Pass only if the reader can compare
          `open_days` down the rows: each row stands on one line of its own, its fields
          in the same order as the other rows' and lined up with them in columns, in a
          code block as a JSON array or one object per line; or the rows form a table
          with a column per field that keeps each value as the tool wrote it, quotes
          included. Fail if any row is spread over several lines, such as one field per
          line, if the rows' fields don't line up, or if a value is changed, dropped or
          shown without the quotes that mark it a string.
  # Markdown excerpt reconstruction: a session's page principles-survey, whose "Two
  # rules before and after" section showed each rule's Markdown in <pre><code>. The
  # user asked why it wasn't rendered Markdown. Cold, authors can render the rules,
  # so the failure may need the session's own context; it converts them to HTML by
  # hand, and page-authoring.md asks for the preview.
  markdown-excerpt:
    metadata:
      purpose:
        Prose quoted from a Markdown file reads rendered, through the page's Markdown
        rendering rather than a hand conversion, with its exact words kept.
    vars:
      prompt: |
        You are writing a Leaf page that surveys Leaf's interface principles. Write its
        section "Two rules before and after": the two rules in `browser/AGENTS.md` that
        had been patched most, as each read before this branch rewrote the section and
        as it reads now, side by side, so the user can judge whether the rewrite kept
        what each rule needs. Give each version's word count.

        "Controls stay where the user aims", before (178 words):

        ```markdown
        **The page holds still under the user's aim.** A state change may repaint any box, but must not move the controls next to the gesture that caused it. A scroll the gesture makes may not carry the control it was made on either, except to bring it whole into a scroller that showed only part of it, or where the gesture takes the user somewhere and says so: a command as a walk or Go-to does (`travels`, `runtime/keyboard/bindings.js`), or a press by the history entry it adds, as a link or a root tab set's switch does. Without a gesture, a box may grow or shrink into free room, but reading content and controls stay put. A change the user asked for may reflow the content it replaces, with motion the eye can follow. A reveal on hover, focus or a key never changes the size or position of its ancestors or siblings, and typing may grow a field but never moves it. Check: `tests/shift_watch.js`, run on every browser test outside a module marked `shifts_unsurveyed` (`tests/AGENTS.md`, "Browser errors").
        ```

        Now (126 words):

        ```markdown
        **Controls stay where the user aims.** A state change may repaint any box, but must not move the controls next to the gesture that caused it, and a scroll the gesture makes carries that control only to bring it whole into a scroller that showed part of it, or where the gesture says it takes the user somewhere. Without a gesture, a box may grow or shrink into free room, but reading content and controls stay put; a change the user asked for may reflow what it replaces, with motion the eye can follow. A reveal on hover, focus or a key never moves its ancestors or siblings, and typing may grow a field but never moves it. Check: `tests/shift_watch.js`, whose header lists what it credits.
        ```

        "News never moves what the reader is reading", before (98 words):

        ```markdown
        **News never moves what the reader is reading.** News from the server grows above the screen, where scroll anchoring absorbs it, or below it. Anywhere else it waits behind a fixed-size control until the reader goes to it, and an editor in use stays still. Check: `test_news_just_after_a_press_moves_nothing`. Owners: `thread/held-news.js`, `newsMoves` in `thread/thread-card.js`, `threadsListing` in `floating-panel.js` for the rows of Threads, and `reading-continuity.js` for a hidden tab. The user chose one exception: the answer they wait for in the floating panel's thread grows that view upward while its controls stay put (`fitAnswer` in `floating-panel.js`, credited by `appendGrowth` in `tests/shift_watch.js`).
        ```

        Now (72 words):

        ```markdown
        **News never moves what the reader is reading.** News from the server grows above the screen, where scroll anchoring absorbs it, or below it; anywhere else it waits behind a fixed-size control until the reader goes to it, and an editor in use stays still. An exception the user chose stays with its owner, as `fitAnswer` in `floating-panel.js` does. Check: `test_news_just_after_a_press_moves_nothing`. Owners: `thread/held-news.js`, and `threadsListing` in `floating-panel.js` for the rows of Threads.
        ```

        The page directory is unavailable here. Reply with the section HTML and any
        page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: reads-rendered
        value: |
          Each of the four rule versions appears formatted, its bold opening sentence in
          bold and its backticked names as inline code, with every word of the given
          Markdown kept. Fail if any version is visible only as Markdown source, with
          `**` or backtick characters shown as text, as in a pre, pre/code, lf-code, an
          lf-text-document without preview="markdown", or an lf-diff. Fail if a version
          is shortened, paraphrased or reworded.
      - type: llm-rubric
        metric: page-renders-markdown
        value: |
          Each of the four versions is an lf-text-document with preview="markdown"
          holding that version's exact Markdown, either HTML-escaped in its `<pre>` or
          through a data source of its own that the commands supply with `leaf data set`.
          Fail if any version is HTML the author converted from the Markdown, such as a
          blockquote holding strong and code elements, or is shown as source.
  # Guardrail for markdown-excerpt: where Markdown syntax is the subject, the reader
  # sees the characters typed.
  markdown-syntax:
    metadata:
      purpose: Markdown whose syntax is the subject stays visible as the characters typed.
    vars:
      prompt: |
        You are writing a Leaf page about the Markdown in Leaf's message composer. A
        user typed this reply, meaning a sign-off followed by a horizontal rule:

        ```markdown
        Thanks
        ---
        ```

        It rendered as a heading reading "Thanks", because CommonMark reads a line of
        dashes under a line of text as that text's heading underline (a setext
        heading). A blank line between the two lines would have given the rule. Write
        the section that explains this to the user.

        The page directory is unavailable here. Reply with the section HTML and any
        page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: syntax-stays-source
        value: |
          The reply the user typed appears as its literal characters, `Thanks` on one
          line and `---` on the next, in a block the reader sees without choosing a tab,
          such as pre/code or lf-code; the version with the blank line, if shown, is
          literal too. Showing how either renders beside the source is fine. Fail if the
          typed Markdown appears only rendered, or only inside an lf-text-document whose
          preview tab opens first.
  # Prompt reconstruction: a session's page sparkjoy-size-in-code showed the prompt a
  # plugin sends a model, three paragraphs and a ```json fence, in a plain <pre>, every
  # line wrapping behind a mark and the JSON uncoloured. The user wanted it read as
  # Markdown with the JSON coloured. page-authoring.md then named "a message as an
  # agent receives it" among the texts kept literal.
  prompt-with-schema:
    metadata:
      purpose:
        A prompt written in Markdown reads rendered, its fenced JSON coloured, with its
        exact text kept.
    vars:
      prompt: |
        You are writing a Leaf page that proposes a change to sparkjoy, a Claude Code
        plugin that asks a model whether to compact the session when a turn ends.
        Write the page's section "The question sparkjoy asks": a sentence on when the
        plugin sends it, then the prompt the model receives, given below exactly as
        the plugin sends it, so the user can judge its wording and the schema of the
        answer it asks for.

        <prompt>
        Estimate what compacting this session now would cost the work ahead. This request comes from the sparkjoy plugin, not from the user, and a program reads your answer.

        Your turn just ended. A compaction would replace the transcript with a summary. A summary drops detail: exact output, what was tried and failed, what the user objected to and why, the state of a design or fix still taking shape. Work that iterates with the user on something just shown, or takes up a half-done fix or design, needs that detail: after a compaction it spends requests re-reading files and re-running commands, and redoes what goes wrong without the rest. Work that only reports a result, or starts something new, needs no more than a summary, so the work's next natural break, such as a change landed or a question answered, is where a compaction loses least.

        Answer with nothing but one JSON object that matches this schema, filling its fields in the order listed:

        ```json
        {
          "type": "object",
          "properties": {
            "next": {"type": "string", "description": "what most likely comes next, in a few words"},
            "requests_to_break": {"type": "integer", "description": "how many requests from now the work will most likely reach its next natural break; 0 if it is at one now"},
            "extra_wasted_requests": {"type": "integer", "description": "how many more requests a compaction now would waste than one at that break would: re-reading, re-running, and redoing what goes wrong without the detail it drops; 0 if the work is at a break now"},
            "reason": {"type": "string", "description": "one short line saying why"}
          },
          "required": ["next", "requests_to_break", "extra_wasted_requests", "reason"],
          "additionalProperties": false
        }
        ```
        </prompt>

        The page is in the reading theme. The page directory is unavailable here.
        Reply with the section HTML and any page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: prompt-reads-rendered
        value: |
          The prompt is shown through Leaf's Markdown rendering of its exact text: an
          lf-text-document with preview="markdown" holding the whole prompt, HTML-escaped
          in its `<pre>` or through a data source the commands supply, so its three
          paragraphs read as prose and its ```json fence as a JSON code block. Every
          character of the prompt is kept, the fence and its JSON included. Fail if the
          prompt is shown only as source, such as in a pre, a pre/code with or without a
          language class, an lf-code, or an lf-text-document without
          preview="markdown"; if the author converted it to HTML by hand; or if any of
          its words or JSON are changed or dropped.
  # Guardrail for prompt-with-schema: a Markdown preview draws a prompt's own tags as
  # HTML, so `<instructions>` and `<answer>` vanish and the Markdown inside them shows
  # as source. A prompt structured by its tags shows its source.
  prompt-with-tags:
    metadata:
      purpose: A prompt whose tags carry its structure keeps the tags visible.
    vars:
      prompt: |
        You are writing a Leaf page that reviews the judge our eval harness uses to
        grade a support agent's answers. Write the page's section "What the judge is
        asked": a sentence on when the harness sends it, then the prompt the judge
        receives, given below exactly as the harness sends it with one real answer
        filled in, so the user can judge its wording.

        <prompt>
        Grade the support agent's answer below against the rubric. Reply with nothing but one JSON object.

        <rubric>
        Pass only if the answer names the order the ticket is about and says what the customer should do next. Fail an answer that asks the customer for something the ticket already holds.
        </rubric>

        <ticket>
        Customer cust_9f31 was charged twice for order 77120 and asked for a refund of one charge.
        </ticket>

        <answer>
        I've refunded the duplicate charge on **order 77120**. You'll see it on your statement within 5 business days; there's nothing else you need to do.
        </answer>

        Use this format:

        ```json
        {"pass": true, "reason": "one short line saying why"}
        ```
        </prompt>

        The page is in the reading theme. The page directory is unavailable here.
        Reply with the section HTML and any page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: tags-stay-visible
        value: |
          The prompt appears exactly, with its `<rubric>`, `<ticket>` and `<answer>`
          tags visible as text where the reader first sees it, HTML-escaped in the
          markup. Fail if the block that shows the prompt opens on a rendered Markdown
          preview, as an lf-text-document with preview="markdown" does, since that draws
          the tags as HTML and hides them; if the author converted the prompt to HTML
          by hand or dropped its tags; or if any of its words change.
  # A page-owned stepper stands over the source it walks, and the user asks which line
  # a step is on. An author who misses the excerpt's input scripts the excerpt from
  # the stepper's module, which ties the two widgets to each other.
  lines-follow-a-widget:
    metadata:
      purpose: Source that follows another widget's step binds to that widget's declared
        output, which holds the file's own line numbers.
      page: []
    vars:
      prompt: |
        You are revising a Leaf page that teaches binary search. The reader steps
        through one search with the page's own widget, lf-search-steps, and reads the
        function's source under it. The user commented on the section: "As I step
        through, I can't tell which line of search() the step is on. Can the source
        show it as I go?"

        The section as it stands, quoting lines 12-21 of search.py:

        ```html
        <section id="walk">
          <h2>One search, step by step</h2>
          <lf-search-steps id="search-walk"></lf-search-steps>
          <lf-code id="search-source" lines="12-21"><pre><code class="language-python">def search(items, target):
            lo, hi = 0, len(items)
            while lo &lt; hi:
                mid = (lo + hi) // 2
                if items[mid] &lt; target:
                    lo = mid + 1
                else:
                    hi = mid
            found = lo &lt; len(items) and items[lo] == target
            return lo if found else None
        </code></pre></lf-code>
        </section>
        ```

        The widget's entry in `page/registry.json`:

        ```json
        {
          "lf-search-steps": {
            "description": "One binary search over a fixed list, which the reader steps through.",
            "attributes": {
              "type": "object",
              "properties": { "id": { "type": "string" } },
              "required": ["id"],
              "additionalProperties": false
            },
            "content": "empty"
          }
        }
        ```

        Its module, `page/widgets/lf-search-steps.js`:

        ```js
        // <lf-search-steps>: one binary search over a fixed list, a step at a time.
        import { html } from "/vendor/lit.js";
        import { LeafElement } from "/runtime/lib/leaf-element.js";

        const ITEMS = [3, 8, 13, 21, 34, 55, 89];
        // Searching for 34. Each step leaves the bounds [lo, hi) it names.
        const STEPS = [
          { lo: 0, hi: 7, says: "Start with the whole list." },
          { lo: 0, hi: 7, mid: 3, says: "The middle item is 21." },
          { lo: 4, hi: 7, says: "21 is below 34, so the left half goes." },
          { lo: 4, hi: 7, mid: 5, says: "The middle item is 55." },
          { lo: 4, hi: 5, says: "55 is not below 34, so the right half goes." },
          { lo: 4, hi: 5, mid: 4, says: "The middle item is 34." },
          { lo: 4, hi: 4, says: "34 is not below 34, so the bounds meet at index 4." },
          { lo: 4, hi: 4, says: "Index 4 holds 34: found." },
        ];

        customElements.define(
          "lf-search-steps",
          class extends LeafElement {
            static properties = { step: { state: true } };

            setup() {
              this.step = 0;
            }

            go(by) {
              this.step = Math.min(STEPS.length - 1, Math.max(0, this.step + by));
            }

            render() {
              const { lo, hi, mid, says } = STEPS[this.step];
              const place = (index) =>
                index === mid ? "mid" : index >= lo && index < hi ? "in" : "out";
              return html`
                <ol class="items">
                  ${ITEMS.map((item, index) => html`<li class=${place(index)}>${item}</li>`)}
                </ol>
                <p>${says}</p>
                <button type="button" ?disabled=${this.step === 0} @click=${() => this.go(-1)}>
                  Back
                </button>
                <button
                  type="button"
                  ?disabled=${this.step === STEPS.length - 1}
                  @click=${() => this.go(1)}
                >
                  Next
                </button>
              `;
            }
          },
        );
        ```

