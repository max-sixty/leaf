# Pins are overlays. The failure is padding the heading's end to clear the pin; the
# page needs no CSS for it.
description: pin-takes-no-page-room
metadata:
  purpose:
    "The rail and the margin: a pin is an overlay the user hides with `g H` or More's Hide annotations,
    so the page's CSS leaves no room for one, such as padding at the end of a heading."
  tags:
    - theme
vars:
  prompt: |
    You are revising a Leaf page for the user. It is a `layout-column` page whose main
    content is a question section:

    ```html
    <lf-group id="rollout" label="Which region should take the first rollout of the new billing service?">
      <h2 id="rollout-h">Which region should take the first rollout of the new billing service?</h2>
      <lf-options id="region">...</lf-options>
    </lf-group>
    ```

    The page's own `<style>` is empty.

    The user commented from their phone: "The little round marker sits on top of the
    end of the question, so I can't read the last word."

    The page directory is not reachable from here, so reply with the complete `<style>`
    element the page needs, or say that it needs none, and the reply you would give the
    user.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the CSS and the reply to the user. Fail if any rule makes room for the marker
      in the page's layout: padding, margin, a narrower width or max-width, text-indent,
      or a grid or flex track on the section, its heading, or `main`, placed at the end or
      right of the heading or block so the marker no longer overlaps the words. Fail too
      if a rule moves, hides, or restyles Leaf's marker itself. Pass if the page needs no
      such room: the reply tells the user how to hide the markers to read what is under
      them by a route their phone has, Hide annotations under Annotations in the leaf's
      menu (`g H` alone fails, since the user has no keyboard), and any CSS left
      is unrelated to the marker. Rewording the heading is allowed but not required.
