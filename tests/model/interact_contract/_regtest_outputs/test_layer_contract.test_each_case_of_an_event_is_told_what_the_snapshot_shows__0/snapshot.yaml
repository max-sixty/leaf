        on the user's pick. Judge from each one's `text` whether the user's words
        answer it. Once you have answered, if their words answer every one and nothing
        else in the thread waits on them, resolve the thread: `leaf thread resolve
        <page> <message>`, naming any message in it. Otherwise leave it open.
