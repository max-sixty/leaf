        text: Dana confirmed at 15:52 that 7.2's 3 s connect timeout is the cause. Mark this
          follow-up done and say so where the page explains the cause.
        applied: '15:52'
      decision:
        task: 'Decide eu-west: roll it back to 4.11 and ship 4.12.1 with the old timeout.'
        typed: Roll eu-west back to 4.11 and ship 4.12.1 with the old timeout.
        chosen:
          eu-west: roll back to 4.11
          next release: 4.12.1 with the old timeout
        values:
          eu-west:
          - resume to 100%
          - hold at 50%
          - roll back to 4.11
          next release:
          - 4.12.1 with the old timeout
          - none
      reveal: ''
    assert:
    - *phase_1_quality
    - *phase_2_quality
    - *phase_3_quality
    - *phase_4_quality
    - *phase_2_preference
    - *comment_answered
