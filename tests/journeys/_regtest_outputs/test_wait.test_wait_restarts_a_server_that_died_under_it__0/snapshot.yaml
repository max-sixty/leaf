# A wait revives its server, notes the recovery, and delivers input.
# The URL's dynamic port and access token are represented by <served-url>.

exit: 0

stderr:
  - code: server-restarted
    severity: advice
    values:
      page: <page>
      url: <served-url>
    text: >-
      <page>: server had died; restarted at <served-url>
