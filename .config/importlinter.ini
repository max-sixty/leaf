# import-linter (https://import-linter.readthedocs.io/), run by the pre-commit hook
# of that name.
#
# `src/leaf`'s modules stand in layer packages, listed below from the top. A module
# imports only from its own package and the packages below it (`layers`). Inside each
# package, and inside each of its subpackages, the modules import each other without a
# cycle (`acyclic`).
# Each package's `__init__.py` says what it holds. The packages group modules by
# concern, ordered so that the imports between them point down, and `exhaustive` fails
# a module at the top of `src/leaf` that no layer names.
# Imports under `TYPE_CHECKING` load nothing and don't count. An import inside a
# function counts as one at the top does, so deferring an import ends no cycle.
#
# When a contract breaks:
#
# - On a new module, put it in the package whose concern it serves. If its imports
#   point up from there, what it needs belongs lower, or the module belongs higher.
# - On an import that points up, make it point down: move what it needs to the module
#   that owns its fact, below both, or pass the value or callback in. Where a module's
#   package is wrong, move the module; the check then says whether the new place holds.
# - On a cycle inside a package, look for a function that sits beside its first user
#   rather than its owner, or a module that holds two concerns, and move or split it as
#   for an import that points up. The imports `acyclic` names as the cycle's breakers
#   are where to start looking, not necessarily the ones to cut.
#
# Neither contract lists exceptions: a backward import or a cycle is fixed rather than
# allowed.

[importlinter]
root_package = leaf
exclude_type_checking_imports = True

[importlinter:contract:layers]
name = src/leaf packages import only themselves and packages below them (.config/importlinter.ini)
type = layers
containers = leaf
exhaustive = true
layers =
    __main__
    commands
    pages
    serving
    agents
    records
    log
    source
    base

[importlinter:contract:acyclic]
name = the modules inside each src/leaf package import each other without a cycle (.config/importlinter.ini)
type = acyclic_siblings
ancestors =
    leaf.*
