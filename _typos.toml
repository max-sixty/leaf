[default]
# Revision ids are hexadecimal evidence, even when a run happens to spell a word.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# A render check quotes the passage print drops at 40 characters, so it can cut a
# word in half; tests/test_render_commands.py expects one of those cuts.
recor = "recor"
# tests/test_interact_anchors.py aims a section anchor at `backfil-first`, one letter off an
# id the fixture holds, because a near-miss is the typo the gate exists to refuse —
# "corrected", the id exists and the refusal under test never fires.
backfil = "backfil"
