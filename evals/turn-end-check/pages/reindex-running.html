<!doctype html>
<html lang="en">
  <head>
    <title>Rebuilding the search index</title>
  </head>
  <body>
    <main class="layout-column">
      <h1 id="rx-title">Rebuilding the search index</h1>
      <p class="lede" id="rx-lede">
        The reindex is running on staging; 2 of 5 shards are rebuilt.
      </p>
      <section id="rx-plan" class="layout-flow">
        <h2>Plan</h2>
        <ol id="rx-plan-list">
          <li id="rx-plan-staging">Rebuild all five shards on staging and swap the alias.</li>
          <li id="rx-plan-check">Compare p95 latency and result counts with the old index.</li>
          <li id="rx-plan-prod">Rebuild production, one region at a time.</li>
        </ol>
      </section>
    </main>
  </body>
</html>
