name: prepared-install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepared-install-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: uv run playwright install --with-deps chromium --only-shell
      - name: Verify installation, native custom packages and offline export
        run: uv run pytest tests/test_distribution.py -q
      - run: uv run leaf-dev distribution --output .tmp/prepared
      # Tar retains launcher executable modes through the artifact transport.
      - run: tar -C .tmp/prepared -czf .tmp/prepared.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-install
          path: .tmp/prepared.tar.gz

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: prepared-install
          path: .tmp
      - run: mkdir .tmp/prepared && tar -C .tmp/prepared -xzf .tmp/prepared.tar.gz
      - name: Advance the verified installation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run leaf-dev publish-distribution .tmp/prepared
