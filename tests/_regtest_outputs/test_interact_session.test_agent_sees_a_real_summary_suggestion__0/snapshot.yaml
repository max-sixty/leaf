# The summary hint from real thread events and the delivery a hook hands the turn.

delivery:
  format: leaf-delivery-v3
  id: <delivery>
  created_at: <time>
  carrier: hook
  acknowledge: null
  batches:
    - page: <page>
      through_seq: 14
      threads:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 3
            actions: 0
          messages:
            - id: event-2
              seq: 2
              author: user
              text: >-
                Which rollout?
            - id: event-6
              seq: 6
              author: user
              text: >-
                Rollout consideration 4.
            - id: event-7
              seq: 7
              author: agent
              text: >-
                Rollout consideration 5.
            - id: event-8
              seq: 8
              author: user
              text: >-
                Rollout consideration 6.
            - id: event-9
              seq: 9
              author: agent
              text: >-
                Rollout consideration 7.
            - id: event-10
              seq: 10
              author: user
              text: >-
                Rollout consideration 8.
            - id: event-11
              seq: 11
              author: agent
              text: >-
                Rollout consideration 9.
            - id: event-12
              seq: 12
              author: user
              text: >-
                Rollout consideration 10.
          summaries: []
          summary_hint:
            from: event-2
            through: event-11
          actions: []
      handling:
        h1: >-
          The user answered in a thread; the batch's `threads` carries the thread's
          context, and `leaf page state <page> <thread-id>` reads its history in
          pages.
        h2: >-
          This event's thread has no title yet: name it by adding `--title "<a few
          words>"` to the reply that answers it, so the thread panel lists its subject
          rather than its opening words.
        h3: >-
          This event's thread has grown long, and its entry in the batch's `threads`
          carries a `summary_hint`. Once you have replied, read the messages from
          its `from` through its `through` and summarize them with `leaf thread
          summarize <page> --from <from> --through <through>`, as the Leaf skill's
          `references/threads.md`, "Summarize a long discussion", says.
        h4: >-
          When the event asks for work, name that work before any other, including
          reading the source it concerns: `leaf status <page> working "<the work,
          in a line>" --on <address>`, where `<address>` is the event's `answer.to`.
          The move then reads Working, and the line stands beside the thread and
          in the banner until you answer. Do the work and put its result on the
          page, with whatever shows it (captures, a figure, the numbers), then answer
          with `leaf thread reply <page> --for <event-id>`: what changed, in a sentence
          or two, linking the section that shows it. When the event asks for no
          work, as a question may not, answer it with that reply at once. The page
          carries the work, and the thread only the conversation about it. `leaf
          thread reply` checks any saved page edit and makes it live before posting.
          If a revision removes what the thread is anchored on, move the thread
          in the reply that reports it with `--section <id>` (narrowed by `--quote`
          or `--part` if needed), or `--detach` it if its subject has left the page.
          Add `--awaits` only if your reply's prose asks the user something.
        h5: >-
          Your reply renders as Markdown, so show code or markup in a fenced block.
      events:
        - kind: reply
          author: user
          parent: event-2
          text: >-
            What do you recommend now?
          id: event-14
          ts: <time>
          seq: 14
          subject:
            kind: thread
            id: event-2
          threads: [event-2]
          handling: [h1, h2, h3, h4, h5]
          answer:
            kind: reply
            to: event-14
            for: event-14
