# The user ends most threads with a last word and then Resolve: the delivery carries
# their message with its `answer` and, seconds later, their resolve of the thread. The
# resolve takes the thread off their lists and leaves the message owed, so the session
# does the work and answers at the message's `answer.ref`, and the answer goes into
# the closed thread. The failure it invites is reading the resolve as the request
# taken back: no work and no answer, or the session's own resolve in place of one.
# The `thanks` variant is the control: a last word that asks for nothing is ended
# without work. The envelope is as `freeze_delivery` writes it for a hook, handling
# included, with ids, page, claim and times substituted.
description: resolved-request-stays-owed
metadata:
  purpose: "A message the user resolved its thread over is still answered, at its
    `answer.ref`; a last word that asks for nothing is ended without work."
  tags: [threads, wait-loop]
