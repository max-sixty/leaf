        inside the ink's bounding box, from its first word to its last; it is absent
        where the box covers no words, as over a picture. `drawing.strokes` are
        coordinates in one frame: the comment's target, or the visual inside it
        that the optional `drawing.frame` names (CSS pixels for HTML, user units
        for SVG, intrinsic pixels for an image, canvas or video), and `drawing.box`
        is that frame's size. To see what the mark covers, run `leaf page picture
        <page> <message>` with the comment's `id`; it prints the path of a PNG of
        the revision as the user saw it, with the ink drawn over it. Answer it like
