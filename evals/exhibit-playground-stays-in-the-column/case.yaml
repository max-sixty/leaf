# Guardrail for surface-page-takes-the-window: a playground that is one exhibit in a
# document keeps the document's column, and the page is not turned into a workspace.
# Claude Code: base 9/9 (c20bf406f twice, c71562813 once), candidate 9/9.
description: exhibit-playground-stays-in-the-column
metadata:
  purpose: "Arranging a page: a document read top to bottom that cites one small playground stays a column page, the playground breaking out in its section."
  tags:
    - layout
    - playground
vars:
  prompt: |
    Write a Leaf page reviewing last week's checkout outage for the payments team, who
    will read it top to bottom before Friday's review. It has seven sections: Summary,
    Timeline, Impact, Root cause, What went well, What went badly, and Actions. Write
    each section's paragraphs as placeholders of a few sentences. In Root cause, the
    retries that amplified the outage are the point: include a playground where the
    reader tunes the retry policy's base delay, multiplier and maximum attempts, sees
    the resulting retry schedule against the 30-second outage window, and submits the
    policy to adopt. The schedule must show timing spatially so the reader can see
    which attempts fall inside the outage. Include this qualification beside it:
    "This model assumes independent retries; production clients also share a rate limit."
    Root cause also has an optional incident-log appendix of about 1,200 words;
    use placeholder paragraphs for that appendix. Polish the page for the review.

    Read references/page-authoring.md and ../../packages/playground/instructions/author.md
    relative to the leaf skill's base directory. The page directory is not reachable from
    here, so reply with the complete `index.html`, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the HTML. Pass only if `main` is a `layout-column` page whose seven sections
      are read in order in the page's own scroll, and the playground, in its `lf-ask`,
      stands within the Root cause section. Fail if `main` is a `layout-workspace`, or if
      the page is split into tabs that separate the playground from the sections.
  - type: llm-rubric
    metric: default-style-and-useful-geometry
    value: |
      Pass if ordinary prose, headings and sections use Leaf's existing treatment
      while the retry schedule communicates time spatially and remains adjustable.
      Page CSS or SVG for that visualization and its task-specific arrangement is
      appropriate. Fail if generic polish adds decorative card wrappers or replaces
      ordinary document typography, colors and spacing, or if avoiding customization
      reduces the retry schedule to prose or a table without a spatial visualization.
  - type: llm-rubric
    metric: disclosure-reading-cost
    value: |
      Pass if the independent-retries qualification is visible beside the schedule
      without opening a disclosure, while the substantial optional incident log is
      available behind a clearly labeled disclosure. Fail if the short qualification
      is hidden or if the optional log interrupts the seven-section reading sequence.
