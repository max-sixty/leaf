# What the agent is told when a user acts on a page
# ===================================================
#
# A test records this file; nobody writes it by hand. The lines starting with `#`
# explain it, and everything else is the recorded data. The walkthrough below is
# one real run: the test serves a page, posts a comment to it the way the browser
# does, runs `leaf wait` in a Claude Code session, and acknowledges its complete
# delivery. Only the id, the times and the page's path are pinned, so the file
# stays the same from run to run.
#
# How this text reaches the agent, by example
# -------------------------------------------
#
# 1. The page's `plan` section reads "The nightly backfill moves to Tuesdays so it
#    stops colliding with the report run." The user selects "moves to Tuesdays"
#    and comments "why here?". The page's JavaScript sends this to the page's
#    server as POST /api/event:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015"}
#
# 2. The server checks the comment against the page, adds who wrote it (`author`),
#    when (`ts`) and an `id`, and appends it to the page's event log, events.jsonl,
#    as this one line:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015", "author": "user", "id": "1946b466", "attention": true, "ts": "2026-09-21T20:12:30-07:00"}
#
# 3. The agent runs `leaf wait`, which notices the new input and prints a complete
#    delivery for the comment. The explicit wait carries the input even if the
#    session's hooks no longer run.
#    The comment is owed a reply, which the delivery records as its `answer` (step
#    4): a `reply` for `leaf thread reply <answer.ref>` here; the Codex App Server route
#    would record a `turn`, which the turn's own messages write. For the
#    instructions, `leaf wait` reads the clauses under
#    `$events.handling.comment` in the page's copy of registry.json, then those
#    under `$events.answering.reply`, the answer it owes. Each clause has a `text`
#    and may have a `when`, a JSON Schema that must hold for the clause to apply.
#    It is tested against the log line together with its `answer` and its
#    `thread`'s entry in the delivery's `threads` (step 4). There are
#    10; here they all are, with whether the comment satisfies each `when`:
#
#      clause 1, does not apply:
#        when: {"required": ["drawing"]}
#        text: The user drew on the page. `drawing.says`, when present, is the page's
#              text inside the ink's bounding box, from its first word to its last; it
#              is absent where the box covers no words, as over a picture.
#              `drawing.strokes` are coordinates in one frame: the comment's target,
#              or the visual inside it that the optional `drawing.frame` names (CSS
#              pixels for HTML, user units for SVG, intrinsic pixels for an image,
#              canvas or video), and `drawing.box` is that frame's size. To see what
#              the mark covers, run `leaf page picture <page> <message>` with the
#              comment's `id`; it prints the path of a PNG of the revision as the user
#              saw it, with the ink drawn over it. Answer it like any comment; its
#              `text`, if any, explains the mark.
#      clause 2, does not apply:
#        when: {"required": ["text"], "properties": {"text": {"pattern": "\\]\\(/media/"}}}
#        text: The message links an image in Markdown, as `/media/<digest>.<ext>`
#              under the page directory the batch names. Open the image before
#              answering; its alt text is only a label.
#      clause 3, does not apply:
#        when: {"required": ["suggestion"], "properties": {"suggestion": {"const": true}}}
#        text: A suggestion proposes exact replacement text. Apply it verbatim, or
#              reply with your reason for declining.
#      clause 4, does not apply:
#        when: {"required": ["about"], "properties": {"about": {"const": "design"}}}
#        text: A design comment is about how the page looks or behaves. Its anchor's
#              `section` is an authored element's id or, if it starts `lf-`, a part of
#              Leaf's chrome, such as `lf-composer`. `part`, when present, describes
#              the control, region or picture the user clicked. Fix it in this page's
#              source. If the behavior belongs to a package's widget, or the user asks
#              for a wider fix, change the package and take the change into the page
#              as the Leaf skill's `references/packages.md` says, and note the package
#              change on the stamp. A fix to Leaf itself is the user's to raise; offer
#              to file it (SKILL.md, "Improve Leaf through use"). Your reply names the
#              stamped version that carries the fix.
#      clause 5, applies:
#        when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
#        text: The thread has no title yet. Name its subject with `--title "<a few
#              words>"` on your reply.
#      clause 6, does not apply:
#        when: {"required": ["token"]}
#        text: A reaction owes no answer. Act on the token if it calls for a change,
#              and reply only if its meaning is unclear. Once the page reflects it,
#              close it with `leaf thread resolve <page> <message>`.
#      clause 7, applies:
#        when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
#        text: If the event asks for work, first post one line in its thread saying
#              what you will do, before any other command, even a read: `leaf thread
#              reply <answer.ref> --ephemeral --text "<what you will do, in a line>"`.
#              Then do the work, put the result on the page with what shows it
#              (captures, a figure, the numbers), and answer with `leaf thread reply
#              <answer.ref> <declaration> --file reply.md`: what changed, in a
#              sentence or two, linking the section that shows it. If the event asks
#              for no work, answer it with that reply at once. The reply checks your
#              saved page edit and makes it live before posting. The declaration says
#              whose move your answer leaves, which delivering what was asked doesn't
#              settle. `--obligation` when it is the user's: it leaves them a
#              decision, or something to try or review before making one, or asks them
#              for an answer or permission. That puts your answer on their On me list
#              until they reply or resolve the thread, even where the decision itself
#              is already there. Where your answer asks a question of its own whose
#              answers you can list, such as which of two ways to proceed or whether
#              to take an action, put them in `--markup` in place of `--obligation`,
#              as `<lf-options id="…" choose>` holding an `<lf-option id="…">` for
#              each answer: the user answers with a press, and the choice waits on
#              them by itself (`references/threads.md`, "Ask for a pick"). `--todo
#              "<what you owe>"` when it is yours, promising work beyond this turn.
#              `--done` when it leaves nobody a move.
#      clause 8, does not apply:
#        when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
#        text: Leaf posts your opening message in the thread as your progress line and
#              your final message as the reply, unless an explicit reply already
#              answered this input. Before your first tool call, tell the user briefly
#              the answer or what you are about to do; later working messages stay in
#              Codex. End with the answer, or what changed and where it shows. A final
#              message leaves the user no move, so where your answer leaves them one,
#              such as a decision or something to try or review before making one,
#              answer with `leaf thread reply <answer.ref> --obligation` instead: it
#              puts the answer on their On me list even where the decision itself is
#              already there. Where your answer asks a question of its own whose
#              answers you can list, such as which of two ways to proceed or whether
#              to take an action, reply with them in `--markup` in place of
#              `--obligation`, as `<lf-options id="…" choose>` holding an `<lf-option
#              id="…">` for each answer, so the user answers with a press
#              (`references/threads.md`, "Ask for a pick"). Reply explicitly too for
#              other widgets, work promised beyond this turn (`--todo`), a title or
#              moving the thread (`references/threads.md`); an explicit reply posts at
#              once, and your final message is then not posted.
#      clause 9, applies:
#        (no `when`, so it always applies)
#        text: Your reply renders as Markdown in a narrow column: give each point its
#              own short paragraph or list item, link a page section as `[its
#              name](#section-id)`, and fence code or markup.
#      clause 10, does not apply:
#        when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
#        text: The widget is in a thread message: continue the work the user's answer
#              selects or unblocks, and answer in that thread.
#
# 4. The wait prints the delivery as JSON. The delivery's event is the log line
#    from step 2 less `attempt`, the browser's retry key, and with these fields added:
#    `seq`, `subject`, `threads`, `handling` and `answer`.
#    The batch's `handling` maps clause ids to their text, each distinct text
#    appearing once. The event's `handling` names its applicable clauses in order.
#    The envelope's `acknowledge` tells the agent to confirm receipt before work;
#    printing alone does not mark the comment Picked up. Large readings expose
#    numbered parts and a `next` command; read all parts before acknowledging.
#    This comment fits in one reading, shown here as the wait prints it:
#
#      {
#        "format": "leaf-delivery/15",
#        "id": "e8417b8a",
#        "created_at": 1790046750.29,
#        "acknowledge": "If the output was cut off, reread it with `leaf delivery read e8417b8a` and follow any `next` commands. Then, before any other work, start `leaf delivery ack e8417b8a && leaf wait` as the next background task, which confirms this delivery and waits for the next. If you forward the delivery instead of handling it, acknowledge once it arrives where you sent it.",
#        "batches": [
#          {
#            "page": "/path/to/page",
#            "claim": "page-session",
#            "through_seq": 3,
#            "threads": [
#              {
#                "id": "1946b466",
#                "title": null,
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "detached_from": null,
#                "resolved": null,
#                "elided": {
#                  "messages": 0,
#                  "actions": 0
#                },
#                "messages": [],
#                "summaries": [],
#                "actions": []
#              }
#            ],
#            "handling": {
#              "h1": "The thread has no title yet. Name its subject with `--title \"<a few words>\"` on your reply.",
#              "h2": "If the event asks for work, first post one line in its thread saying what you will do, before any other command, even a read: `leaf thread reply <answer.ref> --ephemeral --text \"<what you will do, in a line>\"`. Then do the work, put the result on the page with what shows it (captures, a figure, the numbers), and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`: what changed, in a sentence or two, linking the section that shows it. If the event asks for no work, answer it with that reply at once. The reply checks your saved page edit and makes it live before posting. The declaration says whose move your answer leaves, which delivering what was asked doesn't settle. `--obligation` when it is the user's: it leaves them a decision, or something to try or review before making one, or asks them for an answer or permission. That puts your answer on their On me list until they reply or resolve the thread, even where the decision itself is already there. Where your answer asks a question of its own whose answers you can list, such as which of two ways to proceed or whether to take an action, put them in `--markup` in place of `--obligation`, as `<lf-options id=\"\u2026\" choose>` holding an `<lf-option id=\"\u2026\">` for each answer: the user answers with a press, and the choice waits on them by itself (`references/threads.md`, \"Ask for a pick\"). `--todo \"<what you owe>\"` when it is yours, promising work beyond this turn. `--done` when it leaves nobody a move.",
#              "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."
#            },
#            "events": [
#              {
#                "kind": "comment",
#                "revision": 1,
#                "text": "why here?",
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "author": "user",
#                "id": "1946b466",
#                "attention": true,
#                "ts": "2026-09-21T20:12:30-07:00",
#                "seq": 3,
#                "subject": {
#                  "kind": "thread",
#                  "id": "1946b466"
#                },
#                "threads": [
#                  "1946b466"
#                ],
#                "handling": [
#                  "h1",
#                  "h2",
#                  "h3"
#                ],
#                "answer": {
#                  "kind": "reply",
#                  "parent": "1946b466",
#                  "responds": "1946b466",
#                  "ref": "e8417b8a:0:1946b466",
#                  "writer": "agent"
#                }
#              }
#            ]
#          }
#        ]
#      }
#
# 5. The agent acknowledges the delivery, then follows `handling`. For requested
#    work it opens with `leaf thread reply <answer.ref> --ephemeral --text "<plan>"`,
#    does the work, and answers with `leaf thread reply <answer.ref>`.
#
# What this file records
# ----------------------
#
# Step 3, for one example of every case, using the clauses in
# browser/runtime/kernel-registry.json (which `leaf page init` composes into a page).
# Each top-level key below names a case and holds:
#
#   event:  the input: a log line's `kind`, the kind of answer its delivery
#           says it owes (`answer`), and the fields some `when` reads, its
#           `thread`'s among them, and nothing else. A field no `when`
#           names, such as a comment's `anchor` or `text`, cannot change what
#           the agent is told, so it is left out; the test checks both halves of
#           that.
#   told:   the output, the clauses that apply to that line, in order. Each
#           clause has a `text` and may have a `when`:
#   when:   the clause's `when`, exactly as registry.json writes it: a JSON
#           Schema the log line must satisfy for the clause to apply. A clause
#           with no `when` always applies, and has no `when` key here either.
#   text:   the clause's text.
#
# The walkthrough's comment is the first case. No `when` reads any field of its
# log line from step 2 except `kind`, so the case is that line cut down to `kind`,
# the reply it owes and its new thread's missing title, and it gets the
# clauses marked "applies" in step 3. It is recorded as:
#
#      comment:
#        event:
#          kind: comment
#          thread:
#            title: null
#          answer:
#            kind: reply
#            writer: agent
#        told:
#          - when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
#            text: >-
#              The thread has no title yet. Name its subject with `--title "<a few words>"`
#              on your reply.
#          - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
#            text: >-
#              If the event asks for work, first post one line in its thread saying what
#              you will do, before any other command, even a read: `leaf thread reply <answer.ref>
#              --ephemeral --text "<what you will do, in a line>"`. Then do the work, put
#              the result on the page with what shows it (captures, a figure, the numbers),
#              and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`:
#              what changed, in a sentence or two, linking the section that shows it. If
#              the event asks for no work, answer it with that reply at once. The reply
#              checks your saved page edit and makes it live before posting. The declaration
#              says whose move your answer leaves, which delivering what was asked doesn't
#              settle. `--obligation` when it is the user's: it leaves them a decision,
#              or something to try or review before making one, or asks them for an answer
#              or permission. That puts your answer on their On me list until they reply
#              or resolve the thread, even where the decision itself is already there.
#              Where your answer asks a question of its own whose answers you can list,
#              such as which of two ways to proceed or whether to take an action, put them
#              in `--markup` in place of `--obligation`, as `<lf-options id="…" choose>`
#              holding an `<lf-option id="…">` for each answer: the user answers with a
#              press, and the choice waits on them by itself (`references/threads.md`,
#              "Ask for a pick"). `--todo "<what you owe>"` when it is yours, promising
#              work beyond this turn. `--done` when it leaves nobody a move.
#          - text: >-
#              Your reply renders as Markdown in a narrow column: give each point its own
#              short paragraph or list item, link a page section as `[its name](#section-id)`,
#              and fence code or markup.
#
# After changing a clause, re-record this file and review the diff:
#
#   uv run pytest --regtest-reset -n0 tests/model/interact_contract/test_layer_contract.py::test_each_case_of_an_event_is_told_what_the_snapshot_shows

comment:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: reply
      writer: agent
  told:
    - when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
      text: >-
        The thread has no title yet. Name its subject with `--title "<a few words>"`
        on your reply.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
      text: >-
        If the event asks for work, first post one line in its thread saying what
        you will do, before any other command, even a read: `leaf thread reply <answer.ref>
        --ephemeral --text "<what you will do, in a line>"`. Then do the work, put
        the result on the page with what shows it (captures, a figure, the numbers),
        and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`:
        what changed, in a sentence or two, linking the section that shows it. If
        the event asks for no work, answer it with that reply at once. The reply
        checks your saved page edit and makes it live before posting. The declaration
        says whose move your answer leaves, which delivering what was asked doesn't
        settle. `--obligation` when it is the user's: it leaves them a decision,
        or something to try or review before making one, or asks them for an answer
        or permission. That puts your answer on their On me list until they reply
        or resolve the thread, even where the decision itself is already there.
        Where your answer asks a question of its own whose answers you can list,
        such as which of two ways to proceed or whether to take an action, put them
        in `--markup` in place of `--obligation`, as `<lf-options id="…" choose>`
        holding an `<lf-option id="…">` for each answer: the user answers with a
        press, and the choice waits on them by itself (`references/threads.md`,
        "Ask for a pick"). `--todo "<what you owe>"` when it is yours, promising
        work beyond this turn. `--done` when it leaves nobody a move.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.

comment over App Server:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: reply
      writer: turn
  told:
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
      text: >-
        Leaf posts your opening message in the thread as your progress line and
        your final message as the reply, unless an explicit reply already answered
        this input. Before your first tool call, tell the user briefly the answer
        or what you are about to do; later working messages stay in Codex. End with
        the answer, or what changed and where it shows. A final message leaves the
        user no move, so where your answer leaves them one, such as a decision or
        something to try or review before making one, answer with `leaf thread reply
        <answer.ref> --obligation` instead: it puts the answer on their On me list
        even where the decision itself is already there. Where your answer asks
        a question of its own whose answers you can list, such as which of two ways
        to proceed or whether to take an action, reply with them in `--markup` in
        place of `--obligation`, as `<lf-options id="…" choose>` holding an `<lf-option
        id="…">` for each answer, so the user answers with a press (`references/threads.md`,
        "Ask for a pick"). Reply explicitly too for other widgets, work promised
        beyond this turn (`--todo`), a title or moving the thread (`references/threads.md`);
        an explicit reply posts at once, and your final message is then not posted.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.

