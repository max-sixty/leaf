# Tools own their exclusions; only hooks without native ignore configuration
# filter here. Re-stage any files a formatter rewrites.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Generated output, source patches and captured evidence keep their bytes.
        exclude: &verbatim ^((browser/vendor|dist/kernel|packages/.*/vendor)/|examples/(corpus\.html|pr-walkthrough\.patch)$|evals/ui-review-detection/fixtures/)|\.patch$
      - id: end-of-file-fixer
        exclude: *verbatim
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        exclude: *verbatim
      - id: check-added-large-files
        exclude: ^((browser/vendor|dist/kernel|packages/.*/vendor)/|examples/(corpus\.html|pr-walkthrough\.patch)$|evals/ui-review-detection/fixtures/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  # Keep the formatter version pinned: versions disagree about </pre> placement.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0, --no-warn-ignored]
  - repo: local
    hooks:
      - id: record-types
        name: generated Python record types
        language: system
        entry: uv run leaf-dev record-types --check
        pass_filenames: false
        files: '^(src/leaf/|dev/leaf_dev/commands/record_types\.py$|pyproject\.toml$|uv\.lock$)'
      - id: ty
        name: ty
        language: system
        entry: uv run ty check
        pass_filenames: false
        files: '(\.(py|pyi)$|(^|/)pyproject\.toml$|^uv\.lock$)'
      # Whole-graph check; files only wakes it. Install independently of pnpm setup.
      - id: dependency-cruiser
        name: dependency-cruiser
        language: node
        additional_dependencies: [dependency-cruiser@18.3.1]
        entry: depcruise --output-type err browser/runtime
        pass_filenames: false
        files: ^(browser/(leaf\.js|runtime/.*\.js)|\.dependency-cruiser\.mjs)$
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  # Pin upstream's native parallel-step support until it is released. This also
  # checks wait targets:
  # https://github.com/rhysd/actionlint/pull/695
  - repo: https://github.com/rhysd/actionlint
    rev: bf6b9188a5fd7b4e7b7d244a865a60165bdc6783
    hooks:
      - id: actionlint
  # actionlint shellchecks workflow run blocks; this covers standalone scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
