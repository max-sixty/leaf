name: publish-site

# Every product and example route uses one build through a Cloudflare Worker origin:
# immutable documents and browser assets at the edge, and the canonical Python Leaf
# server for per-reader API state.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      # The whole skill payload: the site serves a vendored layer, and that is merged
      # from the kernel and bundled package alike — a change to either
      # is a change to what a visitor loads.
      - 'skills/leaf/**'
      - 'bin/leaf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'example-previews.json'
      - 'scripts/example_data.py'
      - 'scripts/example_assets.py'
      - 'scripts/preview.py'
      - 'scripts/site.py'
      - 'worker/**'
      - 'Dockerfile.website'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-deploy
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Deploy public Leaf pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A Containers deploy activates the Worker before its image rollout necessarily
      # finishes. Prove the public route has crossed both boundaries before calling the
      # deployment successful. One cold start can exceed ten seconds, and writing the
      # response before testing it preserves Cloudflare's final error when retries fail.
      #
      # Each attempt asks as a reader arriving now, with its own session cookie. The
      # cookie picks the Durable Object, and a container Cloudflare has already started
      # stays up for its ten-minute idle timer, so re-asking one session keeps reporting
      # the image that session started on rather than the image the fleet now hands a
      # new reader — which is the property this step exists to prove. One deadline
      # covers the whole rollout, so the second page rides out the first page's wait
      # rather than spending a count of its own. Each page keeps five attempts past
      # that deadline: the two pages seat different containers, so a rollout that runs
      # the first page to the deadline must not leave the second a single probe.
      - name: Verify public Leaf pages
        run: |
          deadline=$(( SECONDS + 900 ))
          verify_page() {
            local page_url="$1"
            local state_url="$2"
            local predicate="$3"
            local cookie
            local shell_layer
            local response_layer
            local attempt=0
            local shell
            local response
            local headers
            shell=$(mktemp)
            response=$(mktemp)
            headers=$(mktemp)
            while true; do
              cookie="__Host-leaf-page=$(openssl rand -hex 16)"
              response_layer=
              : > "$response"
              if curl --fail-with-body --silent --show-error \
                --output "$shell" \
                --cookie "$cookie" \
                --max-time 25 \
                "$page_url" \
                && grep --quiet --fixed-strings 'data-lf-server="published"' "$shell"; then
                shell_layer=$(grep --only-matching 'data-lf-layer="[^"]*"' "$shell" | head -1 | cut -d'"' -f2)
              else
                shell_layer=
              fi
              if test -n "$shell_layer" && curl --fail-with-body --silent --show-error \
                --output "$response" \
                --dump-header "$headers" \
                --cookie "$cookie" \
                --max-time 25 \
                "$state_url"; then
                response_layer=$(awk 'tolower($1) == "leaf-layer:" {gsub("\\r", "", $2); print $2}' "$headers" | tail -1)
                if test "$response_layer" = "$shell_layer" && jq --exit-status "$predicate" "$response"; then
                  return 0
                fi
              fi
              (( SECONDS < deadline || ++attempt < 5 )) || break
              sleep 10
            done
            echo "$page_url served layer ${shell_layer:-none}; $state_url served layer ${response_layer:-none}" >&2
            cat "$response" >&2
            return 1
          }
          verify_page \
            https://leaf.page/ \
            https://leaf.page/api/state \
            '.publication.kind == "product" and .claims == []'
          verify_page \
            https://leaf.page/examples/design-decision/ \
            https://leaf.page/examples/design-decision/api/state \
            '.publication.kind == "example" and .claims == []'
