# Guards a widget's readings across removal independently of native resources.
# One base/candidate run distinguished teardown/recreation from retained subscriptions.
# One run per arm retained the three lifecycle passes; only the candidate passed
# renderer-owned placement with shared datum provenance (20261006-135659-8dka43l3).
# The first two rubrics moved from controller.subscribe and watchData to LeafElement's
# render reads when those routes were deleted, and from this.data and projectData to
# the bound property and drawn marks when those were.
description: widget-controller-lifetime
metadata:
  purpose: A widget keeps its semantic and data readings across removal and reinsertion.
  tags:
    - packages
    - lifecycle
vars:
  prompt: |
    Write the lifecycle methods for a Leaf package widget that displays its declared
    status and the availability of its status action. It can be removed temporarily
    and the same element reinserted later. While removed it should do no rendering;
    on return it should show the latest reading without duplicate callbacks.
    It also displays its declared external-data source named "builds" and the
    page's history. Those readings must catch up when it returns with whatever
    changed while it was absent.

    Read the public references and use Leaf's supported semantic widget API. The
    widget also registers a native window resize listener to measure its local
    inspector; keep that listener active only while the element is connected.
    The external source contains a list of {id, label} build records. Show each label
    in a retained paragraph that users can comment on, following the same build across
    source replacements. Include the data-rendering method as well as the lifecycle
    methods; other rendering and measurement methods already exist.
assert:
  - type: llm-rubric
    metric: reading-owner-lifetime
    value: |
      Pass only if the widget extends LeafElement and its render() reads the declared
      status and the action's availability through a synchronous read of the widget
      controller, such as this.state, this.reading or this.controller.read(), with no
      subscription of its own to the controller that the native connection callbacks stop
      or recreate. It must rely on LeafElement to pause while detached and catch up on
      reinsertion. The native window resize listener must still be registered on
      connection and removed on disconnection, through whileConnected or connection
      callbacks that call the super method; fail if it lasts the element's whole life.
  - type: llm-rubric
    metric: reading-subscription-lifetime
    value: |
      Pass only if render(), or a method it calls synchronously, reads the property the
      "builds" input names, such as this.value, and readHistory(), so LeafElement follows
      both and draws them again on return with whatever changed while the widget was away. Fail if the widget watches either
      through a separate subscription, such as a data watcher, or stops
      and recreates anything for them in the native connection callbacks. Rendering
      methods may be assumed to exist as the prompt allows.
  - type: llm-rubric
    metric: renderer-owned-projection
    value: |
      Pass only if the data-rendering method places retained nodes itself, marks each
      build paragraph with data-lf-datum and a data-lf-identity of its id, and then
      dispatches a drawn event whose detail names the value it drew, so comments follow
      that build with the correct source revision. Either setChildren or Leaf's public
      render with keyed repeat can own placement. Fail if the method replaces every
      paragraph on every update rather than retaining their nodes.
