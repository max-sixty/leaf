name: ci

# Pull requests run the small landing gate plus the nightly-marked tests they edit,
# and the website gate. Main, the daily schedule, and a manual dispatch run the
# complete selection once, with the same runtime, browser-framework and bundle gates.
# Relevant pushes to main run the website gate in publish-site before deploy.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

# Only a pull request cancels its own earlier run. A push to main keeps its run: a red
# branch is judged against the base SHA's result, a cancellation reaches tend-ci-fix as
# something to fix, and the next merge must not end a complete suite partway through.
# Nothing outside a pull request shares a workflow group; the complete test job owns
# the automatic suite's queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires this check by name.
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    # Scheduled and manual runs skip lint. A red or cancelled lint never starts tests.
    if: >-
      !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    needs: lint
    concurrency:
      # One automatic suite at a time: it holds a runner for over an hour, and
      # GitHub's concurrency pool is per-account, shared with the other repos here. A
      # running suite is never cancelled, because that hour would be lost; a newer
      # commit replaces the pending entry instead, under GitHub's default
      # `queue: single`, so a busy main gets the suite on its tip rather than working
      # through commits already superseded. Superseded pending entries are recorded as
      # cancelled runs, and #296 accepted that cost for the same reason.
      #
      # A dispatch keeps a slot per ref, as it had before this job took a group of its
      # own. It is the control a session runs against a base SHA, and two sessions
      # judging two branches need both answers; behind main's queue either one would
      # be replaced by the next merge before it ever started.
      # PRs keep their own slot; the automatic and dispatch groups keep the complete
      # suite's existing queue identity.
      group: ${{ github.event_name == 'pull_request' && format('{0}-test-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-nightly-{1}', github.workflow, github.event_name == 'workflow_dispatch' && github.ref || 'automatic') }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base:
      # the second commit is what the nightly selection below diffs against.
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            evals/package-lock.json

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright, and
      # the phone contract uses its WebKit, the engine iPhone browsers run on.
      - name: Install Chromium headless shell and WebKit
        run: uv run playwright install --with-deps chromium webkit --only-shell

      - name: Install the Linux browser font contract
        run: sudo apt-get install -y fonts-dejavu

      - name: Fetch pinned image assets
        run: uv run leaf-dev fetch-assets

      - name: Install browser-build dependencies
        run: npm ci

      # Python exercises the real Wrangler wrapper, including on main/nightly runs.
      - name: Install website dependencies
        run: npm ci
        working-directory: worker

      - name: Diagnose load-sensitive tests
        run: bash diag/run.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/diag/
            .tmp/flake/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/test-results/
            .tmp/thread-snapshots/runs/
          if-no-files-found: ignore
          retention-days: 30
