# What the agent is told when a user acts on a page
# ===================================================
#
# A test records this file; nobody writes it by hand. The lines starting with `#`
# explain it, and everything else is the recorded data. The walkthrough below is
# one real run: the test serves a page, posts a comment to it the way the browser
# does, runs `leaf wait` in a Claude Code session, and acknowledges its complete
# delivery. Only the id, the times and the page's path are pinned, so the file
# stays the same from run to run.
#
# How this text reaches the agent, by example
# -------------------------------------------
#
# 1. The page's `plan` section reads "The nightly backfill moves to Tuesdays so it
#    stops colliding with the report run." The user selects "moves to Tuesdays"
#    and comments "why here?". The page's JavaScript sends this to the page's
#    server as POST /api/event:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015"}
#
# 2. The server checks the comment against the page, adds who wrote it (`author`),
#    when (`ts`) and an `id`, and appends it to the page's event log, events.jsonl,
#    as this one line:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015", "author": "user", "id": "1946b466", "attention": true, "ts": "2026-09-21T20:12:30-07:00"}
#
# 3. The agent runs `leaf wait`, which notices the new input and prints a complete
#    delivery for the comment. The explicit wait carries the input even if the
#    session's hooks no longer run.
#    The comment is owed a reply, which the delivery records as its `answer` (step
#    4): a `reply` for `leaf response reply <answer.ref>` here; the Codex App Server route
#    would record a `turn`, which the turn's own messages write. For the
#    instructions, `leaf wait` reads the clauses under
#    `$events.handling.comment` in the page's copy of registry.json, then those
#    under `$events.answering.reply`, the answer it owes. Each clause has a `text`
#    and may have a `when`, a JSON Schema that must hold for the clause to apply.
#    It is tested against the log line together with its `answer` and its
#    `thread`'s entry in the delivery's `threads` (step 4). There are
#    10; here they all are, with whether the comment satisfies each `when`:
#
#      clause 1, does not apply:
#        when: {"required": ["drawing"]}
#        text: The user drew on the page. `drawing.says`, when present, is the page's
#              text inside the ink's bounding box, from its first word to its last, so
#              an arrow across a paragraph gives the whole paragraph; it is absent
#              where the box covers no words, as over a picture. `drawing.strokes` are
#              coordinates in one frame: the comment's target, or the visual inside it
#              that the optional `drawing.frame` names (CSS pixels for HTML, user
#              units for SVG, intrinsic pixels for an image, canvas or video), and
#              `drawing.box` is that frame's size. To see what the mark covers, run
#              `leaf page picture PAGE ID` with the comment's `id`: it prints the path
#              of a PNG of that revision in the user's window size and color scheme,
#              with the ink drawn over it. Any `text` explains the mark; otherwise
#              answer it like any comment.
#      clause 2, does not apply:
#        when: {"required": ["text"], "properties": {"text": {"pattern": "\\]\\(/media/"}}}
#        text: The message links an image in Markdown, as `/media/<digest>.<ext>`
#              under the page directory the batch names. Open the image before
#              answering; its alt text is only a label.
#      clause 3, does not apply:
#        when: {"required": ["suggestion"], "properties": {"suggestion": {"const": true}}}
#        text: A suggestion proposes exact replacement text. Apply it verbatim, or
#              reply with your reason for declining.
#      clause 4, does not apply:
#        when: {"required": ["about"], "properties": {"about": {"const": "design"}}}
#        text: A design comment is about how the page looks or behaves, not what it
#              says. Its anchor's `section` is an authored element's id or, if it
#              starts `lf-`, a part of Leaf's chrome, such as `lf-banner`,
#              `lf-threads` (the Threads panel), `lf-queue` (the On panel),
#              `lf-versions` or `lf-composer`. `part`, when present, describes the
#              control, region or picture the user clicked. Fix it in this page's
#              source. If the behavior belongs to a package's widget, or the user asks
#              for a wider fix, change the package as the Leaf skill's
#              `references/packages.md` says, re-vendor, and note the re-vendor on the
#              stamp. A fix to Leaf itself is the user's to raise (the Leaf skill's
#              "Improve Leaf through use"). Your reply reports the stamped version
#              that carries the fix.
#      clause 5, applies:
#        when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
#        text: The thread has no title yet. Name it with `--title "<a few words>"` on
#              your reply, so the Threads panel lists its subject instead of its
#              opening words. If Leaf has already named it from its first message,
#              that name stays.
#      clause 6, does not apply:
#        when: {"required": ["token"]}
#        text: A reaction is a mark, not a question. Act on the token if it calls for
#              a change; reply only if its meaning is unclear. Once the page reflects
#              it, close it with `leaf thread resolve <page> <event-id>`. It never
#              blocks publishing a version and waits on no answer.
#      clause 7, applies:
#        when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
#        text: If the event asks for work, first post one line in its thread saying
#              what you will do, before any other command, even reading the source:
#              `leaf response reply <answer.ref> --ephemeral --text "<what you will
#              do, in a line>"`. It shows at once and starts the update, which reads
#              Working until you answer. Do the work and put the result on the page,
#              with what shows it (captures, a figure, the numbers). Then answer with
#              `leaf response reply <answer.ref> --done < reply.md`: what changed, in
#              a sentence or two, linking the section that shows it. If the event asks
#              for no work, as a question may not, answer it with that reply at once.
#              The page holds the work; the thread holds only the conversation about
#              it. `leaf response reply` checks any saved page edit and makes it live
#              before posting. If the revision removes the thread's anchor, move the
#              thread in the same reply with `--section <id>` (narrowed by `--quote`
#              or `--part`), or `--detach` it if its subject left the page. Each
#              answer takes `--done` when it delivers what was asked, `--ask` when it
#              asks the user something back, or `--todo "<what you owe>"` when it
#              promises work beyond this turn, which stays on you until `leaf task
#              end` (`references/conversation-loop.md`, "Long-running work").
#      clause 8, does not apply:
#        when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
#        text: Leaf streams your opening message into the thread and posts your final
#              message as the reply, unless an explicit reply already answered this
#              input. Before your first tool call, tell the user briefly the answer or
#              what you are about to do; later working messages stay in Codex. End
#              with the answer, or what changed and where it shows. For widgets, an
#              ask awaiting the user (`--ask`), work promised beyond this turn
#              (`--todo`), a title or moving the thread, reply explicitly with `leaf
#              response reply <answer.ref>` (`references/threads.md`); it posts at
#              once, and your final message is then not posted.
#      clause 9, applies:
#        (no `when`, so it always applies)
#        text: Your reply renders as Markdown in a narrow column: give each point its
#              own short paragraph or list item, link a page section as `[its
#              name](#section-id)`, and fence code or markup.
#      clause 10, does not apply:
#        when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
#        text: The widget is in a thread message: continue the work the user's answer
#              selects or unblocks, and answer in that thread.
#
# 4. The wait prints the delivery as JSON. The delivery's event is the log line
#    from step 2 less `attempt`, the browser's retry key, and with these fields added:
#    `seq`, `subject`, `threads`, `handling` and `answer`.
#    The batch's `handling` maps clause ids to their text, each distinct text
#    appearing once. The event's `handling` names its applicable clauses in order.
#    The envelope's `acknowledge` tells the agent to confirm receipt before work;
#    printing alone does not mark the comment Picked up. Large readings expose
#    numbered parts and a `next` command; read all parts before acknowledging.
#    This comment fits in one reading, shown here as the wait prints it:
#
#      {
#        "format": "leaf-delivery/6",
#        "id": "e8417b8a",
#        "created_at": 1790046750.29,
#        "acknowledge": "Whoever ran the `leaf wait` that printed this delivery acknowledges it; until then the user's updates read Sent rather than Picked up. If the output was cut off, reread it with `leaf delivery read e8417b8a`. Follow any `next` commands before confirming. If you handle it, acknowledge before any other work; if you forward it, acknowledge once it durably arrives there. To acknowledge, start `leaf wait --ack e8417b8a` as the next background task: it confirms this delivery and waits for the next.",
#        "batches": [
#          {
#            "page": "/path/to/page",
#            "claim": "page-session",
#            "through_seq": 2,
#            "threads": [
#              {
#                "id": "1946b466",
#                "title": null,
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "detached_from": null,
#                "resolved": null,
#                "elided": {
#                  "messages": 0,
#                  "actions": 0
#                },
#                "messages": [],
#                "summaries": [],
#                "actions": []
#              }
#            ],
#            "handling": {
#              "h1": "The thread has no title yet. Name it with `--title \"<a few words>\"` on your reply, so the Threads panel lists its subject instead of its opening words. If Leaf has already named it from its first message, that name stays.",
#              "h2": "If the event asks for work, first post one line in its thread saying what you will do, before any other command, even reading the source: `leaf response reply <answer.ref> --ephemeral --text \"<what you will do, in a line>\"`. It shows at once and starts the update, which reads Working until you answer. Do the work and put the result on the page, with what shows it (captures, a figure, the numbers). Then answer with `leaf response reply <answer.ref> --done < reply.md`: what changed, in a sentence or two, linking the section that shows it. If the event asks for no work, as a question may not, answer it with that reply at once. The page holds the work; the thread holds only the conversation about it. `leaf response reply` checks any saved page edit and makes it live before posting. If the revision removes the thread's anchor, move the thread in the same reply with `--section <id>` (narrowed by `--quote` or `--part`), or `--detach` it if its subject left the page. Each answer takes `--done` when it delivers what was asked, `--ask` when it asks the user something back, or `--todo \"<what you owe>\"` when it promises work beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`, \"Long-running work\").",
#              "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."
#            },
#            "events": [
#              {
#                "kind": "comment",
#                "revision": 1,
#                "text": "why here?",
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "author": "user",
#                "id": "1946b466",
#                "attention": true,
#                "ts": "2026-09-21T20:12:30-07:00",
#                "seq": 2,
#                "subject": {
#                  "kind": "thread",
#                  "id": "1946b466"
#                },
#                "threads": [
#                  "1946b466"
#                ],
#                "handling": [
#                  "h1",
#                  "h2",
#                  "h3"
#                ],
#                "answer": {
#                  "kind": "reply",
#                  "to": "1946b466",
#                  "for": "1946b466",
#                  "ref": "e8417b8a:0:1946b466",
#                  "writer": "agent"
#                }
#              }
#            ]
#          }
#        ]
#      }
#
# 5. The agent acknowledges the delivery, then follows `handling`. For requested
#    work it opens with `leaf response reply <answer.ref> --ephemeral --text "<plan>"`,
#    does the work, and answers with `leaf response reply <answer.ref>`.
#
# What this file records
# ----------------------
#
# Step 3, for one example of every case, using the clauses in
# skills/leaf/assets/registry.json (the file `leaf page init` copies into a page).
# Each top-level key below names a case and holds:
#
#   event:  the input: a log line's `kind`, the kind of answer its delivery
#           says it owes (`answer`), and the fields some `when` reads, its
#           `thread`'s among them, and nothing else. A field no `when`
#           names, such as a comment's `anchor` or `text`, cannot change what
#           the agent is told, so it is left out; the test checks both halves of
#           that.
#   told:   the output, the clauses that apply to that line, in order. Each
#           clause has a `text` and may have a `when`:
#   when:   the clause's `when`, exactly as registry.json writes it: a JSON
#           Schema the log line must satisfy for the clause to apply. A clause
#           with no `when` always applies, and has no `when` key here either.
#   text:   the clause's text.
#
# The walkthrough's comment is the first case. No `when` reads any field of its
# log line from step 2 except `kind`, so the case is that line cut down to `kind`,
# the reply it owes and its new thread's missing title, and it gets the
# clauses marked "applies" in step 3. It is recorded as:
#
#      comment:
#        event:
#          kind: comment
#          thread:
#            title: null
#          answer:
#            kind: reply
#            writer: agent
#        told:
#          - when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
#            text: >-
#              The thread has no title yet. Name it with `--title "<a few words>"` on your
#              reply, so the Threads panel lists its subject instead of its opening words.
#              If Leaf has already named it from its first message, that name stays.
#          - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
#            text: >-
#              If the event asks for work, first post one line in its thread saying what
#              you will do, before any other command, even reading the source: `leaf response
#              reply <answer.ref> --ephemeral --text "<what you will do, in a line>"`.
#              It shows at once and starts the update, which reads Working until you answer.
#              Do the work and put the result on the page, with what shows it (captures,
#              a figure, the numbers). Then answer with `leaf response reply <answer.ref>
#              --done < reply.md`: what changed, in a sentence or two, linking the section
#              that shows it. If the event asks for no work, as a question may not, answer
#              it with that reply at once. The page holds the work; the thread holds only
#              the conversation about it. `leaf response reply` checks any saved page edit
#              and makes it live before posting. If the revision removes the thread's anchor,
#              move the thread in the same reply with `--section <id>` (narrowed by `--quote`
#              or `--part`), or `--detach` it if its subject left the page. Each answer
#              takes `--done` when it delivers what was asked, `--ask` when it asks the
#              user something back, or `--todo "<what you owe>"` when it promises work
#              beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`,
#              "Long-running work").
#          - text: >-
#              Your reply renders as Markdown in a narrow column: give each point its own
#              short paragraph or list item, link a page section as `[its name](#section-id)`,
#              and fence code or markup.
#
# After changing a clause, re-record this file and review the diff:
#
#   uv run pytest --regtest-reset -n0 tests/model/test_interact_contract.py::test_each_case_of_an_event_is_told_what_the_snapshot_shows

comment:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: reply
      writer: agent
  told:
    - when: {"required": ["thread", "answer"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}, "answer": {"properties": {"kind": {"const": "reply"}, "writer": {"const": "agent"}}}}}
      text: >-
        The thread has no title yet. Name it with `--title "<a few words>"` on your
        reply, so the Threads panel lists its subject instead of its opening words.
        If Leaf has already named it from its first message, that name stays.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
      text: >-
        If the event asks for work, first post one line in its thread saying what
        you will do, before any other command, even reading the source: `leaf response
        reply <answer.ref> --ephemeral --text "<what you will do, in a line>"`.
        It shows at once and starts the update, which reads Working until you answer.
        Do the work and put the result on the page, with what shows it (captures,
        a figure, the numbers). Then answer with `leaf response reply <answer.ref>
        --done < reply.md`: what changed, in a sentence or two, linking the section
        that shows it. If the event asks for no work, as a question may not, answer
        it with that reply at once. The page holds the work; the thread holds only
        the conversation about it. `leaf response reply` checks any saved page edit
        and makes it live before posting. If the revision removes the thread's anchor,
        move the thread in the same reply with `--section <id>` (narrowed by `--quote`
        or `--part`), or `--detach` it if its subject left the page. Each answer
        takes `--done` when it delivers what was asked, `--ask` when it asks the
        user something back, or `--todo "<what you owe>"` when it promises work
        beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`,
        "Long-running work").
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.

comment over App Server:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: reply
      writer: turn
  told:
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
      text: >-
        Leaf streams your opening message into the thread and posts your final message
        as the reply, unless an explicit reply already answered this input. Before
        your first tool call, tell the user briefly the answer or what you are about
        to do; later working messages stay in Codex. End with the answer, or what
        changed and where it shows. For widgets, an ask awaiting the user (`--ask`),
        work promised beyond this turn (`--todo`), a title or moving the thread,
        reply explicitly with `leaf response reply <answer.ref>` (`references/threads.md`);
        it posts at once, and your final message is then not posted.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.

comment with a drawing:
  event:
    kind: comment
    drawing:
      strokes: [[[0, 0], [9, 9]]]
      box: [640, 120]
      viewport: [1200, 900]
      scheme: light
    answer:
      kind: reply
      writer: agent
  told:
    - when: {"required": ["drawing"]}
      text: >-
        The user drew on the page. `drawing.says`, when present, is the page's text
        inside the ink's bounding box, from its first word to its last, so an arrow
        across a paragraph gives the whole paragraph; it is absent where the box
        covers no words, as over a picture. `drawing.strokes` are coordinates in
        one frame: the comment's target, or the visual inside it that the optional
        `drawing.frame` names (CSS pixels for HTML, user units for SVG, intrinsic
        pixels for an image, canvas or video), and `drawing.box` is that frame's
        size. To see what the mark covers, run `leaf page picture PAGE ID` with
        the comment's `id`: it prints the path of a PNG of that revision in the
        user's window size and color scheme, with the ink drawn over it. Any `text`
        explains the mark; otherwise answer it like any comment.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
      text: >-
        If the event asks for work, first post one line in its thread saying what
        you will do, before any other command, even reading the source: `leaf response
        reply <answer.ref> --ephemeral --text "<what you will do, in a line>"`.
        It shows at once and starts the update, which reads Working until you answer.
        Do the work and put the result on the page, with what shows it (captures,
        a figure, the numbers). Then answer with `leaf response reply <answer.ref>
        --done < reply.md`: what changed, in a sentence or two, linking the section
        that shows it. If the event asks for no work, as a question may not, answer
        it with that reply at once. The page holds the work; the thread holds only
        the conversation about it. `leaf response reply` checks any saved page edit
        and makes it live before posting. If the revision removes the thread's anchor,
        move the thread in the same reply with `--section <id>` (narrowed by `--quote`
        or `--part`), or `--detach` it if its subject left the page. Each answer
        takes `--done` when it delivers what was asked, `--ask` when it asks the
        user something back, or `--todo "<what you owe>"` when it promises work
        beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`,
        "Long-running work").
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.

