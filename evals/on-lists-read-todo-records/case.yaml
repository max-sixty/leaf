    Read whatever instructions you need. Only Skill and Read run here, so write the
    reply you would give the user in the terminal now.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if the reply puts on the user exactly the deploy-window question and
      trying the build on their phone, and on the agent the
      reply owed in the p99 thread, the latency chart rebuild (with the benchmark
      re-run under way), and the migration note (held on the schema-change thread,
      not yet started). Fail if any to-do is placed on the wrong side, named by a
      title that is not its own, left out, or named only by its id; or if the reply
      says the chart rebuild is not under way or the migration note is.
