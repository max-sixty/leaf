# The summary hint from real conversation events and their wait delivery.

delivery:
  format: leaf-delivery-v3
  id: <delivery>
  created_at: <time>
  carrier: wait
  acknowledge: >-
    Whoever ran the `leaf wait` that printed this delivery acknowledges it; until
    then the user's moves read Sent rather than Picked up. If the output was cut
    off, acknowledge nothing and rerun the wait with room for the whole envelope.
    If you handle it, acknowledge before any other work; if you forward it, acknowledge
    once it durably arrives there. To acknowledge, start `leaf wait --ack <delivery>`
    as the next background task: it confirms this delivery and waits for the next.
  batches:
    - page: <page>
      through_seq: 14
      conversations:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 3
            actions: 0
          messages:
            - id: event-2
              seq: 2
              author: user
              text: >-
                Which rollout?
            - id: event-6
              seq: 6
              author: user
              text: >-
                Rollout consideration 4.
            - id: event-7
              seq: 7
              author: agent
              text: >-
                Rollout consideration 5.
            - id: event-8
              seq: 8
              author: user
              text: >-
                Rollout consideration 6.
            - id: event-9
              seq: 9
              author: agent
              text: >-
                Rollout consideration 7.
            - id: event-10
              seq: 10
              author: user
              text: >-
                Rollout consideration 8.
            - id: event-11
              seq: 11
              author: agent
              text: >-
                Rollout consideration 9.
            - id: event-12
              seq: 12
              author: user
              text: >-
                Rollout consideration 10.
          summaries: []
          summary_hint:
            from: event-2
            through: event-11
          actions: []
      handling:
        h1: >-
          The user answered in a thread; the batch's `conversations` carries the
          thread's context, and `leaf conversation read <page> <conversation-id>`
          reads its history in pages.
        h2: >-
          This event's conversation has no title yet: name it with `leaf conversation
          title <page> <conversation-id> --text "<a few words>"`, so the thread
          panel lists its subject rather than its opening words.
        h3: >-
          This event's thread has grown long, and its entry in the batch's `conversations`
          carries a `summary_hint`. Once you have replied, read the messages from
          its `from` through its `through` and summarize them with `leaf conversation
          summarize <page> <conversation-id> --from <from> --through <through>`,
          as the Leaf skill's `references/conversation-threads.md`, "Summarize a
          long discussion", says.
        h4: >-
          Answer with `leaf reply <page> --for <event-id>` before any other work,
          including the work this event asks for: give the answer, or say what you
          are about to do and where the result will appear. When work follows, name
          it on the page in the same command, as in `leaf reply <page> --for <event-id>
          --text "…" && leaf status <page> working "<the work, in a line>" --on
          <address>`, where `<address>` is the event's `answer.to`: the line stands
          beside the thread and in the banner until your next reply there. Once
          that work lands, put its result on the page, with whatever shows it (captures,
          a figure, the numbers), then report it with `leaf reply <page> --to <address>`:
          what changed, in a sentence or two, linking the section that shows it.
          The page carries the work, and the thread only the conversation about
          it. `leaf reply` checks any saved page edit and makes it live before posting.
          If a revision removes what the thread is anchored on, move the thread
          in the reply that reports it with `--section <id>` (narrowed by `--quote`
          or `--part` if needed), or `--detach` it if its subject has left the page.
          Add `--awaits` only if your reply's prose asks the user something.
        h5: >-
          Your reply renders as Markdown, so show code or markup in a fenced block.
      events:
        - kind: reply
          author: user
          parent: event-2
          text: >-
            What do you recommend now?
          id: event-14
          ts: <time>
          seq: 14
          subject:
            kind: conversation
            id: event-2
          conversations: [event-2]
          handling: [h1, h2, h3, h4, h5]
          answer:
            kind: reply
            to: event-14
            for: event-14
