# `wt merge` straight to main is how the repo lands, so this is the last check anything
# gets. pre-merge rather than pre-commit, because it runs after the rebase: the tree it
# checks is the one that becomes main.
#
# A hook that rewrites (prettier, ruff-format) fails the merge and leaves the rewrite
# uncommitted in the worktree. Read it, then `wt merge` again — the squash sweeps it in.
#
# Two blocks rather than one table, because a table runs its commands together and the
# lint rewrites the tree the suite reads.
[[pre-merge]]
checks = "pre-commit run -a"

# `--run-nightly` because landing pushes: this run holds the network an everyday one
# is written not to need.
[[pre-merge]]
tests = "uv run pytest tests --run-nightly"

# What a cloud container needs before either gate above can run, declared beside them
# because it is the same subject: the locked environment, the system Chrome the browser
# suite attaches to (`channel="chrome"`, so a preinstalled Chromium of another build is
# no substitute), and warm hook environments. Both clouds run it, each from a command
# string in its own settings that installs `wt`, approves this branch and calls this —
# `.config/cloud.md` holds that chain and where it goes. The repo keeps no setup script,
# there being nothing left for one to hold.
#
# No version is written here. `uv.lock` pins what `uv sync` installs, and the hook revs in
# `.pre-commit-config.yaml` are what decide the lint, so pinning the runner that reads them
# was a second number to bump for no behaviour it could change.
#
# `set -eu` and nothing piped, because an alias runs under `sh`: `pipefail` does not exist
# there, so a pipe's failure would pass for success — a downloader piped into a shell being
# the case that installs nothing and reports a clean setup. Nothing here pipes, and the
# chain that fetches `wt` writes a file and runs it for the same reason.
[aliases]
configure-cloud = """
set -eu
export PATH="$HOME/.local/bin:$PATH"
uv sync --frozen
uv run playwright install-deps chrome
command -v google-chrome >/dev/null 2>&1 || uv run playwright install chrome
uv tool install pre-commit
pre-commit install-hooks
"""
