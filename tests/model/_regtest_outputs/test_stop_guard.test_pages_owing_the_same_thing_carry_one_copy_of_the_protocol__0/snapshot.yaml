# Two pages carry distinct debts and one shared answering instruction.

Stop:
  hookSpecificOutput:
    hookEventName: Stop
    additionalContext: |-
      Leaf needs attention:
      - <first-page>: 1 acknowledged user update with no answer (`leaf thread reply <first-delivery>:0:c1`).
      - <second-page>: 1 acknowledged user update with no answer (`leaf thread reply <second-delivery>:0:c2`).

      `leaf page state <page>` lists what is owed, and `leaf page state <page> <message>` reads a thread's history.
      Read these unanswered updates and their exact answer references:
      ```xml
      <leaf-delivery id="<first-delivery>" operation="delivery read" />
      ```
      ```xml
      <leaf-delivery id="<second-delivery>" operation="delivery read" />
      ```
