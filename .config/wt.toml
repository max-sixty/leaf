# `wt merge` straight to main is how the repo lands, so this is the last check anything
# gets. pre-merge rather than pre-commit, because it runs after the rebase: the tree it
# checks is the one that becomes main.
#
# A hook that rewrites (prettier, ruff-format) fails the merge and leaves the rewrite
# uncommitted in the worktree. Read it, then `wt merge` again — the squash sweeps it in.
#
# Two blocks rather than one table, because a table runs its commands together and the
# lint rewrites the tree the suite reads.
[[pre-merge]]
checks = "pre-commit run -a"

# `--run-nightly` because landing pushes: this run holds the network an everyday one
# is written not to need.
[[pre-merge]]
tests = "uv run pytest tests --run-nightly"

# What a cloud container needs before either gate above can run, declared beside them
# because it is the same subject: the locked environment, the system Chrome the browser
# suite attaches to (`channel="chrome"`, so a preinstalled Chromium of another build is
# no substitute), and warm hook environments.
#
# Both clouds reach it from a command string in their own settings — Codex's setup and
# maintenance scripts, and a Claude `SessionStart` hook in the gitignored
# `.claude/settings.local.json` — because `wt` has to exist before an alias can run, which
# is the whole of what the repo would keep a setup script for:
#
#   command -v wt >/dev/null 2>&1 || {
#     curl --proto '=https' --tlsv1.2 -LsSf --retry 6 --retry-all-errors --retry-delay 2 \
#       -o /tmp/wt-install.sh \
#       https://github.com/max-sixty/worktrunk/releases/latest/download/worktrunk-installer.sh
#     WORKTRUNK_UNMANAGED_INSTALL="$HOME/.local/bin" sh /tmp/wt-install.sh
#   }
#   export PATH="$HOME/.local/bin:$PATH"
#   wt config approvals add --yes
#   wt configure-cloud
#
# Approvals before the call, an alias being approval-gated like the commands above: an
# unapproved container stops the setup at a prompt with nobody there to answer it.
#
# No version is written in either place. `uv.lock` pins what `uv sync` installs and the hook
# revs in `.pre-commit-config.yaml` decide the lint, so pinning the runner that reads them
# was a second number to bump for no behaviour it could change; `wt` is unpinned and fetched
# only when absent, so a cached container starts with no network at all.
#
# Nothing pipes, here or there. An alias runs under `sh`, which has no `pipefail`, so a
# downloader piped into a shell would report success having installed nothing and left the
# setup to run without its tools — hence the file that chain writes and then runs.
[aliases]
configure-cloud = """
set -eu
export PATH="$HOME/.local/bin:$PATH"
uv sync --frozen
uv run playwright install-deps chrome
command -v google-chrome >/dev/null 2>&1 || uv run playwright install chrome
uv tool install pre-commit
pre-commit install-hooks
"""
