# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery/attempt and claim identities, and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

idle before pickup:
  exit: 1
  stdout: ''
  stderr:
    - error: >-
        1 event nobody has picked up, so the page cannot idle yet. Leaf's hook puts
        them in your context at your next turn.
      findings: []

the watch wakes the session: >-
  <page> has new input; Leaf's prompt hook puts it in your context with this notification

delivered at prompt:
  instruction: >-
    Leaf has new input for your turn. Read this complete delivery before answering.
  delivery:
    format: leaf-delivery/6
    id: <delivery>
    created_at: <time>
    acknowledge: null
    batches:
      - page: <page>
        claim: <claim-session>
        through_seq: 2
        threads:
          - id: event-2
            title: null
            anchor: null
            detached_from: null
            resolved: null
            elided:
              messages: 0
              actions: 0
            messages: []
            summaries: []
            actions: []
        handling:
          h1: >-
            The thread has no title yet. Name it with `--title "<a few words>"`
            on your reply, so the Threads panel lists its subject instead of its
            opening words. If Leaf has already named it from its first message,
            that name stays.
          h2: >-
            If the event asks for work, first post one line in its thread saying
            what you will do, before any other command, even reading the source:
            `leaf response reply <answer.ref> --ephemeral --text "<what you will
            do, in a line>"`. It shows at once and starts the update, which reads
            Working until you answer. Do the work and put the result on the page,
            with what shows it (captures, a figure, the numbers). Then answer with
            `leaf response reply <answer.ref> --done < reply.md`: what changed,
            in a sentence or two, linking the section that shows it. If the event
            asks for no work, as a question may not, answer it with that reply at
            once. The page holds the work; the thread holds only the conversation
            about it. `leaf response reply` checks any saved page edit and makes
            it live before posting. If the revision removes the thread's anchor,
            move the thread in the same reply with `--section <id>` (narrowed by
            `--quote` or `--part`), or `--detach` it if its subject left the page.
            Each answer takes `--done` when it delivers what was asked, `--ask`
            when it asks the user something back, or `--todo "<what you owe>"` when
            it promises work beyond this turn, which stays on you until `leaf task
            end` (`references/conversation-loop.md`, "Long-running work").
          h3: >-
            Your reply renders as Markdown in a narrow column: give each point its
            own short paragraph or list item, link a page section as `[its name](#section-id)`,
            and fence code or markup.
        events:
          - attention: true
            kind: comment
            author: user
            revision: 1
            text: >-
              Add the camera first.
            id: event-2
            ts: <time>
            seq: 2
            subject:
              kind: thread
              id: event-2
            threads: [event-2]
            handling: [h1, h2, h3]
            answer:
              kind: reply
              to: event-2
              for: event-2
              ref: <delivery>:0:event-2
              writer: agent
  attention: ''

acknowledged at stop:
  hookSpecificOutput:
    hookEventName: Stop
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 acknowledged user update with no answer (`leaf response reply <delivery>:0:event-2`).

      Each update takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf page state <page> <id>`.
      Read these unanswered updates and their exact answer references:
      ```xml
      <leaf-delivery id="<delivery>" operation="delivery read" />
      ```

idle before answer:
  exit: 1
  stdout: ''
  stderr:
    - error: >-
        1 acknowledged user update with no answer (`leaf response reply <delivery>:0:event-2`);
        answer before idling. Each update takes the answer named for it. Read current
        obligations with `leaf page state <page>` and thread history with `leaf
        page state <page> <id>`.
      findings: []

answer:
  kind: reply
  author: agent
  agent: Claude
  session: s1
  parent: event-2
  text: >-
    I will add the camera first.
  responds: event-2
  attempt: <attempt>
  revision: 1
  id: event-4
  attention: false
  ts: <time>
  seq: 4

answered at stop: null
