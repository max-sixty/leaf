# For a direct local landing, `wt merge` runs these checks after rebasing, so the tree
# they check is the one that becomes main.
#
# A hook that rewrites (prettier, ruff-format) fails the merge and leaves the rewrite
# uncommitted in the worktree. Read it, then `wt merge` again — the squash sweeps it in.
#
# Two blocks rather than one table, because a table runs its commands together and the
# lint rewrites the tree the suite reads.
#
# `uv run` synchronizes the Python environment on every command, so the suite never meets
# a stale one. Its node half had no such step: `tests/test_live_shell_artifact.py` runs
# `worker/bundle-runtime.mjs`, which imports esbuild from an install git does not carry,
# and a worktree that never ran setup failed the gate on a test its branch never touched.
# `npm ci` gives the node side the same guarantee for a third of a second against a warm
# npm cache. It writes only the ignored `node_modules/`, so it runs beside the lint.
[[pre-merge]]
checks = "uv run pre-commit run -a"
node = "npm ci"

# Broad discovery keeps the local gate quick. CI adds the nightly browser and
# published-site integration suites after main moves.
[[pre-merge]]
tests = "uv run pytest tests"

# A new worktree has no `node_modules`, so an ordinary `uv run pytest tests` fails before
# anyone reaches a merge. Install in the background rather than blocking the switch; the
# merge gate above installs again for the worktrees that predate this hook.
[post-start]
node = "npm ci"

# The marketplace follows the remote default branch. Manual post-merge hooks still
# name the source branch and its pre-squash commit, so read the landed default branch
# and wait for its concurrent push before refreshing installed plugins.
[post-merge]
refresh-codex-leaf = '''
if command -v codex >/dev/null 2>&1 &&
  codex plugin list --marketplace leaf --json |
    jq -e 'any(.installed[]; .pluginId == "leaf@leaf")' >/dev/null
then
  landed_commit=$(git rev-parse refs/heads/{{ default_branch }}) || exit 1
  attempts=0
  while [ "$attempts" -lt 12 ]; do
    remote_commit=$(git ls-remote {{ remote }} refs/heads/{{ default_branch }} | cut -f1)
    if [ -n "$remote_commit" ] &&
      git fetch --quiet --no-tags {{ remote }} refs/heads/{{ default_branch }} &&
      git merge-base --is-ancestor "$landed_commit" "$remote_commit"
    then
      exec codex plugin marketplace upgrade leaf
    fi
    attempts=$((attempts + 1))
    sleep 5
  done
  echo "Codex Leaf plugin refresh timed out waiting for the landed commit" >&2
  exit 1
fi
'''

# uv run synchronizes the locked Python environment. The external previews, browser
# binaries, and website node_modules live outside it, so those remain explicit.
[[aliases.setup]]
assets = "uv run --frozen scripts/example_assets.py"

[[aliases.setup]]
chromium = "uv run --frozen playwright install chromium --only-shell"

[[aliases.setup]]
chrome = "uv run --frozen playwright install chrome"

# The root install carries the browser framework's build and the esbuild the Python suite
# reaches through `worker/bundle-runtime.mjs`; `post-start` repeats it for every worktree
# after this one, and only the first clone needs it from here. The worker install is an
# order of magnitude larger and only the website gate reads it.
[[aliases.setup]]
browser = "npm ci"

[[aliases.setup]]
worker = "npm ci --prefix worker"

[[aliases.refresh-previews]]
previews = "uv run --frozen scripts/example-previews.py"

[[aliases.cloud]]
setup = "wt setup"

[[aliases.cloud]]
tests = '''
# urllib matches the IPv6 URL's bracketed host literally.
NO_PROXY="${NO_PROXY:-},${no_proxy:-},[::1]"; export NO_PROXY no_proxy="$NO_PROXY"
uv run pytest tests {{ args }}
'''
