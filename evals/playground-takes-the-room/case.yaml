# Added when an Ask came to keep the prose's width on a wide page as in a column, as
# playground-ask-takes-the-room: the Ask framing a playground had to be granted the
# page's room for its stage (Claude Code: base 0/3 and 0/2, candidate 3/3 and 2/2,
# across two wordings). Since layout-wide was retired the room went on the playground
# itself, a breakout from a column page. Since a page whose subject is a playground
# became a workspace (session e8a66e47's design review, where the breakout's edges
# matched nothing above it), the page itself is the room: the Ask is the workspace's body.
# On that wording, Claude Code: base (c20bf406f) 4/6 across two runs, candidate 6/6;
# the base often follows notification-playground, so this case protects more than it
# distinguishes.
description: playground-takes-the-room
metadata:
  purpose: 'Playground: a page whose subject is a playground is a workspace whose body is the playground''s Ask.'
  tags:
  - playground
  - layout
vars:
  prompt: |
    The user wants to choose between two empty-state designs for the project list:
    an illustration with one "Create project" button, or a checklist of three setup
    steps. Build a Leaf playground page where they can see both candidates side by
    side at full size, toggle whether the list has a search bar above it, and submit
    which design to build.

    Read packages/playground/instructions/author.md inside the leaf skill's base
    directory. The page directory is not reachable here, so reply with the page's
    HTML and any page module it needs.
assert:
- type: llm-rubric
  metric: playground-takes-the-room
  value: |
    Pass only if `main` is a `layout-workspace` whose body, the element between its
    `header` and any `footer`, is the `lf-ask` holding the `lf-playground`, and the
    `lf-playground` carries `data-width="available"`, so the playground takes the
    window rather than breaking out beside a column. Fail if `main` is a
    `layout-column` or `layout-sidebar` page, or if the playground stands in a section
    or other wrapper inside the body.
