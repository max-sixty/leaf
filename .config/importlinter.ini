# import-linter (https://import-linter.readthedocs.io/), run by the pre-commit hook
# of that name.
#
# `src/leaf`'s modules and subpackages stand in one order, and each imports only those
# below it. The order is the one a greedy heuristic for a minimum feedback arc set
# found over the modules' imports (Eades, Lin and Smyth), not a design: it holds the
# direction the code already mostly takes, so an import that turns against it is
# noticed when it is written rather than found later in a survey. `exhaustive` fails a
# module the order doesn't name. Imports under `TYPE_CHECKING` load nothing and don't
# count.
#
# When the contract breaks:
#
# - On a new module, place it below every module that imports it and above every module
#   it imports.
# - On an import that points up, make it point down: pass the value or callback in,
#   or move what it needs to a module below both. Where the order itself is wrong for
#   a module, move the module instead; the check then says whether the new place holds.
# - On an allowance that matches nothing, delete it: its import is gone.
#
# `ignore_imports` allows the backward imports that remain. It only shrinks: an
# allowance goes when its import does, and a new backward import is fixed rather than
# allowed.

[importlinter]
root_package = leaf
exclude_type_checking_imports = True

[importlinter:contract:layers]
name = src/leaf modules import only modules below them (.config/importlinter.ini)
type = layers
containers = leaf
exhaustive = true
layers =
