# Added for #1491: a grid can satisfy the same-dimensions table rule while its
# purpose is a pattern across measurements. Compare the earlier instructions with the
# explicit chart priority; the exact-value request checks the secondary table route.
description: numeric-grid-shows-shape
metadata:
  purpose: 'Numeric comparisons: show a shared trend as a chart, with exact values available for lookup.'
  tags:
  - authoring
  - charts
vars:
  prompt: "You are writing one section of a Leaf page for a reader comparing how three\ngroups changed\
    \ over five weekly windows. The main finding is that all three\ngroups rose together in weeks 2\u2013\
    4 and fell in week 5. The reader also wants\nto look up an individual measurement if needed.\n\n|\
    \ week | Alpha | Beta | Gamma |\n| --- | ---: | ---: | ---: |\n| 1 | 12 | 18 | 9 |\n| 2 | 17 | 22\
    \ | 14 |\n| 3 | 23 | 29 | 20 |\n| 4 | 27 | 32 | 24 |\n| 5 | 19 | 25 | 16 |\n\nThe page directory is\
    \ not reachable from here, so reply with the section's\nHTML fragment rather than writing a file.\n"
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-page-authoring
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/page-authoring\.md
- type: javascript
  metric: charts-the-pattern
  value: file://text-regex.cjs
  config:
    pattern: <lf-chart\b
    flags: i
    negate: false
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the HTML leads with an `lf-chart` that plots the three groups
    against the five weeks, making their shared rise and fall visible. The exact
    measurements remain available in a table below the chart, preferably inside
    `<details>`. Fail if the table is the primary presentation, or if the chart
    omits a group or the five-week sequence.
