# Where each case's comment box, and the thread card it became, stand.

column-passage-first-line:
  expected: right
  comment box:
    side: right
    stands: level with the words
  thread card:
    side: right
    stands: level with the words
  moves:
    across: near right
    down: still

column-passage-deep-line:
  expected: right
  comment box:
    side: right
    stands: level with the words
  thread card:
    side: right
    stands: away over the words
  moves:
    across: near right
    down: away up

column-element:
  expected: right
  comment box:
    side: right
    stands: level with the words
  thread card:
    side: right
    stands: level with the words
  moves:
    across: near right
    down: still

wide-passage-deep-line:
  expected: right
  comment box:
    side: right
    stands: level with the words
  thread card:
    side: right
    stands: away over the words
  moves:
    across: away right
    down: away up

narrow-rail-passage:
  expected: below or above
  comment box:
    side: below
    stands: clear under the block
  thread card:
    side: below
    stands: clear under the block
  moves:
    across: away right
    down: still

beside-passage:
  expected: below or above
  comment box:
    side: below
    stands: clear under the block
  thread card:
    side: below
    stands: clear under the block
  moves:
    across: near right
    down: still

beside-element:
  expected: below or above
  comment box:
    side: above
    stands: clear over the block
  thread card:
    side: below
    stands: clear under the block
  moves:
    across: near right
    down: away down

phone-passage:
  expected: below or above
  comment box:
    side: above
    stands: clear over the block
  thread card:
    side: above
    stands: clear over the block
  moves:
    across: near left
    down: still

phone-touch-passage:
  expected: below
  comment box:
    side: below
    stands: clear under the block
  thread card:
    side: below
    stands: away off the block
  moves:
    across: near left
    down: away up
