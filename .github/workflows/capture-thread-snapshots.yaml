name: Capture thread snapshots

on:
  pull_request:
    paths:
      - .github/workflows/capture-thread-snapshots.yaml
      - skills/leaf/assets/theme.css

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked Chromium and native fonts
        run: |
          uv run playwright install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-dejavu
      - name: Fetch pinned assets and install browser dependencies
        run: |
          uv run leaf-dev fetch-assets
          npm ci
      - name: Capture complete thread appearance
        run: uv run leaf-dev thread-snapshots capture
      - name: Upload capture and success marker
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-snapshots-${{ github.run_id }}
          path: .tmp/thread-snapshots/captures/
          if-no-files-found: error
          retention-days: 30
