# Added with the Layout classes (#1246). Base at aec3eea3d wrote `lf-grid` and
# `main[data-width]` (0 of 3); the change wrote a sidebar page with tiles (3 of 3). Once a
# tile row's wrapping became the page's call, setting the tiles' columns counts as adjusting.
# The contents-default restoration also guards this dashboard against an unnecessary TOC.
# A page's own grid passes since Leaf stopped preferring its Layouts over a page's CSS;
# the scar it keeps is the retired elements.
description: page-arrangement-uses-layouts
metadata:
  purpose:
    "Arranging a page: a page wider than the column takes a shipped Layout class on main or
    its own grid, rather than a retired element."
  tags:
    - layout
vars:
  prompt: |
    You are writing a Leaf page that tracks a service migration for the user, who will
    keep it open on a desktop monitor and check it through the day. Your notes:

    - Five headline numbers: services migrated 14 of 22, error rate 0.4% (down from
      0.9%), p95 latency 212 ms (up 8 ms), rollbacks this week 1, days to cutover 9.
    - The main body is a table of the 22 services: name, owner, stage (planned,
      shadowing, cut over, rolled back), and last deploy.
    - Beside the table, a short column the user glances at: who is on call, the next
      two cutover windows, and a link to the runbook.

    The page directory is not reachable from here, so reply with the complete `<main>`
    element, and any `<style>` the page needs, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the HTML. Pass only if all of these hold. The table and the side column
      stand beside each other on a desktop width, and the five numbers sit together
      in a row or grid, whether through Leaf's Layout classes (`layout-sidebar`,
      `layout-tiles`) or the page's own grid or flex CSS on or inside `main`. It uses
      none of `lf-grid`, `lf-workspace`, or a `data-width` attribute on `main`. The
      page has no contents outline (`lf-toc`). Fail if the side column falls below the
      table at a desktop width.
