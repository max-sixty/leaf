description: page-css-names-leaf-controls
metadata:
  purpose: "Restyling generated controls uses an explicitly marked stylesheet; selectors
    then target only the requested widgets while other surfaces keep their faces."
  tags:
    - theme
vars:
  prompt: |
    You are revising a Leaf page for the user. It has a triage board
    (`<lf-board id="triage">` with three columns of cards) and, below it, an Ask whose
    answer is an `<lf-options id="next-step" choose>` with three options. The page's own
    `<style>` is empty.

    The user commented on the board: "The buttons on the board and the pick buttons in
    the question are too small for me to hit on my trackpad. Make those bigger. Leave
    the rest of the page as it is."

    The page directory is not reachable from here, so reply with the complete `<style>`
    element the page needs, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the CSS. Pass only if the supplied style element carries data-controls,
      granting its stylesheet access to generated controls, and the enlargement rules
      target the requested board and options controls specifically. Selectors naming
      widgets without that stylesheet marker cannot reach generated controls and fail.
      Native @scope may constrain the intended region, but does not itself grant access.
      Fail if the enlargement reaches unrelated page or chrome controls, or changes
      page-wide size tokens or the type scale when the user asked to leave the rest alone.
