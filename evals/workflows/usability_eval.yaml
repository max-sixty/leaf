      262 ms: 240 ms
    choice: opt-eu-west
    plan:
      - depth: 0
        title: Get the rate limiter rollout ready to ship
        state: working
      - depth: 1
        title: Put this week's p99s in the latency table
        state: done
      - depth: 1
