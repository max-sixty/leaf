name: tend-ci-fix
on:
  workflow_run:
    workflows: ["ci", "publish-site"]
    types: [completed]
    branches: ["main"]

jobs:
  fix-ci:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false' && contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    concurrency:
      # A red branch fails every push that follows, each on its own commit, so
      # one session per branch — not per commit — is what collapses the burst.
      # The watched workflow is in the key too: a red `publish-site` must not
      # starve behind a stream of red `ci`. Never cancel — a running session
      # may already have pushed a branch or opened a PR. Default queue depth
      # is right: the newest failure replaces the pending one.
      group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --no-dev playwright install-deps webkit
        name: Install WebKit's system libraries

      - uses: max-sixty/tend/claude@0.2.11
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: leaf-agent
          model: opus
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          sandbox_env: |2
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          sandbox_setup: |2
            uv sync --frozen
            uv run playwright install chromium webkit --only-shell
            uv run python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.webkit.launch().close(); p.stop()"
          prompt: |2
            /tend-ci-runner:ci-fix ${{ github.event.workflow_run.id }}
            - Run URL: ${{ github.event.workflow_run.html_url }}
            - Conclusion: ${{ github.event.workflow_run.conclusion }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Commit message: ${{ github.event.workflow_run.head_commit.message }}
