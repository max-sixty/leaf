      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: watch_left_to_leaf
      value: >-
        Throughout this live scenario, the agent left watching for later user input to Leaf rather than launching its own background wait or polling loop. Judge what the tools actually started, including renamed launchers, variables and wrappers. Reading help, quoting a wait command, and failed attempts that started nothing are allowed.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: detail_names_ask
      value: 'This status, shown while the page waits on the user, says what it waits for:
        their choice of how the backfill copy runs.'
      transform: context.metadata.texts?.["status"] ?? ''
    - type: llm-rubric
      metric: gesture_named
      value: 'The message tells the user how to make the decision on the page: by picking,
        choosing or selecting one of its options.'
      transform: context.metadata.texts?.["handover"] ?? ''
    - type: llm-rubric
      metric: edit_done
      value: The paragraph says the dry run took 3 hours 10 minutes.
      transform: context.metadata.texts?.["dry-run"] ?? ''
    - type: llm-rubric
