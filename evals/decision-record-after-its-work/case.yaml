              <a href="https://github.com/max-sixty/leaf/pull/4518">#4518</a> (merged)
              folds thread messages with <code>until-found</code> and deletes
              <code>revealedBy</code>, and find keeps reaching filtered diff files.
            </p>

            <lf-ask id="diff-filter-question">
              <h3>Should find-in-page reach diff files the filter hides?</h3>
              <p>
                Since #4500 a filtered-out file is <code>hidden="until-found"</code>. Find
                (⌘F), a fragment link or Leaf's target search can land in it, which clears
