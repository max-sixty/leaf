# Added when the user could rewrite a sent message in place (the `edit` event a
# browser posts). A user's rewrite is a turn the agent answers, addressed to the edit
# rather than the message it rewrote, about what the new wording changes. The envelope
# is the one Claude Code's prompt hook handed over for a log built through the append
# door and `leaf response reply`: the user asked for the owner to be named, the agent
# answered, and the user then rewrote the request to add the launch date. Delivery id,
# page path and the reply's id are substituted for readable stable ones.
# The envelope carries the delivery's own handling, so `--base` arms differ only in
# the references, and a handling change is scored by pasting each wording into the
# prompt. Its thread is titled for its subject, which the rewrite keeps, so it also
# guards the handling's retitling sentence: the title stands. A draft keyed on the
# rewrite changing "what the thread is about" retitled it on Codex in `mid-session`
# (1 of 1 completed run); keyed on the title no longer fitting, it held 4 of 4 on
# Codex and 6 of 6 on Claude Code, cold and `mid-session`.
# Re-frozen after `leaf response reply` replaced `leaf thread reply --for`. Against
# 5851b2088 every sample answered `e7f1a2c3:0:edit-a` and kept the title: Claude Code
# 2 of 2 cold and 2 of 2 `mid-session`, Codex 2 of 2 cold and 1 of 2 `mid-session`.
# The Codex miss was the judgment grading a fact the prompt withholds: no launch date
# is given, and it drafted only the reply asking for one. The rubric now accepts that
# answer; Codex then passed 2 of 2.
# Handling re-pasted from the registry at 3fe3eb0af (`--ask`, `--todo`, "update"),
# where it passed 1/1 cold and 1/1 `mid-session` on Claude Code.
description: user-rewrite-answered
metadata:
  purpose: "A user's rewrite of an answered message is answered as a new turn, for the edit's id, about what the rewrite changed, and a rewrite that keeps the thread's subject keeps its title."
  tags: [threads, wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:
    {"format": "leaf-delivery-v5", "id": "e7f1a2c3", "created_at": 1791448199.576215, "acknowledge": null, "batches": [{"page": "/tmp/review", "claim": "0b7e2a6c-4f1d-4c8e-9a35-2d6f1e8b7c40", "through_seq": 4, "threads": [{"id": "comment-a", "title": "Revising the opening", "anchor": null, "detached_from": null, "resolved": null, "elided": {"messages": 0, "actions": 0}, "messages": [{"id": "comment-a", "seq": 1, "author": "user", "text": "Please revise the opening to name the owner and the launch date.", "edited": {"id": "edit-a", "seq": 4, "ts": "2026-10-08T01:29:59.412-07:00", "was": "Please revise the opening to name the owner."}}, {"id": "reply-a", "seq": 3, "author": "agent", "agent": "Claude", "text": "The opening now names Priya as the owner."}], "summaries": [], "actions": []}], "handling": {"h1": "The user rewrote their message `message` in place: `text` is how it reads now and `was` how it read before, and the thread shows only the new wording. Answer the message as it now reads. Where your earlier answer or work rested on what changed, say what that changes and redo the work it requires; where it changes nothing you did, say so. If `message` opens the thread and the thread's title no longer fits what it now asks, retitle the thread with `leaf thread edit <page> <message> --title \"<a few words>\"`, so the thread panel names what the thread is about now.", "h2": "When the event asks for work, say in its thread what you will do before any other command, including reading the source it concerns: `leaf response reply <answer.ref> --ephemeral --text \"<what you will do, in a line>\"`. The user reads it in the thread at once, and it takes the update in hand: the update reads Working, and the line stands in the banner until you answer. Do the work and put its result on the page, with whatever shows it (captures, a figure, the numbers), then answer with `leaf response reply <answer.ref> --done < reply.md`: what changed, in a sentence or two, linking the section that shows it. When the event asks for no work, as a question may not, answer it with that reply at once. The page carries the work, and the thread only the conversation about it. `leaf response reply` checks any saved page edit and makes it live before posting. If a revision removes what the thread is anchored on, move the thread in the reply that reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it if its subject has left the page. Every answer says what it leaves: `--done` when it delivers what was asked, `--ask` when its prose asks the user something back, or `--todo \"<what you owe>\"` when it promises work that outlasts this turn, which then stays on you, under the reply's id, until `leaf task end` (`references/conversation-loop.md`, \"Long-running work\").", "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."}, "events": [{"kind": "edit", "author": "user", "id": "edit-a", "message": "comment-a", "text": "Please revise the opening to name the owner and the launch date.", "attention": true, "ts": "2026-10-08T01:29:59.412-07:00", "seq": 4, "subject": {"kind": "thread", "id": "comment-a"}, "threads": ["comment-a"], "was": "Please revise the opening to name the owner.", "handling": ["h1", "h2", "h3"], "answer": {"kind": "reply", "to": "comment-a", "for": "edit-a", "ref": "e7f1a2c3:0:edit-a", "writer": "agent"}}]}]}

    The page is already served. Only Skill and Read run here, so write out, in order,
    each command you would run, with the full text of any thread reply you would post.
    Then end your answer.
assert:
- type: llm-rubric
  metric: answers-the-edit
  value: |
    Pass only if the agent answers the rewrite with an ordinary `leaf response reply`
    (not `--ephemeral`) naming the edit's reference `e7f1a2c3:0:edit-a`. A progress
    message before it is fine. Any spelling of the launcher passes. Fail if a
    non-ephemeral reply answers the original message comment-a (a reference ending in `:comment-a`, or a
    `leaf thread reply` to comment-a) as though the rewrite were the old request.
- type: llm-rubric
  metric: keeps-the-title
  value: |
    The rewrite keeps the thread's subject, so its title "Revising the opening"
    still fits. Pass only if no command retitles the thread: no `--title` on a
    `leaf thread edit`, `leaf thread reply` or `leaf response reply`.
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the work the agent describes adds the launch date to the opening
    (the part the rewrite added, beyond the owner it already named), and the reply
    it would post tells the user what changed for the rewritten request, such as the
    launch date now standing in the opening. The envelope gives no date, so an
    answer to the edit that asks the user which launch date to add also passes, as
    does one that drafts the addition with a placeholder. Fail if the agent treats
    the rewrite as already answered, replies only about the owner, or asks the user
    to resend it.
