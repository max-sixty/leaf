request: |-
  Make a v2.4 release triage board with these seven defects: migration reruns,
  digest email timezone, CSV export quoting, webhook retry delays, logout with an expired
  session, HEIC avatar uploads and search missing renamed projects. Only the migration
  blocks release because the next migration would apply account credits twice. Keep
  all seven defects visible with their priorities, show the total open count, and let
  me move cards. The release cut is Thursday, two days away.
cases:
  seeded:
    inputs:
      total: 8
    assert:
    - type: not-agent-rubric
      metric: count-defect-detected
      value: Open every screenshot the output lists. A region with its own scroll shows only
        its first screen, so count the cards at a width that shows the whole board. Pass only
        if the page's displayed total of open defects equals the number of defect cards on the
        board.
  clean:
    inputs:
      total: 7
    assert:
    - type: agent-rubric
      metric: count-control-accepted
      value: Open every screenshot the output lists. A region with its own scroll shows only
        its first screen, so count the cards at a width that shows the whole board. Pass only
        if the page's displayed total of open defects equals the number of defect cards on the
        board.
