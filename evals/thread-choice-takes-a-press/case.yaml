         "resolved": null,
         "elided": {
          "messages": 0,
          "actions": 0
         },
         "messages": [],
         "summaries": [],
         "actions": []
        }
       ],
       "handling": {
        "h1": "The thread has no title yet. Name its subject with `--title \"<a few words>\"` on your reply.",
        "h2": "If the event asks for work, first post one line in its thread saying what you will do, before any other command, even a read: `leaf thread reply <answer.ref> --ephemeral --text \"<what you will do, in a line>\"`. Then do the work, put the result on the page with what shows it (captures, a figure, the numbers), and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`: what changed, in a sentence or two, linking the section that shows it. If the event asks for no work, answer it with that reply at once. The reply checks your saved page edit and makes it live before posting. The declaration says whose move your answer leaves, which delivering what was asked doesn't settle. `--obligation` when it is the user's: it leaves them a decision, or something to try or review before making one, or asks them for an answer or permission. That puts your answer on their On Me list until they reply or resolve the thread, even where the decision itself is already there. Where your answer asks a question of its own whose answers you can list, such as which of two ways to proceed or whether to take an action, put them in your reply in place of `--obligation`, as `<lf-options id=\"…\">` holding an `<lf-option id=\"…\">` for each answer: the user answers with a press, and the choice waits on them by itself (`references/threads.md`, \"Ask for a pick\"). `--todo \"<what you owe>\"` when it is yours, promising work beyond this turn. `--done` when it leaves nobody a move.",
        "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."
       },
       "events": [
        {
         "kind": "comment",
         "author": "user",
         "revision": 1,
         "attention": true,
         "text": "add a comparison against last year",
         "anchor": {
          "section": "p95"
         },
         "id": "6988cfa8",
         "ts": "2026-10-31T17:28:50.085-07:00",
         "seq": 2,
         "subject": {
          "kind": "thread",
          "id": "6988cfa8"
         },
         "threads": [
          "6988cfa8"
         ],
         "handling": [
          "h1",
          "h2",
          "h3"
         ],
         "answer": {
          "kind": "reply",
          "parent": "6988cfa8",
          "responds": "6988cfa8",
          "ref": "42e90c8c:0:6988cfa8",
          "writer": "agent"
         }
        }
       ]
      }
     ]
    }
    ```

    You posted your progress line and checked the data. "Last year" has two readings, and
    they tell different stories:

    - Q3 2025, the same quarter a year ago. It predates February's cache rewrite, so this
      quarter's p95 is 52% lower.
    - The trailing twelve months. They include the rewrite from February on, so this
      quarter's p95 is 18% lower.

    Each takes a few minutes to compute and both together crowd the table, so you want the
    user's pick before computing either. You'd take Q3 2025: it's the baseline the
    quarterly reviews use.

    The page and services are unreachable in this exercise. Write out the command you would
    run to answer the user's comment, with the full text of the reply and any markup, then
    end your answer.
assert:
  - type: llm-rubric
    metric: choice-in-the-reply
    value: |
      Find how the answer asks the user to choose the baseline. Pass only if the
      `leaf thread reply` that answers the comment carries, in its text, a widget the
      user answers by picking, such as `lf-options` with one `lf-option`
      for Q3 2025 and one for the trailing twelve months. Fail if the choice is asked
      only in words, even with `--obligation`, or only on the page.
  - type: llm-rubric
    metric: asked-once
    value: |
      Pass unless a reply that carries a widget asking for the baseline also passes
      `--obligation`, which would leave the question on the user's list after they
      pick. A reply without such a widget passes this metric.
  - &markup-accepted
    type: llm-rubric
    metric: markup-accepted
    value: |
      Pass unless the reply holds a choice that `leaf thread reply` refuses or that
      the user can't press: an `lf-options` or an `lf-option` without an `id`,
      either carrying an attribute Leaf doesn't declare, such as `name` or `prompt`,
      a choice inside backticks or a code fence, which
      shows it as text, or one passed as `--markup`, an option the command doesn't
      take. A reply without a choice passes this metric.
  - &said-once
    type: llm-rubric
    metric: said-once
    value: |
      Pass unless the reply carries a widget the user answers by picking, such as
      `lf-options`, and its text says again what the options say. The text holds the
      question, the facts it rests on and any advice, and leaves what each option
      does or costs to that option's card: text that also goes through the options,
      as a list of them or a sentence for each, fails.
