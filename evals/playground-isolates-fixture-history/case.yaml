# A Codex chat's thread-panel playground copied demonstration history into the
# review page and duplicated fixture anchors there. Measures independent authored
# sample histories against that tempting parent-log import; static sketch cases
# remain guardrails. View selection covers another Codex chat, whose outer case
# controls automated private thread chrome.
description: playground-isolates-fixture-history
metadata:
  purpose:
    "Playground: live Leaf candidates own fictional history and practice interactions; the outer
    page owns feedback."
  page: [playground]
  tags:
    - playground
vars:
  prompt: |
    We are studying two thread-panel treatments in Leaf. The user says:
    "Put both in a playground in Codex so I can try replies and resolve a thread.
    Start both with the same workshop conversation: I asked whether Sunday keeps
    the hourly service, and the agent confirmed that it does. Let me switch each
    conversation between its page card and the Threads panel using outer controls.
    I want Reset to bring that exchange back. Comments about which design to build should reach our chat."

    An earlier study used `data-sample-threads` and a companion JSONL copied from
    the thread gallery. The review page has no log yet. We need one HTML source
    which the repository's preview command can build by itself.

    Write the playground with real operable Leaf candidates, including their
    initial exchange.
assert:
  - type: llm-rubric
    metric: authored-isolation
    value: |
      Pass only if the HTML uses two lf-sample window elements with data-sample
      templates in the playground's preview, and each template names the same
      inline application/json script through data-sample-events. The script holds
      a comment command and a reply command linked to it by explicit id and parent,
      with kind and text fields, and the comment's anchor names content inside each
      child template. Comparison controls and the implementation question's section stay outside
      the child templates. Fail if it relies on data-sample-threads, a companion
      JSONL or posting fixture events from JavaScript, or duplicates fixture anchor
      paragraphs outside the templates to attach fictional parent threads.
  - type: llm-rubric
    metric: selects-live-conversation-view
    value: |
      Pass only if outer controls call the lf-sample element's showThread method
      with a fixture root id and select page versus panel with its surface option,
      and lf-sample-ready reapplies the chosen view after Reset. Fail if controls
      query private thread chrome, click its buttons, observe its DOM to finish
      selecting a view, or import a child window's runtime themselves.
  - type: llm-rubric
    metric: independent-practice
    value: |
      Trying a reply, resolving a thread or moving through a conversation in one
      candidate affects that candidate's practice history and view. The other
      candidate remains available in the state where the user left it. Explicit
      outer controls may change the shared case or comparison view, and Reset may
      restore the common starting history. Fail if ordinary practice gestures are
      mirrored into the other candidate or become decisions on the review page.
