# From a triage queue of 21 GitHub items whose research came back from subagents as
# what / state / decision / options per item. Each panel kept that order: two
# paragraphs of what the item is and where it stands, then its Ask, which `a` brought
# to the top with those paragraphs out of view. The sibling of
# record-asks-hold-their-premise, on a queue. Base at 672d76d82 failed 7 of 9 over three
# batches. A sentence in the queue paragraph passed 6 of 6; stating in authoring-asks
# that the Ask says what it is about, whatever order the notes came in, passed 3 of 3.
# Stated cold, without the research's shape, both arms passed.
schema_version: '1.0'
name: queue-item-opens-with-its-ask
description: "A queue item opens with its lf-ask, which holds what the item is and where it stands, rather than prose above the Ask."
tags:
- asks
- layout
execution:
  prompt: |
    The user asked: "review all outstanding items, with enough info on each that I can
    whizz through them". Your research subagents have reported back. Write the Leaf
    page, one item at a time beside the queue, each with its decision and your
    recommended pick.

    ### #1402: fix(review-runs): read each convergence listing at a different per_page
    - what: A bot fix for #1401. The convergence check reads one URL twice and takes
      two matching answers as settled, so a stale cache entry agrees with itself; on
      the 09-23 sweep it published 40 already-fixed failures as live. The PR makes
      each read ask for a different page size, so each read is a distinct URL.
    - state: CI green, merges cleanly into main, all 16 tests pass on the merged tree.
      No maintainer review yet. The bot's self-review raised one residual: two sizes
      could both be stale, never observed.
    - decision: Merge as it is?
    - options: A: squash-merge now, closes #1401. B: ask the bot for clock-offset page
      sizes first; the bug stays live until then. C: close it.
    - recommendation: A.

    ### #1171: state-based review queue
    - what: The user's own +3,956/−1,001 rework replacing the review queue with
      state-based admission and a nightly request loop.
    - state: 214 commits behind with 30 conflicting files. Main kept the old queue and
      documents it as the design. The last bot review found an unfixed bug: it posts
      the replacement review before deleting the pending one, which GitHub rejects
      with 422.
    - decision: Close it?
    - options: A: close with a note naming what would reopen it. B: close and file a
      tracking issue. C: rebase and fix, days of conflict resolution.
    - recommendation: A.

    ### #1222: vulnerable transitive pins held by mitmproxy 12.2.3
    - what: A bot tracker for 12 Dependabot alerts that mitmproxy 12.2.3's dependency
      caps keep Dependabot from fixing.
    - state: 12.2.3 is still the latest release; upstream main lifts every cap,
      unreleased. The shipped proxy is installed at job time, not from the lockfile.
    - decision: Wait, or force patched versions now?
    - options: A: wait; the weekly sweep bumps the pin when a release lands. B:
      override dependencies in the dev lockfile. C: dismiss the 8 unreachable alerts.
    - recommendation: A.

    The page directory is not reachable from here, so reply with the complete
    `index.html`, rather than writing a file.
graders:
- name: loads-leaf
  type: tool_used
  tool: Skill
  input_match: leaf
- name: reads-page-authoring
  type: tool_used
  tool: Read
  input_match: page-authoring
- name: judgment
  type: llm
  criteria: |
    Read the HTML as a user who presses `a` on each item, which puts that item's
    `lf-ask` heading at the top of the screen with everything above it in the item's
    panel or section out of view. Pass only if, for every item, what the item is and
    where it stands (for #1402, that the check re-reads one URL and the PR varies the
    page size, and that CI is green; for #1171, the conflicts and the unfixed bug) is
    said inside the `lf-ask`, after its heading and before or within its options. A
    single line of links or status chips above the `lf-ask` is allowed, and anything
    after the `lf-options` is allowed. Fail if any item has a paragraph describing the
    item or its state above its `lf-ask`, leaving the `lf-ask` to hold little more
    than the question, a premise that relies on that paragraph, and the options.
