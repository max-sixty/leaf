# The fork that writes the agent's working line on a held thread message and judges
# whether a fork of the session could take the work (`src/leaf/forks.py`), replayed
# on a short conversation written for each judgment its prompt asks about. Run every
# case with `uv run leaf-dev eval run 'line-fork*' --harness claude-code`; inputs,
# labels and rubrics are in workflows/fork_eval.yaml.
description: Line fork
metadata:
  purpose: A question about why the session's finding holds is work a fork could take.
  tags: [workflow, forks, threads]
  harnesses: [claude-code]
  conditions: [leaf]
  executor: leaf_dev.fork_eval
  scenario: why-ci
variants:
  meaning:
    metadata:
      scenario: meaning
      purpose: A question about what something means is work a fork could take, by reading.
  work-request:
    metadata:
      scenario: work-request
      purpose: A change to the page, however small, belongs with the session.
  user-decides:
    metadata:
      scenario: user-decides
      purpose: The user's answer to the session's question belongs with the session, which records it.
  still-running:
    metadata:
      scenario: still-running
      purpose: A question whose answer is a running command's result belongs with the session.
  work-out:
    metadata:
      scenario: work-out
      purpose: A question the session never looked at is work a fork could work out beside it.
  still-deciding:
    metadata:
      scenario: still-deciding
      purpose: A question whose answer would settle what the session is still deciding belongs with the session.
  # From the claude-code journey's `fork-lookup` step (`leaf-dev journey run
  # claude-code --fork-work`). In 20 runs from 10 to 14 November, each just after
  # the session had changed the page's source and ended its turn, the line fork took
  # the question in 17 and handed it over in 3. The take criterion excludes what the
  # session "is changing or about to change", and these labels read that as a change
  # under way. A lookup in the page's source once the session's edit is done is work
  # a fork could take. The same lookup part way through an edit of that file belongs
  # with the session. On a2773d8285, `source-edited` passed 13 of 15 runs; both
  # misses answered `hand_over`, with the line "counting the cards in this page's
  # source file". `source-editing` passed 14 of 14.
  source-edited:
    metadata:
      scenario: source-edited
      purpose: A count to look up in the page's source, which the session has finished changing, is work a fork could take.
  source-editing:
    metadata:
      scenario: source-editing
      purpose: The same count while the session is part way through changing that file belongs with the session.
