# The summary hint from real thread events and the delivery an explicit wait prints.

delivery:
  format: leaf-delivery/6
  id: <delivery>
  created_at: <time>
  acknowledge: >-
    Whoever ran the `leaf wait` that printed this delivery acknowledges it; until
    then the user's updates read Sent rather than Picked up. If the output was cut
    off, reread it with `leaf delivery read <delivery>`. Follow any `next` commands
    before confirming. If you handle it, acknowledge before any other work; if you
    forward it, acknowledge once it durably arrives there. To acknowledge, start
    `leaf wait --ack <delivery>` as the next background task: it confirms this delivery
    and waits for the next.
  batches:
    - page: <page>
      claim: <claim-session>
      through_seq: 8
      threads:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 0
            actions: 0
          messages:
            - id: event-2
              seq: 2
              author: user
              text: >-
                Which rollout?
            - id: event-3
              seq: 3
              author: agent
              text: >-
                Rollout consideration 1.
            - id: event-4
              seq: 4
              author: user
              text: >-
                Rollout consideration 2.
            - id: event-5
              seq: 5
              author: agent
              text: >-
                Rollout consideration 3.
            - id: event-6
              seq: 6
              author: user
              text: >-
                Rollout consideration 4.
          summaries: []
          summary_hint:
            from: event-2
            through: event-5
          actions: []
      handling:
        h1: >-
          The user answered in a thread. The batch's `threads` holds the thread's
          context, and `leaf page state <page> <thread-id>` reads its full history
          a page at a time.
        h2: >-
          The thread has no title yet. Name it with `--title "<a few words>"` on
          your reply, so the Threads panel lists its subject instead of its opening
          words. If Leaf has already named it from its first message, that name
          stays.
        h3: >-
          This thread's entry in the batch's `threads` has a `summary_hint`: an
          earlier range of messages worth summarizing. As you answer, follow the
          Leaf skill's `references/threads.md`, "Summarize a long discussion". The
          hint owes nothing of its own.
        h4: >-
          If the event asks for work, first post one line in its thread saying what
          you will do, before any other command, even reading the source: `leaf
          response reply <answer.ref> --ephemeral --text "<what you will do, in
          a line>"`. It shows at once and starts the update, which reads Working
          until you answer. Do the work and put the result on the page, with what
          shows it (captures, a figure, the numbers). Then answer with `leaf response
          reply <answer.ref> --done < reply.md`: what changed, in a sentence or
          two, linking the section that shows it. If the event asks for no work,
          answer at once. The page holds the work; the thread holds only the conversation
          about it. `leaf response reply` checks any saved page edit and makes it
          live before posting. If the revision removes the thread's anchor, move
          the thread in the same reply with `--section <id>` (narrowed by `--quote`
          or `--part`), or `--detach` it if its subject left the page. Each answer
          takes `--done` when it delivers what was asked, `--ask` when it asks the
          user something back, or `--todo "<what you owe>"` when it promises work
          beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`,
          "Long-running work").
        h5: >-
          Your reply renders as Markdown in a narrow column: give each point its
          own short paragraph or list item, link a page section as `[its name](#section-id)`,
          and fence code or markup.
      events:
        - attention: true
          kind: reply
          author: user
          parent: event-2
          text: >-
            What do you recommend now?
          id: event-8
          ts: <time>
          seq: 8
          subject:
            kind: thread
            id: event-2
          threads: [event-2]
          handling: [h1, h2, h3, h4, h5]
          answer:
            kind: reply
            to: event-8
            for: event-8
            ref: <delivery>:0:event-8
            writer: agent
