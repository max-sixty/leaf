# Added with the `edit` handling's sentence on retitling: a thread's title names its
# opening message's subject, so a rewrite of that message to a new subject leaves the
# title stale. The envelope is frozen the way user-rewrite-answered's is, with the
# thread titled for its first request and the opening rewritten to a different one. It
# carries the delivery's own handling, so the arms are the wordings, pasted into the
# prompt. Cold, the agent reads references/threads.md, which says to rename a thread
# whose title no longer fits, and both wordings passed 3 of 3 on Claude Code.
# `mid-session` reads no reference, leaving the handling as the guidance in reach:
# without the sentence 0 of 3 on Claude Code and 0 of 2 on Codex, with it 3 of 3 on
# each. Re-frozen after `leaf response reply` replaced `leaf thread reply --for`:
# against 5851b2088 it passed 2 of 2 cold and 2 of 2 `mid-session` on each harness,
# every sample retitling with `leaf thread edit /tmp/review comment-a --title` and
# answering `e7f1a2c3:0:edit-a`.
# Handling re-pasted from the registry at 3fe3eb0af (`--ask`, `--todo`, "update"),
# where it passed 1/1 cold and 1/1 `mid-session` on Claude Code.
# Re-pasted after the registry's readability rewrite (725e29e28 and its review
# fixes), which reworded the `edit` clause and the reply clause; not yet scored.
description: user-rewrite-retitles-its-thread
metadata:
  purpose: "A user's rewrite of a thread's opening message to a new subject retitles the thread."
  tags: [threads, wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:
    {"format": "leaf-delivery/6", "id": "e7f1a2c3", "created_at": 1791448196.695843, "acknowledge": null, "batches": [{"page": "/tmp/review", "claim": "0b7e2a6c-4f1d-4c8e-9a35-2d6f1e8b7c40", "through_seq": 4, "threads": [{"id": "comment-a", "title": "Owner in the opening", "anchor": null, "detached_from": null, "resolved": null, "elided": {"messages": 0, "actions": 0}, "messages": [{"id": "comment-a", "seq": 1, "author": "user", "text": "Please add a rollback plan to the risks section: what we do if the deploy fails halfway through.", "edited": {"id": "edit-a", "seq": 4, "ts": "2026-10-08T01:29:56.465-07:00", "was": "Please revise the opening to name the owner."}}, {"id": "reply-a", "seq": 3, "author": "agent", "agent": "Claude", "text": "The opening now names Priya as the owner."}], "summaries": [], "actions": []}], "handling": {"h1": "The user rewrote their message `message`: `text` is the new wording and `was` the old, and the thread shows only the new. Answer it as it now reads. If your earlier answer or work depended on what changed, say what that changes and redo the work; if it didn't, say so. If `message` opens the thread and the title no longer fits, retitle it with `leaf thread edit <page> <message> --title \"<a few words>\"`.", "h2": "If the event asks for work, first post one line in its thread saying what you will do, before any other command, even reading the source: `leaf response reply <answer.ref> --ephemeral --text \"<what you will do, in a line>\"`. It shows at once and starts the update, which reads Working until you answer. Do the work and put the result on the page, with what shows it (captures, a figure, the numbers). Then answer with `leaf response reply <answer.ref> --done < reply.md`: what changed, in a sentence or two, linking the section that shows it. If the event asks for no work, as a question may not, answer it with that reply at once. The page holds the work; the thread holds only the conversation about it. `leaf response reply` checks any saved page edit and makes it live before posting. If the revision removes the thread's anchor, move the thread in the same reply with `--section <id>` (narrowed by `--quote` or `--part`), or `--detach` it if its subject left the page. Each answer takes `--done` when it delivers what was asked, `--ask` when it asks the user something back, or `--todo \"<what you owe>\"` when it promises work beyond this turn, which stays on you until `leaf task end` (`references/conversation-loop.md`, \"Long-running work\").", "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."}, "events": [{"kind": "edit", "author": "user", "id": "edit-a", "message": "comment-a", "text": "Please add a rollback plan to the risks section: what we do if the deploy fails halfway through.", "attention": true, "ts": "2026-10-08T01:29:56.465-07:00", "seq": 4, "subject": {"kind": "thread", "id": "comment-a"}, "threads": ["comment-a"], "was": "Please revise the opening to name the owner.", "handling": ["h1", "h2", "h3"], "answer": {"kind": "reply", "to": "comment-a", "for": "edit-a", "ref": "e7f1a2c3:0:edit-a", "writer": "agent"}}]}]}

    The page is already served. Only Skill and Read run here, so write out, in order,
    each command you would run, with the full text of any thread reply you would post.
    Then end your answer.
assert:
- type: llm-rubric
  metric: answers-the-edit
  value: |
    Pass only if the agent answers the rewrite with an ordinary `leaf response reply`
    (not `--ephemeral`) naming the edit's reference `e7f1a2c3:0:edit-a`. A progress
    message before it is fine. Any spelling of the launcher passes.
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the agent renames the thread with `leaf thread edit` and `--title`
    to a few words about the rollback plan (the rewritten request), not the owner,
    and its reply to the rewrite is about adding the rollback plan to the risks
    section. Fail if the thread keeps a title about the owner or the opening.
variants:
