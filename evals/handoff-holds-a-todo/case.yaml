# A reply promising later work holds a task where the replying agent carries the
# work itself; one handing it to another session (a `/dispatch`) can hold none, so
# the promise leaves both queues and no result reaches the thread. Cold, the failure
# is ending the task rather than opening it: "a worker touches the page only in a
# role Leaf's instructions give it" can lead the brief to forbid `leaf task`, so the
# instructions say whoever finishes the work ends the to-do, from the dispatched
# session. A dispatch handoff can also answer `--done`: the dispatch skill's own last
# step, pasted in below, pulls that way ("the launch closes out this task"), with
# "work owned by another session stays there" misread as covering the thread, so
# "Long-running work" names a handoff as a promise.
description: handoff-holds-a-todo
metadata:
  purpose: "Conversation loop: work the agent hands to another session still gets a
    to-do on the thread that asked for it, and the brief lets that session end
    it where the result lands."
  tags:
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf page at
    ~/.local/state/leaf/pages/release, served with `leaf server start`. The delivery
    brought one user comment, id 3b9e51a0, opening thread 3b9e51a0 on the `parser`
    section: "/dispatch -- the parser test is flaky again, can you get to the bottom of
    it?" Its answer is `{kind: reply, writer: agent, ref: "5d02c7e1:0:3b9e51a0"}`.

    `/dispatch` is the user's command for handing a task to a separate Claude Code
    session: you write its brief, it starts in its own worktree, and it runs on its
    own for an hour or so. It can run `leaf` commands against this page. You carry on
    with this page and will not hear from that session unless it posts somewhere.
    The dispatch skill's last step reads:

    > Report that the dispatch fired, described by its task ("Dispatched a session
    > to document the rate-limiter config"), not by a branch name. Its result comes
    > back in that session, so the launch is the whole report. Once fired, the
    > receiving session belongs to the user and talks to them directly. Don't track
    > its progress, list it as an open item, or park enrichment for it. The launch
    > closes out this task, however unfinished the dispatched work is.

    Only Skill and Read run here, so write out,
    in order, each command you would run on the page in this turn, and the brief you
    would hand the dispatched session.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if the commands answer 3b9e51a0 with `leaf thread reply` carrying
      `--todo "<title>"` for the parser investigation; and if the brief gives the
      dispatched session what it needs to end that to-do where its result lands (the
      page and the to-do's id, with `leaf task end`), or otherwise names how the to-do
      is ended. Fail if no to-do is opened, or if nothing provides for ending it.
