name: publish-site

# Every product and example route uses one build through a Cloudflare Worker origin:
# immutable documents and browser assets at the edge, and the canonical Python Leaf
# server for per-reader API state.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      # The whole skill payload: the site serves a vendored layer, and that is merged
      # from the kernel and bundled package alike — a change to either
      # is a change to what a visitor loads.
      - 'skills/leaf/**'
      - 'bin/leaf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'example-previews.json'
      - 'scripts/example_data.py'
      - 'scripts/example_assets.py'
      - 'scripts/preview.py'
      - 'scripts/site.py'
      - 'worker/**'
      - 'Dockerfile.website'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-deploy
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Deploy public Leaf pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A Containers deploy activates the Worker before its image rollout necessarily
      # finishes. Prove the public route has crossed both boundaries before calling the
      # deployment successful. One cold start can exceed ten seconds, and writing the
      # response before testing it preserves Cloudflare's final error when retries fail.
      - name: Verify public Leaf pages
        run: |
          COOKIE="__Host-leaf-page=$(openssl rand -hex 16)"
          verify_page() {
            local page_url="$1"
            local state_url="$2"
            local predicate="$3"
            local shell_layer
            local response_layer
            local fallback_layer
            local shell
            local fallback_shell
            local response
            local headers
            local attempt=0
            shell=$(mktemp)
            fallback_shell=$(mktemp)
            response=$(mktemp)
            headers=$(mktemp)
            while (( attempt++ < 20 )); do
              if curl --fail-with-body --silent --show-error \
                --output "$shell" \
                --cookie "$COOKIE" \
                --max-time 25 \
                "$page_url" \
                && grep --quiet --fixed-strings 'data-lf-server="published"' "$shell"; then
                shell_layer=$(grep --only-matching 'data-lf-layer="[^"]*"' "$shell" | head -1 | cut -d'"' -f2)
              else
                shell_layer=
              fi
              if test -n "$shell_layer" && curl --fail-with-body --silent --show-error \
                --output "$response" \
                --dump-header "$headers" \
                --cookie "$COOKIE" \
                --header "Leaf-Layer: $shell_layer" \
                --max-time 25 \
                "$state_url"; then
                response_layer=$(awk 'tolower($1) == "leaf-layer:" {gsub("\\r", "", $2); print $2}' "$headers" | tail -1)
                if jq --exit-status "$predicate" "$response"; then
                  if test "$response_layer" = "$shell_layer"; then
                    return 0
                  fi
                  if grep --quiet --ignore-case '^set-cookie: __Host-leaf-container=1;' "$headers" \
                    && curl --fail-with-body --silent --show-error \
                      --output "$fallback_shell" \
                      --cookie "$COOKIE; __Host-leaf-container=1" \
                      --max-time 25 \
                      "$page_url"; then
                    fallback_layer=$(grep --only-matching 'data-lf-layer="[^"]*"' "$fallback_shell" | head -1 | cut -d'"' -f2)
                    if test "$fallback_layer" = "$response_layer" \
                      && ! grep --quiet --fixed-strings 'data-lf-server="published"' "$fallback_shell"; then
                      return 0
                    fi
                  fi
                fi
              fi
              sleep 5
            done
            cat "$response" >&2
            return 1
          }
          verify_page \
            https://leaf.page/ \
            https://leaf.page/api/state \
            '.publication.kind == "product" and .claims == []'
          verify_page \
            https://leaf.page/examples/design-decision/ \
            https://leaf.page/examples/design-decision/api/state \
            '.publication.kind == "example" and .claims == []'
