preference: '"A standing preference for all my pages from now on: I read them in a window about
  900px wide, beside my editor. At that width, keep the page''s summary, status, contents or
  queue beside the main content rather than stacked above or below it."'
widths:
  laptop:
    viewport:
    - 1440
    - 900
    description: a 1440px laptop window
  narrow:
    viewport:
    - 900
    - 900
    description: a 900px window
  short:
    viewport:
    - 900
    - 600
    description: a short 900px by 600px window
  phone:
    viewport:
    - 390
    - 844
    description: a 390px phone
prompts:
  first:
    leaf: |-
      You have the Leaf skill at {payload}/skills/leaf/SKILL.md. Read and follow it, resolving references from {payload}/skills/leaf/. $LEAF is {payload}/bin/leaf. Check the page with `$LEAF page check {page} --render`, fix findings and stamp it.

      Write the page at {page}/index.html. This run is non-interactive: nobody will
      answer in the page. Produce a finished record with readable evidence and the
      choices or navigation the request needs. You may use the browser tooling available
      on this machine. Do not start an agent feedback watcher or wait for input. Reply
      with one line naming the path.

      The user's request follows.

      {request}
    html: |-
      Build with ordinary HTML, CSS and JavaScript. No Leaf instructions, widgets or runtime are available. Check your output in the browser and fix findings.

      Write the page at {page}/index.html. This run is non-interactive: nobody will
      answer in the page. Produce a finished record with readable evidence and the
      choices or navigation the request needs. You may use the browser tooling available
      on this machine. Do not start an agent feedback watcher or wait for input. Reply
      with one line naming the path.

      The user's request follows.

      {request}
  second:
    leaf: |
      The user writes:

      {preference}

      Revise the page at {page} to follow this preference. Check it with `$LEAF page check {page} --render`, fix findings and stamp it.
      Do not start an agent feedback watcher or wait for input. Reply with its path.
    html: |
      The user writes:

      {preference}

      Revise the page at {page} to follow this preference. Check your output in the browser and fix findings.
      Do not start an agent feedback watcher or wait for input. Reply with its path.
  comment:
    leaf: |
      The user has left a comment on the page at {page}. Handle it.
      Check with `$LEAF page check {page} --render`, fix findings and stamp the revision.
      Do not start an agent feedback watcher or wait for input. Reply with its path.
    html: |
      The user writes about the page at {page}:

      "On {target}: {text}"

      Handle it. Check your output in the browser and fix findings.
      Do not start an agent feedback watcher or wait for input. Reply with its path.
  continuation: The user has reviewed {page}. Add a short Review status note saying it has now
    been reviewed. Preserve their existing decisions. Check with `$LEAF page check {page} --render`
    and stamp the revision. Do not start a watcher or wait for input. Reply with its path.
  choice_reader: 'Read the Leaf skill at {payload}/skills/leaf/SKILL.md. The page at {page}
    has been reviewed by a user. Read its current state: which option ids are selected in {widget}?
    Don''t edit the page or serve it.'
cases:
  document:
    inputs:
      choice: true
      comment:
        target: the recommendation's ask of the database owners
        quotes:
        - the database owners to say whether 55% peak CPU is acceptable
        - whether 55% peak CPU is acceptable
        - 55% peak CPU
        text: The database owners are Mei Tanaka's team. Name them here and ask for their answer
          by Wednesday, the day before the decision.
        applied: Mei Tanaka
    assert:
    - &phase_1_quality
      type: agent-rubric
      metric: phase-1-quality
      value: 'Open every screenshot the output lists for version 1 before judging. Each width''s
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page''s
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don''t infer interaction behavior from an unoperated screenshot. Pass only
        if, at every width, version 1 keeps the request''s substantive information, lets the
        user find and read the evidence, and provides the decisions or navigation the request
        needs. '
    - &phase_2_quality
      type: agent-rubric
      metric: phase-2-quality
      value: 'Open every screenshot the output lists for version 2 before judging. Each width''s
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page''s
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don''t infer interaction behavior from an unoperated screenshot. Pass only
        if, at every width, version 2 keeps the request''s substantive information, lets the
        user find and read the evidence, and provides the decisions or navigation the request
        needs. '
    - &phase_3_quality
      type: agent-rubric
      metric: phase-3-quality
      value: 'Open every screenshot the output lists for version 3 before judging. Each width''s
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page''s
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don''t infer interaction behavior from an unoperated screenshot. Pass only
        if, at every width, version 3 keeps the request''s substantive information, lets the
        user find and read the evidence, and provides the decisions or navigation the request
        needs. '
    - &phase_2_preference
      type: agent-rubric
      metric: phase-2-preference
      value: Open every screenshot the output lists for version 2 before judging. Each width's
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page's
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don't infer interaction behavior from an unoperated screenshot. Pass only
        if version 2 follows the standing width preference the output quotes.
    - &comment_answered
      type: agent-rubric
      metric: comment-answered
      value: Pass only if the author's answer to the user's comment, which the output quotes,
        tells the user that the change the comment asked for is made.
  dashboard:
    inputs:
      choice: true
      comment:
        target: the follow-up to confirm the timeout change with the payments team
        quotes:
        - Confirm the timeout change with the payments team (Dana).
        - Confirm the timeout change with the payments team
        - timeout change with the payments team
        text: Dana confirmed at 15:52 that 7.2's 3 s connect timeout is the cause. Mark this
          follow-up done and say so where the page explains the cause.
        applied: '15:52'
    assert:
    - *phase_1_quality
    - *phase_2_quality
    - *phase_3_quality
    - *phase_2_preference
    - *comment_answered
  queue:
    inputs:
      choice: true
      comment:
        target: ESC-4110 (Brightline Dental)'s suggested action
        quotes:
        - point to the feature request board, already planned for Q4
        - point to the feature request board
        - feature request board
        text: 'Brightline is on a Team trial that converts next week, so don''t just close it:
          route it to their account manager, Sam Okafor, with the Q4 plan.'
        applied: Sam Okafor
    assert:
    - *phase_1_quality
    - *phase_2_quality
    - *phase_3_quality
    - *phase_2_preference
    - *comment_answered
  configuration:
    inputs:
      choice: false
      comment:
        target: the ledger-reconciliation-lag alert
        quotes:
        - minutes since the last successful ledger reconciliation run
        - last successful ledger reconciliation run
        - ledger-reconciliation-lag
        text: Finance owns this alert. If it pages, it pages the finance-ops rotation, not payments
          on-call; show that beside its routing.
        applied: finance-ops
    assert:
    - *phase_1_quality
    - *phase_2_quality
    - *phase_3_quality
    - *phase_2_preference
    - *comment_answered
  sidebar-page-at-900px:
    inputs:
      choice: false
    assert:
    - type: agent-rubric
      metric: phase-1-quality
      value: Open every screenshot the output lists for version 1 before judging. Each width's
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page's
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don't infer interaction behavior from an unoperated screenshot. Pass only
        if, at every width, version 1 keeps the request's substantive information, lets the
        user find and read the evidence, and provides the decisions or navigation the request
        needs. The completed rollout's forty entries must remain readable in the document's
        scroll, rather than showing only one screen of a separate listing. At both 900px window
        heights, all six checks and their failing result stay accessible beside the log as it
        scrolls. Page navigation and any supporting sidebar content remain reachable; a sticky
        box must not hold them below the window. On a phone, the regions stack without covering
        the log or hiding its entries.
    - type: agent-rubric
      metric: phase-2-quality
      value: Open every screenshot the output lists for version 2 before judging. Each width's
        screenshots run top to bottom with overlap. Fixed viewer controls are outside the page's
        content, and a region with its own scroll shows only its first screen. Judge only what
        a user sees; don't infer interaction behavior from an unoperated screenshot. Pass only
        if, at every width, version 2 keeps the request's substantive information, lets the
        user find and read the evidence, and provides the decisions or navigation the request
        needs. The completed rollout's forty entries must remain readable in the document's
        scroll, rather than showing only one screen of a separate listing. At both 900px window
        heights, all six checks and their failing result stay accessible beside the log as it
        scrolls. Page navigation and any supporting sidebar content remain reachable; a sticky
        box must not hold them below the window. On a phone, the regions stack without covering
        the log or hiding its entries.
    - *phase_2_preference
