version: 2

# Nothing watched anything here before this file. The pinned versions that stay
# outside it are `tend-weekly`'s, in `.claude/skills/running-tend/SKILL.md`: the
# bundles under `assets/vendor/`, which are rebuilt by their scripts rather than
# resolved from a manifest.
#
# The uv entry watches the repository's one lock. Its runtime packages are what
# an install of leaf actually resolves — a bump there changes what every host
# runs — and the dev group is the suite's; the lock records both.
#
# Grouped so each ecosystem opens one PR a week rather than one per dependency;
# on a repo this size the review cost of a group is the same as a single bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
