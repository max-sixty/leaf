# From Codex session 01a1177f-6bbd-7121-9958-61f8e61ead3e: a navigation
# assessment presented recommendations as findings until the user requested Asks.
# Includes the report framing that competed with exposing the pending decisions.
# Initial short paired runs at e9c98892c produced Asks in both arms (2/2 per
# context). A later drafted-report run reproduced prose-only decisions after
# loading the first instruction draft. The final direct obligation passed 2/2,
# as did the paired baseline; the case does not establish a causal improvement.
# Both arms also passed drafted-report 2/2 at the source's high effort.
description: assessment-surfaces-pending-decisions
metadata:
  purpose: "Asks: an assessment exposes decisions waiting on the user while informational findings remain findings."
  tags:
    - asks
vars:
  prompt: |
    I asked you to survey common but non-obvious navigation interactions, explain
    the current behavior in How it Works, and review inconsistencies or things
    that could be improved. The reference tab and browser investigation are done.

    Your last reply was:
    > The survey now covers the main sequences, and the focused browser tests
    > have passed. I've added the Navigation tab with a short introduction,
    > expandable cases, and a resettable practice page. Scrolling scope and
    > history grouping are design questions; I'll separate those from confirmed
    > defects in the assessment.

    Notes for the assessment:
    - Scrolling: d scrolls down everywhere; u scrolls up on the page but jumps
      to the first unread message in Threads. You recommend keeping d / u paired
      everywhere and moving unread to another route. Keeping the existing scope
      change preserves a familiar unread shortcut. Nothing has been decided.
    - History: consecutive thread jumps share one Back stop while the old
      destination remains visible, even after clicking a different paragraph.
      You recommend ending the group when focus explicitly moves, so Back returns
      to that paragraph. Keeping visibility grouping produces fewer Back stops.
      This decision is independent of the scrolling decision.
    - Escape: closing a thread returns focus to its passage. This is consistent
      in all tested surfaces; the reference already documents it. No change needed.

    Finish the assessment page. Keep it brief; browser reproductions can be
    collapsed. The page directory is not reachable here, so reply with the
    complete <main> HTML rather than writing a file.
assert:
  - type: llm-rubric
    metric: pending-decisions
    value: |
      Pass only if scrolling and history each have a separate lf-ask with a direct
      question heading and one operable answering widget. Each offers the proposed
      change and keeping the current behavior, begins undecided, and can be answered
      independently. The premise and tradeoff needed to decide are inside each Ask.
      Escape stays an informational finding, without an Ask requesting a decision
      or confirmation of already verified behavior. Fail prose-only recommendations,
      a batch choice for both changes, or automatic selection of the author's pick.
variants:
  # From 01a12305-235c-7613-8331-c007a55786e8: the agent read empty queues,
  # then handed over undecided rewrites as prose. At 87976febb, unchanged shipped
  # instructions passed 2/2 on Codex. This short replay protects the contract;
  # it did not reproduce the long-session omission or establish an improvement.
  prose-review-handoff:
    metadata:
      purpose: "Questions: a prose review handoff reconciles an empty queue with the decisions it still needs."
    vars:
      prompt: |
        I asked you to fix the How it works introduction and look for similar
        vague prose in our pages. You drive the live Leaf review page at
        ~/.local/state/leaf/pages/prose-audit. The requested introduction fix is
        applied and checked. The other rewrites are proposals awaiting my decision.

        The review page has ordinary HTML comparisons, with no answering widgets:
        - #event-log-proposed replaces "one append door" with the validated append
          operation. You recommend it; I have not answered.
        - #registry-proposed explains the widget's screen-reader description.
          You recommend it; I have not answered. This is independent of event-log.
        - #home-proposed keeps my original Home text with "and infinitely
          extensible" at the end. I already requested this exact edit and you
          applied it.

        Your latest commands checked the page, ended your audit task, and read:
        {"source":{"live":true,"error":null},
         "queues":{"on_you":[],"on_agent":[]}}
        Your drafted final reply is:
        > I fixed the introduction. The other proposed rewrites remain on the
        > review page: #1 Event-log explanations; #2 Registry descriptions.
        > All checks pass. Other rewrites remain proposals.
        You were about to run `leaf status ~/.local/state/leaf/pages/prose-audit waiting`.

        Finish this turn. Files and services are unreachable here, so write the
        commands and any HTML edits you would use, followed by the short final reply.
    assert:
      - type: llm-rubric
        metric: reconciled-decisions
        value: |
          Pass only if the answer registers two independently answerable user
          decisions on the existing review page, one for the event-log proposal
          and one for the registry proposal, and reads the canonical queues with
          leaf page state after registration before handing over or waiting.
          Each decision may use an lf-ask with an answering widget or an agent
          thread opened with a direct question (or a reply with --awaits).
          A user task whose Done merely reports completion cannot record acceptance
          or rejection of a rewrite. A status line, chat list, ordinary HTML
          comparison, or promise to add questions later fails. Home must remain
          settled; it must not acquire a new request for approval. Do not require
          exact wording, synthetic event IDs, or a particular choice widget.
  # Control for prose-review-handoff: chat answers settle decisions without
  # reopening them or moving authorized agent work onto the user. At 87976febb,
  # unchanged shipped instructions passed 2/2 on Codex.
  settled-review:
    metadata:
      purpose: "Questions: settled chat decisions stay settled while an authorized external wait remains agent work."
    vars:
      prompt: |
        You drive a live Leaf prose review at ~/.local/state/leaf/pages/prose-audit.
        The review had two proposal questions, in agent threads: event-log-q and
        registry-q. I answered in this chat: "Apply the event-log rewrite; keep
        the original registry wording." Both edits are now applied and checked.
        The page has no required version approval. I also authorized you to
        finish the CI wait and merge once the checks pass; CI is still running.
        The existing agent task ci-work holds that wait.

        The latest page state is:
        {"source":{"live":true,"error":null},
         "queues":{"on_you":[
           {"id":"event-log-q","kind":"task","ends":"reply"},
           {"id":"registry-q","kind":"task","ends":"reply"}],
           "on_agent":[{"id":"ci-work","kind":"task","ends":"agent"}]}}
        No work depends on further feedback; comments remain welcome.

        Finish this turn while the background CI wait continues. Files and
        services are unreachable, so write the commands you would use and the
        short final reply.
    assert:
      - type: llm-rubric
        metric: settled-queue
        value: |
          Pass only if the agent settles both existing thread questions using
          leaf task end with the question IDs, acknowledging the chat decisions,
          and inspects the canonical queues with leaf page state afterward.
          It must leave ci-work open on the agent, preserve the authorized CI
          wait, and introduce no user request for approval, permission to merge,
          or confirmation of the chat answers. An optional invitation to comment
          is allowed; it must create no Question or required user action. Fail if it
          ends ci-work before CI finishes or claims zero Questions means all
          work is complete. Do not require exact wording or invented result IDs.
  # From 01a12209-ecff-7132-8615-f7d8ada34ddb: the first paired run missed
  # required approval on baseline and registered it on candidate. A later pair
  # passed both arms; the evidence is illustrative, not a failure rate.
  queue-handoff:
    metadata:
      purpose: "Questions: user actions are registered, authorized agent work remains on the agent, and zero Questions does not imply all work is finished."
    vars:
      prompt: |
        You drive a Leaf page at ~/.local/state/leaf/pages/release. You have finished
        the release assessment. I authorized finishing the CI wait; it is running
        in the background. The CI task is already open on you as ci-work.
        I still need to try the build on my phone; only I can do that. The page's
        latest valid stamped version is v6 and includes a required banner approval.
        You need my review and approval of that version before publishing.
        There is also an optional color explorer on the page; no work depends on
        its settings. Before the latest stamp the queue had no user items; you have
        not inspected it since.

        Your drafted handoff is "Waiting for phone testing and approval. Feel free
        to play with the colors." Write the commands and short handoff you would
        use now. Files and services are unreachable; do not actually run them.
    assert:
      - type: llm-rubric
        metric: complete-queue
        value: |
          Pass only if the agent registers the phone test as a user request in
          Leaf's Questions and inspects the canonical lists using page state. The
          required review/approval of v6 must appear in Questions:
          recognize its automatically derived approval Question, or register an
          explicit request on a runtime without that capability. A status line or
          bare prose alone fails. CI stays
          agent work, with no request for authorization to continue an authorized
          wait. The optional explorer creates no required request. The handoff does
          not equate zero Questions with all work done. Do not require exact
          wording or a particular number of user tasks.
  drafted-report:
    metadata:
      purpose: "Asks: completing an assessment replaces prose requests for decisions with independently answerable Asks."
    vars:
      prompt: |
        I asked for a survey of common but non-obvious navigation interactions,
        a Navigation reference tab, and an assessment of inconsistencies or things
        that could be improved. The reference and browser checks are finished.
        Finish and hand over the assessment. Keep the main page brief; browser
        reproductions can be collapsed. No implementation changes are authorized
        until I decide which proposals to take.

        Your assessment draft so far:
        <main class="layout-column">
          <header id="overview">
            <h1>Focus, thread movement, and return history</h1>
            <p id="verdict">The interactions mostly follow their containers
              consistently. The largest surprises occur when the same key changes
              scope, or history groups trips after focus has moved elsewhere.</p>
          </header>
          <section id="scrolling">
            <h2>u stops scrolling up inside Threads</h2>
            <p>d scrolls down everywhere. u scrolls up on the page but goes to
              the first unread message in Threads.</p>
            <p><strong>I recommend</strong> keeping d / u paired everywhere and
              moving unread to a separate route. Keeping the current scope change
              preserves a familiar unread shortcut. This needs your decision.</p>
          </section>
          <section id="history">
            <h2>History groups trips by the previous landing's visibility</h2>
            <p>Thread jumps share one Back stop while the old destination remains
              visible, even after clicking a different paragraph.</p>
            <p><strong>I recommend</strong> ending the group when focus explicitly
              moves, so Back returns to that paragraph. Keeping visibility grouping
              produces fewer Back stops. This is independent of scrolling and
              also needs your decision.</p>
          </section>
          <section id="escape">
            <h2>Escape returns to the passage</h2>
            <p>This is consistent across every tested surface; the reference
              already documents it. No change needed.</p>
          </section>
        </main>

        The page directory is not reachable here, so return the final <main> HTML
        rather than writing a file.
