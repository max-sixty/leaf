# https://pre-commit.com/
#
# Hooks check without rewriting files, so lint can share a checkout with readers.
# Captures and generated files are excluded: their source lives elsewhere.
#
# The vendored bundles are what build/vendor.py fetches and builds; a formatted
# copy conflicts on the next run of it.
#
# examples/corpus.html is generated by `leaf-dev corpus` out of the sibling examples,
# and a hook editing it puts the two out of step until someone reruns the command. The PR
# walkthrough patch is an exact GitHub data capture; its spaces are source evidence too.
# One exclude for the file rather than one per hook, because the rule is the file's and
# a per-hook list misses whichever hook is added next. Regenerate the corpus with
# `leaf-dev corpus` whenever its sibling examples change.
# Historical eval fixtures are frozen, hash-checked source evidence, including
# reconstructed variants. Formatting one would invalidate its provenance pin.
exclude: ^(skills/leaf/packages/default/shadow\.css$|skills/leaf/(assets/vendor|packages/.*/vendor)/|examples/(corpus\.html|pr-walkthrough\.patch)$|evals/ui-review-detection/fixtures/)

repos:
  - repo: local
    hooks:
      # Native pygrep checks preserve the whitespace rules without a fixer or
      # another tool dependency. Empty files are valid; nonempty files end in
      # exactly one LF, CRLF, or CR, matching end-of-file-fixer's contract.
      - id: trailing-whitespace
        name: check trailing whitespace
        language: pygrep
        # pygrep reads LF-delimited lines: preserve a CRLF terminator, but a bare
        # CR or the extra CR before CRLF is trailing whitespace.
        entry: '[\t \v\f](?=\r?\n?\Z)|\r(?=\r\n\Z|\Z)'
        types: [text]
      - id: final-newline
        name: check final newline
        language: pygrep
        entry: '\A\Z|[^\r\n](?:\r\n|\r|\n)\Z'
        args: [--multiline, --negate]
        types: [text]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=no]
      # Every tracked byte ships in every install (AGENTS.md, "The install runs this
      # tree"). It checks only files a commit adds, past the exclude above.
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  # Definitions nothing reaches. The hook reads the whole Python tree whatever
  # changed, since a definition dies in the change that removes its last caller,
  # in another file; `[tool.vulture]` in pyproject.toml holds the scope and patterns.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  # JavaScript and HTML. Not CSS, where it splits theme.css's grouped rules one per
  # line, and not markdown, where it strips the indent off a list item's continuation
  # lines. HTML is safe because every whitespace-significant body on a page is inside a
  # <pre>, which is the one thing prettier's own table reads as untouchable; a bare
  # custom element's body it would reflow into a paragraph, stylesheet be damned.
  #
  # Explicit formatting must use the version pinned below: an unpinned prettier
  # disagrees about `</pre>` placement and rewrites every authored example.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        entry: prettier --check --ignore-unknown
        types_or: [javascript, html]
  # Parse every JavaScript module and enforce the rules a module's own source answers:
  # which specifiers an owner may name, who may write the document root, who may
  # publish semantic state. The browser loader proves that named imports exist.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--max-warnings=0]
  # The runtime import graph, which no per-file linter can see: cycles, the direct
  # edges that cross a boundary, and the transitive closures `.dependency-cruiser.mjs`
  # declares. Every rule reads the whole graph, so the hook takes no filenames and the
  # pattern below only wakes it. dependency-cruiser is not an eslint plugin, so it
  # needs a hook of its own, pinned here as every other tool in this file is.
  # Hooks also run outside CI without `pnpm install --frozen-lockfile`, so a tool
  # pinned only in the build's package.json would not always be installed.
  - repo: local
    hooks:
      - id: dependency-cruiser
        name: dependency-cruiser
        language: node
        additional_dependencies: [dependency-cruiser@18.3.1]
        entry: depcruise --output-type err skills/leaf/assets/runtime skills/leaf/packages/default/runtime
        pass_filenames: false
        files: ^(skills/leaf/assets/(leaf\.js|runtime/.*\.js)|skills/leaf/packages/[^/]+/runtime/.*\.js|\.dependency-cruiser(?:-resolve)?\.mjs)$
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
  # actionlint's schema rejects `concurrency.queue`, which tend's generated
  # workflows set; `.github/actionlint.yaml` ignores that one key for those files.
  # Pin upstream's native parallel-step support until it is released. This also
  # checks wait targets rather than ignoring the new syntax:
  # https://github.com/rhysd/actionlint/pull/695
  - repo: https://github.com/rhysd/actionlint
    rev: bf6b9188a5fd7b4e7b7d244a865a60165bdc6783
    hooks:
      - id: actionlint
  # actionlint already shellchecks the `run:` blocks in the workflows above. This
  # covers the shell outside them, starting with bin/leaf, which every install
  # executes.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
