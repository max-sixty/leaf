# The one project: the repository is the plugin, and the plugin is this uv
# project. A host copies the tracked tree into its plugin cache; `bin/leaf`
# there runs `uv run --project <that copy>`, and the environment appears on the
# first run, synced into `.venv` beside this file: one environment per
# installed version.
#
# The module lives at `skills/leaf/scripts/leaf` because the skill directory is
# what a host reads, and `module-root` points the build backend at it rather
# than moving the tree to suit packaging. `uv sync` installs the project
# editable, so `schema.py`'s `SKILL_ROOT` still resolves through `__file__`
# into the tree and finds `assets/` and `packages/` beside it.
#
# Dependencies state the lowest version the suite passes on, with no upper cap.
# `uv.lock` ships in the install, so a host runs the resolution the suite was
# last green on; CLAUDE.md carries why that keeps the host's index in the loop.
#
# The dev group is what the suite and `scripts/` need on top of the runtime:
# pytest, the accessibility checks, and the demo recorder's frames. The scripts
# are stdlib-only bar that recorder, and it runs here rather than carrying a
# header of its own — a developer's tool like the suite, so one environment
# covers both. `bin/leaf` passes `--no-dev`, so an install never fetches the
# group, though the lock records it.
#
# Playwright is a runtime dependency because the skill's own flow runs the
# browser: `version check --render` gates every finished page and `version
# export` copies one. Its wheel lands in each version's environment as links
# into uv's shared cache, so the disk it takes is paid once per machine, not
# per install. A `--with` overlay carries no console scripts, so it is not a
# route to supplying it per dispatch.

[project]
name = "leaf"
version = "0"
requires-python = ">=3.10"
dependencies = [
  "click>=8",
  "jsonschema>=4",
  "mcp>=2.1.1",
  "playwright>=1.49",
  "tinycss2>=1.4",
]

[project.scripts]
leaf = "leaf.cli:cli"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "skills/leaf/scripts"
module-name = "leaf"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-xdist>=3",
  "axe-playwright-python>=0.1.4",
  # scripts/record-demo.py, which draws its frames.
  "pillow>=11",
]

# The suite is round trips through a real browser rather than computation, so tests
# shard independently: every test gets its own tmp_path, XDG homes, and server.
# The site module is one load group because its module-scoped build and host are the
# shared setup; everything else stays individually balanced. Chromium launches once
# per worker for the run.
# Two workers cap the browser load when suites overlap.
# `-n0` to debug a single test.
[tool.pytest.ini_options]
addopts = "-n 2 --dist loadgroup"
# `scripts/` is not a package; the suite imports its example-data module directly.
# The `leaf` package needs no entry here: the project installs itself editable.
pythonpath = ["scripts"]
markers = ["nightly: complete browser or site integration; `--run-nightly` runs it"]
