# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up, so the page cannot idle yet. Leaf's hook puts them in your context at your next turn.

the watch wakes the session: >-
  <page> has new input; Leaf's prompt hook puts it in your context with this notification

delivered at prompt:
  instruction: >-
    Leaf has new input for your turn. Read this complete delivery before answering.
  delivery:
    format: leaf-delivery-v3
    id: <delivery>
    created_at: <time>
    acknowledge: null
    batches:
      - page: <page>
        through_seq: 2
        threads:
          - id: event-2
            title: null
            anchor: null
            detached_from: null
            resolved: null
            elided:
              messages: 0
              actions: 0
            messages: []
            summaries: []
            actions: []
        handling:
          h1: >-
            This event's thread has no title yet: name it by adding `--title "<a
            few words>"` to the reply that answers it, so the thread panel lists
            its subject rather than its opening words. If Leaf has named it from
            its opening message by then, that name stands.
          h2: >-
            When the event asks for work, name that work before any other, including
            reading the source it concerns: `leaf task start <page> <event-id> "<the
            work, in a line>"`. The move then reads Working, and the line stands
            beside the thread and in the banner until you answer. Do the work and
            put its result on the page, with whatever shows it (captures, a figure,
            the numbers), then answer with `leaf thread reply <page> --for <event-id>
            < reply.md`: what changed, in a sentence or two, linking the section
            that shows it. When the event asks for no work, as a question may not,
            answer it with that reply at once. The page carries the work, and the
            thread only the conversation about it. `leaf thread reply` checks any
            saved page edit and makes it live before posting. If a revision removes
            what the thread is anchored on, move the thread in the reply that reports
            it with `--section <id>` (narrowed by `--quote` or `--part` if needed),
            or `--detach` it if its subject has left the page. Add `--awaits` only
            if your reply's prose asks the user something.
          h3: >-
            Your reply renders as Markdown in a narrow column: give each point its
            own short paragraph or list item, link a page section as `[its name](#section-id)`,
            and fence code or markup.
        events:
          - attention: true
            kind: comment
            author: user
            revision: 1
            text: >-
              Add the camera first.
            id: event-2
            ts: <time>
            seq: 2
            subject:
              kind: thread
              id: event-2
            threads: [event-2]
            handling: [h1, h2, h3]
            answer:
              kind: reply
              to: event-2
              for: event-2
  attention: ''

acknowledged at stop:
  hookSpecificOutput:
    hookEventName: Stop
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`).

      Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf page state <page> <id>`.

idle before answer:
  exit: 1
  output: |
    1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`); answer before idling. Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf page state <page> <id>`.

answer:
  kind: reply
  author: agent
  agent: Claude
  session: s1
  parent: event-2
  text: >-
    I will add the camera first.
  responds: event-2
  id: event-4
  attention: false
  ts: <time>
  seq: 4

answered at stop: null
