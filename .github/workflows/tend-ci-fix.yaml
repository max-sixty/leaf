name: tend-ci-fix
on:
  workflow_run:
    workflows: ["ci", "publish-site"]
    types: [completed]
    branches: ["main"]

jobs:
  fix-ci:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false' && contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    concurrency:
      # A red branch fails every push that follows, each on its own commit, so
      # one session per branch — not per commit — is what collapses the burst.
      # The watched workflow is in the key too: a red `publish-site` must not
      # starve behind a stream of red `ci`. Never cancel — a running session
      # may already have pushed a branch or opened a PR. Default queue depth
      # is right: the newest failure replaces the pending one.
      group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium webkit --only-shell
        name: Install Chromium headless shell and WebKit
      - run: uv run python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.webkit.launch().close(); p.stop()"
        name: Launch both browsers
      - run: echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
        name: Export the Cloudflare log token for agents that read the logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event.issue && !github.event.issue.pull_request)) && secrets.CLOUDFLARE_API_TOKEN || '' }}

      - uses: max-sixty/tend/codex@0.3.2
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: restricted
          control_plane_owner: ""
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          bot_name: leaf-agent
          model: gpt-6-sol
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            $ci-fix ${{ github.event.workflow_run.id }}
            - Run URL: ${{ github.event.workflow_run.html_url }}
            - Conclusion: ${{ github.event.workflow_run.conclusion }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Commit message: ${{ github.event.workflow_run.head_commit.message }}
