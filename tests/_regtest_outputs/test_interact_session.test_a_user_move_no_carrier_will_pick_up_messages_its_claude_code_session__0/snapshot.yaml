# A real user POST reaches the Claude Code socket after its watcher died.
# This is the complete user frame, without the separate authentication frame.

socket user frame:
  type: user
  session_id: s1
  message:
    role: user
    content: >-
      leaf: <page> has new input, which arrives with this message, and no `leaf
      wait` is running for this session. So that later input wakes you, start an
      unnamed `leaf wait` as a background task with `timeout` 7200000 (milliseconds),
      the longest Claude Code allows.
