# Sibling of record-asks-hold-their-premise (#1322) for a table and a log excerpt.
# Base at 64186bcb9 0 of 3, the change 3 of 3.
description: record-asks-hold-their-table
metadata:
  purpose: 'Asks: on a record page, an Ask that turns on a measurement holds the measured table inside
    the lf-ask, and long backing follows it.'
  tags:
  - asks
vars:
  prompt: "You are writing a Leaf status page for a service migration. It has sections for\ncutover progress,\
    \ a timeout regression, and the rollback plan. Write the timeout\nregression section, which puts a\
    \ question to the user.\n\nYour notes:\n- Since the cutover, 2.1% of export requests hit the 5 s gateway\
    \ timeout, up from\n  0.1%. Exports over 40 MB account for nearly all of them.\n- Measured over one\
    \ day of traffic:\n\n  | export size | requests | p50 | p95 | over 5 s |\n  | --- | --- | --- | ---\
    \ | --- |\n  | under 10 MB | 18,240 | 0.4 s | 1.1 s | 0.0% |\n  | 10\u201340 MB | 3,112 | 1.9 s |\
    \ 3.8 s | 0.3% |\n  | over 40 MB | 911 | 4.6 s | 9.2 s | 41% |\n\n- The user decides between raising\
    \ the timeout to 15 s for exports only,\n  streaming large exports so the first byte arrives within\
    \ 5 s, or leaving it\n  while the export team rewrites the job next quarter.\n- You also have a 60-line\
    \ gateway log excerpt showing three timed-out requests,\n  and a paragraph on why the new gateway\
    \ buffers exports where the old one\n  streamed them. Include both.\n\nThe page directory is not reachable\
    \ from here, so reply with the section's HTML\nfragment rather than writing a file.\n"
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-authoring-asks
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/authoring-asks\.md
- type: regex
  metric: has-asks
  value: <lf-ask\b
- type: llm-rubric
  metric: judgment
  value: |
    Read the HTML fragment as a user who presses `a`, which puts the `lf-ask`'s
    heading at the top of the screen with everything above it out of view. Pass only
    if all of these hold:
    1. There is one `lf-ask` whose first child is a heading stating the question.
    2. Inside that `lf-ask`, before its `lf-options`, stand the measured table (its
       rows by export size) and at least one sentence of premise saying what the
       table shows or why it matters. Its exact content is the author's choice.
    3. The gateway log excerpt and the buffering paragraph come after the
       `lf-options`, inside the `lf-ask` after its options or after the `lf-ask`,
       collapsed or not. Fail if either stands before the `lf-ask` or between its
       heading and its options.
    Fail if the table stands before the `lf-ask`, outside it, with the `lf-ask`
    holding little more than the question and its options.
