# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

no watcher:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

unpicked at prompt:
  hookSpecificOutput:
    hookEventName: UserPromptSubmit
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 update you haven't picked up. `leaf wait` prints them.

unpicked at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 update you haven't picked up. `leaf wait` prints them.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up; read them with `leaf wait` before idling

delivered:
  format: leaf-delivery-v3
  id: <delivery>
  created_at: <time>
  carrier: wait
  acknowledge: >-
    Whoever ran the `leaf wait` that printed this delivery acknowledges it; until
    then the user's moves read Sent rather than Picked up. If the output was cut
    off, acknowledge nothing and rerun the wait with room for the whole envelope.
    If you handle it, acknowledge before any other work; if you forward it, acknowledge
    once it durably arrives there. To acknowledge, start `leaf wait --ack <delivery>`
    as the next background task: it confirms this delivery and waits for the next.
  batches:
    - page: <page>
      through_seq: 2
      threads:
        - id: event-2
          title: null
          anchor: null
          detached_from: null
          resolved: null
          elided:
            messages: 0
            actions: 0
          messages: []
          summaries: []
          actions: []
      handling:
        h1: >-
          This event's thread has no title yet: name it with `leaf thread title
          <page> <thread-id> --text "<a few words>"`, so the thread panel lists
          its subject rather than its opening words.
        h2: >-
          Answer with `leaf thread reply <page> --for <event-id>` before any other
          work, including the work this event asks for: give the answer, or say
          what you are about to do and where the result will appear. When work follows,
          name it on the page in the same command, as in `leaf thread reply <page>
          --for <event-id> --text "…" && leaf status <page> working "<the work,
          in a line>" --on <address>`, where `<address>` is the event's `answer.to`:
          the line stands beside the thread and in the banner until your next reply
          there. Once that work lands, report it with `leaf thread reply <page>
          --to <address>`. `leaf thread reply` checks any saved page edit and makes
          it live before posting. If a revision removes what the thread is anchored
          on, move the thread in the reply that reports it with `--section <id>`
          (narrowed by `--quote` or `--part` if needed), or `--detach` it if its
          subject has left the page. Add `--awaits` only if your reply's prose asks
          the user something.
        h3: >-
          Your reply renders as Markdown, so show code or markup in a fenced block.
      events:
        - kind: comment
          author: user
          revision: 1
          text: >-
            Add the camera first.
          id: event-2
          ts: <time>
          seq: 2
          subject:
            kind: thread
            id: event-2
          threads: [event-2]
          handling: [h1, h2, h3]
          answer:
            kind: reply
            to: event-2
            for: event-2

acknowledged at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`).

    Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

idle before answer:
  exit: 1
  output: |
    1 acknowledged user move with no answer (`leaf thread reply <page> --for event-2`); answer before idling. Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

answer: |
  replied in event-2

answered at stop: null
