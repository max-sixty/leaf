      metric: entry_read
      value: >-
        Before first modifying page/index.html to use the unfamiliar slo package widget, the agent successfully read the package's declared registry entry. Judge file-tool paths, shell or script behavior and their results. A registry filename mentioned in a failed command, read from an unrelated package, or read only after the modification does not count.
      transform: context.metadata.texts?.["trace"] ?? ''
    - type: llm-rubric
      metric: source_unread
      value: >-
        Before first modifying page/index.html to add the slo widget, the agent did not read the implementation source of that widget (lf-burn.js or equivalent package implementation files). Reading package instructions, the selected registry or page declarations is allowed; merely mentioning implementation filenames without reading their contents is allowed.
      transform: context.metadata.texts?.["trace"] ?? ''
