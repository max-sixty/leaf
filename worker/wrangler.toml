name = "leaf-website"
account_id = "ece2539b9b32ab59dd74aa6b6285e5db"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat_do_not_populate_process_env"]
workers_dev = false

[dev]
port = 0
inspector_port = 0

[assets]
directory = "../.tmp/site-assets"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["OPENAI_API_KEY"]

[[containers]]
# Each session object starts its own container from the image of the Worker version it
# runs (`LeafSession` in `src/index.ts`), so a container started after a deploy runs
# the deployed image, and a running one keeps its image until it stops. Cloudflare
# fixes an application's policy when it creates it, and gives each object class one
# application.
name = "leaf-website-session"
class_name = "LeafSession"
scheduling_policy = "durable_object"

  [containers.images.leaf]
  dockerfile = "Dockerfile"
  build_context = ".."

[[durable_objects.bindings]]
name = "PAGES"
class_name = "LeafSession"

# A visitor's session object outlives deploys, so it must run the deployed release's
# code. By default Cloudflare lets an object that keeps receiving requests run the
# previous version for up to five minutes after a deploy, so an object would start
# containers on the previous image and serve answers the previous release saved.
[durable_objects.code_update_strategy]
mode = "immediate"

[[analytics_engine_datasets]]
binding = "WEBSITE_EVENTS"
dataset = "leaf_website_events"

[[ratelimits]]
name = "SOURCE_AGENT_RATE_LIMITER"
namespace_id = "34302"

  [ratelimits.simple]
  limit = 20
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeafExampleSession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LeafSession"]

[observability]
enabled = true

[observability.logs]
invocation_logs = true

[[routes]]
pattern = "leaf.page"
custom_domain = true

# One persistent remote environment for testing an arbitrary checkout before it reaches
# main. Production remains the top-level environment used by publish-site.yaml. The
# developer command always names `--env dev`, so it cannot omit its target and replace
# leaf.page by accident. Bindings are repeated because Wrangler environments
# intentionally do not inherit them.
[env.dev]
name = "leaf-website-dev"
workers_dev = true
routes = []

  [env.dev.assets]
  directory = "../.tmp/site-assets"
  binding = "ASSETS"
  run_worker_first = true

  [env.dev.secrets]
  required = ["OPENAI_API_KEY"]

  [[env.dev.containers]]
  name = "leaf-website-dev-session"
  class_name = "LeafSession"
  scheduling_policy = "durable_object"

    [env.dev.containers.images.leaf]
    dockerfile = "Dockerfile"
    build_context = ".."

  [[env.dev.durable_objects.bindings]]
  name = "PAGES"
  class_name = "LeafSession"

  [env.dev.durable_objects.code_update_strategy]
  mode = "immediate"

  [[env.dev.analytics_engine_datasets]]
  binding = "WEBSITE_EVENTS"
  dataset = "leaf_website_events_dev"

  [[env.dev.ratelimits]]
  name = "SOURCE_AGENT_RATE_LIMITER"
  namespace_id = "34302"

    [env.dev.ratelimits.simple]
    limit = 20
    period = 60

  [[env.dev.migrations]]
  tag = "v1"
  new_sqlite_classes = ["LeafExampleSession"]

  [[env.dev.migrations]]
  tag = "v2"
  renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

  [[env.dev.migrations]]
  tag = "v3"
  new_sqlite_classes = ["LeafSession"]

  [env.dev.observability]
  enabled = true

    [env.dev.observability.logs]
    invocation_logs = true
