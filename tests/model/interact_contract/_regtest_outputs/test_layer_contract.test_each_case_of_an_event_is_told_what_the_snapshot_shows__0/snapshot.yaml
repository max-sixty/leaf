pick inside a thread:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: reply
      writer: agent
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
      text: >-
        If the event asks for work, first post one line in its thread saying what
        you will do, before any other command, even a read: `leaf thread reply <answer.ref>
        --ephemeral --text "<what you will do, in a line>"`. Then do the work, put
        the result on the page with what shows it (captures, a figure, the numbers),
        and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`:
        what changed and where it shows, in a sentence or two. If the event asks
        for no work, answer it with that reply at once. The reply checks your saved
        page edit and makes it live before posting. The declaration says whose move
        your answer leaves, which delivering what was asked doesn't settle. `--obligation`
        when it is the user's: it leaves them a decision, or something to try or
        review before making one, or asks them for an answer or permission. That
        puts your answer on their On Me list until they reply or resolve the thread,
        even where the decision itself is already there. Where your answer asks
        a question of its own whose answers you can list, such as which of two ways
        to proceed or whether to take an action, put them in your reply in place
        of `--obligation`, in a widget that asks, such as `<lf-options id="…">`
        holding an `<lf-option id="…">` for each answer: the user answers with a
        press, and the choice waits on them by itself (`references/threads.md`,
        "Ask for a pick"). `--todo "<what you owe>"` when it is yours, promising
        work beyond this turn, with `--waiting-on "<what>"` where it can't start
        until something you don't control happens. `--done` when it leaves nobody
        a move.
    - text: >-
        Your reply renders as Markdown in a narrow card or panel. The thread already
        reaches the passage or section it is on, as a card beside it or by Show
        on page, so say in words what changed there, and link a page section elsewhere
        as `[its name](#section-id)`. Give each point its own short paragraph or
        list item, and fence code or markup. Where your answer rests on a source,
        such as a rule, a file or a message, quote the whole passage it turns on,
        conditions included, so the user can check your answer against it there;
        put a passage longer than a few lines in a `<details>` in your reply.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

pick inside a thread over App Server:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: reply
      writer: turn
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
      text: >-
        Leaf posts your opening message in the thread as your progress line and
        your final message as the reply, unless an explicit reply already answered
        this input. Before your first tool call, tell the user briefly the answer
        or what you are about to do; later working messages stay in Codex. End with
        the answer, or what changed and where it shows. A final message leaves the
        user no move, so where your answer leaves them one, such as a decision or
        something to try or review before making one, answer with `leaf thread reply
        <answer.ref> --obligation` instead: it puts the answer on their On Me list
        even where the decision itself is already there. Where your answer asks
        a question of its own whose answers you can list, such as which of two ways
        to proceed or whether to take an action, put them in a `leaf thread reply`
        in place of `--obligation`, in a widget that asks, such as `<lf-options
        id="…">` holding an `<lf-option id="…">` for each answer, so the user answers
        with a press (`references/threads.md`, "Ask for a pick"). Reply explicitly
        too for work promised beyond this turn (`--todo`), a title or moving the
        thread (`references/threads.md`), and for news the user would want to stop
        and read, such as that you could not do what they asked: they may have resolved
        the thread by then, and only that command's record says so. An explicit
        reply posts at once, and your final message is then not posted.
    - text: >-
        Your reply renders as Markdown in a narrow card or panel. The thread already
        reaches the passage or section it is on, as a card beside it or by Show
        on page, so say in words what changed there, and link a page section elsewhere
        as `[its name](#section-id)`. Give each point its own short paragraph or
        list item, and fence code or markup. Where your answer rests on a source,
        such as a rule, a file or a message, quote the whole passage it turns on,
        conditions included, so the user can check your answer against it there;
        put a passage longer than a few lines in a `<details>` in your reply.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

resolve:
  event:
    kind: resolve
  told:
    - text: >-
        The user resolved the thread, which takes it off their list and retires
        any question you asked in it. A message or a pick of theirs there you have
        not answered stays owed: answer it as usual. What you say in the thread
        goes into it without reopening it, unless it asks them something. `leaf
        thread reopen <page> <message>` brings the thread back to their list, for
        news they would want to stop and read, such as that you could not do what
        they asked (`references/threads.md`).

unresolve:
  event:
    kind: unresolve
  told:
    - text: >-
        The user reopened a closed thread. Reopening needs no separate answer; if
        the thread's latest user message was never answered, `leaf page state <page>
        <message>` shows the `answer` still owed.

undo:
  event:
    kind: undo
  told:
    - text: >-
        The user took back the gesture `undoes` names. Treat it as withdrawn: don't
        answer or record it, and if you have already acted on it, undo or redo what
        depended on it. Undoing an action that answered or closed a thread reopens
        that thread, and undoing an `edit` takes that rewrite of its message back.

report:
  event:
    kind: report
  told:
    - text: >-
        A worker reported provisional state for a page widget, which the page shows
        until a stamped version answers it. Before the page ends, answer it in a
        stamped version: write the reported state into the markup, or mark the element
        `overruled` and say why in the version note.

error:
  event:
    kind: error
  told:
    - text: >-
        The page's runtime reported a failure the user saw. Fix the page or widget
        and save the fix. Reply only if the user asked about it.

render:
  event:
    kind: render
  told:
    - text: >-
        Leaf's render check read the version you handed over, as the user's browser
        draws it. Fix each failure it lists and save the fix. Weigh each piece of
        advice against the page, and change the page only where that helps the user.
        Reply only if the user asked about it.
