# Leaf's two conversation forks, replayed on short constructed conversations
# (`dev/leaf_dev/fork_eval.py`). A case names its fork, the page the session holds
# (a source under evals/, with `log` events admitted as its history), the
# conversation (a `from` item stands for a named one, and `found` for the line the
# arm's clerk queues for that finding), and how its answer is scored. `{page}` and
# `{session}` stand for the case's page directory and session id.
#
# Turn-end labels: `expect` items the answer must name, and `absent` items it must
# leave out, each by `kind` and the `words` (any of them) it rests on; a guardrail
# shares its words with its positive case. A question label's `choice` says whether
# the ask is a widget in its text, such as a choice (true), or in words (false). A
# stale label's `edit` is the words its fix must remove, or null where the turn-end
# check's prompt asks for no edit (skills/leaf/references/turn-end-check.md). A reply case judges the working line
# the fork posted as it handed the message on.

# When each conversation starts; its records follow seven seconds apart.
start: "2026-11-03T09:00:00+00:00"

rubrics:
  items: &items
    type: llm-rubric
    metric: items-right
    # A run with no answer Leaf took, from a tool call or a refusal, leaves no text.
    transform: context.metadata.texts?.judge || 'The fork gave no usable answer.'
    value: >-
      The input is the line "The fork gave no usable answer.", which fails; the line
      "No items and no changes.", which passes; or a conversation between a user and
      a coding agent, the question Leaf's turn-end
      check asked a fork of that conversation, every item of the fork's answer that
      Leaf took (each ask as Leaf put it On Me, with the title and text the user
      reads; each finding as Leaf passed it to the agent), each marked `labelled`
      where this test expects it, and the changes Leaf made to the page from the
      answer's edits. Pass only if all of these hold. A question's title names its
      subject and its text asks what the conversation leaves to the user, correctly,
      in a way the user can answer from the card alone, with each point in a short
      paragraph or item of its own and the question on its own line rather than one
      unbroken block. An ask whose text holds an `lf-options` group is a choice the
      user presses: its words and options ask it together, each option titled by what
      choosing it does, and an option marked recommended only where the agent
      advised it, by the `recommended` attribute, which draws its chip, rather than
      in its own words or a chip written by hand. Its words hold the question, the
      facts it rests on and any advice, and leave what each option does or costs to
      that option's card: words that also go through the options, as a list of them
      or a sentence for each, say again what the cards say, and fail. An action the
      agent takes once the user agrees, such as a merge, is
      asked as such a choice. For a step only the user can take,
      it says what to do, and asks for an answer only for what the user alone can report or the agent's next step waits
      on, not for an effect the agent could check itself and nothing waits on, as a
      choice where the answers can be listed, such as installed or failed. A finding's summary says correctly what the conversation
      shows. Each change makes the page say what the conversation shows now, in the
      page's own register. Each item not labelled is one the question asks for and
      the conversation clearly shows: an ask the agent left to the user that no On Me
      item or question the page still holds open asks and the user hasn't answered
      since; anything a page holds that no
      longer fits the work as it now stands, such as words the work or the
      conversation has since changed, or finished or dropped work the page still
      presents as current; an On Me item settled elsewhere; work
      the agent promised or set running that no page shows; or an open thread whose
      agent messages the user would misread, since the work overtook its latest one
      or a later reply corrects an earlier one. An unlabelled item fails
      if it hedges about what the page may say, if a Leaf message in the
      conversation already passed it on, if it concerns a chat reply rather than the
      page, if an On Me item already holds it, if the user has since answered it, if
      it concerns a server, watcher or wait loop serving only the agent's own checks,
      or if it repeats another item.
  names: &names
    type: llm-rubric
    metric: names-the-work
    transform: context.metadata.texts?.judge || 'The fork gave no usable answer.'
    value: >-
      The input is the line "The fork gave no usable answer.", which fails, or a
      conversation between a user and a coding agent, the question Leaf's turn-end
      check asked a fork of that conversation, and every item of the fork's answer
      that Leaf took. Judge only the asks (items of kind question), each as the user
      meets it, often hours later, without the conversation and without rereading the
      page: its title alone, as a row in their list of what waits on them, and its
      text and options in a narrow card beneath that title. Pass only if, in every
      ask, the title says what the work is or does, each option title says what
      choosing it does ("Merge it", "Merge the cache", or "Merge #812" under a title
      that says what #812 is, may pass), and the text says what each piece of work
      it mentions is or does where it first mentions it, in words the user used or
      the page shows, so the user can decide from the card alone what merging
      changes. A pull request's number may stand beside such words, as their link,
      and a later sentence or an option may refer back to work the card has already
      described. Fail if a title names work only by its number (as "Merging #812"
      would), if the text mentions work it never describes (as "It builds on #809"
      would), or if it describes work only by
      code the user never wrote, or by something only the conversation identifies.
  line: &line
    type: llm-rubric
    metric: line-right
    transform: context.metadata.texts?.line || 'The fork gave no usable answer.'
    value: >-
      The input is the line "The fork gave no usable answer.", which fails, or a
      conversation between a user and a coding agent, the tool call the agent is
      running now (an empty list when none), the user's message in a thread on the
      agent's page, and the one line a fork of the conversation posted in the thread
      as the agent's working line while it handed the message to the agent, which
      reads "(no line)" when it posted none, which fails. Pass only if the line says
      in a few plain words what the agent will do about the message, in the way the
      conversation makes likely, as the agent says it before starting; gives no
      answer, result or finished work, even one the conversation holds; and says
      nothing of a fork, a main session or a hand-over, which the user never sees.

  summary: &summary
    type: llm-rubric
    metric: summary-right
    transform: context.metadata.texts?.summary || 'The fork gave no usable answer.'
    value: >-
      The input is the line "The fork gave no usable answer.", which fails, or a
      conversation between a user and a coding agent, a thread on the agent's page as
      its log holds it (a `summary` event folds the messages from `from` through
      `through`), the range of the thread Leaf suggested a fork of that conversation
      summarize, the range the summary folds, and the summary Leaf posted from the
      fork's answer as the agent's, which reads "(no summary)" when Leaf posted none,
      which fails. Pass only if the summary is Markdown prose that gives the range's
      decisions, their reasons where the thread gives them, and its open questions,
      correctly and from the original messages, including those an earlier summary
      in the range folded; holds every decision the range made; is much shorter than
      the messages it folds, saying where they landed rather than retelling each
      one; and answers nothing
      the thread's newest message asks, which is the agent's to answer. The range
      must fold the settled earlier discussion, and each message the thread keeps
      after it must read on from the summary: where a kept message answers a
      question the range folds, the summary states that question.

# The words a guardrail and its positive case share.
words:
  cache-question: &cache-question [lru, ttl]
  flag-step: &flag-step [flags set search cache lru, search cache]
  staging-flag: &staging-flag [staging]
  reindex-stale:
    &reindex-stale [
      2 of 5,
      all 5 shards rebuilt,
      remaining shards rebuilt,
      staging now serves,
      search v7,
      reindex is running,
    ]
  old-index:
    &old-index [
      old index,
      delete it as soon as the swap,
      deletes the old index,
      retain old index,
    ]
  eu-west-rebuild:
    &eu-west-rebuild [
      eu west rebuild,
      running in the background,
      tell you when it finishes,
      tell me when it s done,
      reindex start,
    ]
  warmup-replies:
    &warmup-replies [
      skips the first 10 000 queries,
      first five minutes of misses,
      rerunning both simulations,
    ]
  stale-lead:
    &stale-lead [
      now caches its results by lru,
      merged in 812,
      slowest queries,
      fix first,
    ]
  production-flag:
    &production-flag [
      env prod,
      production now has,
      prod set,
      in production too,
      turn it on in production,
    ]

conversations:
  cache:
    - user: >-
        Compare an LRU cache and a TTL cache for the search API's result cache, and
        keep the page at {page} up to date with what you find.
    - assistant: I'll replay last week's query log through both policies.
    - tool: Bash
      input:
        command: python bench/cache_sim.py --policy lru --size 50000 && python bench/cache_sim.py --policy ttl --ttl 300
        description: Simulate both eviction policies on last week's queries
      result: |-
        policy=lru size=50000 queries=1204331 hit_rate=0.81 p95_age=41m peak_mem=1.9GB
        policy=ttl ttl=300s queries=1204331 hit_rate=0.74 p95_age=4m peak_mem=2.6GB
    - tool: Edit
      input:
        file_path: "{page}/index.html"
        old_string: |-
          <p id="cache-findings-body">
                    Simulating both policies.
                  </p>
        new_string: |-
          <p id="cache-findings-body">
                    LRU hits 81% of queries and stays under 1.9 GB, but a result can be 41
                    minutes old at p95. TTL hits 74% and keeps every result under five minutes
                    old, at up to 2.6 GB.
                  </p>
      result: The file {page}/index.html has been updated successfully.
  cache-chosen:
    - user: LRU. Memory is what's tight on the search hosts.
    - assistant: Going with LRU, behind a flag so it can be turned on per environment.
    - tool: Edit
      input:
        file_path: search/cache.py
        old_string: "        return self._search(query)"
        new_string: "        if flags.get(\"search.cache\") == \"lru\":\n            return self._lru.get_or_compute(query.key, lambda: self._search(query))\n        return self._search(query)"
      result: The file search/cache.py has been updated successfully.
    - tool: Bash
      input:
        command: pytest tests/search -q
        description: Run the search tests
      result: 48 passed in 3.1s
    - tool: Edit
      input:
        file_path: "{page}/index.html"
        old_string: |-
          Two eviction policies, simulated on last week's query log: LRU at 50,000
                  entries and TTL at five minutes.
        new_string: |-
          The search API's result cache evicts by LRU at 50,000 entries, since memory is
                  the constraint on the search hosts. It serves where the search.cache flag
                  is lru.
      result: The file {page}/index.html has been updated successfully.
    - assistant: >-
        The LRU cache is in `search/cache.py`, behind the `search.cache` flag, and the
        search tests pass. The page records the choice and why.
  flag-asked:
    - user: Turn the LRU cache on in staging.
    - tool: Bash
      input:
        command: ./ops/flags set search.cache lru --env staging
        description: Turn the LRU cache on in staging
      result: "error: staging flags need an ops token (OPS_TOKEN unset); run `ops login` first"
      error: true
    - assistant: >-
        Setting staging flags needs your ops login, which this session doesn't have.
        Run `./ops/flags set search.cache lru --env staging` from your terminal, and
        tell me when it's done.
  flag-on:
    - user: Ran it. Staging should have it now.
    - tool: Bash
      input:
        command: ./ops/flags get search.cache --env staging
        description: Check the staging flag
      result: search.cache=lru (staging, set 2026-11-03T09:06Z)
    - assistant: Confirmed, staging has `search.cache=lru`, so its search results now come through the LRU cache.
  # The user's comment on the cache page's findings, delivered between turns.
  warmup-asked:
    - user: |-
        <task-notification>
        <summary>Leaf: new input</summary>
        </task-notification>
    - leaf: >-
        Leaf has new input for your turn. Read this complete delivery before
        answering.
        {"format": "leaf-delivery/59", "batches": [{"page": "{page}", "threads":
        [{"id": "c1", "anchor": {"section": "cache-findings"}, "messages": [{"id":
        "c1", "author": "user", "text": "Does TTL's 74% count the cache warming up
        from empty?"}]}], "handling": {"h1": "Answer it with `leaf thread reply`."},
        "events": [{"kind": "comment", "id": "c1", "author": "user", "handling":
        ["h1"]}]}]}
  reindex:
    - user: >-
        Check on the staging reindex and finish it if it's stuck. The page at {page}
        tracks it.
    - tool: Bash
      input:
        command: ./ops/reindex status --env staging
        description: Check the staging reindex
      result: |-
        shard-0 rebuilt
        shard-1 rebuilt
        shard-2 stuck: lock held by worker 4412 (exited 3h ago)
        shard-3 pending
        shard-4 pending
    - assistant: Shard 2 is stuck on a lock left by a worker that exited three hours ago. Clearing it and resuming.
    - tool: Bash
      input:
        command: ./ops/reindex unlock --shard 2 --env staging && ./ops/reindex resume --env staging --wait
        description: Clear the stale lock and finish the reindex
      result: |-
        shard-2 rebuilt
        shard-3 rebuilt
        shard-4 rebuilt
        all 5 shards rebuilt; alias search -> search-v7
    - assistant: >-
        Done: once shard 2's stale lock was cleared, the remaining shards rebuilt, and
        staging now serves search-v7.
  flaky:
    - user: >-
        test_cache_warmup keeps failing on CI but never on my laptop. Find out why,
        and put what you find on the page at {page}.
    - tool: Bash
      input:
        command: pytest tests/test_cache.py::test_cache_warmup -n 8 --count 300 -q
        description: Run the test 300 times under eight workers
      result: |-
        FAILED tests/test_cache.py::test_cache_warmup[17-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[42-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[61-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[95-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[118-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[151-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[187-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[230-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[264-300] - KeyError: 'q:shoes'
        FAILED tests/test_cache.py::test_cache_warmup[289-300] - KeyError: 'q:shoes'
        10 failed, 290 passed in 41.2s
    - tool: Bash
      input:
        command: pytest tests/test_cache.py::test_cache_warmup -n 0 --count 300 -q
        description: Run it 300 times serially
      result: 300 passed in 96.0s
    - tool: Read
      input:
        file_path: src/search/cache.py
      result: |-
        40	    async def start(self):
        41	        self._task = asyncio.create_task(self._warm())
        42	        return self
        43
        58	    async def _warm(self):
        59	        # Fill the cache with the 10,000 most frequent queries from yesterday's log.
        60	        for query in await top_queries(10_000):
        61	            self._store[query.key] = await self._search(query)
  # A later request on the cache page, once the cache has merged: the work moves to a
  # new question.
  slow:
    - user: >-
        #812 merged, and I've turned the flag on in production too. Next, look at the
        three slowest queries in yesterday's log and tell me what we should change.
        Keep the page at {page} current.
    - tool: Bash
      input:
        command: python bench/slow_queries.py --day 2026-11-02 --top 3
        description: List yesterday's three slowest queries and their causes
      result: |-
        1  shoes size:*            p95=2.8s  calls=41k  cause=wildcard facet expands to 312 terms
        2  (empty query)           p95=1.9s  calls=12k  cause=scans every shard
        3  brand:nike sort:price   p95=1.2s  calls=88k  cause=sort on field price, no index
  # The claude-code journey's start (`leaf-dev journey run claude-code`): the session
  # serves the user's page and handles their comments on it by revising its source.
  board:
    - user: >-
        I wrote a Leaf page at {page}. Serve it so I can review it in my browser, and
        handle the comments I leave on it.
    - tool: Bash
      input:
        command: leaf server start {page} && leaf page open {page}
        description: Start the Leaf server and open the page
      result: '{"url": "http://127.0.0.1:57477/?t=8YBmQvVWW-rx16WNmxen0Q", "page": "{page}"}'
    - assistant: >-
        Your Release triage page is being served at http://127.0.0.1:57477/?t=8YBmQvVWW-rx16WNmxen0Q.
        Each comment you leave comes back to this session, and I'll answer it and
        revise the page.

# The agent's replies more than one case ends a turn with.
replies:
  cache: &cache-reply
    assistant: >-
      Both are on the page now. LRU hits 81% of queries and stays under 1.9 GB, but
      at p95 a result is 41 minutes old; TTL hits 74% and keeps every result under
      five minutes old, at up to 2.6 GB. Do you want the LRU cache, for its hit rate and
      bounded memory, or the TTL cache, for fresher results? I'll wire up whichever
      you pick.
  slow: &slow-reply
    assistant: >-
      Each of the three slowest queries has its own cause. `shoes size:*` takes 2.8 s
      at p95 because its wildcard facet expands to 312 terms; an empty query takes 1.9
      s because it scans every shard; and `brand:nike sort:price`, the most called at
      88,000 a day, takes 1.2 s because it sorts by a field with no index. I'd index the
      price field first: it's one index build and the most calls. Which to fix first
      is on the page.
  flaky: &flaky-reply
    assistant: >-
      Found it. `start()` launches the warmup with `asyncio.create_task` and returns
      at once, so a request can arrive before the cache is filled. Run serially, the
      warmup always finishes first; under eight workers it loses about 1 run in 30.
      CI runs the suite with `-n 8`, and pytest on your laptop runs serially unless
      you pass `-n`, which is why you've never seen it fail. The page has the cause
      and two fixes: await the warmup in `start()` (three lines, about 200 ms more
      startup), or lock around the fill (no startup cost, about forty lines).

cases:
  ask-question:
    fork: turn-end
    page: turn-end-check/pages/cache.html
    conversation:
      - from: cache
      - *cache-reply
    labels:
      expect:
        - kind: question
          words: *cache-question
          choice: true
    assert:
      - *items
  ask-choice:
    fork: turn-end
    page: turn-end-check/pages/reindex-staged.html
    conversation:
      - from: reindex
      - user: Good. Is production ready for the rebuild?
      - tool: Bash
        input:
          command: ./ops/reindex preflight --env prod
          description: Check both production regions can take the rebuild
        result: |-
          eu-west: ready (disk 61% free)
          us-east: ready (disk 58% free)
      - assistant: >-
          Production is ready: both regions pass the preflight with about 60% of disk
          free. When should I run the rebuild? Tonight at 22:00, when traffic is a
          fifth of daytime, it takes about 40 minutes a region and needs nobody
          awake. Now, in daytime traffic, it puts p95 search latency up by about 30%
          while it runs. Saturday morning the on-call team is around, but that's two
          days away. I'd go tonight.
    labels:
      expect:
        - kind: question
          words: [tonight, saturday, production rebuild, rebuild production]
          thread: null
          choice: true
    assert:
      - *items
  # A closeout whose fork would ask the user in words to run the command, so they would
  # type it as a reply.
  ask-permission:
    fork: turn-end
    page: turn-end-check/pages/cache-chosen.html
    conversation:
      - from: cache
      - *cache-reply
      - from: cache-chosen
      - user: Open a PR for it.
      - tool: Bash
        input:
          command: gh pr create --fill && gh pr checks --watch
          description: Open the pull request and wait for its checks
        result: |-
          https://github.com/acme/search/pull/812
          All checks were successful
          review-bot  APPROVED
      - assistant: >-
          [#812](https://github.com/acme/search/pull/812) holds the LRU cache behind
          the `search.cache` flag. CI passes and the review bot approved it.


          Merging is yours: run `/merge-pr`.
    labels:
      expect:
        - kind: question
          words: ["812"]
          thread: null
          choice: true
    assert:
      - *items
      - *names
  # A closeout that names the pull requests by number and describes the change by its
  # code, as a long session's does, so a fork copying its words asks to merge "#812".
  ask-permission-named:
    fork: turn-end
    page: turn-end-check/pages/cache-chosen.html
    conversation:
      - from: cache
      - *cache-reply
      - from: cache-chosen
      - user: Open a PR for it. Does it need the key fix that landed this morning?
      - tool: Bash
        input:
          command: gh pr view 809 --json title,mergedAt && gh pr create --fill && gh pr checks --watch
          description: Check the merged key fix, open the pull request and wait for its checks
        result: |-
          {"title": "Normalize query keys before lookup", "mergedAt": "2026-11-03T08:12:40Z"}
          https://github.com/acme/search/pull/812
          All checks were successful
          review-bot  APPROVED
      - assistant: >-
          [#812](https://github.com/acme/search/pull/812) is open, CI is green and
          review-bot approved it.


          **What #812 changes**

          - `SearchService.lookup` goes through `LRUCache.get_or_compute`, keyed on
          `query.key`, where `flags.get("search.cache") == "lru"`.

          - `cache_size` defaults to 50,000, from the simulation.

          - It sits on #809, so equivalent queries share one entry; nothing else
          waits.


          📌 #1 🟡 **Merge #812**: ready.


          To land it, run `/merge-pr`.
    labels:
      expect:
        - kind: question
          words: ["812"]
          thread: null
          choice: true
    assert:
      - *items
      - *names
  ask-on-me:
    fork: turn-end
    page: turn-end-check/pages/cache.html
    log:
      - kind: comment
        author: agent
        agent: Claude
        revision: 1
        id: q1
        ts: "2026-11-03T09:00:30+00:00"
        title: LRU or TTL for the result cache
        obligation: true
        text: >-
          LRU hits 81% of queries within 1.9 GB but serves results up to 41 minutes
          old at p95; TTL hits 74% and keeps every result under five minutes old, at
          up to 2.6 GB. Which should I wire up?
    conversation:
      - from: cache
      - tool: Bash
        input:
          command: >-
            leaf thread create {page} --obligation --title "LRU or TTL for the result
            cache" --text "LRU hits 81% of queries within 1.9 GB but serves results up
            to 41 minutes old at p95; TTL hits 74% and keeps every result under five
            minutes old, at up to 2.6 GB. Which should I wire up?"
          description: Ask on the page which policy to wire up
        result: '{"kind": "comment", "id": "q1", "author": "agent", "title": "LRU or TTL for the result cache", "obligation": true}'
      - *cache-reply
    labels:
      absent:
        - kind: question
          words: *cache-question
    assert:
      - *items
  ask-held:
    fork: turn-end
    page: turn-end-check/pages/cache.html
    # The user answered the choice with a question, which hands it to the agent, so
    # On Me lists nothing while the agent works the answer out.
    log:
      - kind: comment
        author: agent
        agent: Claude
        revision: 1
        id: q1
        ts: "2026-11-03T09:00:30+00:00"
        title: LRU or TTL for the result cache
        text: >-
          LRU hits 81% of queries within 1.9 GB but serves results up to 41 minutes
          old at p95; TTL hits 74% and keeps every result under five minutes old, at
          up to 2.6 GB. Which should I wire up?


          <lf-options id="cache-policy"><lf-option id="cache-policy-lru" label="Use
          the LRU cache"><strong>Use the LRU cache</strong> 81% of queries hit, in
          1.9 GB.</lf-option><lf-option id="cache-policy-ttl" label="Use the TTL
          cache"><strong>Use the TTL cache</strong> Every result under five minutes
          old.</lf-option></lf-options>
      - kind: reply
        author: user
        revision: 1
        id: u1
        parent: q1
        ts: "2026-11-03T09:01:30+00:00"
        text: How old can an LRU result get at p99?
    conversation:
      - from: cache
      - tool: Bash
        input:
          command: >-
            leaf thread create {page} --title "LRU or TTL for the result cache"
            --text "LRU hits 81% of queries within 1.9 GB but serves results up to 41
            minutes old at p95; TTL hits 74% and keeps every result under five minutes
