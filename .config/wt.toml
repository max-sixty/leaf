# `wt merge` straight to main is how the repo lands, so this is the last local check.
# pre-merge rather than pre-commit, because it runs after the rebase: the tree it checks
# is the one that becomes main.
#
# A hook that rewrites (prettier, ruff-format) fails the merge and leaves the rewrite
# uncommitted in the worktree. Read it, then `wt merge` again — the squash sweeps it in.
#
# Two blocks rather than one table, because a table runs its commands together and the
# lint rewrites the tree the suite reads.
[[pre-merge]]
checks = "pre-commit run -a"

# Broad discovery keeps the local gate quick. CI adds the nightly browser and
# published-site integration suites after main moves.
[[pre-merge]]
tests = "uv run pytest tests"

# `marketplace upgrade` also refreshes installed plugins. The guard keeps this
# hook inert for developers who do not use Leaf through Codex.
[post-merge]
refresh-codex-leaf = '''
if command -v codex >/dev/null 2>&1 &&
  codex plugin list --marketplace leaf --json |
    jq -e 'any(.installed[]; .pluginId == "leaf@leaf")' >/dev/null
then
  codex plugin marketplace upgrade leaf
fi
'''

[aliases]
cloud = '''
uv sync --frozen
uv run playwright install chromium --only-shell
uv run playwright install chrome
uv tool install pre-commit
# urllib matches the IPv6 URL's bracketed host literally.
NO_PROXY="${NO_PROXY:-},${no_proxy:-},[::1]"; export NO_PROXY no_proxy="$NO_PROXY"
uv run pytest tests {{ args }}
'''
