# From two motion-handoff evaluation agents opening desktop windows while serving
# their traces (2026-10-06). Integration coverage executes the command under the
# eval environment; this case checks which workflow the instructions elicit.
# Read-only Codex instruction selection failed 2/2 on old guidance and passed
# 2/2 with the server-only command (2026-10-06); it does not execute a handoff.
description: trace-review
metadata:
  purpose: 'A trace handoff serves evidence without opening desktop windows.'
  tags: [review, maintainer, browser]
vars:
  prompt: |
    Read the repository's developing-leaf skill at
    `../../.claude/skills/developing-leaf/SKILL.md` relative to the leaf skill's
    base directory. You recorded a thread interaction for Max. The native archive
    is `.tmp/recordings/thread/worktree/trace.zip`, and the Leaf review page already
    contains its imported timeline. It needs a running viewer URL for inspecting
    the same archive's DOM, console and network. Write the command you would run
    and describe the handoff. The page is unavailable here; answer in text.
assert:
  - type: llm-rubric
    metric: serves-without-opening
    value: The proposed command serves the supplied trace.zip with leaf-dev trace-server so the existing review page can link to its running viewer.
  - type: llm-rubric
    metric: avoids-desktop-launcher
    value: The proposed workflow does not open a desktop browser or trace viewer window. A warning against show-trace is allowed; recommending it as an action fails.
