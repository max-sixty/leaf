model_provider = "leaf-http"

[model_providers.leaf-http]
name = "OpenAI"
requires_openai_auth = true
supports_websockets = false
env_http_headers = { "OpenAI-Organization" = "OPENAI_ORGANIZATION", "OpenAI-Project" = "OPENAI_PROJECT" }

[shell_environment_policy]
inherit = "all"
exclude = ["OPENAI_API_KEY"]

# Codex here runs unsandboxed, so it needs no route out of the sandbox, and each
# session would otherwise start Leaf's MCP server (`codex_tool.py`).
[plugins."leaf@leaf".mcp_servers.leaf]
enabled = false
