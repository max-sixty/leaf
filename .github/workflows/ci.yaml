name: ci

# The two gates `wt merge` already runs locally (`.config/wt.toml`), run again
# where that hook never reaches: a pull request, and any push that didn't come
# through `wt merge`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # Nothing to install first. The suite resolves what it shells out to the way
      # a user's machine does, and Playwright attaches to the runner's own Chrome
      # (`channel="chrome"`), the same one `publish-site` draws the examples with,
      # so there is no browser to fetch either.
      #
      # `--run-nightly` adds the generated gallery cases and the online gates; the
      # runner has the package index those gates resolve Playwright from.
      - name: 🧪 Test suite
        run: uv run pytest tests --run-nightly

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1
