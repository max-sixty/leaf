# From Codex session 01a0f99f-caf4-7302-9fa7-bec4ca9f3050: a test-removal
# review grouped independent proposals in checkbox sets, leaving rejection implicit
# and each choice unfinished until the group's Done. The checkbox-wording context
# preserves that request, which also admits a single selected-set answer. The
# primary supplies the partial-review need: keep and not-yet-reviewed differ.
# With partial-review context, both arms exposed the three states (2/2 each) at
# e9c98892c. The original checkbox context failed this granularity criterion in
# both arms (0/2 each); its wording leaves the answer's granularity ambiguous.
# Compact controls remain allowed; advice-marker checks are independent of the
# card comparison treatment, which options-stay-words-for-wording covers.
# At e9c98892c the final ordered card/advice instructions still omitted compact
# recommendation markers in both arms (0/2 each). A compact worked example also
# produced 0/2 and was not retained. This detection remains a known failure.
# Matching the source's high effort instead of the catalog's medium still gave
# 0/2 per arm; the Ask granularity criterion passed 2/2 per arm in both settings.
description: proposals-get-individual-decisions
metadata:
  purpose: 'Asks: independent proposals each have explicit acceptance and rejection, and either answer
    completes that proposal.'
  tags:
  - asks
vars:
  prompt: |
    I asked you to search our tests deeply for assertions that preserve bad or
    suboptimal behavior. Better no test than a test that teaches agents to keep
    the wrong behavior. Make a list, review it, and allow me to go through and
    check off everything we should remove.

    I will review this over several sittings. I need to distinguish assertions
    I want to keep from candidates I haven't reviewed yet when I return.

    In this ongoing audit, your last chat reply was:
    > The remaining policy choices will show both the reason to remove the
    > assertion and the guarantee it currently protects. I'm also building the
    > checkbox page and checking its keyboard and touch routes.

    Your audit and independent review are complete. These are the candidates:
    - Remove the assertion that accessible question names must be truncated to
      120 characters. It loses the clause distinguishing nearby questions; keep
      the position announcements and full question in navigation.
    - Remove the assertion that a report captures only the first 500 characters
      of visible text. It loses evidence; keep Unicode and capture validation.
    - Remove the assertion that an arrival animation lasts exactly 10 seconds.
      It freezes a tuning choice; keep finite, once-only, reduced-motion behavior.
    No tests changed.

    Write the Leaf review page. The page directory is not reachable from here,
    so reply with the complete `<main>` element's HTML rather than writing a file.
assert:
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if each of the three independent removal proposals has its own
    lf-ask and an operable choice that explicitly accepts or rejects that proposal
    (Remove / Keep, Accept / Reject, or equivalent). Each proposal begins
    undecided. Either choice must complete that proposal's Ask without requiring
    a Done or submit action shared with another proposal. Fail a checkbox list
    that treats unchecked proposals as rejections, even if the copy explains that
    meaning, and fail a single choice that decides the proposals as a batch.
    Each proposal's evidence and removal scope must be available in its own Ask.
- type: llm-rubric
  metric: recommendation-markers
  value: |
    Each recommended removal needs a recommended small.tag on its Remove option,
    with a reason in prose. Advice must remain distinct from the user's choice:
    neither option starts chosen. Fail recommendations expressed only in prose.
    Compact Remove / Keep controls need not have comparison chips; this case
    checks the advice marker rather than the card treatment.
variants:
  checkbox-wording:
    metadata:
      purpose: 'Diagnostic: the original checkbox request is ambiguous about partial-review outcomes.'
    vars:
      prompt: |
        I asked you to search our tests deeply for assertions that preserve bad or
        suboptimal behavior. Better no test than a test that teaches agents to keep
        the wrong behavior. Make a list, review it, and allow me to go through and
        check off everything we should remove.

        In this ongoing audit, your last chat reply was:
        > The remaining policy choices will show both the reason to remove the
        > assertion and the guarantee it currently protects. I'm also building the
        > checkbox page and checking its keyboard and touch routes.

        Your audit and independent review are complete. These are the candidates:
        - Remove the assertion that accessible question names must be truncated to
          120 characters. It loses the clause distinguishing nearby questions; keep
          the position announcements and full question in navigation.
        - Remove the assertion that a report captures only the first 500 characters
          of visible text. It loses evidence; keep Unicode and capture validation.
        - Remove the assertion that an arrival animation lasts exactly 10 seconds.
          It freezes a tuning choice; keep finite, once-only, reduced-motion behavior.
        No tests changed.

        Write the Leaf review page. The page directory is not reachable from here,
        so reply with the complete `<main>` element's HTML rather than writing a file.
  # From Claude Code session 656c7596 (thread 662249df on duplicate-logic-sweep):
  # a sweep page asked "which workstreams to dispatch" as one multi-select after the
  # last workstream section, so answering for any one meant scrolling back to it.
  # The source's brief prescribed that multi-select; this prompt only asks to
  # choose which to dispatch. At e1c3d2b3d the base passed 6/11 (each failure one
  # page-end multi-select); defining a selected set by dependence passed 8/8.
  dispatch-from-sections:
    metadata:
      purpose: 'Asks: independent items presented in their own sections are decided where each is presented, not in one selected set apart from them.'
    vars:
      prompt: |
        I asked you to sweep the repository for duplicated logic, where two modules
        answer the same question separately. Reviewers found the sites, and an
        independent verifier tried to refute every claim that the copies already
        disagree. Six workstreams came out of it. Each could become one dispatched
        session, and I'll choose which to dispatch from the page. Keep #7–#12 as
        their handles.

        Write the findings page: open with the answer, then one section per
        workstream with its underlying problem, its findings with verdicts and
        sites, and the direction.

        #7 The server decides; the browser re-derives.
        - CONFIRMED: the Questions panel shows a quiet agent's task as live while
          the thread card says "Task open" (activity.py:422 marks it stale;
          queue-panel.js:184 ignores that).
        - CONFIRMED: accepting a suggestion that resolves a thread leaves that
          thread's held news held (held-news.js:113 never reads the action's meaning).
        - Direction: serve queues and event threads in the browser view; the
          browser overlays only its unsent moves.

        #8 One reading of a thread's presentation.
        - CONFIRMED: an agent-held thread reads "Task open" in the panel and
          nothing in the margin (margin-model.js:216).
        - CONFIRMED: an untitled thread is named by raw markdown on one surface and
          by rendered words on another (thread/model.js:267 vs lf-activity.js:107).
        - Direction: one function returns a thread's label and context, and every
          surface paints it.

        #9 Layers and modals.
        - CONFIRMED (probed): the margin treats everything in the always-open
          auxiliary dialog as an open layer, so cluster options never fold when
          focus moves into the Questions panel (margin-projection.js:264).
        - CONFIRMED: Page Map's modal has no Tab loop, so Tab from its last control
          leaves the page.
        - Direction: layer-stack.js owns "open layer"; one modal helper takes the
          Tab loop.

        #10 Walks and the working place.
        - CONFIRMED: `t` skips a thread whose passage contains the caret, while `q`
          stops at it (navigation.js:62 vs queue-walk.js:186).
        - Direction: one walk over places, used by both keys.

        #11 Package data contracts.
        - PLAUSIBLE: `leaf data set` accepts diff records the widget then rejects
          (key != path); no shipped page writes one.
        - REFUTED: control ranges; page check already enforces them.
        - Direction unclear: either the registry schema gains the rule or the
          widget stops enforcing it. The verifier could not say which side
          should own it.

        #12 Test fixtures.
        - PLAUSIBLE: the seed cursor counts blank lines differently from the event
          log (page_fixtures.py:205 vs event_log.py:196); no tracked seed has a
          blank line.
        - Will drift: three helpers each build a served page for tests.
        - Direction: one fixture builder, though it touches every browser test, so
          it may not be worth a session now.

        The page directory is not reachable from here, so reply with the complete
        `<main>` element's HTML rather than writing a file.
    assert:
    - type: llm-rubric
      metric: judgment
      value: |
        Read the page as a user who decides, workstream by workstream, whether to
        dispatch it. Pass only if every one of #7–#12 can be decided without
        leaving the material that decision rests on, in one of these forms:
        (a) each workstream's section holds its own Ask (an lf-ask or answering
            widget) for dispatching that workstream, with an explicit way to
            decline it as well as to dispatch it; or
        (b) one Ask dispatches several clear-cut workstreams together, and that Ask
            itself states, for each workstream it covers, the confirmed effect that
            makes it clear-cut; #11 and #12, whose verdicts are only plausible or
            whose direction is unsettled, each get a separate Ask in or beside
            their own section.
        Every dispatch decision begins undecided. Fail a single multi-select or
        checkbox list covering all six workstreams that stands apart from their
        sections, such as at the end of the page, whose options name or point at
        the workstreams rather than carry their case. Fail if #11 or #12 is
        decided only inside a batch with the clear-cut workstreams.
  # Guardrail for dispatch-from-sections: a capacity limit ties the items together,
  # so the answer is genuinely one set. Both arms passed 3/3 at e1c3d2b3d. A
  # blunter rule (one Question per item, never a multi-select across items)
  # passed 0/4, posing six separate Asks; the dependence wording passed 4/4.
  # Reworded by #2506 (one ask); at 3fe3eb0af it passed 1/1 on Claude Code.
  dispatch-two-of-six:
    metadata:
      purpose: 'Asks: a choice constrained across items stays one ask whose answer is the set.'
    vars:
      prompt: |
        I asked you to sweep the repository for duplicated logic. Six workstreams
        came out of it, and I can only run two dispatched sessions this week, so
        I'll pick the two from the page. The other four wait for next week's
        sweep, so nothing is declined outright.

        Write the decision page. Keep #7–#12 as handles.

        - #7 Server decides, browser re-derives: two confirmed user-visible bugs
          (a quiet task shown live; held news never released). Large.
        - #8 Thread presentation: two confirmed inconsistencies in status words
          and thread names across surfaces. Medium.
        - #9 Layers and modals: confirmed focus escape from Page Map's modal.
          Small.
        - #10 Walks: `t` and `q` disagree on a caret's own thread. Small.
        - #11 Data contracts: plausible only; owner unsettled. Small.
        - #12 Test fixtures: plausible only; touches every browser test. Large.

        The page directory is not reachable from here, so reply with the complete
        `<main>` element's HTML rather than writing a file.
    assert:
    - type: llm-rubric
      metric: judgment
      value: |
        Pass only if the pick of two is posed as one ask whose answer is the
        set of chosen workstreams (for example an lf-options with multiple, or an
        equivalent single answering widget), in which every option carries enough
        of its workstream's case (effect, verdict, size) to compare them without
        leaving the ask. The page must say two are to be picked. Fail six
        separate dispatch/decline Asks, which cannot express the two-session limit,
        and fail options that are bare names or links to sections elsewhere.
