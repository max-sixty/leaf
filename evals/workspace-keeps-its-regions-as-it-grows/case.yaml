    14:10:51 done</pre>
            </lf-pane>
          </div>
        </main>
      </body>
    </html>
    ```

    Since the last revision, the dry run passed on the staging copy, and the migration is
    in PR #412. Your open items now:

    - #7: merging #412 waits on the user.
    - #8: whether the `shipping_region` backfill runs in business hours waits on the
      user; it holds its lock about four minutes per million rows.
    - #6: done; `rollback.sql` now restores the old table's index too.

    The user reads and acts on the work from this page, and asked you to keep your open
    items on it: give the page an Open items section listing each item's id, its mark (🟡
    waiting on the user, 🟢 done) and its body, and keep it current from now on. Update
    the page.
assert:
  - type: llm-rubric
    metric: regions-keep-the-window
    value: |
      Read the final page's HTML and CSS as the user, who works in the plan and the
      dry-run log in a 1280 by 800 window. Pass if the page lists the three open items
      by id and, as the page opens, the plan and log panes still fill the window below
      the page's one-row header, with at most a row of tabs above them: the open items
      stand in a view of their own that the page doesn't open on, such as a later tab or
      part, or inside one of the two panes. Fail if the open items take part of the
      window's height from the plan and log panes: as a block of the workspace beside its
      panes (between the header and the panes, after them, or in a header or footer grown
      to hold the list), or as another pane or row of the panes' grid. Fail too if an
      item is missing.
