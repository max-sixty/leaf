            <tbody>
              <tr><td>Small independent candidates</td><td>#51 drawing inspection; #52 review tools; #53 menu scroll/focus; #54 sticky tab layers; #55 comment markers avoiding controls; #57 narrow reply layout; #59 touch thread selection.</td><td>Recheck against current main and prepare one behavior at a time. #59 is my recommendation.</td></tr>
