# Two pages carry distinct debts and one shared answering instruction.

Stop:
  hookSpecificOutput:
    hookEventName: Stop
    additionalContext: |-
      Leaf needs attention:
      - <first-page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for c1`).
      - <second-page>: 1 acknowledged user move with no answer (`leaf thread reply <page> --for c2`).

      Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf page state <page> <id>`.
