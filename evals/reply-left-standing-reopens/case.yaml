    The page and services are unreachable in this exercise. Write out the command you would run to answer the user's message, with the full text of the reply, then end your answer.
assert:
  - type: llm-rubric
    metric: reopened
    value:
      Pass only if the reply that answers the user's message is declared with `--reopen`
      naming `message:48220706`, says where to get the build, and asks them again to
      try it and reply. The user asked something back, so the step is still to do and the
      plan step should follow. Fail a reply declared `--obligation` without `--reopen`,
      which would ask under a new id and leave the plan step reading done, and one declared
      `--done`. Other commands and the reply's wording don't matter.
