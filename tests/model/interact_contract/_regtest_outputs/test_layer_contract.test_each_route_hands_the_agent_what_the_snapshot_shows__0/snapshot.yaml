Codex App Server:
  turn/start:
    threadId: codex-thread
    clientUserMessageId: '33333333'
    input: []
    toolOutput:
      name: leaf_delivery
      output:
        format: leaf-delivery/15
        id: '33333333'
        created_at: 1790046750.29
        acknowledge: null
        batches:
          - page: /path/to/page
            claim: codex-thread
            through_seq: 2
            threads:
              - id: 1946b466
                title: null
                anchor:
                  section: plan
                  quote: moves to Tuesdays
                detached_from: null
                resolved: null
                elided:
                  messages: 0
                  actions: 0
                messages: []
                summaries: []
                actions: []
            handling:
              h1: >-
                Leaf posts your opening message in the thread as your progress line
                and your final message as the reply, unless an explicit reply already
                answered this input. Before your first tool call, tell the user
                briefly the answer or what you are about to do; later working messages
                stay in Codex. End with the answer, or what changed and where it
                shows. A final message leaves the user no move, so where your answer
                leaves them one, such as a decision or something to try or review
                before making one, answer with `leaf thread reply <answer.ref> --obligation`
                instead: it puts the answer on their On me list even where the decision
                itself is already there. Where your answer asks a question of its
                own whose answers you can list, such as which of two ways to proceed
                or whether to take an action, reply with them in `--markup` as an
                `lf-options` choice in place of `--obligation`, so the user answers
                with a press (`references/threads.md`, "Ask for a pick"). Reply
                explicitly too for other widgets, work promised beyond this turn
                (`--todo`), a title or moving the thread (`references/threads.md`);
                an explicit reply posts at once, and your final message is then
                not posted.
              h2: >-
                Your reply renders as Markdown in a narrow column: give each point
                its own short paragraph or list item, link a page section as `[its
                name](#section-id)`, and fence code or markup.
            events:
              - kind: comment
                revision: 1
                text: why here?
                anchor:
                  section: plan
                  quote: moves to Tuesdays
                author: user
                id: 1946b466
                attention: true
