# For a direct local landing, `wt merge` runs these checks after rebasing, so the tree
# they check is the one that becomes main. They are the gates a pull request's `lint`
# and `test` jobs run on the code. The website's delivery checks — the site build, the
# Worker's dry-run deploy, and the Chrome pass over the bundled release — stay with
# `publish-site`, which runs them before it deploys: together they take minutes and a
# Docker daemon, and here they would run beside a suite that is sensitive to load.
#
# A hook that rewrites (prettier, ruff-format, the bundle rebuild) fails the merge and
# leaves the rewrite uncommitted in the worktree. Read it, then `wt merge` again — the
# squash sweeps it in.
#
# Separate blocks rather than one table, because a table runs its commands together: the
# lint rewrites the tree the suite reads, and the bundle rebuild needs the install the
# first block makes and replaces bundles the suite copies into pages.
#
# Setup waits for any background preparation, then verifies the dependencies the
# suite reads. It owns installation and serialization for both entry points.
# Installs write only ignored files, so they run beside the lint.
[[pre-merge]]
checks = "uv run pre-commit run -a"
setup = "uv run --frozen leaf-dev setup"

# The bundles build from the installed lock, so a rebuild reproduces the tracked bytes
# exactly, and any difference is a lock nobody rebuilt from.
[[pre-merge]]
bundles = "npm run check:bundles"

# Broad discovery keeps the local gate quick, adding only the nightly-marked tests the
# branch edits, as a pull request's gate does. CI runs the rest after main moves.
[[pre-merge]]
tests = "uv run pytest tests --nightly-changed-since main"
node-checks = "npm run check"

# Prepare a new worktree while the agent starts working. The setup command also
# serializes overlapping installs; its foreground entry below is the test barrier.
[post-start]
setup = "uv run --frozen leaf-dev setup"

# The same pipeline in the foreground, with failures propagated to the caller.
[aliases]
setup = "uv run --frozen leaf-dev setup"

[[aliases.refresh-previews]]
previews = "uv run --frozen leaf-dev refresh-previews"

[[aliases.cloud]]
setup = "wt setup"

[[aliases.cloud]]
tests = '''
# urllib matches the IPv6 URL's bracketed host literally.
NO_PROXY="${NO_PROXY:-},${no_proxy:-},[::1]"; export NO_PROXY no_proxy="$NO_PROXY"
uv run pytest tests {{ args }}
'''
