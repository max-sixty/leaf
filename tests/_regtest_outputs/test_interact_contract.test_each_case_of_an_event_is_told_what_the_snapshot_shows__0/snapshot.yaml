# What the agent is told when a user acts on a page
# ===================================================
#
# A test records this file; nobody writes it by hand. The lines starting with `#`
# explain it, and everything else is the recorded data. The walkthrough below is
# one real run: the test serves a page, posts a comment to it the way the browser
# does, and runs `leaf wait`. Only the id, the times and the page's path are
# pinned, so the file stays the same from run to run.
#
# How this text reaches the agent, by example
# -------------------------------------------
#
# 1. The page's `plan` section reads "The nightly backfill moves to Tuesdays so it
#    stops colliding with the report run." The user selects "moves to Tuesdays"
#    and comments "why here?". The page's JavaScript sends this to the page's
#    server as POST /api/event:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015"}
#
# 2. The server checks the comment against the page, adds who wrote it (`author`),
#    when (`ts`) and an `id`, and appends it to the page's event log, events.jsonl,
#    as this one line:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015", "author": "user", "id": "1946b466", "ts": "2026-09-21T20:12:30-07:00"}
#
# 3. Earlier, the agent started `leaf wait` in the background and went idle. The
#    agent does nothing in this step: `leaf wait`, a leaf process, notices the new
#    line and builds a delivery for it. The comment is owed a reply, which the
#    delivery records as its `obligation` (step 4). For the instructions, `leaf
#    wait` reads the clauses under `$events.handling.comment` in the page's copy of
#    registry.json, then those under `$events.answering.reply`, the answer it owes.
#    Each clause has a `text` and may have a `when`, a JSON Schema the log line,
#    with its `obligation`, must satisfy for the clause to apply. There are
#    9; here they all are, with whether the line from step 2 satisfies each
#    `when`:
#
#      clause 1, applies:
#        when: {"not": {"required": ["token"]}}
#        text: Acknowledge this delivery before anything else, by your host contract's
#              route where it leaves acknowledgement to you: until then the user's
#              message reads Sent or Queued rather than Picked up.
#      clause 2, does not apply:
#        when: {"required": ["drawing"]}
#        text: The user drew on the page. `drawing.says`, when present, holds the
#              page's words from the first to the last inside the ink's extents: the
#              neighbourhood of the mark rather than the mark, so an arrow across a
#              paragraph says the whole paragraph. It is absent where the extents hold
#              no words, as over a picture or in a margin. On a drawing anchored to an
#              element, `drawing.strokes` are offsets from that element's top-left
#              corner and `drawing.box` is its width and height, so a stroke's share
#              of the box says which part of a picture it marks; a drawing on the
#              whole page has no `box`, and its offsets start at the page's top-left
#              corner. Any `text` explains the mark. Otherwise it is an ordinary
#              comment, answered the same way.
#      clause 3, does not apply:
#        when: {"required": ["text"], "properties": {"text": {"pattern": "\\]\\(/media/"}}}
#        text: The message carries an image as a Markdown link to
#              `/media/<digest>.<ext>`, a path under the page directory the batch
#              names. Open the image itself before answering: its alt text is a label,
#              not a description of what it shows.
#      clause 4, does not apply:
#        when: {"required": ["suggestion"], "properties": {"suggestion": {"const": true}}}
#        text: A suggestion proposes exact replacement text. Apply it verbatim, or
#              reply with your reason for declining.
#      clause 5, does not apply:
#        when: {"required": ["about"], "properties": {"about": {"const": "design"}}}
#        text: A design comment is about how the page looks or behaves rather than
#              what it says. Its anchor's `section` is a widget's id or, when it
#              starts `lf-`, a part of Leaf's own chrome, such as `lf-banner`,
#              `lf-threads` (the Threads panel), `lf-asks`, `lf-versions` or
#              `lf-composer`; `part`, when present, names the control the click landed
#              on. Find the source that produces what it names and fix it in this
#              page's own source, unless the behavior belongs to a package's widget or
#              the user asks for a wider fix: then change the package as the Leaf
#              skill's `references/packages.md` says, re-vendor, and note the
#              re-vendor on the stamp. A fix that belongs in Leaf itself is the user's
#              to raise, as the Leaf skill's "Improve Leaf through use" says. The
#              stamped version that carries the fix is the result the reply reports.
#      clause 6, applies:
#        when: {"not": {"required": ["token"]}}
#        text: If this event's conversation has a null `title` in the batch's
#              `conversations`, name it with `leaf conversation title <page>
#              <conversation-id> --text "<a few words>"`, so the thread panel lists
#              its subject rather than its opening words.
#      clause 7, does not apply:
#        when: {"required": ["token"]}
#        text: A reaction is a mark, not a question. Read the token and the `means`
#              its package gives, if any, and act on it if it calls for a change;
#              reply only if its meaning is unclear. Once the page reflects it, close
#              it with `leaf resolve <page> --to <event-id>`. It never blocks
#              publishing a version, and it does not wait on an answer.
#      clause 8, applies:
#        (no `when`, so it always applies)
#        text: Answer with `leaf reply <page> --for <event-id>`. In a Codex task Leaf
#              observes over App Server, your final message is the reply instead, and
#              `leaf reply` refuses the event. Where you answer with `leaf reply`,
#              reply before any other work, including the work this event asks for:
#              give the answer, or say what you are about to do and where the result
#              will appear. Once that work lands, report it with `leaf reply <page>
#              --to <address> --initiates`, where `<address>` is the event's
#              `obligation.response.to`. `leaf reply` checks any saved page edit and
#              makes it live before posting. If a revision removes what the thread is
#              anchored on, move the thread in the reply that reports it with
#              `--section <id>` (narrowed by `--quote` or `--part` if needed), or
#              `--detach` it if its subject has left the page. Add `--awaits` only if
#              your reply's prose asks the user something. Your reply renders as
#              Markdown, so show code or markup in a fenced block.
#      clause 9, does not apply:
#        when: {"required": ["meaning"], "properties": {"meaning": {"required": ["document"], "properties": {"document": {"required": ["kind"], "properties": {"kind": {"const": "thread"}}}}}}}
#        text: The widget is in a thread message: continue the work the user's answer
#              selects or unblocks, and answer in that thread.
#
# 4. `leaf wait` prints the delivery as JSON and exits. The agent's host hands that
#    output to the agent as the result of the background command, which wakes it.
#    The delivery's event is the log line from step 2 less `attempt`, the
#    browser's retry key, and with these fields added:
#    `seq`, `subject`, `conversations`, `handling` and `obligation`.
#    The batch's `handling` maps clause ids to their text, each distinct text
#    appearing once. The event's `handling` names its applicable clauses in order.
#    The whole output, indented here (leaf prints it on one line):
#
#      {
#        "format": "leaf-delivery-v2",
#        "id": "e8417b8a-6e03-45ad-b7bd-c0f0eceb1a92",
#        "created_at": 1790046750.29,
#        "batches": [
#          {
#            "page": "/path/to/page",
#            "through_seq": 2,
#            "conversations": [
#              {
#                "id": "1946b466",
#                "title": null,
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "detached_from": null,
#                "resolved": null,
#                "elided": {
#                  "messages": 0,
#                  "actions": 0
#                },
#                "messages": [],
#                "summaries": [],
#                "actions": []
#              }
#            ],
#            "handling": {
#              "h1": "Acknowledge this delivery before anything else, by your host contract's route where it leaves acknowledgement to you: until then the user's message reads Sent or Queued rather than Picked up.",
#              "h2": "If this event's conversation has a null `title` in the batch's `conversations`, name it with `leaf conversation title <page> <conversation-id> --text \"<a few words>\"`, so the thread panel lists its subject rather than its opening words.",
#              "h3": "Answer with `leaf reply <page> --for <event-id>`. In a Codex task Leaf observes over App Server, your final message is the reply instead, and `leaf reply` refuses the event. Where you answer with `leaf reply`, reply before any other work, including the work this event asks for: give the answer, or say what you are about to do and where the result will appear. Once that work lands, report it with `leaf reply <page> --to <address> --initiates`, where `<address>` is the event's `obligation.response.to`. `leaf reply` checks any saved page edit and makes it live before posting. If a revision removes what the thread is anchored on, move the thread in the reply that reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it if its subject has left the page. Add `--awaits` only if your reply's prose asks the user something. Your reply renders as Markdown, so show code or markup in a fenced block."
#            },
#            "events": [
#              {
#                "kind": "comment",
#                "revision": 1,
#                "text": "why here?",
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "author": "user",
#                "id": "1946b466",
#                "ts": "2026-09-21T20:12:30-07:00",
#                "seq": 2,
#                "subject": {
#                  "kind": "conversation",
#                  "id": "1946b466"
#                },
#                "conversations": [
#                  "1946b466"
#                ],
#                "handling": [
#                  "h1",
#                  "h2",
#                  "h3"
#                ],
#                "obligation": {
#                  "as_of_seq": 2,
#                  "response": {
#                    "kind": "reply",
#                    "to": "1946b466",
#                    "for": "1946b466"
#                  }
#                }
#              }
#            ]
#          }
#        ]
#      }
#
# 5. The agent follows `handling`: it replies in the thread with `leaf reply`, edits
#    the page if warranted, and runs `leaf wait --ack <delivery-id>` to confirm receipt and wait
#    for the next one.
#
# What this file records
# ----------------------
#
# Step 3, for one example of every case, using the clauses in
# skills/leaf/assets/registry.json (the file `leaf page init` copies into a page).
# Each top-level key below names a case and holds:
#
#   event:  the input: a log line's `kind`, the kind of answer its delivery
#           says it owes (`obligation`), and the fields some `when` reads, and
#           nothing else. A field no `when` names, such as a comment's `anchor`
#           or `text`, cannot change what the agent is told, so it is left out;
#           the test checks both halves of that.
#   told:   the output, the clauses that apply to that line, in order. Each
#           clause has a `text` and may have a `when`:
#   when:   the clause's `when`, exactly as registry.json writes it: a JSON
#           Schema the log line must satisfy for the clause to apply. A clause
#           with no `when` always applies, and has no `when` key here either.
#   text:   the clause's text.
#
# The walkthrough's comment is the first case. No `when` reads any field of its
# log line from step 2 except `kind`, so the case is that line cut down to `kind`
# and the reply it owes, and it gets the clauses marked "applies" in step 3. It is
# recorded as:
#
#      comment:
#        event:
#          kind: comment
#          obligation:
#            response:
#              kind: reply
#        told:
#          - when: {"not": {"required": ["token"]}}
#            text: >-
#              Acknowledge this delivery before anything else, by your host contract's
#              route where it leaves acknowledgement to you: until then the user's message
#              reads Sent or Queued rather than Picked up.
#          - when: {"not": {"required": ["token"]}}
#            text: >-
#              If this event's conversation has a null `title` in the batch's `conversations`,
#              name it with `leaf conversation title <page> <conversation-id> --text "<a
#              few words>"`, so the thread panel lists its subject rather than its opening
#              words.
#          - text: >-
#              Answer with `leaf reply <page> --for <event-id>`. In a Codex task Leaf observes
#              over App Server, your final message is the reply instead, and `leaf reply`
#              refuses the event. Where you answer with `leaf reply`, reply before any
#              other work, including the work this event asks for: give the answer, or
#              say what you are about to do and where the result will appear. Once that
#              work lands, report it with `leaf reply <page> --to <address> --initiates`,
#              where `<address>` is the event's `obligation.response.to`. `leaf reply`
#              checks any saved page edit and makes it live before posting. If a revision
#              removes what the thread is anchored on, move the thread in the reply that
#              reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed),
#              or `--detach` it if its subject has left the page. Add `--awaits` only if
#              your reply's prose asks the user something. Your reply renders as Markdown,
#              so show code or markup in a fenced block.
#
# After changing a clause, re-record this file and review the diff:
#
#   uv run pytest --regtest-reset -n0 tests/test_interact_contract.py::test_each_case_of_an_event_is_told_what_the_snapshot_shows

comment:
  event:
    kind: comment
    obligation:
      response:
        kind: reply
  told:
    - when: {"not": {"required": ["token"]}}
      text: >-
        Acknowledge this delivery before anything else, by your host contract's
        route where it leaves acknowledgement to you: until then the user's message
        reads Sent or Queued rather than Picked up.
    - when: {"not": {"required": ["token"]}}
      text: >-
        If this event's conversation has a null `title` in the batch's `conversations`,
        name it with `leaf conversation title <page> <conversation-id> --text "<a
        few words>"`, so the thread panel lists its subject rather than its opening
        words.
    - text: >-
        Answer with `leaf reply <page> --for <event-id>`. In a Codex task Leaf observes
        over App Server, your final message is the reply instead, and `leaf reply`
        refuses the event. Where you answer with `leaf reply`, reply before any
        other work, including the work this event asks for: give the answer, or
        say what you are about to do and where the result will appear. Once that
        work lands, report it with `leaf reply <page> --to <address> --initiates`,
        where `<address>` is the event's `obligation.response.to`. `leaf reply`
        checks any saved page edit and makes it live before posting. If a revision
        removes what the thread is anchored on, move the thread in the reply that
        reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed),
        or `--detach` it if its subject has left the page. Add `--awaits` only if
        your reply's prose asks the user something. Your reply renders as Markdown,
        so show code or markup in a fenced block.

