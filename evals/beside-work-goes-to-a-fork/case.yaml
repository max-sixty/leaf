# A Claude Code session hears from Leaf that its line fork judged a thread message's
# work could run beside the session (`forks.beside_line`), with the message's
# delivery, while the session is partway through a change of its own. The rule is in
# `references/harness-claude-code.md`, "Subagents": start the message, since the line
# fork's working line doesn't start it, give it to a fork in the background, which
# answers it itself, and pass the thread's later messages on to that fork. The
# failure it invites is skipping the start because the thread already shows a working
# line. Each context is the hook's output as Leaf writes it
# (`hook_transport.carry_turn`: `inline_context` and the queued line), rendered from
# `delivery.handled` with the kernel registry's clauses, its ids, page and claim
# substituted. The `later` variant is the thread's next message after the fork
# answered, which the line fork judged the same way. The subject can't run the Agent
# tool, so it writes the operations out.
description: beside-work-goes-to-a-fork
metadata:
  purpose:
    A message Leaf marks as work a fork could do beside the session is started by the
    session and goes to a fork it spawns in the background, which answers it, and the
    thread's later messages go to that fork.
  tags:
    - wait-loop
    - forks
    - threads
  harnesses: [claude-code]
