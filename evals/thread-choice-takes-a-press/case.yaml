# Agent messages in a thread can ask in words with --obligation, some listing the
# answers ("Which do you want? - Keep this hold. - Drop it.") and some asking yes or
# no to an action ("Shall I open the PR?"), which the user could answer with a press
# were the reply to carry lf-options. A handling that sends every user move to
# --obligation and names the widget route only as an aside can keep every open
# question in words. The envelopes are the real delivery's shape with the handling at
# the commit that adds this case; a handling change is scored by regenerating them
# with each wording. A handling that only names `lf-options` can lead agents to markup
# that `leaf thread reply` refuses, lacking ids, so the handling gives the markup's
# shape.
description: thread-choice-takes-a-press
metadata:
  purpose:
    "Asks: a question in a thread whose answers the agent can list takes a widget in the
    reply's markup, so the user answers with a press; one it can't list stays in words."
  tags:
    - threads
    - asks
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session using Leaf, three hours into a page with the user at
    /Users/max/.local/state/leaf/pages/checkout-latency: a report on checkout's p95 latency
    for Q3 2026. You loaded the Leaf skill and the references it routes to at the start of the session
    and have answered a dozen of their comments since, so act on this without reloading them.

    Leaf's prompt hook handed you this complete inline delivery:

    ```json
