# From a findings page that put each section's claim, figure and demo above a bare
# question (#1322). Base at 64186bcb9 put them all above the Ask (0 of 3); the change
# put the figure inside it and the demo after it (3 of 3).
description: record-asks-hold-their-premise
metadata:
  purpose:
    "Asks: on a record page, an `lf-ask` about a finding holds the finding's claim and its distinguishing
    figure inside the lf-ask, and a tall live demo follows it."
  tags:
    - asks
vars:
  prompt: |
    You are writing a Leaf page that records six focus gaps you found in a chat
    widget, one section per gap, each putting a question to the user. Write the
    section for this gap.

    Your notes:
    - Finding: a second message sent from a task's own message box starts a second
      thread instead of continuing the first.
    - Measured: after the first send, focus stays in the task's box, so the next
      message the user writes becomes a new thread under the task. Two sends make two
      threads.
    - The user decides where the user should continue after a send from the task's
      box: in the new thread's reply box (your proposal), or in the task's box as today.
    - You already drew a before/after figure with the two threads today beside one
      thread proposed. Include it verbatim as
      `<figure id="seat-figure"><svg class="drawing" viewBox="0 0 680 272"></svg></figure>`.
    - You also built a live demo the user can operate: two numbered steps, then
      `<lf-sample id="seat-sample" label="practice plan"><template data-sample><!-- demo page --></template></lf-sample>`,
      which renders about 700px tall at desktop width.

    The page directory is not reachable from here, so reply with the section's HTML
    fragment rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the HTML fragment as a user who presses `m`, which puts the `lf-ask`'s
      heading at the top of the screen with everything above it out of view. Pass only
      if all of these hold:
      1. There is one `lf-ask` whose first child is a heading stating the question.
      2. `<figure id="seat-figure">` stands inside that `lf-ask`, before its `lf-options`.
      3. The `lf-ask` itself says what happens today: focus stays in the task's box, so a
         second send makes a second thread. Wording may differ; a restatement counts, and
         so does an option that states it.
      4. The numbered steps and `<lf-sample id="seat-sample">` come after the
         `lf-options`, not before the `lf-ask` or between its heading and its options.
      Fail if the figure or the numbered steps and demo stand before the `lf-ask`, with
      the `lf-ask` holding little more than the question and its options.
variants:
  # From session 498a60e2, whose decision on plan context put its two captures in a
  # table above the options, so nothing tied each capture to its option. The user
  # asked "why aren't the images within the options?"
  option-captures:
    metadata:
      purpose: "Choices: each option's capture stands inside that option, today's in the option that keeps it, at a width it can be read."
    vars:
      prompt: |
        Write the decision section of a Leaf page about drawing an agent's plan in
        Leaf's floating panel. The user decides whether each item on their On me list
        should carry a muted line naming the plan goal and step it belongs to, such
        as "Ship the reconnect fix · step 3 of 5". You recommend adding the line.

        You captured the panel's On me view both ways from the same page and log,
        at 2x, each 540 CSS pixels wide:
        - `/media/5c2f172f22c9e701.png`, 540 by 259: On me today, with "How should
          retries back off" and its choices, and "Try the build" with Done.
        - `/media/1caf95f363a5d13d.png`, 540 by 297: the same list with each item
          headed "Ship the reconnect fix, step 3 of 5" and "step 4 of 5".

        The page directory is not reachable here, so reply with the section's HTML.
        Read the lf-ask, lf-options and lf-option registry entries before writing it.
    assert:
      - type: llm-rubric
        metric: captures-in-options
        value: |
          Pass only if the decision offers adding the line and leaving On me as it
          is, and each capture's `<img>` stands inside the `lf-option` whose choice
          it shows: the capture with the plan line inside the option that adds it,
          and today's capture inside the option that leaves On me as it is. Fail if
          either capture stands outside the `lf-options`, such as in a table or
          figure before or after it, even when an option also refers to it.
      - type: llm-rubric
        metric: captures-readable
        value: |
          Pass only if the block holding the captures is granted width past the
          reading column: `data-width="wide"` or `data-width="available"` on the
          `lf-options` that holds them, or on the table or figure that holds them.
          Fail if no block holding a capture carries `data-width`.
  compact-values:
    metadata:
      purpose: "Choices: a value that names the whole outcome stays a compact label."
    vars:
      prompt: |
        Write the decision section of a Leaf incident record. The user must choose
        how long to retain diagnostic captures: one day, seven days or thirty days.
        Every capture contains the same fields and has the same access controls;
        only the automatic deletion time differs. The choice is still open. The
        page directory is not reachable here, so reply with the section's HTML.
        Read the lf-options and lf-option registry entries before writing it.
    assert:
      - type: llm-rubric
        metric: compact-values
        value: |
          The decision offers one day, seven days and thirty days, initially
          undecided, as mutually exclusive alternatives. Each option identifies its
          duration using a compact label, with no explanatory paragraph, repeated
          fact chips, drawing or other padding inside that option. A concise shared
          premise outside the options is fine. Pass equivalent duration wording.
  # From Codex 01a15575-517e-7782-949b-334241bda993: eight findings preceded
  # identical Apply/Keep forms. Start before authoring: the user supplied no template.
  cleanup-review:
    metadata:
      purpose: "On me: a cleanup review carries each proposal's reason, evidence and concrete outcomes at its answering destination."
    vars:
      prompt: |
        The user asked: "Do a full review for anything else that we don't need /
        overly hard-codes." The review is complete. Write the review page so the
        user can decide which independent changes to apply.

        Your verified findings:
        - #1 Thread-reference validation is tied to one widget. The registry declares
          thread references for any widget with that capability, but the target check
          lives in the suggestion-only loop. An independently declared proposal accepts
          a missing thread; the identical suggestion correctly refuses it. Recommend
          validating references by the declared capability, keeping suggestion nesting
          rules with suggestions. This restores the shared guarantee for custom packages.
        - #2 TypeScript has a second package inventory. Compiler path aliases list
          vendor directories but expose only the default package's widget directory.
          A temporary importer under the actual configuration cannot resolve existing
          playground and trace modules; the default board resolves. This is a limit
          on new typed imports, not a checked-in build failure. Recommend deriving
          paths from discovered package directories, retaining the runtime facade alias.
        - #3 Product routes repeat document filenames. All eight current routes follow
          index → / and every other stem → /stem/. An isolated new top-level document
          is omitted and navigation composition raises KeyError until another row is
          added. Recommend discovering docs/*.html and computing routes, keeping the
          navigation bar authored. Future top-level documents would publish by default;
          nested package documents would stay excluded.
        - #4 Startup and runtime repeat the text-input rule. Their input-type lists
          currently match, but a comment requires updating both copies. No keyboard
          failure was observed. Recommend putting the predicate in the existing
          early-script contract, preserving behavior without a new startup request.
        - #5 The developer corpus uses a positive file list. It includes five of six
          top-level developer pages; a costly thread-panel gallery is the sole current
          exclusion. Recommend discovering pages and stating that exclusion explicitly.
          Current membership stays the same; future galleries would enter by default.
        - #6 A package-coverage test guesses package IDs by normalizing visible labels.
          Renaming only Playwright to Playwright traces breaks it with every package
          and link unchanged. Recommend a structured identity on each authored card,
          keeping the coverage assertion while letting visible wording vary.
        - #7 Thread folding silently drops orphan replies to support older Leaf logs.
          Current admission keeps the parent in force; the older-state test bypasses
          admission. The project requires no compatibility with old persisted records.
          Recommend direct parent lookup and removing that obsolete test tail. Admitted
          logs behave the same; corrupt logs surface an error instead of losing replies.
        - #8 Catalog discovery defines a separate HTML parser for one link selector,
          although SourceDocument is already imported. Its parse tree returns the same
          fifteen active entries in the same order, excluding commented cards.
          Recommend using that tree and deleting the one-off parser; curation stays authored.

        Write the page from this material. No code has changed. The page directory
        is not reachable here, so reply with the complete main element's HTML.
        Read the lf-ask, lf-options and lf-option registry entries before writing it.
    assert:
      - type: llm-rubric
        metric: arrival-context
        value: |
          Treat each decision's lf-ask (or its answering widget if unframed) as the
          arrival destination; everything before it is out of view. Pass only if
          each proposal has its issue and checked evidence inside the decision that
          covers it. A shared decision for clear-cut proposals must explain each. For
          example, #1 carries the missing-thread contrast and #3 the new-document
          omission. The route and developer-corpus decisions must expose their
          future-discovery defaults. A heading that merely asks Apply #N does not
          supply the premise.
      - type: llm-rubric
        metric: concrete-outcomes
        value: |
          Pass only if every decision explains what applying and retaining each
          proposal means within that decision. For #1 distinguish validating every
          declaring widget from keeping suggestion-only validation; for #3 distinguish
          discovering top-level documents from maintaining explicit route registration.
          Each option's label or title must name its proposal's concrete outcome;
          generic Apply / Keep labels fail even with an informative shared premise
          or option body. Generic descriptions such as "Implement the change
          described above" cannot substitute for concrete consequences. Each
          decision must offer explicit acceptance and rejection, initially
          undecided. Independent proposals can be grouped only when the group
          explains why each is clear-cut.
