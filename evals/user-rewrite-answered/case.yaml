# Added when the user could rewrite a sent message in place (the `edit` event a
# browser posts). A user's rewrite is a turn the agent answers, addressed to the edit
# rather than the message it rewrote, about what the new wording changes. The envelope
# is one Leaf's delivery froze from a real log: the user asked for the owner to be named,
# the agent answered, and the user then rewrote the request to add the launch date.
# The envelope carries the delivery's own handling, so `--base` arms differ only in
# the references, and a handling change is scored by pasting each wording into the
# prompt. Both arms passed 2 of 2 on Claude Code against db9ac2d76.
# Its thread is titled for its subject, which the rewrite keeps, so it also guards the
# handling's retitling sentence: the title stands. A draft keyed on the rewrite
# changing "what the thread is about" retitled it on Codex in `mid-session` (1 of 1
# completed run); keyed on the title no longer fitting, it held 4 of 4 on Codex and
# 6 of 6 on Claude Code, cold and `mid-session`.
description: user-rewrite-answered
metadata:
  purpose: "A user's rewrite of an answered message is answered as a new turn, for the edit's id, about what the rewrite changed, and a rewrite that keeps the thread's subject keeps its title."
  tags: [threads, wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:
    {"format":"leaf-delivery-v3","id":"e7f1a2c3","acknowledge":null,"batches":[{"page":"/tmp/review","through_seq":4,"threads":[{"id":"comment-a","title":"Revising the opening","anchor":null,"detached_from":null,"resolved":null,"elided":{"messages":0,"actions":0},"messages":[{"id":"comment-a","seq":2,"author":"user","text":"Please revise the opening to name the owner and the launch date.","edited":{"id":"edit-a","seq":4,"ts":"2026-10-06T10:16:08.969-07:00"}},{"id":"reply-a","seq":3,"author":"agent","agent":"Claude","text":"The opening now names Priya as the owner."}],"summaries":[],"actions":[]}],"handling":{"h1":"The user rewrote their message `message` in place: `text` is how it reads now and `was` how it read before, and the thread shows only the new wording. Answer the message as it now reads. Where your earlier answer or work rested on what changed, say what that changes and redo the work it requires; where it changes nothing you did, say so. If `message` opens the thread and the thread's title no longer fits what it now asks, retitle the thread with `leaf thread edit <page> <message> --title \"<a few words>\"`, so the thread panel names what the thread is about now.","h2":"When the event asks for work, say in its thread what you will do before any other command, including reading the source it concerns: `leaf thread reply <page> --for <event-id> --ephemeral --text \"<what you will do, in a line>\"`. The user reads it in the thread at once, and it takes the move in hand: the move reads Working, and the line stands in the banner until you answer. Do the work and put its result on the page, with whatever shows it (captures, a figure, the numbers), then answer with `leaf thread reply <page> --for <event-id> < reply.md`: what changed, in a sentence or two, linking the section that shows it. When the event asks for no work, as a question may not, answer it with that reply at once. The page carries the work, and the thread only the conversation about it. `leaf thread reply` checks any saved page edit and makes it live before posting. If a revision removes what the thread is anchored on, move the thread in the reply that reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it if its subject has left the page. Add `--awaits` only if your reply's prose asks the user something.","h3":"Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."},"events":[{"kind":"edit","author":"user","message":"comment-a","text":"Please revise the opening to name the owner and the launch date.","id":"edit-a","attention":true,"ts":"2026-10-06T10:16:08.969-07:00","seq":4,"subject":{"kind":"thread","id":"comment-a"},"threads":["comment-a"],"was":"Please revise the opening to name the owner.","handling":["h1","h2","h3"],"answer":{"kind":"reply","to":"comment-a","for":"edit-a"}}]}]}

    The page is already served. Only Skill and Read run here, so write out, in order,
    each command you would run, with the full text of any thread reply you would post.
    Then end your answer.
assert:
- type: regex
  metric: answers-the-edit
  value: >-
    (?:^|\n)[^\n]*\bleaf\s+thread\s+reply\b(?=[^\n]*--for(?:=|\s+)['"]?edit-a\b)[^\n]*
- type: not-regex
  metric: leaves-the-answered-message-alone
  value: >-
    (?:^|\n)[^\n]*\bleaf\s+thread\s+reply\b[^\n]*--for(?:=|\s+)['"]?comment-a\b
- type: not-regex
  metric: keeps-the-title
  value: >-
    (?:^|\n)[ \t]*(?:\$[ \t]*)?leaf\s+thread\s+(?:edit|reply)\b[^\n]*--title\b
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the work the agent describes adds the launch date to the opening
    (the part the rewrite added, beyond the owner it already named), and the reply
    it would post tells the user what changed for the rewritten request, such as the
    launch date now standing in the opening. Fail if the agent treats the rewrite as
    already answered, replies only about the owner, or asks the user to resend it.
