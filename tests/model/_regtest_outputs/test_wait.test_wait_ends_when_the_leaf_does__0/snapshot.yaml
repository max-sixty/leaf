# An idle page ends its wait whether the server is still running or stopped.

still served:
  exit: 2
  stdout: ''
  stderr:
    - code: pages-idle
      severity: advice
      values:
        pages: [<page>]
      text: >-
        the page closed; <page> is idle

server stopped:
  exit: 2
  stdout: ''
  stderr:
    - code: pages-idle
      severity: advice
      values:
        pages: [<page>]
      text: >-
        the page closed; <page> is idle
