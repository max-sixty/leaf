# Leaf places package sheets without adding a scope, so package CSS names the widgets
# it styles. This case checks whether the package reference teaches root, descendant,
# outside-condition and shadow-host selectors that name the package's widgets.
description: native-package-scopes
metadata:
  purpose: Package CSS names its widgets, conditions and shadow hosts.
  tags:
    - packages
    - styles
vars:
  prompt: |
    I'm writing theme.css and shadow.css for a Leaf package declaring lf-notice
    and lf-meter. The notice itself needs a 3px green border, and paragraphs
    inside either widget need green text. A notice should use orange text while
    Leaf is interactive. Its shadow-tree host needs 4px padding when it wears
    class ready. The page's own paragraphs and other packages' widgets must keep
    their normal faces.

    Read the package reference and show the two package stylesheets, explaining
    how their rules reach the intended elements. Return CSS in your reply.
assert:
  - type: llm-rubric
    metric: root-and-descendants
    value: |
      Pass only if the package CSS styles the notice root with an lf-notice selector,
      styles paragraphs inside either widget with selectors that name the widgets
      (such as `:is(lf-notice, lf-meter) p`) rather than a bare `p`, which would reach
      the page's own paragraphs, and selects the interactive notice with a condition
      on the root element, such as `html[data-lf-interactive] lf-notice`.
  - type: llm-rubric
    metric: shadow-host-state
    value: |
      Pass only if the shadow-tree CSS styles the host's ready state with a `:host(...)`
      selector that names the notice and class ready, such as `:host(lf-notice.ready)`,
      and explains that Leaf adds no scope around the sheet, so the rule names its host.
      Ordinary `.ready` or `lf-notice.ready` cannot match a shadow host from inside its
      tree.
