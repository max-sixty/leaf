# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

no watcher:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up, so the page cannot idle yet. Leaf's hook puts them in your context at your next turn.

wait wakes the session: |
  <page> has new input; Leaf's prompt hook puts it in your context with this notification

delivered at prompt:
  instruction: >-
    Leaf delivered this input into your turn and confirmed it, so the user's moves
    read Picked up.
  delivery:
    format: leaf-delivery-v3
    id: <delivery>
    created_at: <time>
    carrier: hook
    acknowledge: null
    batches:
      - page: <page>
        through_seq: 2
        threads: []
        handling:
          h1: >-
            The user asked you to run an operation the page's package defines; the
            package's guidance says what the operation means and what to check before
            running it: `leaf page guidance <page>` lists its audiences, and the
            one that runs requests, such as `coordinator`, is the guide to read.
            The request id, with the page, identifies it: after an interruption,
            check whether it already ran before acting.
          h2: >-
            Say what it will do with `leaf status <page> working "<what it does,
            in a line>"`, run it at most once, then record its outcome with exactly
            one `leaf experimental receipt <page> <request-id> succeeded|failed
            --text "…"`. The receipt does not change the page: refresh any data
            the page shows, update `index.html` to reflect the result, and stamp
            it if it is worth a note.
        events:
          - kind: request
            author: user
            revision: 1
            widget: commands
            action: restart
            detail:
              target: goal
              worker: worker
              worktree: tree
            meaning:
              scope: page
              unit: commands
            id: event-2
            ts: <time>
            seq: 2
            subject:
              kind: widget
              id: commands
            threads: []
            says:
              commands: Restart
            handling: [h1, h2]
            answer:
              kind: receipt
              request: event-2
  attention: |-
    Leaf needs attention:
    - <page>: 1 acknowledged user move with no answer (`leaf experimental receipt <page> event-2 succeeded|failed`).
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

    Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

acknowledged at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 acknowledged user move with no answer (`leaf experimental receipt <page> event-2 succeeded|failed`).

    Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

idle before answer:
  exit: 1
  output: |
    1 acknowledged user move with no answer (`leaf experimental receipt <page> event-2 succeeded|failed`); answer before idling. Each move takes the answer named for it. Read current obligations with `leaf page state <page>` and thread history with `leaf thread read <page> <id>`.

answer: |
  settled request event-2 as succeeded

answered at stop: null
