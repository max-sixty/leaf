# The widget keyboard API playground used bare <pre><code> and packed several
# command fields onto each line. This case exercises a revision of that code display.
# On d1a357e06, with page-authoring.md read, the baseline passed 0 of 3 and the
# guidance on language and illustrative-code formatting passed 3 of 3. The plain
# diagnostic output is the guardrail against treating every preformatted block as code.
description: source-code-readable
metadata:
  purpose:
    Source snippets declare their language and keep the code structure readable; literal output
    remains literal.
  tags:
    - authoring
    - code
vars:
  prompt: |
    Use the leaf:leaf skill and read `references/page-authoring.md` inside its
    base directory before revising this page.

    Revise this section in our Leaf keyboard API design playground. Explain that each
    action is declared once, and that `commands(deck, decisions)` exposes the scope
    while keeping its action identity. Keep the explanation short. Include the code
    example and the diagnostic output below, and keep the code's behavior unchanged.

    <section id="api-design"><h2>One declared command, several places to use it</h2>
    <pre><code>const decisions = commandScope("In a classifier", [
      { id: "classify.pass", keys: ["ArrowLeft", "1"], control: pass,
        decision: "Pass", does: "Pass the active card",
        line: "pass", when: canClassify, run: () =&gt; pass.click() },
      { id: "classify.keep", keys: ["ArrowRight", "2"], control: keep,
        decision: "Keep", does: "Keep the active card",
        line: "keep", when: canClassify, run: () =&gt; keep.click() },
    ]);
    commands(deck, decisions);</code></pre>
    <p>Diagnostic output:</p>
    <pre><code>Scope: In a classifier
    Active commands: 2
    Result: ready</code></pre>
    </section>

    The page directory is not reachable from here, so reply with the revised HTML
    section rather than writing a file.
assert:
  - type: llm-rubric
    metric: readable-source
    value: |
      The JavaScript source is displayed in a syntax-highlighted Leaf code block:
      either a native pre/code with class="language-javascript" or a lf-code with
      language="javascript". Object fields and closing braces are broken onto
      consistently indented lines so each action's fields can be read individually.
      All the original command fields and behavior remain in the snippet. Fail if
      source stays uncolored or keeps several distinct object fields crammed onto
      each line. The diagnostic output remains uncolored and preserves its lines
      and exact values; it must not be mistaken for source code or rewritten.

# Text-edit reconstruction: source chat 01a122c3-94c8-71a3-84df-9bf04006bc08,
# report revision r8. Original guidance passed 1/2; clarifying its existing diff
# paragraph in place passed 2/2. Require the binding that supplies line controls.
variants:
  # Work-update suggestion (2026-10-10): one Codex run per arm passed this case
  # and text-edit. Candidate used wt step diff; base assembled a temporary index.
  current-work:
    metadata:
      purpose: A current-work update offers refreshable patch evidence without transcribing it.
    vars:
      prompt: |
        Prepare a short Leaf update on our current branch's work. The branch has
        three commits and uncommitted edits across twelve text files. Checks pass.
        The change consolidates request cancellation under one owner; explain
        that behavior and give Max a way to inspect the implementation while we
        continue revising it. Worktrunk is available. The page directory and
        repository are unavailable in this read-only task. Reply with the HTML
        section and the shell commands you would run to supply and later refresh
        its evidence. Do not invent source contents.
    assert:
      - type: llm-rubric
        metric: refreshable-patch
        value: |
          The section briefly explains the behavior change and includes a
          source-bound lf-diff. Commands select the whole branch's work including
          uncommitted edits, using wt step diff or an equivalent comparison, and
          supply the patch to leaf data set for the widget's source, either as a
          JSON string (for example via jq -Rs .) or through the optional
          leaf package run diff patch_manifest.py file-manifest producer.
          Refresh repeats capture into the same source id. Fail if the answer invents or transcribes patch contents,
          captures only the latest commit or only uncommitted edits, or requires
          rewriting the page's HTML for each refresh. Launcher spelling may be
          leaf or a resolved launcher path.
  text-edit:
    metadata:
      purpose:
        A report reviewing a wording change lets the reader see and comment on the exact
        edit.
    vars:
      prompt: |
        You are finishing a Leaf report about whether our test guidance should change. The session diagnosis, comparison trials and checks are complete. Current guidance reproduced the dense scroll grid in 0/2 successful decisions; the revised guidance chose representative states in 2/2. The source code is changed locally. Keep the explanation short and give the user the completed repair section of the report.

        The draft section is:

        <section id="repair"><h2>Added work must buy added coverage</h2><p>The existing rule asks whether an important contract warrants an expensive test. That does not resolve how much repeated evidence of the same contract to retain. The revised paragraph keeps the browser-boundary rule and asks which additional failure the additional work exposes.</p><details><summary>Current paragraph</summary><pre id="current-paragraph">Prove each contract at the lowest boundary that preserves it, and keep a browser test
        only where it proves boundaries working together. Every run of the suite pays for each
        test&#x27;s compute, so weigh that cost against how much the protected behavior matters
        before adding or keeping an expensive test: a long browser journey, a sweep across
        pages or widths, or a wide parametrization needs a contract important enough to pay
        for it. When a high-level browser test is slow, or fails on timing or geometry outside
        its contract, repair its arrangement or move its contract to the lower boundary.
        </pre></details><details open><summary>Revised paragraph — applied locally</summary><pre id="candidate-paragraph">Prove each contract at the lowest boundary that preserves it, and keep a browser test
        only where it proves boundaries working together. Before adding cases or steps, choose
        the smallest set that exposes distinct plausible failures beyond existing coverage.
        Retain a broad sweep only when its extra samples catch a failure that representative
        states or transitions miss; an investigation&#x27;s sampling grid is not itself a regression
        requirement. Every run pays for the test&#x27;s compute, so weigh the additional cost against
        the additional coverage. When a high-level browser test is slow, or fails on timing or
        geometry outside its contract, repair its arrangement or move its contract to the lower
        boundary.
        </pre></details><p>The local edit replaces one paragraph in tests/AGENTS.md.</p></section>

        The page directory is unavailable here. Reply with the final section HTML and any page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: exact-edit
        value:
          The report presents the change to tests/AGENTS.md as an exact unified patch through
          a source-bound lf-diff with commands supplying the patch. It captures the real Git diff
          for that file or supplies the exact removed and added text. A short explanation
          accompanies the evidence. Fail if it only displays two full paragraphs, invents a different
          edit, or adds an approval request not in the task.

  # Markdown excerpt reconstruction: session dad43231-b8ff-4849-9702-a6a9cb360a93,
  # page principles-survey, whose "Two rules before and after" section showed each
  # rule's Markdown in <pre><code>. The user asked why it wasn't rendered Markdown.
  # At 945fce2f8 every arm rendered the rules (reads-rendered 3/3), so showing source
  # needs the session's own context; base converted them to HTML by hand and
  # page-renders-markdown passed 0/3, then 3/3 once page-authoring.md asked for the
  # preview. A variant giving the rules as Read-tool output scored the same (0/3, 3/3).
  markdown-excerpt:
    metadata:
      purpose:
        Prose quoted from a Markdown file reads rendered, through the page's Markdown
        rendering rather than a hand conversion, with its exact words kept.
    vars:
      prompt: |
        Use the leaf:leaf skill and read `references/page-authoring.md` inside its
        base directory before writing.

        You are writing a Leaf page that surveys Leaf's interface principles. Write its
        section "Two rules before and after": the two rules in `browser/AGENTS.md` that
        had been patched most, as each read before this branch rewrote the section and
        as it reads now, side by side, so the user can judge whether the rewrite kept
        what each rule needs. Give each version's word count.

        "Controls stay where the user aims", before (178 words):

        ```markdown
        **The page holds still under the user's aim.** A state change may repaint any box, but must not move the controls next to the gesture that caused it. A scroll the gesture makes may not carry the control it was made on either, except to bring it whole into a scroller that showed only part of it, or where the gesture takes the user somewhere and says so: a command as a walk or Go-to does (`travels`, `runtime/keyboard/bindings.js`), or a press by the history entry it adds, as a link or a root tab set's switch does. Without a gesture, a box may grow or shrink into free room, but reading content and controls stay put. A change the user asked for may reflow the content it replaces, with motion the eye can follow. A reveal on hover, focus or a key never changes the size or position of its ancestors or siblings, and typing may grow a field but never moves it. Check: `tests/shift_watch.js`, run on every browser test outside a module marked `shifts_unsurveyed` (`tests/AGENTS.md`, "Browser errors").
        ```

        Now (126 words):

        ```markdown
        **Controls stay where the user aims.** A state change may repaint any box, but must not move the controls next to the gesture that caused it, and a scroll the gesture makes carries that control only to bring it whole into a scroller that showed part of it, or where the gesture says it takes the user somewhere. Without a gesture, a box may grow or shrink into free room, but reading content and controls stay put; a change the user asked for may reflow what it replaces, with motion the eye can follow. A reveal on hover, focus or a key never moves its ancestors or siblings, and typing may grow a field but never moves it. Check: `tests/shift_watch.js`, whose header lists what it credits.
        ```

        "News never moves what the reader is reading", before (98 words):

        ```markdown
        **News never moves what the reader is reading.** News from the server grows above the screen, where scroll anchoring absorbs it, or below it. Anywhere else it waits behind a fixed-size control until the reader goes to it, and an editor in use stays still. Check: `test_news_just_after_a_press_moves_nothing`. Owners: `thread/held-news.js`, `newsMoves` in `thread/thread-card.js`, `threadsListing` in `floating-panel.js` for the rows of Threads, and `reading-continuity.js` for a hidden tab. The user chose one exception: the answer they wait for in the floating panel's thread grows that view upward while its controls stay put (`fitAnswer` in `floating-panel.js`, credited by `appendGrowth` in `tests/shift_watch.js`).
        ```

        Now (72 words):

        ```markdown
        **News never moves what the reader is reading.** News from the server grows above the screen, where scroll anchoring absorbs it, or below it; anywhere else it waits behind a fixed-size control until the reader goes to it, and an editor in use stays still. An exception the user chose stays with its owner, as `fitAnswer` in `floating-panel.js` does. Check: `test_news_just_after_a_press_moves_nothing`. Owners: `thread/held-news.js`, and `threadsListing` in `floating-panel.js` for the rows of Threads.
        ```

        The page directory is unavailable here. Reply with the section HTML and any
        page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: reads-rendered
        value: |
          Each of the four rule versions appears formatted, its bold opening sentence in
          bold and its backticked names as inline code, with every word of the given
          Markdown kept. Fail if any version is visible only as Markdown source, with
          `**` or backtick characters shown as text, as in a pre, pre/code, lf-code, an
          lf-text-document without preview="markdown", or an lf-diff. Fail if a version
          is shortened, paraphrased or reworded.
      - type: llm-rubric
        metric: page-renders-markdown
        value: |
          Each of the four versions is an lf-text-document with preview="markdown" bound
          by `source` to a data source of its own, and the commands supply each source
          with that version's exact Markdown through `leaf data set` (for example piping
          the text through `jq -Rs .`). Fail if any version is HTML the author converted
          from the Markdown, such as a blockquote holding strong and code elements, or
          is shown as source.
  # Guardrail for markdown-excerpt: where Markdown syntax is the subject, the reader
  # sees the characters typed. From the composer-markdown-exploration page.
  markdown-syntax:
    metadata:
      purpose: Markdown whose syntax is the subject stays visible as the characters typed.
    vars:
      prompt: |
        Use the leaf:leaf skill and read `references/page-authoring.md` inside its
        base directory before writing.

        You are writing a Leaf page about the Markdown in Leaf's message composer. A
        user typed this reply, meaning a sign-off followed by a horizontal rule:

        ```markdown
        Thanks
        ---
        ```

        It rendered as a heading reading "Thanks", because CommonMark reads a line of
        dashes under a line of text as that text's heading underline (a setext
        heading). A blank line between the two lines would have given the rule. Write
        the section that explains this to the user.

        The page directory is unavailable here. Reply with the section HTML and any
        page setup commands it needs.
    assert:
      - type: llm-rubric
        metric: syntax-stays-source
        value: |
          The reply the user typed appears as its literal characters, `Thanks` on one
          line and `---` on the next, in a block the reader sees without choosing a tab,
          such as pre/code or lf-code; the version with the blank line, if shown, is
          literal too. Showing how either renders beside the source is fine. Fail if the
          typed Markdown appears only rendered, or only inside an lf-text-document whose
          preview tab opens first.
