name = "leaf-website"
account_id = "ece2539b9b32ab59dd74aa6b6285e5db"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat_do_not_populate_process_env"]
workers_dev = false

[assets]
directory = "../.tmp/site"
binding = "ASSETS"
run_worker_first = true

[[containers]]
# Cloudflare keys a container application to its Durable Object namespace, and a
# namespace can hold only one. Wrangler matches the deployed application by name and
# otherwise derives it from `<worker>-<class_name>`, so the v2 class rename below asked
# it to create a second application against the namespace the first one already holds —
# DURABLE_OBJECT_ALREADY_HAS_APPLICATION. Naming the standing application keeps the
# deploy on the modify path. Renaming it would mean deleting the application first,
# which drops every seated reader session.
name = "leaf-website-leafexamplesession"
class_name = "LeafWebsiteSession"
image = "../Dockerfile.website"
# Product routes give every browser a private Leaf session. Cloudflare's current
# account limits allow 15,000 concurrent instances of the lite type.
max_instances = 15000
instance_type = "lite"

[[durable_objects.bindings]]
name = "PAGES"
class_name = "LeafWebsiteSession"

[[workflows]]
name = "leaf-website-agent"
binding = "AGENT_WORKFLOW"
class_name = "LeafWebsiteAgentWorkflow"

[[ratelimits]]
name = "SOURCE_AGENT_RATE_LIMITER"
namespace_id = "34302"

  [ratelimits.simple]
  limit = 100
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeafExampleSession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

[observability]
enabled = true

[[routes]]
pattern = "leaf.page"
custom_domain = true
