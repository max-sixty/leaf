name: ci

# Pull requests and main run the small landing gate. The scheduled and manual
# paths run the complete browser and published-site surface on one runner.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Branch protection requires this check by name.
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Core and browser-smoke tests
        run: uv run pytest tests -v --junitxml=.tmp/test-results/everyday.xml

      - name: Install website dependencies
        run: npm ci
        working-directory: worker

      - name: Build website
        run: uv run scripts/site.py

      - name: 🧪 Website worker tests
        run: |
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker

      - name: Measure the bundled release in Chrome
        run: scripts/verify-site-local.sh

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-everyday-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/everyday.xml
          if-no-files-found: ignore
          retention-days: 30

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Complete test suite
        run: uv run pytest tests --run-nightly -v --junitxml=.tmp/test-results/nightly.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/nightly.xml
          if-no-files-found: ignore
          retention-days: 30
