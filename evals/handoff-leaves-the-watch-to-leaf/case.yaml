# Added when Leaf's Claude Code watch moved from a background `leaf wait` the model
# restarts into Leaf's own `asyncRewake` Stop hook, which Claude Code 2.1.286 keeps
# past the two-hour limit it puts on a background command. Replaces a case that
# pinned the wait's `timeout`. Base at 12432f61c, whose reference has the model
# start a background `leaf wait`, passed 0 of 4 runs that finished; the change 4 of
# 4. Two runs in each arm ended on a model error and measured nothing. Opus 5.5's
# safeguards later refused every run while the prompt asked for each tool call with
# its full JSON input; asking for the commands, base passed 0 of 3, the change 3 of 3.
description: handoff-leaves-the-watch-to-leaf
metadata:
  purpose:
    "Claude Code reference: a handoff ends the turn with the URL and starts no `leaf wait`, since
    Leaf watches between turns."
  tags:
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session, and the user asked for your plan for the session
    cache as a Leaf page they can comment on. You have written the page at
    ~/.local/state/leaf/pages/cache-plan and `leaf server start` printed its URL,
    http://127.0.0.1:8123/?t=abc. Now hand it off, following the leaf skill for this
    harness; the user expects to comment a few hours from now. The plan is complete,
    no answer or approval is required, and any later comments are optional.

    Read whatever instructions you need. Only Skill and Read run here, so write out, in
    order, each command you would run before your closing message, then give the
    closing message itself.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if the reply hands the page over without starting any `leaf wait`
      (foreground or background, named or not) and its closing message gives the URL
      http://127.0.0.1:8123/?t=abc. Leaving the page available for comments is fine. Fail if any
      written-out command runs `leaf wait`.
  - type: llm-rubric
    metric: optional-feedback
    value: |
      The page remains available for optional comments, with no obligation demanding
      an answer or approval. Fail if the agent closes the page's conversation or
      invents a required user decision. Availability is not a request for input.
variants:
  missing-input:
    metadata:
      purpose: "A required answer goes into an On me thread obligation, not a page availability declaration."
    vars:
      prompt: |
        You are a Claude Code session driving the Leaf report at
        ~/.local/state/leaf/pages/cache-plan, already checked and served at
        http://127.0.0.1:8123/?t=abc. It records yesterday's cache benchmark results.
        The user now says: "Compare this against the latency budget in my private
        notes. I haven't shared that budget yet. Ask me in a new page thread and
        keep the report unchanged until I answer."

        Read whatever instructions you need. The page and services are unreachable
        here, so write the commands you would run and your short closing reply.
    assert:
      - type: llm-rubric
        metric: required-answer
        value: |
          The agent opens a new thread asking for the missing latency budget and
          registers the plain message as a user obligation with --obligation.
          The question remains owed until answered. A status detail, question only
          in chat, an lf-ask widget, or a claim to have registered it without a
          command is insufficient. The report is unchanged, no budget is invented,
          and the page remains available for the answer rather than being closed.
  finished:
    metadata:
      purpose: "Close a completed page conversation explicitly, keeping the report available at its URL."
    vars:
      prompt: |
        You drive the checked Leaf report at ~/.local/state/leaf/pages/cache-plan,
        served at http://127.0.0.1:8123/?t=abc. Its canonical state has no unread
        updates, owed replies, open to-dos or user obligations. The user says:
        "We're finished with this report. End the conversation and stop watching
        for comments, but keep the report available at its URL."

        Read whatever instructions you need. The page and services are unreachable
        here, so write the commands you would run and your short closing reply.
    assert:
      - type: llm-rubric
        metric: close-conversation
        value: |
          The agent explicitly ends the page's conversation and watching using its
          installed lifecycle command (page close or the baseline status idle).
          At the end, the HTTP server is running and the report remains readable at
          the same URL, with no new obligation or task. Resolving one thread or
          declaring availability for feedback does not end the page's conversation.
