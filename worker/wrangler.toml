name = "leaf-website"
account_id = "ece2539b9b32ab59dd74aa6b6285e5db"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat_do_not_populate_process_env"]
workers_dev = false

[dev]
port = 0
inspector_port = 0

[assets]
directory = "../.tmp/site-assets"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["OPENAI_API_KEY"]

[[containers]]
# Cloudflare keys a container application to its Durable Object namespace, and a
# namespace can hold only one. Wrangler matches the deployed application by name and
# otherwise derives it from `<worker>-<class_name>`, so the v2 class rename below asked
# it to create a second application against the namespace the first one already holds —
# DURABLE_OBJECT_ALREADY_HAS_APPLICATION. Naming the existing application keeps the
# deploy on the modify path. Renaming it would mean deleting the application first,
# which drops every seated user session.
name = "leaf-website-leafexamplesession"
class_name = "LeafWebsiteSession"
image = "../Dockerfile.website"
# Product routes give every browser a private Leaf session. A page's first write waits
# while its container boots and composes the page's layer, CPU-bound work that takes
# about 8.7 s on `basic`'s 1/4 vCPU and 1.9 s on one vCPU. Cloudflare bills CPU only as
# it is used, so the smallest custom instance, one vCPU with the 3 GiB it requires,
# costs less than `standard-1`'s 1/2 vCPU with 4 GiB. The account's default limit of
# 1,500 concurrent vCPU sets the capacity: reserve twenty for the persistent dev
# application and leave ten free for rollout bookkeeping.
max_instances = 1470
instance_type = { vcpu = 1, memory_mib = 3072, disk_mb = 4000 }
# During a rollout, Cloudflare replaces a container only once it has been connected to
# its Durable Object for this many seconds. The Worker refuses every answer from a
# container still on the previous release (`rollingOut` in `src/index.ts`), so sparing
# one that started recently only keeps its visitor waiting. The session Durable Object
# retains the canonical page record across container replacement.
rollout_active_grace_period = 0

[[durable_objects.bindings]]
name = "PAGES"
class_name = "LeafWebsiteSession"

[[analytics_engine_datasets]]
binding = "WEBSITE_EVENTS"
dataset = "leaf_website_events"

[[ratelimits]]
name = "SOURCE_AGENT_RATE_LIMITER"
namespace_id = "34302"

  [ratelimits.simple]
  limit = 20
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeafExampleSession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

[observability]
enabled = true

[observability.logs]
invocation_logs = true

[[routes]]
pattern = "leaf.page"
custom_domain = true

# One persistent remote environment for testing an arbitrary checkout before it reaches
# main. Production remains the top-level environment used by publish-site.yaml. The
# developer command always names `--env dev`, so it cannot omit its target and replace
# leaf.page by accident. Bindings are repeated because Wrangler environments
# intentionally do not inherit them.
[env.dev]
name = "leaf-website-dev"
workers_dev = true
routes = []

  [env.dev.assets]
  directory = "../.tmp/site-assets"
  binding = "ASSETS"
  run_worker_first = true

  [env.dev.secrets]
  required = ["OPENAI_API_KEY"]

  [[env.dev.containers]]
  name = "leaf-website-dev-leafexamplesession"
  class_name = "LeafWebsiteSession"
  image = "../Dockerfile.website"
  max_instances = 20
  instance_type = { vcpu = 1, memory_mib = 3072, disk_mb = 4000 }
  rollout_active_grace_period = 0

  [[env.dev.durable_objects.bindings]]
  name = "PAGES"
  class_name = "LeafWebsiteSession"

  [[env.dev.analytics_engine_datasets]]
  binding = "WEBSITE_EVENTS"
  dataset = "leaf_website_events_dev"

  [[env.dev.ratelimits]]
  name = "SOURCE_AGENT_RATE_LIMITER"
  namespace_id = "34302"

    [env.dev.ratelimits.simple]
    limit = 20
    period = 60

  [[env.dev.migrations]]
  tag = "v1"
  new_sqlite_classes = ["LeafExampleSession"]

  [[env.dev.migrations]]
  tag = "v2"
  renamed_classes = [{ from = "LeafExampleSession", to = "LeafWebsiteSession" }]

  [env.dev.observability]
  enabled = true

    [env.dev.observability.logs]
    invocation_logs = true
