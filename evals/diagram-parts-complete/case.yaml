# Issue #1455: a partial `parts` list made adjacent diagram boxes respond differently
# to Comment. This case checks the author's choice at page creation.
# The 2026-10-07 Claude Code comparison kept all five parts on both arms;
# accessible metadata was absent on HEAD and meaningful on the candidate.
# Guidance survey #18 now checks that the renderer owns the node inventory rather
# than making the author duplicate it in a synchronized roster.
description: diagram-parts-complete
metadata:
  purpose: A diagram exposes every named box through its renderer-owned inventory.
  tags:
    - diagram
    - comments
vars:
  prompt: |
    Write a Leaf page section for this review of a release flow. The user wants to
    comment on individual boxes in the diagram, especially the decisions, as well
    as on the diagram as a whole. Use the diagram package's lf-diagram element;
    its authoring entry is in `../../packages/diagram/registry.json` relative to the
    leaf skill's base directory.

    The flow is: Ready? (A) goes to Tested? (B) on yes and Wait (C) on no.
    Tested? goes to Ship (D) on yes and Test (E) on no.

    The page directory is not reachable from here, so reply with the HTML fragment
    rather than writing a file.
assert:
  - type: llm-rubric
    metric: all-boxes-addressable
    value: |
      Pass only if the HTML contains one lf-diagram whose `parts="all"` lets its
      renderer expose every box for comment, and valid Mermaid source draws all five
      boxes with the stated yes/no relationships. Fail if parts is omitted, or lists
      the nodes itself (such as node:A node:B node:C node:D node:E), since the author
      then keeps a roster the renderer already owns.
  - type: llm-rubric
    metric: accessible-diagram
    value: |
      Pass if the lf-diagram's Mermaid source supplies an accTitle and accDescr
      that name and explain the release flow for a reader who cannot see it.
      Mentioning accessibility outside the diagram source does not pass.
      Do not demand exact wording.
