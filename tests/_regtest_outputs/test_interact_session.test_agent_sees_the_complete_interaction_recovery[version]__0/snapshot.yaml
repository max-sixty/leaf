# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

no watcher:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

unpicked at prompt:
  hookSpecificOutput:
    hookEventName: UserPromptSubmit
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 update you haven't picked up. `leaf wait` prints them.

      If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully, then acknowledge it before any other work. If forwarding it, or if its guidance holds the acknowledgement until a request reaches its executor, acknowledge once it durably arrives there. Run `leaf wait --ack <delivery-id>` in the background to acknowledge its captured batches and wait for the next batch while the page remains live. The agent handling the batch must address every event.

unpicked at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 update you haven't picked up. `leaf wait` prints them.

    If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully, then acknowledge it before any other work. If forwarding it, or if its guidance holds the acknowledgement until a request reaches its executor, acknowledge once it durably arrives there. Run `leaf wait --ack <delivery-id>` in the background to acknowledge its captured batches and wait for the next batch while the page remains live. The agent handling the batch must address every event.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up; read them with `leaf wait` before idling. If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully, then acknowledge it before any other work. If forwarding it, or if its guidance holds the acknowledgement until a request reaches its executor, acknowledge once it durably arrives there. Run `leaf wait --ack <delivery-id>` in the background to acknowledge its captured batches and wait for the next batch while the page remains live.

delivered:
  format: leaf-delivery-v2
  id: <delivery>
  created_at: <time>
  batches:
    - page: <page>
      through_seq: 2
      conversations:
        - id: event-2
          title: null
          anchor:
            section: choice
          detached_from: null
          resolved: null
          elided:
            messages: 0
            actions: 0
          messages: []
          summaries: []
          actions: []
      handling:
        h1: >-
          If this event's conversation has a null `title` in the batch's `conversations`,
          name it with `leaf conversation title <page> <conversation-id> --text
          "<a few words>"`, so the thread panel lists its subject rather than its
          opening words.
        h2: >-
          This conversation asks for a new version of the page rather than a reply.
          Make the change it asks for, stamp the version, then close it with `leaf
          resolve <page> --to <conversation-id>`, which refuses until the stamped
          version's authored state answers the Ask.
      events:
        - kind: comment
          author: user
          revision: 1
          text: >-
            Add the camera first.
          anchor:
            section: choice
          response:
            kind: version
            verb: choose
          id: event-2
          ts: <time>
          seq: 2
          subject:
            kind: conversation
            id: event-2
          conversations: [event-2]
          handling: [h1, h2]
          obligation:
            as_of_seq: 2
            response:
              kind: version
              conversation: event-2

acknowledged at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 acknowledged reader move with no answer (a stamped version, then `leaf resolve <page> --to event-2`).

    Each named command writes the answer its move is owed; a reply may instead be your final message where the host sends it as the reply. Read current obligations with `leaf page state <page>` and conversation history with `leaf conversation read <page> <id>`.

idle before answer:
  exit: 1
  output: |
    1 acknowledged reader move with no answer (a stamped version, then `leaf resolve <page> --to event-2`); answer before idling. Each named command writes the answer its move is owed; a reply may instead be your final message where the host sends it as the reply. Read current obligations with `leaf page state <page>` and conversation history with `leaf conversation read <page> <id>`.

stamped answer: |
  stamped v2 — Choose the flag-first rollout.

answer: |
  resolved event-2

answered at stop: null
