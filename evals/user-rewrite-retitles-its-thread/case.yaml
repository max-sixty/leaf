# Added with the `edit` handling's sentence on retitling: a thread's title names its
# opening message's subject, so a rewrite of that message to a new subject leaves the
# title stale. The envelope is user-rewrite-answered's, with the thread titled for its
# first request and the opening rewritten to a different one. It carries the
# delivery's own handling, so the arms are the wordings, pasted into the prompt. Cold,
# the agent reads references/threads.md, which says to rename a thread whose title no
# longer fits, and both wordings passed 3 of 3 on Claude Code. `mid-session` reads no
# reference, leaving the handling as the guidance in reach: without the sentence 0 of 3
# on Claude Code and 0 of 2 on Codex, with it 3 of 3 on each.
description: user-rewrite-retitles-its-thread
metadata:
  purpose: "A user's rewrite of a thread's opening message to a new subject retitles the thread."
  tags: [threads, wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:
    {"format":"leaf-delivery-v3","id":"e7f1a2c3","acknowledge":null,"batches":[{"page":"/tmp/review","through_seq":4,"threads":[{"id":"comment-a","title":"Owner in the opening","anchor":null,"detached_from":null,"resolved":null,"elided":{"messages":0,"actions":0},"messages":[{"id":"comment-a","seq":2,"author":"user","text":"Please add a rollback plan to the risks section: what we do if the deploy fails halfway through.","edited":{"id":"edit-a","seq":4,"ts":"2026-10-06T10:16:08.969-07:00"}},{"id":"reply-a","seq":3,"author":"agent","agent":"Claude","text":"The opening now names Priya as the owner."}],"summaries":[],"actions":[]}],"handling":{"h1":"The user rewrote their message `message` in place: `text` is how it reads now and `was` how it read before, and the thread shows only the new wording. Answer the message as it now reads. Where your earlier answer or work rested on what changed, say what that changes and redo the work it requires; where it changes nothing you did, say so. If `message` opens the thread and the thread's title no longer fits what it now asks, retitle the thread with `leaf thread edit <page> <message> --title \"<a few words>\"`, so the thread panel names what the thread is about now.","h2":"When the event asks for work, say in its thread what you will do before any other command, including reading the source it concerns: `leaf thread reply <page> --for <event-id> --ephemeral --text \"<what you will do, in a line>\"`. The user reads it in the thread at once, and it takes the move in hand: the move reads Working, and the line stands in the banner until you answer. Do the work and put its result on the page, with whatever shows it (captures, a figure, the numbers), then answer with `leaf thread reply <page> --for <event-id> < reply.md`: what changed, in a sentence or two, linking the section that shows it. When the event asks for no work, as a question may not, answer it with that reply at once. The page carries the work, and the thread only the conversation about it. `leaf thread reply` checks any saved page edit and makes it live before posting. If a revision removes what the thread is anchored on, move the thread in the reply that reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it if its subject has left the page. Add `--awaits` only if your reply's prose asks the user something.","h3":"Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."},"events":[{"kind":"edit","author":"user","message":"comment-a","text":"Please add a rollback plan to the risks section: what we do if the deploy fails halfway through.","id":"edit-a","attention":true,"ts":"2026-10-06T10:16:08.969-07:00","seq":4,"subject":{"kind":"thread","id":"comment-a"},"threads":["comment-a"],"was":"Please revise the opening to name the owner.","handling":["h1","h2","h3"],"answer":{"kind":"reply","to":"comment-a","for":"edit-a"}}]}]}

    The page is already served. Only Skill and Read run here, so write out, in order,
    each command you would run, with the full text of any thread reply you would post.
    Then end your answer.
assert:
- type: regex
  metric: answers-the-edit
  value: >-
    (?:^|\n)[^\n]*\bleaf\s+thread\s+reply\b(?=[^\n]*--for(?:=|\s+)['"]?edit-a\b)[^\n]*
- type: regex
  metric: retitles
  value: >-
    (?:^|\n)[ \t]*(?:\$[ \t]*)?leaf\s+thread\s+edit\b[^\n]*--title\b
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the agent renames the thread with `leaf thread edit` and `--title`
    to a few words about the rollback plan (the rewritten request), not the owner,
    and its reply to the rewrite is about adding the rollback plan to the risks
    section. Fail if the thread keeps a title about the owner or the opening.
variants:
  mid-session:
    metadata:
      purpose: "The same rewrite deep in a session, where the delivery's handling is the guidance in reach."
