# Added when Claude Code's and Pi's hooks began confirming the inline envelope they
# hand over, so the move reads Picked up as the hook runs instead of after the
# model's first call. Replaces a case that pinned the model's own `leaf delivery ack`
# of the same envelope, a command this change removed. On Codex (3 runs per arm at
# b9d22d31e) both arms ran no acknowledgement, so it has only guarded there: the
# base reference's `leaf delivery ack` lost to the envelope's null `acknowledge`.
# Opus 5.5's safeguards refused every Claude Code run while the prompt asked for each
# tool call with its full JSON input. Asking for the commands instead, both arms
# passed 3 of 3 against b9d22d31e, so it has only guarded on Claude Code too.
description: claude-hook-delivery-needs-no-ack
metadata:
  purpose: "A Claude hook delivery arrives confirmed: run no acknowledgement command, and name the move's work first."
  tags: [wait-loop]
vars:
  prompt: |
    You are a Claude Code session using Leaf. You just received this complete inline envelope from Leaf's prompt hook:
    {"format":"leaf-delivery-v3","id":"dc81eabb","carrier":"hook","acknowledge":null,"batches":[{"page":"/tmp/review","through_seq":1,"threads":[],"handling":{},"events":[{"kind":"comment","id":"comment-a","seq":1,"author":"user","text":"Please revise the opening to name the owner.","answer":{"kind":"reply","to":"comment-a","for":"comment-a"},"threads":["comment-a"],"subject":{"kind":"thread","id":"comment-a"},"handling":[]}]}]}

    The page is already served. Read the Leaf instructions needed for your harness.
    Only Skill and Read run here, so write out, in order, each command you would run
    before starting the requested revision. Then end your answer.
assert:
- type: javascript
  metric: reads-claude-code-harness
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/harness-claude-code\.md
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if no written command acknowledges or confirms the delivery
    (`leaf delivery ack`, `leaf wait --ack`, or `leaf delivery read`), and a written
    command starts the comment's work with `leaf task start /tmp/review comment-a
    "<a line>"` before any edit. Fail if a command starts `leaf wait`. Reading
    instructions or page state first is fine.
