<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Leaf page</title>
    <style>
      :root {
  color-scheme: light dark;
  --leaf-bg: var(--color-background-primary, light-dark(#fbfaf7, #171a1d));
  --leaf-panel: var(--color-background-secondary, light-dark(#f2f0eb, #20252a));
  --leaf-ink: var(--color-text-primary, light-dark(#202522, #eef2ee));
  --leaf-muted: var(--color-text-secondary, light-dark(#626965, #abb5ae));
  --leaf-border: var(--color-border-secondary, light-dark(#d8d4cb, #3d454b));
  --leaf-ring: var(--color-ring-primary, light-dark(#365f90, #9bbce4));
  --leaf-warning: var(--color-text-warning, light-dark(#875b16, #e4bd75));
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--leaf-bg);
}

body,
button {
  font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);
}

body {
  color: var(--leaf-ink);
}

.shell {
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding:
    var(--safe-top, 0px)
    var(--safe-right, 0px)
    var(--safe-bottom, 0px)
    var(--safe-left, 0px);
}

.bar,
.foot {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--leaf-panel);
}

.bar {
  min-height: 38px;
  justify-content: space-between;
  padding: 5px 8px 5px 10px;
  border-bottom: 1px solid var(--leaf-border);
}

.identity,
.actions {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}

.identity {
  overflow: hidden;
}

.mark,
.mark svg {
  width: 19px;
  height: 19px;
  display: block;
  flex: 0 0 19px;
}

.product {
  font-size: 12px;
  font-weight: var(--font-weight-semibold, 650);
}

.page-title {
  min-width: 0;
  overflow: hidden;
  color: var(--leaf-muted);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button {
  min-height: 27px;
  padding: 3px 7px;
  border: 1px solid var(--leaf-border);
  border-radius: var(--border-radius-sm, 5px);
  background: var(--leaf-bg);
  color: var(--leaf-ink);
  font-size: 11px;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

button:hover:not(:disabled) {
  border-color: var(--leaf-muted);
}

button:focus-visible {
  outline: 2px solid var(--leaf-ring);
  outline-offset: 2px;
}

button:disabled {
  cursor: wait;
  opacity: 0.55;
}

.surface {
  min-width: 0;
  min-height: 0;
  position: relative;
  background: var(--leaf-bg);
}

#leaf-page {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  background: var(--leaf-bg);
}

#leaf-page[hidden] {
  display: none;
}

.loading {
  max-width: 34rem;
  margin: 24px;
  color: var(--leaf-muted);
  font-size: 13px;
  line-height: 1.45;
}

.foot {
  min-height: 24px;
  padding: 3px 9px;
  border-top: 1px solid var(--leaf-border);
  color: var(--leaf-muted);
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, monospace);
  font-size: 9px;
}

#source-warning {
  color: var(--leaf-warning);
}

#status {
  min-width: 0;
  margin-left: auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@media (max-width: 540px) {
  .bar {
    align-items: stretch;
    flex-direction: column;
  }

  .actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .actions button {
    overflow: hidden;
    text-overflow: ellipsis;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
    </style>
  </head>
  <body>
    <main class="shell" id="app">
      <header class="bar">
        <div class="identity">
          <span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="leaf">
<!-- A leaf whose midrib is a page's left margin, with the text hanging off it:
     the name drawn as one shape. A single filled path — the paragraph is cut
     out of the blade as negative space, so the mark scales without stroke
     weights drifting. The two palettes are theme.css's accent pair, spelled
     out because a favicon cannot link a stylesheet.

     The whole mark is `lf-tone`, and that is a contract with the runtime:
     a served page paints this element in whatever colour the banner's dot is
     wearing, so the tab says what the leaf is doing (paintTab). A layer
     overriding this file keeps the class or the tab stops saying anything. -->
<style>
  .lf-tone { fill: #2f5480; }
  @media (prefers-color-scheme: dark) {
    .lf-tone { fill: #8fb0d8; }
  }
</style>

</svg></span>
          <span class="product">Leaf</span>
          <span class="page-title" id="page-title">Opening page…</span>
        </div>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="open-page" type="button" disabled>Open in browser</button>
          <button id="display-mode" type="button" hidden>Full screen</button>
        </div>
      </header>
      <section class="surface" id="surface">
        <p class="loading" id="loading">Starting the Leaf page…</p>
        <iframe
          id="leaf-page"
          title="Leaf page"
          referrerpolicy="no-referrer"
          hidden
        ></iframe>
      </section>
      <footer class="foot">
        <span id="sequence">Waiting for Leaf</span>
        <span id="source-warning" hidden>Showing the last valid revision</span>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>
