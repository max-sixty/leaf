# From real pages since `leaf task` shipped (2026-10-05 to 10-10): of 5 replies
# promising later work, the 3 the replying agent carried itself held a task; the 2 it
# handed to another session (a `/dispatch`) held none, so the promise left both
# queues and no result reached the thread. Cold, every run opens the task; what
# fails is ending it, since "a worker touches the page only in a role Leaf's
# instructions give it" leads the brief to forbid `leaf task`. Base at 8cbfb8f75
# passed 6 of 8 runs on Claude Code, both failures that brief; the change 4 of 4,
# each brief ending the task from the dispatched session.
description: handoff-holds-a-task
metadata:
  purpose: 'Conversation loop: work the agent hands to another session still gets a
    `leaf task` on the thread that asked for it, and the brief lets that session end
    it where the result lands.'
  tags:
  - wait-loop
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf page at
    ~/.local/state/leaf/pages/release, served with `leaf server start`. The delivery
    brought one user comment, id 3b9e51a0, opening thread 3b9e51a0 on the `parser`
    section: "/dispatch -- the parser test is flaky again, can you get to the bottom of
    it?" Its answer is `{kind: reply, writer: agent, ref: "5d02c7e1:0:3b9e51a0"}`.

    `/dispatch` is the user's command for handing a task to a separate Claude Code
    session: you write its brief, it starts in its own worktree, and it runs on its
    own for an hour or so. It can run `leaf` commands against this page. You carry on
    with this page and will not hear from that session unless it posts somewhere.

    Read whatever instructions you need. Only Skill and Read run here, so write out,
    in order, each command you would run on the page in this turn, and the brief you
    would hand the dispatched session.
assert:
- type: llm-rubric
  metric: judgment
  value: |
    Pass only if the commands include a `leaf task open` on the page naming
    3b9e51a0 (the comment or its thread) for the parser investigation, and a
    `leaf response reply` answering 3b9e51a0; and if the brief gives the
    dispatched session what it needs to end that task where its result lands (the
    page and the task id, with `leaf task end`), or otherwise names how the task
    is ended. Fail if no task is opened, or if nothing provides for ending it.
