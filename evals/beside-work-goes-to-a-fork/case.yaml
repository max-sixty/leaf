      a progress line `leaf thread reply c31f7a52:0:70a0f2c6 --ephemeral --text "<a
      line>"`. Fail if it leaves that to the subagent, or starts nothing because Leaf's
      line fork already posted a working line.
  - type: llm-rubric
    metric: fork-type
    value: |
      Pass only if the subagent the agent starts for the user's message 70a0f2c6 is a
      fork of its own conversation, such as the Agent tool with `subagent_type:
      "fork"`. Fail if it starts a fresh subagent of another type, or none.
