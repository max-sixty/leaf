name: ci

# Pull requests repeat the local landing gate where `wt merge` does not run.
# Pushes to main add the nightly browser and published-site integration suites.

on:
  push:
    branches: [main]
  pull_request:

# One main run at a time, but never a cancelled one. The nightly suite takes 22-41
# minutes and main takes a commit every 10 minutes at the median, so cancelling the
# run in flight meant the newer commit's run was cancelled in turn: the complete
# suite reached a verdict on under a third of main's commits. Queueing instead keeps
# the same one-run-at-a-time ceiling — GitHub still drops a superseded *pending* run,
# so the queue never grows past the newest head — while letting each run finish. It
# is also what makes the timeouts below reachable: a wedged run has to outlive the
# next push to be reported as one, and each job is bounded even before its suite starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    steps:
      # Two commits, so a pull request's merge commit has its base parent and
      # the touched-module step below can diff against it.
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v7

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Everyday suite
        if: github.event_name == 'pull_request'
        timeout-minutes: 45
        run: uv run pytest tests -v

      # The everyday suite deselects the nightly-marked modules, so a pull request
      # whose whole diff is one of them goes green having run none of it: that is
      # how #336 rewrote two render modules under a green gate and reddened main
      # on the next push. Name the touched ones back. An explicit file selection
      # runs what it names, `-m nightly` leaves the everyday cases in a mixed
      # module to the step above rather than running them twice, and pytest's
      # exit 5 is what a pull request that touches no nightly case gets. A change
      # to the runtime the modules drive is still the nightly run's to catch;
      # this reaches the modules themselves.
      - name: 🧪 Nightly cases this pull request touches
        if: github.event_name == 'pull_request'
        timeout-minutes: 45
        run: |
          touched=()
          while IFS= read -r module; do
            if [ -f "$module" ]; then
              touched+=("$module")
            fi
          done < <(git diff --name-only HEAD^1 HEAD -- 'tests/test_*.py')
          if [ ${#touched[@]} -eq 0 ]; then
            echo "No test module touched."
            exit 0
          fi
          echo "Touched test modules: ${touched[*]}"
          uv run pytest "${touched[@]}" -m nightly -v || [ $? -eq 5 ]

      # `-v` names a stalled test. The step timeout makes a wedge a failure that
      # `tend-ci-fix` can act on.
      - name: 🧪 Nightly suite
        if: github.event_name == 'push'
        timeout-minutes: 90
        run: uv run pytest tests --run-nightly -v

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1

  website-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Build website deploy artifact
        run: npx wrangler deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker
