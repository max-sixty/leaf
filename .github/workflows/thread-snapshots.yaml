name: thread-snapshots

# Captures the thread appearance gate's images on the runner `ci`'s `test` job uses,
# the only place the gate compares them (`dev/leaf_dev/commands/thread_snapshots.py`).
# Dispatch it on the branch whose appearance to approve, review the artifact, then
# accept the run with `leaf-dev thread-snapshots accept`. A dispatch runs the branch's
# own copy of this file, so a branch that changes the capture tests it the same way.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 📸 Capture thread appearance
        run: uv run leaf-dev thread-snapshots capture

      # A failed capture uploads its runs' evidence, and no capture.json, which accept
      # refuses.
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-snapshots
          path: .tmp/thread-snapshots/
          if-no-files-found: ignore
          retention-days: 30
