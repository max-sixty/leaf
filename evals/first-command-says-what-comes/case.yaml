# An ephemeral reply to an owed update takes that update in hand, so the user's
# first sign of the agent is words in their thread rather than a Working label.
# The failure it invites: a first command of `leaf task start` and a read of the
# page, with nothing in the thread until the final reply. The delivery's handling
# is read from each arm's own registry, since that clause is what a real delivery
# hands the agent. The envelope is frozen with `freeze_delivery`: answers name
# `parent` and `responds`, the format is `leaf-delivery/58`, and ids, page, claim
# and times are substituted. The handling is left empty: the prompt reads it from
# each arm's registry.
description: first-command-says-what-comes
metadata:
  purpose: "Conversation loop: after a delivery whose message asks for work, the first command posts a short progress message in its thread saying what the agent will do, before reading or editing anything; the answer comes later."
  tags:
    - wait-loop
    - threads
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf page at
    ~/.local/state/leaf/pages/rollout, served with `leaf server start`. Leaf's prompt
    hook has just put this delivery in your context and confirmed it:

    ```json
    {
     "format": "leaf-delivery/58",
     "id": "7f20c3d9",
     "created_at": 1791448199.576215,
     "acknowledge": null,
     "batches": [
      {
       "page": "~/.local/state/leaf/pages/rollout",
       "claim": null,
       "through_seq": 2,
       "threads": [
        {
         "id": "5d1e8a42",
         "title": null,
         "anchor": {
          "section": "rollout",
          "quote": "The rollout starts on 14 October"
         },
         "detached_from": null,
         "rewritten_from": null,
         "resolved": null,
         "elided": {
          "messages": 0,
          "actions": 0
         },
         "messages": [],
         "summaries": [],
         "actions": []
        }
       ],
       "handling": {},
       "events": [
        {
         "kind": "comment",
         "author": "user",
         "revision": 1,
         "anchor": {
          "section": "rollout",
          "quote": "The rollout starts on 14 October"
         },
         "text": "This paragraph repeats the one above it. Tighten the rollout section, and check its dates against CHANGELOG.md.",
         "id": "5d1e8a42",
         "attention": true,
         "ts": "2026-10-08T01:29:59.412-07:00",
         "seq": 2,
         "subject": {
          "kind": "thread",
          "id": "5d1e8a42"
         },
         "threads": [
          "5d1e8a42"
         ],
         "answer": {
          "kind": "reply",
          "parent": "5d1e8a42",
          "responds": "5d1e8a42",
          "ref": "7f20c3d9:0:5d1e8a42",
          "writer": "agent"
         }
        }
       ]
      }
     ]
    }
    ```

    The delivery's handling text for this comment is the list of clauses under
    `$events` → `answering` → `reply` in `../../browser/runtime/kernel-registry.json` relative to the Leaf skill's
    base directory; read it as part of the delivery.

    Only Skill and Read run here, so write
    out, in order, each command you would run from now until you have answered the
    comment, including any that read files or the page. Then end your answer.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if the first command written, before any command that reads a file,
      the changelog, the page source or page state, edits the page, or checks it, is a
      `leaf thread reply` with `--ephemeral` addressed to `7f20c3d9:0:5d1e8a42` whose text tells the user in a line what the agent is about to do, and
      if a later ordinary `leaf thread reply` (without `--ephemeral`) answers 5d1e8a42
      after the work. A `leaf task start` on 5d1e8a42 after the progress message is
      fine. Fail if the first command is a `leaf task start`, a read, an edit, or
      anything other than that progress message, or if the comment is never answered.
