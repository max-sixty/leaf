# Leaf's developer tooling as one package. `uv run leaf-dev --help` lists its
# commands; the scripts under `scripts/`, the suite, and the eval harnesses in `notes/`
# import its modules. It is a workspace member that only the root dev group depends
# on, so `bin/leaf`, which runs `--no-dev`, never installs it or what it needs.
[project]
name = "leaf-dev"
version = "0"
requires-python = ">=3.10"
dependencies = ["leaf", "click>=8", "pillow>=12.1"]

[project.scripts]
leaf-dev = "leaf_dev.cli:cli"

[tool.uv.sources]
leaf = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
