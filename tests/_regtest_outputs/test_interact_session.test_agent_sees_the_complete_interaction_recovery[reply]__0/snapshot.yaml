# Complete agent-facing outputs through real hooks, wait and response commands.
# Only page paths, event/delivery identities and timestamps are normalized.
# A null hook output means the turn can end without a reminder.

no watcher:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: no watcher. Start `leaf wait` in the background for all this session's pages, or run `leaf status <page> idle` if this page is done.

unpicked at prompt:
  hookSpecificOutput:
    hookEventName: UserPromptSubmit
    additionalContext: |-
      Leaf needs attention:
      - <page>: 1 update you haven't picked up. `leaf wait` prints them.

      If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully before acknowledging. If forwarding it, wait for durable delivery to its handler. Then run `leaf ack <page> <through-seq>` in the background, using the batch's page and sequence. Ack advances the cursor, then waits for the next batch while the page remains live. The agent handling the batch must address every event.

unpicked at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 update you haven't picked up. `leaf wait` prints them.

    If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully before acknowledging. If forwarding it, wait for durable delivery to its handler. Then run `leaf ack <page> <through-seq>` in the background, using the batch's page and sequence. Ack advances the cursor, then waits for the next batch while the page remains live. The agent handling the batch must address every event.

idle before pickup:
  exit: 1
  output: |
    1 update nobody has picked up; read them with `leaf wait` before idling. If output is truncated, acknowledge nothing; rerun with enough output capacity for the whole batch. If you handle the batch yourself, read it fully before acknowledging. If forwarding it, wait for durable delivery to its handler. Then run `leaf ack <page> <through-seq>` in the background, using the batch's page and sequence. Ack advances the cursor, then waits for the next batch while the page remains live.

delivered:
  format: leaf-delivery-v1
  id: <delivery>
  created_at: <time>
  batches:
    - page: <page>
      through_seq: 2
      conversations: []
      events:
        - kind: comment
          author: user
          revision: 1
          text: >-
            Add the camera first.
          id: event-2
          ts: <time>
          seq: 2
          subject:
            kind: conversation
            id: event-2
          conversations: [event-2]
          handling: >-
            Reply in the thread with `leaf reply <page> --for <event-id>`, or with
            your final message on a host that sends it as the reply, and revise
            the page if the comment calls for it. If that revision removes what
            the thread is anchored on, move the thread in the same reply with `--section
            <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it
            if its subject has left the page. Leave the thread open unless the reader
            asks you to close it or nothing further could change the outcome.
          obligation:
            as_of_seq: 2
            response:
              kind: reply
              to: event-2
              for: event-2

acknowledged at stop:
  decision: block
  reason: |-
    Leaf needs attention:
    - <page>: 1 acknowledged reader move with no answer (event-2).

    Read current obligations with `leaf page state <page>` and conversation history with `leaf conversation read <page> <id>`. Reply using `leaf reply <page> --for <event-id> --text ...`, or your final message if the host sends it as the reply. For `response.kind: version`, revise and stamp the page, then resolve the conversation. If you need clarification first, open `leaf comment <page> --section <ask-id>` on the same Ask. An explicit reply checks and activates page edits; it leaves the conversation open.

idle before answer:
  exit: 1
  output: |
    1 acknowledged reader move with no answer (event-2); answer before idling. Read current obligations with `leaf page state <page>` and conversation history with `leaf conversation read <page> <id>`. Reply using `leaf reply <page> --for <event-id> --text ...`, or your final message if the host sends it as the reply. For `response.kind: version`, revise and stamp the page, then resolve the conversation. If you need clarification first, open `leaf comment <page> --section <ask-id>` on the same Ask. An explicit reply checks and activates page edits; it leaves the conversation open.

answer: |
  replied in event-2

answered at stop: null
