# The one project: the repository is the plugin, and the plugin is this uv
# project. A harness installs the tree or loads it in place; `bin/leaf`
# runs `uv run --project <that root>`, and the environment appears on the
# first run, synced into `.venv` beside this file: one environment per
# installed version.
#
# The Python application lives at `src/leaf`;
# `module-root` points the build backend there. This is Leaf's layout, not a
# harness requirement: the plugin root is the installation boundary, while
# `skills/leaf/SKILL.md` is the agent's instruction entry point. `uv sync`
# installs the project editable, so `schema.py` resolves application resources
# through `__file__` into this same tree.
#
# Dependencies state the lowest version the suite passes on, with no upper cap.
# `uv.lock` ships in the install, so a harness runs the versions the suite last
# passed on.
#
# The dev group is what the suite and `leaf-dev` need on top of the runtime:
# pytest, the accessibility checks, and screenshot assertions. These run here
# rather than carrying
# dependency headers of their own — developer tools like the suite, so one environment
# covers both. `bin/leaf` passes `--no-dev`, so an install never fetches the group,
# though the lock records it.
#
# psutil is a compiled extension, so every install fetches a platform wheel for it
# rather than pure Python. It is a runtime dependency because every page claim
# reads the process tree above it (`machine.py`).
# pywhatwgurl resolves captured resource URLs and checks the `uri` format with a
# WHATWG URL parser. It is pure Python, so URL validation needs no native
# build toolchain on older Linux systems.
# regress is an ECMAScript regular-expression engine; schema `pattern`s are read
# with it (`registry/schema.py`) so they mean what they mean to the browser rather
# than Python's `re`, whose `$` also matches before a final newline.
# watchfiles supplies the native subscriptions shared by page maintenance,
# delivery waits and developer previews, avoiding repeated idle filesystem scans.
#
# Playwright is a runtime dependency because the skill's own flow runs the
# browser: `page check --render` gates every finished page and `version
# export` copies one. Its wheel lands in each version's environment as links
# into uv's shared cache, so the disk it takes is paid once per machine, not
# per install. A `--with` overlay carries no console scripts, so it is not a
# route to supplying it per dispatch.

[project]
name = "leaf"
version = "0"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.10",
  "click>=8.2",
  "jmespath>=1",
  "jsonschema>=4.18",
  "linkify-it-py>=2",
  "markdown-it-py>=4",
  "mdit-py-plugins>=0.4",
  "playwright>=1.64",
  "psutil>=6",
  "pywhatwgurl>=0.1.2",
  "regress>=2026.9",
  "starlette>=0.48",
  "tinycss2>=1.4",
  "tree-sitter>=0.25.2",
  "tree-sitter-javascript>=0.25.0",
  "turbohtml>=1.7",
  "uvicorn>=0.31.1",
  "watchfiles>=1.1.0",
  "websockets>=15",
]

[project.scripts]
leaf = "leaf.__main__:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "leaf"

[dependency-groups]
dev = [
  # Accessible snapshots with rendered boxes for corpus round-trip checks.
  "playwright>=1.64",
  "pytest>=9.1",
  "pytest-xdist>=3",
  "axe-playwright-python>=0.1.4",
  "pre-commit>=4.6.2",
  # Browser screenshot assertions.
  "pillow>=12.1",
  "pytest-regtest>=2.7",
  # The YAML snapshots `interact_support.yaml_document` writes.
  "pyyaml>=6",
  # Reads bundled package scripts' declared dependencies, to hold them to the
  # dependency policy (`test_interact_layer.py`).
  "packaging>=22",
  # Reads the example review's captured patch by line (`test_product_page.py`).
  "unidiff>=1",
  # The developer tooling package in `dev/`.
  "leaf-dev",
  # The Python server behind leaf.page, in `worker/`.
  "leaf-website",
  "pytest-image-snapshot[pixelmatch]>=0.5.3",
  "ty>=0.0.94",
  "ruff>=0.17.3",
  "datamodel-code-generator>=0.87.0",
]

# An install never syncs the members, but uv reads their `pyproject.toml` files to
# check the lock on every unfrozen run, so a partial copy of the tree that runs
# `bin/leaf` carries them (`leaf_dev.arms.PAYLOAD`).
[tool.uv.workspace]
members = ["dev", "worker"]

[tool.uv.sources]
leaf-dev = { workspace = true }
leaf-website = { workspace = true }

[tool.ruff]
target-version = "py312"
# Apply the same scope to directory scans and filenames passed by pre-commit.
force-exclude = true
extend-exclude = [
  "browser/vendor",
  "packages/**/vendor",
  "evals/ui-review-detection/fixtures",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
# The formatter owns line wrapping; existing module setup and callable expressions
# may put imports after setup or use a lambda as a value.
# Review zip length semantics separately before enabling B905.
ignore = ["E402", "E501", "E731", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["leaf", "leaf_dev", "leaf_website"]

[tool.ty.environment]
# Match pytest's helper imports below, including tests/browser packages.
extra-paths = ["tests"]

# SessionEnd runs before a managed environment exists (bin/leaf), on system Python.
[tool.ruff.per-file-target-version]
"src/leaf/state.py" = "py39"

# The suite is round trips through a real browser rather than computation, so tests
# shard independently: every test gets its own tmp_path, XDG homes, and server.
# The site's test modules are one load group because their module-scoped build and
# host are the shared setup; everything else stays individually balanced. Chromium launches once
# per worker for the run.
# Two workers cap the browser load when suites overlap on one machine; CI's own
# runner sets its count in ci.yaml.
# `-n0` to debug a single test.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-n 2 --dist loadgroup --max-worker-restart=0 --regtest-consider-line-endings --image-snapshot-save-diff -p leaf_dev.thread_snapshot_plugin -p leaf_dev.commands.suite_profile"
markers = [
  "network: requires external network access after development setup",
  "shifts_unsurveyed: its browser tests await a shift survey, so they do not reject unsolicited layout shifts",
  "watch_shifts: a surveyed test marked `shifts_unsurveyed` rejects unsolicited layout shifts and typing that carries its field",
]
# A test still running after half an hour is hung, not slow: the slowest takes under
# three minutes on CI, so even ten times slower it finishes. The worker prints every
# thread's stack, which names the call that blocked, and exits. xdist reports the test
# as crashed, and `--max-worker-restart=0` (addopts) then ends the run once the other
# workers finish the tests already sent to them. Replacing the crashed worker instead
# leaves a `--dist loadgroup` run with every worker idle, waiting for a test that never
# comes, until something kills it (xdist 3.8.0). Without the timeout, a call with no
# deadline of its own (`page.evaluate`, a new page, a lock) holds the run until the CI
# job's six-hour limit. Pytest cancels this timer when a test reports a failure,
# so it does not bound that test's cleanup. CI also bounds the whole Python/profile
# command, including failed-test cleanup, before the job deadline.
faulthandler_timeout = 1800
faulthandler_exit_on_timeout = true

# Definitions nothing in the tree reaches (pre-commit's `vulture`). Every Python
# tree is scanned at once, so a use in the tests, the Worker's container or a dev
# command keeps a definition alive. What a framework calls by name is excluded by
# the framework's own registration or naming convention, never one dead candidate
# at a time: a decorator that registers the function, or a name the framework's
# protocol fixes. A new framework gets its pattern here; a definition only a
# removed caller used gets deleted.
[tool.vulture]
paths = ["build", "dev", "evals", "hooks", "src", "packages", "skills", "tests", "worker"]
exclude = ["vendor/", "node_modules/"]
min_confidence = 60
ignore_decorators = [
  "@*.command",
  "@*.group",
  "@*.fixture",
  "@pytest.*",
  "@atexit.register",
  "@*.checks",
]
ignore_names = [
  # pytest and its plugins
  "pytest_*",
  "pytestmark",
  # Promptfoo's Python provider and assertion entry points are called by the external
  # runner.
  "call_api",
  "get_assert",
  "image_snapshot_*",
  "show_differences",
  # a subject's module fixture another tier directory's module imports by its alias
  # (`tests/AGENTS.md`, "Run what the change needs")
  "*_fixture",
  # http.server, socketserver, logging
  "do_*",
  "list_directory",
  "log_message",
  "protocol_version",
  "close_connection",
  "daemon_threads",
  "handlers",
  # urllib.request calls this HTTPRedirectHandler override by name.
  "redirect_request",
  # a reference held only so its page stays in the recent pages (samples.py)
  "parent_memory",
  # click, uvicorn, markdown-it
  "get_command",
  "format_commands",
  "command_class",
  "group_class",
  "main_loop",
  "validateLink",
]
