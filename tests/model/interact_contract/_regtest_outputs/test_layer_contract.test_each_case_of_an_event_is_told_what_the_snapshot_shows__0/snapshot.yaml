        keeps the lf-new branch and `reject` the lf-old one. In the next version,
        write the kept branch in as plain prose with its ids and remove the suggestion.
    - when: {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}}
      text: >-
        If you need clarification, ask in a thread on the picked option. To override
        the pick in a later version, mark the element `restated` and say why in
        the version note.
    - text: >-
        It answers the page's obligation, which waits on you until the markup records
        the answer. Before starting the work it selects or unblocks, name it with
        `leaf task start <page> <event-id> --text "<the work, in a line>"`; then
        do it and write the answer into the markup. Once the work is done, make
        the question a record of the decision (`references/authoring-revisions.md`,
        "Keep the current page current"), such as a choice group marked `settled`
        with what came of it beside it, and stamp a version. An option the user
        added needs no writing in; the page keeps it where the user put it.

pick inside a thread:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: reply
      writer: agent
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "agent"}}}}}
      text: >-
        If the event asks for work, first post one line in its thread saying what
        you will do, before any other command, even a read: `leaf thread reply <answer.ref>
        --ephemeral --text "<what you will do, in a line>"`. Then do the work, put
        the result on the page with what shows it (captures, a figure, the numbers),
        and answer with `leaf thread reply <answer.ref> <declaration> --file reply.md`:
        what changed, in a sentence or two, linking the section that shows it. If
        the event asks for no work, answer it with that reply at once. The reply
        checks your saved page edit and makes it live before posting. The declaration
        says whose move your answer leaves, which delivering what was asked doesn't
        settle. `--obligation` when it is the user's: it leaves them a decision,
        or something to try or review before making one, or asks them for an answer
        or permission. That puts your answer on their On me list until they reply
        or resolve the thread, even where the decision itself is already there.
        Where your answer asks a question of its own whose answers you can list,
        such as which of two ways to proceed or whether to take an action, put them
        in `--markup` in place of `--obligation`, as `<lf-options id="…" choose>`
        holding an `<lf-option id="…">` for each answer: the user answers with a
        press, and the choice waits on them by itself (`references/threads.md`,
        "Ask for a pick"). `--todo "<what you owe>"` when it is yours, promising
        work beyond this turn. `--done` when it leaves nobody a move.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

pick inside a thread over App Server:
  event:
    kind: action
    meaning:
      scope: thread
    answer:
      kind: reply
      writer: turn
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"properties": {"answer": {"properties": {"writer": {"const": "turn"}}}}}
      text: >-
        Leaf posts your opening message in the thread as your progress line and
        your final message as the reply, unless an explicit reply already answered
        this input. Before your first tool call, tell the user briefly the answer
        or what you are about to do; later working messages stay in Codex. End with
        the answer, or what changed and where it shows. A final message leaves the
        user no move, so where your answer leaves them one, such as a decision or
        something to try or review before making one, answer with `leaf thread reply
        <answer.ref> --obligation` instead: it puts the answer on their On me list
        even where the decision itself is already there. Where your answer asks
        a question of its own whose answers you can list, such as which of two ways
        to proceed or whether to take an action, reply with them in `--markup` in
        place of `--obligation`, as `<lf-options id="…" choose>` holding an `<lf-option
        id="…">` for each answer, so the user answers with a press (`references/threads.md`,
        "Ask for a pick"). Reply explicitly too for other widgets, work promised
        beyond this turn (`--todo`), a title or moving the thread (`references/threads.md`);
        an explicit reply posts at once, and your final message is then not posted.
    - text: >-
        Your reply renders as Markdown in a narrow column: give each point its own
        short paragraph or list item, link a page section as `[its name](#section-id)`,
        and fence code or markup.
    - when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
      text: >-
        The widget is in a thread message: continue the work the user's answer selects
        or unblocks, and answer in that thread.

resolve:
  event:
    kind: resolve
  told:
    - text: >-
        The user closed the thread. You owe no reply there; a to-do you opened on
        it stays open until you end it.

unresolve:
  event:
    kind: unresolve
  told:
    - text: >-
        The user reopened a closed thread. Reopening needs no separate answer; if
        the thread's latest user message was never answered, `leaf page state <page>
        <message>` shows the `answer` still owed.

Done on a to-do on the user:
  event:
    kind: todo_end
  told:
    - text: >-
        The user pressed Done on the to-do `todo`, which ends it and owes no reply.
        Continue the work it was waiting for; if you still need something from them,
        ask again.

undo:
  event:
    kind: undo
  told:
    - text: >-
        The user took back the gesture `undoes` names. Treat the two as cancelled:
        don't answer or record the withdrawn gesture. Undoing an action that answered
        or closed a thread reopens that thread.

report:
  event:
    kind: report
  told:
    - text: >-
        A worker reported provisional state for a page widget, which the page shows
        until a stamped version answers it. Before the page ends, answer it in a
        stamped version: write the reported state into the markup, or mark the element
        `overruled` and say why in the version note.

error:
  event:
    kind: error
  told:
    - text: >-
        The page's runtime reported a failure the user saw. Fix the page or widget
        and save the fix. Reply only if the user asked about it.
