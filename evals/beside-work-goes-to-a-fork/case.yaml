    metric: spawns-a-fork
    value: |
      Pass only if the agent starts a background subagent for the user's message
      70a0f2c6 whose brief has it do the work the message asks (reading what the lease
      allows) and answer the user there itself, with `leaf thread reply` and the
      reference `c31f7a52:0:70a0f2c6`, and the agent itself goes on with the retry
      change rather than doing that work. Posting a progress line on the message
      (`--ephemeral`) or starting it with `leaf task start` is fine. Fail if the agent
      reads the lease or answers the message itself, waits for the subagent before
      going on, or starts no subagent for it.
  - type: llm-rubric
    metric: starts-the-message
    value: |
      Pass only if the agent itself takes the user's message 70a0f2c6 in hand in this
      turn, before it ends the turn, with `leaf task start
