# Agents can hand an action the user takes over as a waiting line. There are no
# to-dos on the user, the user's choice: everything On Me is answered through its
# widget or thread, so the action is asked in a thread message. Whether the install
# worked has answers the agent can list, so the message offers them as options the
# user presses. Scores conversation-loop.md, "The On lists".
description: step-on-the-user-takes-a-thread
metadata:
  purpose:
    "Conversation loop: work the agent needs the user to do outside the page, whose
    outcome the agent can list, goes on the user's On Me list as a thread message
    offering those outcomes as a choice, about the section it concerns, rather than
    only into a reply."
  tags:
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf page at
    ~/.local/state/leaf/pages/release, served with `leaf server start`. You just
    stamped version 3, which rewrites the page's `install` section with new steps for
    installing the release on a phone. Before you hand the page back, you need the user
    to follow those steps on their own phone and tell you whether it worked; you
    cannot do it yourself.

    Only Skill and Read run here, so write out,
    in order, each command you would run on the page to hand it back.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if the commands put trying the install steps on the user's On Me list
      as a thread message (`leaf thread create` on the page, on the `install` section
      or the page as a whole) whose words say what to try and whose text holds an
      `lf-options` group with an `lf-option` for each outcome, such as that it
      installed and that it failed, so the user answers with a press. Fail if the
      outcome is asked only in words, even with `--obligation`, or if the request
      reaches the user only as prose, such as a reply or a waiting status line.
