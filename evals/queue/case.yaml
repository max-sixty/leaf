# Complete task; diagnostic contexts retain the original fixed checks.
description: Queue
metadata:
  purpose: Compose and revise a queue; inspect its rendered output against the
    request and, on Leaf, read and preserve a user choice on that page.
  tags:
    - workflow
  conditions:
    - leaf
    - html
  executor: leaf_dev.arrangement_eval
  scenario: queue
variants:
  board:
    metadata:
      executor: leaf_dev.usability_eval
      scenario: board
      purpose: Read moves and undo before revising a board.
      conditions:
        - leaf
  mixed:
    metadata:
      executor: leaf_dev.usability_eval
      scenario: mixed
      purpose: Answer mixed comments, choices, moves, undo and errors.
      conditions:
        - leaf
  # From TODO.md, "Test the Layouts on agents": after its comment and decisions,
  # the queue also carries a hand-off for a reader who did not work it, so a
  # workspace and a document share one page.
  hand-off:
    metadata:
      scenario: queue-hand-off
      purpose: Add a hand-off document to a worked queue, keeping both usable and the comment thread.
      tags: [workflow, layout]
      conditions: [leaf]
