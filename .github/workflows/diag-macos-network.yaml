name: diag-macos-network
on:
  push:
    branches: [firefox-bounce-tracking]
jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: uv run --with playwright playwright install chromium-headless-shell
      - name: Describe the network
        run: |
          sw_vers; uptime; networksetup -listallnetworkservices; scutil --nwi; ifconfig -a
          scutil --dns | head -40
          sysctl net.inet6.ip6.use_tempaddr net.inet6.ip6.temppltime net.inet6.ip6.tempvltime || true
          ipconfig getpacket en0 || true
          mkdir -p out
          { sw_vers; uptime; networksetup -listallnetworkservices; scutil --nwi; ifconfig -a; ipconfig getpacket en0; } > out/describe.txt 2>&1 || true
          log stream --style compact --predicate 'process == "configd" OR subsystem == "com.apple.IPConfiguration"' > out/configd.log 2>&1 &
      - name: Watch 1
        run: |
          mkdir -p out/1
          cp out/describe.txt out/configd.log out/1/ 2>/dev/null || true
          uv run --with playwright python .github/diag/network_watch.py 62 out/1 2>&1 | tee out/1/watch.log || true
          cp out/configd.log out/1/ || true
      - name: Upload 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-watch-1
          path: out/1/
      - name: Watch 2
        run: |
          mkdir -p out/2
          cp out/describe.txt out/configd.log out/2/ 2>/dev/null || true
          uv run --with playwright python .github/diag/network_watch.py 62 out/2 2>&1 | tee out/2/watch.log || true
          cp out/configd.log out/2/ || true
      - name: Upload 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-watch-2
          path: out/2/
      - name: Watch 3
        run: |
          mkdir -p out/3
          cp out/describe.txt out/configd.log out/3/ 2>/dev/null || true
          uv run --with playwright python .github/diag/network_watch.py 62 out/3 2>&1 | tee out/3/watch.log || true
          cp out/configd.log out/3/ || true
      - name: Upload 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-watch-3
          path: out/3/
      - name: Watch 4
        run: |
          mkdir -p out/4
          cp out/describe.txt out/configd.log out/4/ 2>/dev/null || true
          uv run --with playwright python .github/diag/network_watch.py 62 out/4 2>&1 | tee out/4/watch.log || true
          cp out/configd.log out/4/ || true
      - name: Upload 4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-watch-4
          path: out/4/
      - name: Watch 5
        run: |
          mkdir -p out/5
          cp out/describe.txt out/configd.log out/5/ 2>/dev/null || true
          uv run --with playwright python .github/diag/network_watch.py 62 out/5 2>&1 | tee out/5/watch.log || true
          cp out/configd.log out/5/ || true
      - name: Upload 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-watch-5
          path: out/5/
