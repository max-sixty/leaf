# The fork that writes the agent's working line on a thread message
# (`src/leaf/agents/forks.py`), replayed on a short conversation written for each kind of
# message a session gets. Run every case with `uv run leaf-dev eval run 'line-fork*'
# --harness claude-code`; inputs and rubrics are in workflows/fork_eval.yaml.
description: Line fork
metadata:
  purpose: A question about why the session's finding holds gets a line saying what the agent will check.
  tags: [workflow, forks, threads]
  harnesses: [claude-code]
  conditions: [leaf]
  executor: leaf_dev.fork_eval
  scenario: why-ci
variants:
  meaning:
    metadata:
      scenario: meaning
      purpose: A question about what something means, answered by reading.
  work-request:
    metadata:
      scenario: work-request
      purpose: A change to the page, however small.
  user-decides:
    metadata:
      scenario: user-decides
      purpose: The user's answer to the session's question, which the session records.
  still-running:
    metadata:
      scenario: still-running
      purpose: A question whose answer is a running command's result.
  work-out:
    metadata:
      scenario: work-out
      purpose: A question the session never looked at.
  still-deciding:
    metadata:
      scenario: still-deciding
      purpose: A question whose answer would settle what the session is still deciding.
  steer-plan:
    metadata:
      scenario: steer-plan
      purpose: A message that changes how the session will do the work it said it does next.
  steer-running:
    metadata:
      scenario: steer-running
      purpose: A message that changes a command the session is running.
  # The claude-code journey's `fork-busy` question (`leaf-dev journey run
  # claude-code`), asked just after the session has added a card to the page's
  # source and ended its turn.
  source-edited:
    metadata:
      scenario: source-edited
      purpose: A count to look up in the page's source.
