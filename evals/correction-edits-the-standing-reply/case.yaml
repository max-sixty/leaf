 to proceed or whether to take an action, put them in `--markup` in place of `--obligation`, as `<lf-options id=\"\u2026\" choose>` holding an `<lf-option id=\"\u2026\">` for each answer: the user answers with a press, and the choice waits on them by itself (`references/threads.md`, \"Ask for a pick\"). `--todo \"<what you owe>\"` when it is yours, promising work beyond this turn. `--done` when it leaves nobody a move.", "h3": "Your reply renders as Markdown in a narrow column: give each point its own short paragraph or list item, link a page section as `[its name](#section-id)`, and fence code or markup."}, "events": [{"attention": true, "author": "user", "revision": 1, "kind": "comment", "text": "Why did checkout p95 jump to 340 ms?", "anchor": {"section": "p95-figure"}, "id": "c2f698d6", "ts": "2026-11-09T08:31:07.599+00:00", "seq": 2, "subject": {"kind": "thread", "id": "c2f698d6"}, "threads": ["c2f698d6"], "handling": ["h1", "h2", "h3"], "answer": {"kind": "reply", "parent": "c2f698d6", "responds": "c2f698d6", "ref": "48357e87:0:c2f698d6", "writer": "agent"}}]}]}


    You answered it with:

    leaf thread reply 48357e87:0:c2f698d6 --done --text "Tuesday's deploy flushed the product cache, so checkout reads from the database until the cache warms. It should settle back toward 180 ms within a day."

    which posted your reply as message aaab97a2.


    You kept reading the traces after posting it. The product cache's hit rate has been back at 98% since Wednesday, so the cache is not the cause. The p95 comes from the coupon lookup, which since Tuesday's deploy runs one database query per cart line; carts of ten or more lines take 300 ms longer. It will not settle on its own. The user has not written anything in the thread since your reply.


    The page and services are unreachable in this exercise. Write out the Leaf commands you would run now, with the full text of any message, then end your answer.
assert:
  - type: llm-rubric
    metric: edits-the-standing-reply
    value: Pass only if the agent corrects its earlier answer by editing message
      `aaab97a2` with `leaf thread edit`, so the thread's reply now says the cause is
      the coupon lookup's per-line queries rather than the cache. Fail if it posts the
      correction as a new message in the thread (any `leaf thread reply`, or a new
      thread), whether or not it also edits. Other commands, such as page edits, and
      the wording don't matter.
