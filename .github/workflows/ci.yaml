name: ci

# The two gates `wt merge` already runs locally (`.config/wt.toml`), run again
# where that hook never reaches: a pull request, and any push that didn't come
# through `wt merge`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      # `--run-nightly` adds the complete browser and published-site integration
      # suites; the runner has the package index the launcher resolves Playwright from.
      #
      # The suite sometimes stops mid-run with a browser still alive and never
      # returns, so bound it. `timeout` on the command rather than
      # `timeout-minutes` on the job, because the two kills are reported
      # differently: GitHub's job cap yields `cancelled`, and `tend-ci-fix` fires
      # on `failure` alone, so a wedge there is the one red `main` nothing sees —
      # and nothing here lands through a pull request, so this run is the only
      # gate a commit gets. A timed-out command exits 124, which is a failure like
      # any other. `--kill-after` because the TERM has to reach eight xdist workers
      # and a headless shell. 30 minutes is well past the 11.6-minute worst of the
      # last 40 healthy runs.
      - name: 🧪 Test suite
        run: timeout --kill-after=1m 30m uv run pytest tests --run-nightly

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1
