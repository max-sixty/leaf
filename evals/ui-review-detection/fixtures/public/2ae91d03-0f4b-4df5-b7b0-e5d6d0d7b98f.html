<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review recording</title><style>body{margin:0;background:#faf9f6;color:#272622;font:15px/1.45 Arial,sans-serif}main{max-width:1000px;margin:35px auto;padding:0 24px}h1{font-size:24px;font-weight:600}button,input,select{font:inherit}button{background:#f6f4ef;border:1px solid #d4cfc3;border-radius:5px;color:inherit;min-height:44px;padding:0 14px;cursor:pointer}button:focus-visible{outline:2px solid #315b89;outline-offset:2px}[hidden]{display:none!important}.panel{padding:16px;border:1px solid #d4cfc3;border-radius:5px;background:#faf9f6}.controls{display:flex;align-items:center;gap:12px;margin:12px 0}p{margin:8px 0}h2{font-size:18px;font-weight:500}.lf-trace-timeline { min-inline-size: 0; }

.lf-trace-markers { min-inline-size: 0; }
.lf-trace-marker { inline-size: var(--lf-trace-control-size); block-size: var(--lf-trace-control-size); display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--r); background: var(--paper); color: var(--ink); font: 600 var(--lf-trace-small-type) / 1 var(--sans); cursor: pointer; }
.lf-trace-marker:hover, .lf-trace-marker[aria-current] { background: var(--accent-tint); color: var(--accent); }
.lf-trace-marker:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.lf-trace-marker:disabled { color: var(--muted); cursor: default; }
.lf-trace-markers .vis-timeline { --lf-drawing: 1; border: 1px solid var(--border-2); border-radius: var(--r); font: inherit; touch-action: pan-y !important; }
.lf-trace-markers .vis-panel, .lf-trace-markers .vis-grid { border-color: var(--border-2); }

.lf-trace-markers .vis-panel.vis-center { z-index: 2; }
.lf-trace-markers .vis-text { color: var(--muted); font: var(--lf-trace-small-type) / 1.4 var(--sans); }
.lf-trace-markers .vis-time-axis .vis-text { color: var(--muted); font-size: var(--lf-trace-small-type); min-block-size: var(--lf-trace-control-size); box-sizing: border-box; display: flex; align-items: flex-start; padding-block-start: 2px; }

.lf-trace-stage:has(.lf-trace-markers[aria-busy="true"]) { visibility: hidden; }
.lf-trace-markers[aria-busy="true"] .vis-timeline { visibility: hidden !important; }
.lf-trace-markers .vis-shadow { box-shadow: 0 0 8px var(--ink); }
.lf-trace-markers .vis-item { color: var(--ink); border: 0; background: none; }
.lf-trace-markers .vis-item .vis-item-content { padding: 0; }
.lf-trace-markers .vis-item.vis-box { z-index: 2; }

.lf-trace-markers .vis-item:is(.vis-dot, .vis-line) { display: none; }
.lf-trace-moment-anchor { display: inline-block; }
.lf-trace-markers .vis-item.vis-background { background: none; pointer-events: none; }

.lf-trace-markers .vis-custom-time { --lf-trace-cursor-cap-size: 18px; --lf-trace-cursor-start: calc(var(--lf-trace-cursor-axis, 0px) + var(--lf-trace-control-size) - var(--lf-trace-cursor-cap-size)); inline-size: 2px; background: none; translate: -1px 0; z-index: 1; pointer-events: none; cursor: ew-resize; }
.lf-trace-markers .vis-rtl .vis-custom-time { translate: 1px 0; }
.lf-trace-markers .vis-custom-time::before { content: ""; position: absolute; inset-block-start: var(--lf-trace-cursor-start); left: 50%; inline-size: 14px; block-size: var(--lf-trace-cursor-cap-size); border-radius: 3px 3px 7px 7px; background: var(--accent); translate: -50% 0; }
.lf-trace-markers .vis-custom-time::after { content: ""; position: absolute; inset-block-start: var(--lf-trace-cursor-start); inset-inline: 0; inset-block-end: 0; background: var(--accent); }

.lf-trace-markers .vis-custom-time > div { min-inline-size: var(--lf-trace-control-size); height: var(--lf-trace-control-size) !important; top: var(--lf-trace-cursor-axis, 0px) !important; left: 50% !important; translate: -50% 0; pointer-events: auto; touch-action: none; cursor: ew-resize; }
.lf-trace-markers.lf-trace-readonly .vis-custom-time > div { pointer-events: none; }
.lf-trace-marker > span, .lf-trace-moment-number { display: grid; place-items: center; min-inline-size: 22px; block-size: 22px; padding-inline: 3px; box-sizing: border-box; border: 1px solid var(--border-2); border-radius: 999px; background: var(--paper); }
.lf-trace-input-tick { display: grid; place-items: center; min-inline-size: var(--lf-trace-control-size); block-size: var(--lf-trace-control-size); padding-inline: var(--sp-2); border: 1px solid var(--border-2); border-radius: var(--r); color: var(--ink); background: var(--paper-2); font: 600 var(--lf-trace-small-type) / 1 var(--sans); cursor: pointer; }
.lf-trace-input-tick:hover { background: var(--accent-tint); color: var(--accent); }
.lf-trace-input-tick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }:root{--border-2:#d4cfc3;--r:5px;--ink:#272622;--paper:#faf9f6;--paper-2:#f8f7f3;--muted:#706b61;--accent:#315b89;--accent-tint:#e5eaf0;--sans:Arial,sans-serif;--lf-trace-small-type:12px;--lf-trace-control-size:44px;--sp-2:8px}.lf-trace-markers{margin-top:8px}.lf-trace-input-tick{box-sizing:border-box}.readout{font-size:13px;color:#706b61}.moment-list{max-width:700px}.moment-list p{display:flex;justify-content:space-between;padding:8px 0}.moment-list strong{font-weight:400}.moment-list button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;width:100%;padding:8px 0}.moment-list button:hover{background:#e5eaf0}</style></head><body><main><h1>Review recording</h1><section class="panel"><div class="moment-list"><p>Moments (3)</p><button data-moment="1"><strong>1 &nbsp; Thread reached from above</strong><span>1.361 s</span></button><button data-moment="2"><strong>2 &nbsp; Thread reached from below</strong><span>2.277 s</span></button><button data-moment="3"><strong>3 &nbsp; Reply focused</strong><span>2.318 s</span></button></div><div class="controls"><button id="previous">‹</button><button id="play">▶ Play</button><button id="next">›</button><span class="readout" id="readout">0.408 s · After checkpoint · Frame.goto</span></div><div class="lf-trace-markers"></div><p class="readout">Recorded pace (1x)</p></section></main><script type="module">import {Timeline,DataSet,css} from './assets/timeline.esm.js';
const style=document.createElement('style');style.textContent=css;document.head.prepend(style);
const inputs=[{"key": "t", "time": 663.777}, {"key": "Escape", "time": 1387.8250000000007}, {"key": "g", "time": 1408.559000000001}, {"key": "Shift+g", "time": 1437.9560000000001}, {"key": "t", "time": 1649.9390000000003}, {"key": "c", "time": 2292.161}];const moments=[{"number": 1, "time": 1360.886, "label": "Thread reached from above"}, {"number": 2, "time": 2276.693, "label": "Thread reached from below"}, {"number": 3, "time": 2317.829, "label": "Reply focused"}];const host=document.querySelector('.lf-trace-markers');
const dataset=new DataSet([...inputs.map((action,i)=>({id:'input:'+i,start:action.time,type:'box',className:'lf-trace-input-event',inputAction:action,content:''})),...moments.map(moment=>({id:moment.number,start:moment.time,content:String(moment.number),type:'box',align:'center'}))]);
let selected=408.203;
const select=(time,label)=>{selected=time;rail.setCustomTime(time,'selection');document.querySelector('#readout').textContent=`${(time/1000).toFixed(3)} s · ${label}`;};
const rail=new Timeline(host,dataset,{onInitialDrawComplete:()=>requestAnimationFrame(()=>requestAnimationFrame(()=>window.__fixtureReady=true)),showCurrentTime:false,showMajorLabels:false,stack:true,cluster:false,selectable:false,orientation:'top',zoomKey:'ctrlKey',zoomMin:1,snap:null,start:0,end:2410,min:0,max:2410,margin:{item:8,axis:2},format:{minorLabels:date=>`${(+date/1000).toFixed(+date%10?3:+date%1000?2:0)} s`},template:item=>{const button=document.createElement('button');if(item.inputAction){const action=item.inputAction;button.className='lf-trace-input-tick';button.textContent=action.key;button.title=`Press ${action.key} · ${(action.time/1000).toFixed(3)} s`;button.setAttribute('aria-label',button.title);button.onclick=()=>select(action.time,'Action checkpoint · Press '+action.key);}else{button.className='lf-trace-marker';button.innerHTML=`<span>${item.content}</span>`;button.onclick=()=>{const moment=moments.find(x=>x.number===item.id);select(moment.time,moment.label);};}return button;}});
rail.addCustomTime(selected,'selection');rail.setCustomTimeTitle('Drag to scrub recording','selection');rail.on('timechanged',event=>select(+event.time,'Captured frame'));for(const button of document.querySelectorAll('.moment-list [data-moment]'))button.onclick=()=>{const moment=moments.find(x=>x.number===Number(button.dataset.moment));select(moment.time,moment.label);};let playing=null;const stops=[...inputs.map(x=>({time:x.time,label:'Action checkpoint · Press '+x.key})),...moments.map(x=>({time:x.time,label:x.label}))].sort((a,b)=>a.time-b.time);document.querySelector('#previous').onclick=()=>{const stop=stops.findLast(x=>x.time<selected-0.01);if(stop)select(stop.time,stop.label);};document.querySelector('#next').onclick=()=>{const stop=stops.find(x=>x.time>selected+0.01);if(stop)select(stop.time,stop.label);};document.querySelector('#play').onclick=e=>{if(playing){clearInterval(playing);playing=null;e.currentTarget.textContent='▶ Play';}else{if(selected>=2410)selected=0;e.currentTarget.textContent='Pause';playing=setInterval(()=>{select(Math.min(2410,selected+50),'Captured frame');if(selected>=2410){clearInterval(playing);playing=null;document.querySelector('#play').textContent='▶ Play';}},50);}};
</script></body></html>
