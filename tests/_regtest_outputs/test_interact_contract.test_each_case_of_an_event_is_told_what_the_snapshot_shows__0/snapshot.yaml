pick on the page:
  event:
    kind: action
    meaning:
      document:
        kind: page
    obligation:
      response:
        kind: markup
  told:
    - text: >-
        The user already sees the action applied.
    - when: {"not": {"required": ["meaning"], "properties": {"meaning": {"required": ["document"], "properties": {"document": {"required": ["kind"], "properties": {"kind": {"const": "thread"}}}}}}}}
      text: >-
        If you need clarification, ask in a thread on the picked option. To override
        the pick in a later version, mark the element `restated` and say why in
        the version note.
    - text: >-
        It answers the page's Ask, so the page shows it as waiting on you until
        the markup records it. Continue the work it selects or unblocks, then write
        it in and stamp a version.

