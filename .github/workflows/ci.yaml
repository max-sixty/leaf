name: ci

# Every event runs the runtime, browser-framework and bundle gates; the Python suite's
# selection follows the test tiers, the directories under `tests/`
# (`tests/conftest.py`, `TIERS`):
# - a pull request runs `model`, `process` and `smoke`, plus the `browser` and
#   `journeys` tests it edits, and the website gate;
# - a push to main adds `browser`;
# - the daily schedule and a manual dispatch run every product test, and their summary lists
#   the tests over their directory's budget; `test-macos` runs them on macOS too.
#   The daily schedule also runs the benchmark (`bench`), whose readings gate
#   nothing;
# - a dispatch given `flake` runs only `test-macos`, which runs `leaf-dev suite flake`
#   with those arguments in place of the suite.
# The daily schedule also runs the developer-tool tests in dev/tests and the
# claude-code agent journey, which no other event runs.
# Relevant pushes to main run the website gate in publish-site before deploy.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      flake:
        description: Arguments for `leaf-dev suite flake` to run on macOS in place of the suite

# Only a pull request cancels its own earlier run. A push to main keeps its run: a red
# branch is judged against the base SHA's result, and the next merge must not end a
# suite partway through. tend-ci-failures reports a failed run on main and never a
# cancelled one, so a cancellation goes unreported. Nothing outside a pull request
# shares a workflow group; the test job owns each event's queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ !inputs.flake }}
    concurrency:
      # One push suite at a time: it holds a runner for over an hour, and GitHub's
      # concurrency pool is per-account, shared with the other repos here. A running
      # suite is never cancelled, because that hour would be lost; a newer commit
      # replaces the pending entry instead, under GitHub's default `queue: single`, so a
      # busy main gets the suite on its tip rather than working through commits already
      # superseded. Superseded pending entries are recorded as cancelled runs, a cost
      # accepted for the same reason.
      #
      # The daily schedule has a slot of its own. It is the only run of the `nightly`
      # tier, and in the push queue the next merge would replace it before it reached a
      # runner. A dispatch keeps a slot per ref. It is the control a session runs
      # against a base SHA, and two sessions judging two branches need both answers;
      # behind main's queue either one would be replaced by the next merge before it
      # ever started. A pull request keeps a slot per number.
      group: ${{ format('{0}-test-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.event_name) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1
      # py-spy's sampling rate, which `leaf-dev suite profile` reads to turn samples
      # into minutes.
      PY_SPY_RATE: 2

    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base:
      # the second commit is what `--changed-since` below diffs against.
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Exercise the same foreground setup local agents use before testing.
      - uses: ./.github/actions/setup

      # Where the Python suite's time goes. BSD process accounting records each
      # process's CPU as it exits, so the run's CPU reads back by command afterwards;
      # py-spy samples the stacks of every Python process the run starts, waits
      # included, so wall time reads back by function. py-spy reads a process it did
      # not start only where Yama allows any same-user trace. The package's daily cron
      # job would restart accounting onto its own file at 06:25 UTC, ending the
      # suite's record partway through any run that crosses that time. eatmydata is
      # for the suite's own run below.
      - name: Install the suite's profilers and eatmydata
        run: |
          sudo apt-get install -y acct eatmydata
          sudo rm /etc/cron.daily/acct
          sudo sysctl -w kernel.yama.ptrace_scope=0
          uvx py-spy@0.4.2 --version

      # The bundles build from the installed lock, so a rebuild reproduces the
      # tracked bytes exactly and any difference is a lock nobody rebuilt from.
      - name: Check bundles, browser, runtime and Worker
        run: pnpm run check

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Hooks rewrite what they flag, so they run in a worktree of their own: a rewrite
      # must not reach the Python tests and website build reading this checkout.
      - name: 🔍 Pre-commit hooks
        id: lint
        background: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          uv run --project "$GITHUB_WORKSPACE" pre-commit run --all-files --show-diff-on-failure --color=always

      # The synchronous gates fail before Python spends its runner time.
      # Two workers can leave much of the runner's four vCPUs idle, and four can slow
      # each test, so three take the idle share without saturating the deadlines
      # browser tests wait under.
      - name: 🧪 Python tests
        id: python-tests
        background: true
        # The profilers write beside the junit report: `cpu-by-command.txt` is `sa`'s
        # table of every process that ran meanwhile, and `stacks.txt` holds one line
        # per distinct stack and sample count, rooted at its process, for
        # `leaf-dev suite profile`, speedscope or flamegraph.pl. py-spy follows the
        # process tree from `uv run` once it has a child, and stops when it exits. Its
        # cost scales with the rate. At 2 Hz each worker's stack is still sampled 7,200
        # times an hour.
        # Accounting is machine-wide, so it runs only where the suite is the only work
        # meanwhile: a pull request builds the website beside it.
        run: |
          mkdir -p .tmp/test-results
          # Fail normally before the six-hour job deadline, which cancels the run
          # and never reaches tend-ci-failures. Leave time for termination, profiles,
          # uploads and the website gates.
          # Keep the shell alive through INT while pytest and py-spy finalize. Shell
          # background jobs inherit INT ignored, so reset it at both child entries.
          timeout --verbose --signal=INT --kill-after=1m 5h bash -euo pipefail <<'SUITE' > >(tee .tmp/test-results/output.log) 2>&1
          trap '' INT
          export PYTHONUNBUFFERED=1
          # Each worker charges its tests' CPU to a cgroup of its own under this one
          # (`dev/leaf_dev/commands/suite/profile.py`). Owning it lets the workers make and join
          # theirs without root, and this shell joins it so pytest starts inside.
          export SUITE_PROFILE_CGROUP=/sys/fs/cgroup/leaf-suite
          sudo mkdir "$SUITE_PROFILE_CGROUP"
          sudo chown -R "$(id -u)" "$SUITE_PROFILE_CGROUP"
          echo $$ | sudo tee "$SUITE_PROFILE_CGROUP/cgroup.procs" >/dev/null
          accounting=${{ github.event_name != 'pull_request' }}
          if $accounting; then
            sudo touch /var/log/account/suite
            sudo accton /var/log/account/suite
          fi
          # eatmydata makes fsync a no-op in every process the suite starts. Leaf
          # syncs each file it stages or replaces, which no test can observe short
          # of a crash, and on the runner's disk they cost a pull request's suite
          # minutes of worker time. eatmydata execs its command, so py-spy still
          # follows the tree from this PID.
          env --default-signal=INT eatmydata uv run pytest tests -n 3 -v --junitxml=.tmp/test-results/results.xml \
            ${{ github.event_name == 'pull_request' && '--changed-since HEAD^1' || github.event_name == 'push' && '--run-main' || '--run-nightly' }} &
          tests=$!
          until pgrep -P "$tests" >/dev/null || ! kill -0 "$tests" 2>/dev/null; do
            sleep 0.1
          done
          env --default-signal=INT uvx py-spy@0.4.2 record --pid "$tests" --subprocesses --idle --nonblocking \
            --function --rate "$PY_SPY_RATE" --format raw --output .tmp/test-results/stacks.txt &
          profiler=$!
          wait "$tests" && status=0 || status=$?
          # A profile that failed fails the job, keeping pytest's own failure status.
          wait "$profiler" && profiled=0 || profiled=$?
          if [ "$profiled" -ne 0 ]; then
            echo "::error::py-spy exited with $profiled"
            [ "$status" -ne 0 ] || status=1
          fi
          if $accounting; then
            sudo accton off
            sudo chmod a+r /var/log/account/suite
            sa -a -c -i /var/log/account/suite > .tmp/test-results/cpu-by-command.txt
          fi
          exit "$status"
          SUITE

      # The website build can overlap Python; Docker must wait because its host
      # interface changes interrupt Chrome's loopback requests in browser tests.
      - name: Build website
        if: github.event_name == 'pull_request'
        run: uv run leaf-dev site build

      # wait runs even when the build fails. Propagate both results and finish
      # Python's artifacts before Docker or the unconditional upload below.
      - name: Wait for lint and Python tests
        wait: [lint, python-tests]

      # The daily run checks `hooks/` again against each harness's newest release, once
      # the steps reading `node_modules` are done. The pins move with Dependabot's
      # weekly npm group, while a user's Claude Code updates itself as each release
      # ships. So this step alone lifts pnpm's three-day wait (`minimumReleaseAge` in
      # `pnpm-workspace.yaml`), and `@latest` resolves to the newest release: one that
      # refuses to load `hooks/claude-code.ts`, or changes the Pi API `hooks/pi.ts`
      # uses, turns the run red for tend within a day of shipping. The cost, which Max
      # chose to pay, is that CI runs that release and any dependency it brings before
      # it is three days old; the lockfile this step writes is never committed.
      - name: Check the hooks against the newest Claude Code and Pi
        if: github.event_name == 'schedule' && !cancelled()
        env:
          pnpm_config_minimum_release_age: 0
        run: |
          pnpm add --save-dev @anthropic-ai/claude-code@latest @earendil-works/pi-coding-agent@latest
          pnpm run check:hooks

      - name: Check website deployment
        if: github.event_name == 'pull_request'
        run: |
          pnpm --dir .. exec wrangler --cwd worker deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker

      - name: Measure the bundled release in a browser
        if: github.event_name == 'pull_request'
        run: uv run leaf-dev site verify website-worker

      - name: Summarize where the suite's time went
        if: (success() || failure()) && hashFiles('.tmp/test-results/results.xml') != ''
        run: |
          uv run leaf-dev suite profile .tmp/test-results | tee .tmp/test-results/summary.txt
          { echo '```'; cat .tmp/test-results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The developer-tool tests (dev/AGENTS.md, "Tests"), daily only, on a runner of
  # their own. A step that overruns fails, where the six-hour job deadline would
  # cancel the run and never summon tend.
  dev-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: 🧪 Python developer-tool tests
        timeout-minutes: 60
        run: uv run pytest dev/tests -n 3 -v
      - name: 🧪 Eval harness smoke tests
        if: ${{ !cancelled() }}
        run: pnpm run test:evals

  # The claude-code agent journey (dev/leaf_dev/commands/journey/_claude_code.py),
  # daily only: an interactive Claude Code session, driven through tmux, on the `tend`
  # environment's Claude Code login. It runs here rather than in Tend's
  # credential-isolation sandbox, which refuses the Unix sockets that tmux and Claude
  # Code's messaging both need, so the login is in the journey step's environment,
  # where the session under test can read it. That session's input is this commit's
  # own pages and prompts. The checkout keeps no GitHub token, and the job's reads
  # only, so that session holds no credential besides the login. The evidence, each
  # step's screen, Claude Code's debug log and the page's log, uploads only when no
  # file in it holds the login, since the artifacts of this public repository are
  # public.
  journey-claude-code:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    environment: tend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install tmux and Claude Code
        run: |
          sudo apt-get install -y tmux
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 🧭 Claude Code journey
        timeout-minutes: 60
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run leaf-dev journey run claude-code
      - name: Check that the evidence holds no login
        id: evidence
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '! grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" .tmp/journey'
      - name: Upload the journey's evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: journey-claude-code-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/journey/
          if-no-files-found: ignore
          retention-days: 30

  # The daily benchmark: `leaf-dev bench` on its generated pages, in the browser and
  # on the server, on a runner of its own so the suite's tests don't share its cores.
  # No reading passes or fails anything (tests/AGENTS.md, "Results do not depend on
  # execution speed"); the job fails only when the command does. Its report, each
  # reading by size with the exponent of its growth, goes to the job's summary, its log
  # and the `bench-report` artifact. GitHub serves no job summary to its API, so Tend's
  # daily `review-runs` reads the artifact and weighs whether a cost grows
  # (`.claude/skills/running-tend/SKILL.md`, "Review-runs: benchmark costs that grow").
  #
  # The load's and each input's main-thread CPU and each gesture's `shown` at 64
  # sections, the size of the largest real pages, are charted on the `gh-pages`
  # branch's `dev/bench` page, and each run's comparison with the one before goes in
  # the job summary; the other readings, such as request counts and single paints,
  # vary too much from run to run for an alert. A reading 50% above the run before
  # comments on the commit. CI's runners vary from run to run, so tighten the threshold
  # once the chart shows their spread. The action compares with the last reading of another
  # commit, so a day with no merge compares with the day before it. GitHub Pages
  # doesn't serve the branch, so the chart is read from it directly. The action
  # switches the checkout to `gh-pages`, so it comes last.
  bench:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # A step that overruns fails, where the six-hour job deadline would cancel the
      # run and never summon tend; `bash` adds `pipefail`, so the command's status
      # survives `tee`. Each run's `results.json` keeps each reading's lowest by page,
      # size and arm (`lowest`), which the server's run leaves empty, and keeps what a
      # failed run read before it failed.
      - name: Measure the pages in the browser
        timeout-minutes: 120
        shell: bash
        run: |
          mkdir -p .tmp/bench-report
          uv run leaf-dev bench --sizes 64,128,256 --rounds 2 | tee .tmp/bench-report/browser.txt
          { echo '```'; cat .tmp/bench-report/browser.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The page of tabs of large text documents, reading only the inputs that need its
      # tabs and sources and the modes whose cost grew with every document's lines,
      # which keeps it to minutes; the `document` page's text grows under every other
      # input.
      - name: Measure the documents page in the browser
        if: success() || failure()
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p .tmp/bench-report
          uv run leaf-dev bench documents --sizes 64,128,256 --rounds 2 \
            --input design --input inspect --input pick --input part \
            --input draw --input capture \
            --input data --input reveal --input search --input matches --input browse \
            | tee .tmp/bench-report/documents.txt
          { echo '```'; cat .tmp/bench-report/documents.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the browser readings to chart
        if: success() || failure()
        shell: bash
        run: |
          jq -s '[.[].lowest[] | select(.size == 64) | .page as $page | .readings
            | to_entries[] | select(.key | endswith(" cpu") or endswith(" shown"))
            | {name: "\($page): \(.key)", unit: "ms", value: (.value * 100 | round / 100)}]' \
            .tmp/bench/run-*/results.json > .tmp/bench.json

      - name: Measure the server's paths
        if: success() || failure()
        timeout-minutes: 60
        shell: bash
        run: |
          mkdir -p .tmp/bench-report
          uv run leaf-dev bench --read server | tee .tmp/bench-report/server.txt
          { echo '```'; cat .tmp/bench-report/server.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/bench-report/
            .tmp/bench/*/results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Chart the browser readings
        if: ${{ !cancelled() && hashFiles('.tmp/bench.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Bench at 64 sections
          tool: customSmallerIsBetter
          output-file-path: .tmp/bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          summary-always: true

  # Every product test on macOS, the platform Leaf's local sessions run on. Only the
  # daily schedule and a dispatch run it, since it adds a runner for as long as the
  # nightly suite takes, and a failure turns the run red for tend like `test`'s. The
  # Linux job's gates, website checks and profiles are platform-independent or
  # Linux-only, so this job runs the suite alone. A failure only this job shows is
  # reproduced here too, by a dispatch on a branch that names its tests in `flake`
  # (tests/AGENTS.md, "Races"), so nobody edits this file to probe one.
  test-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1
    steps:
      # The runner's DHCP server answers a new client but not a renewal, so the runner
      # drops its address when each one-hour lease ends and takes the same one back a
      # few seconds later. Chromium answers the change by failing every loopback load
      # still waiting for a socket with net::ERR_NETWORK_CHANGED, and the test that was
      # loading fails. Setting the leased address, router and DNS server by hand keeps
      # the interface unchanged for the rest of the job. Every value is read from the
      # lease before any is set, since setting the address ends the lease and
      # `ipconfig getoption` answers nothing for it afterwards.
      - name: Hold the runner's network address
        run: |
          interface=$(route -n get default | awk '/interface:/ {print $2}')
          service=$(networksetup -listnetworkserviceorder | awk -v device="$interface" '/^\([0-9]+\) / {sub(/^\([0-9]+\) /, ""); name=$0} index($0, "Device: " device ")") {print name}')
          address=$(ipconfig getifaddr "$interface")
          mask=$(ipconfig getoption "$interface" subnet_mask)
          router=$(ipconfig getoption "$interface" router)
          dns=$(ipconfig getoption "$interface" domain_name_server)
          sudo networksetup -setmanual "$service" "$address" "$mask" "$router"
          sudo networksetup -setdnsservers "$service" "$dns"
          until [ "$(ipconfig getifaddr "$interface")" = "$address" ]; do sleep 1; done

      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install GNU timeout
        run: brew install coreutils

      # A suite that overruns is interrupted before the six-hour job deadline, which
      # would cancel the run and never summon tend. pytest stops at one interrupt and
      # still writes results.xml for every test that ran, but a second one, arriving
      # while it stops its workers, ends it before the report. GNU timeout signals its
      # own process group: pytest and its workers. It runs inside `uv run` because uv
      # passes on every interrupt it receives, so a uv inside that group would send
      # pytest a second one. An explicit `bash` adds `pipefail`, so the step fails
      # with timeout's status. Four workers on the runner's three cores starve every
      # test of CPU, which makes this the run that checks the suite's results don't
      # depend on speed (tests/AGENTS.md, "Waits"); the suite can take as long at four
      # workers as at two.
      - name: 🧪 Python tests
        if: ${{ !inputs.flake }}
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          uv run gtimeout --verbose --signal=INT --kill-after=1m 345m \
            pytest tests -n 4 -v --run-nightly --junitxml=.tmp/test-results/results.xml \
            2>&1 | tee .tmp/test-results/output.log

      # `flake` holds `leaf-dev suite flake`'s arguments (its `--help` says what each
      # does), which xargs splits as a shell would, quotes included, without running a
      # shell. The step's log ends with each test's count per outcome and every
      # failure's message, and the artifact holds each copy's log and its failing
      # pages' pictures.
      - name: Run the named tests as copies under load
        if: ${{ inputs.flake }}
        env:
          FLAKE: ${{ inputs.flake }}
        run: printf '%s' "$FLAKE" | xargs uv run leaf-dev suite flake

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.flake && '.tmp/flake/' || '.tmp/test-results/' }}
          if-no-files-found: ignore
          retention-days: 30
