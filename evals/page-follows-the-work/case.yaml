# A session's page (choice-alignment): the user complained about an inspect row on
# another session's page; the agent fixed Leaf's choice control and wrote a page that
# opened with before/after captures of that row. Minutes later it learned the row was
# gone from its page, and over the next two hours the user moved the work on to
# rebuilding the control. Every revision was a targeted edit of the region it changed:
# the agent added the rebuild as a new section, recaptured the old row's "after" with
# the new CSS, and amended the lede, while the title kept asking why the row
# misaligned and the row's captures and a paragraph about its own CSS stayed first.
# Asked whether the row was still part of the design, the user then asked why it was
# still on the page. The prompt replays the minute the rebuild was pushed, with the
# page as it stood (revision 6) and the rebuild's captures; the session recaptured the
# old "after" images itself next. SKILL.md judges material by what a reader arriving
# now needs, and says material about something since removed goes; that goal alone,
# without the clause, can leave the row standing. A variant replaying the user's
# comment on the row's "after" an hour earlier tests nothing here: the row was the
# page's subject then, so answering the user's question on the page is right; what
# the user objected to was that material staying once the work moved on.
description: page-follows-the-work
metadata:
  purpose:
    "Keeping the page current when the user moves the work on: a revision that adds the new
    work also retires material about what no longer exists and leads with where the work
    stands, rather than appending under the page's first framing."
  tags:
    - revisions
vars:
  prompt: |
    You are a Claude Code session using Leaf in a checkout of Leaf itself, on branch
    inspect-bar-alignment with PR #6110 open, two hours into a page you keep for the user at
    /Users/max/.local/state/leaf/pages/choice-alignment. Load the Leaf skill if it isn't in your
    context. You read the references it routes to when you wrote the page and have revised it
    several times since, so act on this without reopening them.

    How the work got here:

    - On another session's page, "How a code block shows its notes", the user commented on its
      inspect row (a caption, "Inspect, not part of the choice:", then a "Case" legend and two
      radios): "the vertical alignment here is a disaster, what's going on? where did this
      problem start? how did this get reviewed and added??", and then that the checked radio
      moved whenever they changed the selection. That session handed the complaint to you.
    - You found that Leaf's choice control (`lf-choice`) took its line from its radio mark, which
      put the legend low and dropped a checked radio 1px, and that the playground rail cut off
      its bar of actions. You fixed all three in #6110 and wrote this page from captures of a
      copy of that page as the user saw it.
    - Minutes later the other session told you it had rebuilt its row without that markup, and
      that its page has since become a record without the playground, so the row is gone.
    - The user commented on `row-shot`: "but the `Inspect, not...` is still misaligned??". You
      answered that the caption's offset came from that page's own CSS, and added
      `caption-cause` and `row-aligned`.
    - The user resolved the rail, touch-mark and landing threads and asked for the underlying fix
      for rich text in a choice label, which wrapped in the wrong place. After your first answer
      they wrote in chat: "tbc, we really should fix this, the current thing looks really bad,
      you are fine to make bigger changes if necessary, or just rethink the whole UI in this
      area".

    Since then you rebuilt the control, and the commit is pushed to #6110 with CI running:

    - Everything after the mark is now one run of text. The mark sits in the label's start
      padding, centred on the first line, so a wrapped line starts under the first word. Before,
      a flex row and then a grid laid each piece of a label out as its own box: "Use **high
      quality** for this image" wrapped in three columns, and a wrapped label's mark sat between
      its lines.
    - The gap between mark and words was 3.5px in the playground rail, 4px in its cards, 7px in
      visual review and 8px in the command reference. It is now one theme token,
      `--lf-choice-gap`, half the em of the choice's type. A component sets the room around a
      mark with `--lf-choice-pad` and `--lf-choice-gap`, and you updated the five Leaf
      components that set `padding` or `gap` directly.
    - A playground option card's focus ring now wraps the whole card instead of running through
      its title, and the screenshot comparison's options menu shows Leaf's checkboxes again.
    - The choice test now also checks a wrapped label holding bold words, and fails on the grid
      version.

    You registered these captures of the rebuild, in Firefox, with `leaf page media`:

    - `/media/057382f59b0db981.png` and `/media/90d622b700ab7606.png`: a label holding bold
      words at 220px, before (main) and after.
    - `/media/360116a9d0c1eb16.png` and `/media/b7f0d7de86f9340d.png`: a wrapped label at
      200px, before and after.

    The page's other "after" images show the control before the rebuild. You can capture any
    state, of a plain row of radios or of your copy of the other page, on main or on the
    branch, and register it with `leaf page media`. Write a capture you'd add as
    `/media/<name>.png` and say what it shows.

    Now put the rebuild on the page. This is the page's `<main>` as it stands:

    ```html
        <main class="layout-column">
              <h1 id="title">Why the inspect row's radios misaligned</h1>
              <p class="lf-lede" id="verdict">
                Both faults you saw in the radios were Leaf's, in the face every authored radio
                wears (<code>lf-choice</code>), and so was the cut-off bar under the rail. All
                three are fixed in <a href="https://github.com/max-sixty/leaf/pull/6110">#6110</a>. The caption standing higher
                at the row's left was the page's own CSS, and its session has rebuilt that row.
              </p>

              <section id="baseline">
                <h2>The choice took its line from its mark</h2>
                <p>
                  A choice was a flex row of mark and words, mark first. A flex row takes its
                  baseline from its first item, and a mark has no words, so the browser used the
                  mark's foot. Whatever lines up by baseline with a choice, here your legends,
                  stood on the mark's foot, about 4px below the choice's own words. Now the
                  words give the choice its line, and the mark centres on them.
                </p>
                <figure id="baseline-drawing">
                  <svg
                    class="lf-drawing"
                    width="380"
                    viewBox="0 0 380 236"
                    role="img"
                    aria-label="Before, the row's line runs along the radio's foot, so the legend sits 4px below the choice's words. After, the line runs under the words, and the legend and the words share it."
                  >
                    <text class="strong" x="8" y="20" font-size="15">Before</text>
                    <line class="guide" x1="4" y1="76" x2="376" y2="76"></line>
                    <text x="8" y="76" font-size="20">Case</text>
                    <circle class="box" cx="84" cy="61" r="15"></circle>
                    <circle class="mark" cx="84" cy="61" r="7"></circle>
                    <text x="108" y="70" font-size="24">Verb declarations</text>
                    <text x="8" y="100" font-size="15">the row's line: the mark's foot</text>

                    <text class="strong" x="8" y="140" font-size="15">After</text>
                    <line class="guide" x1="4" y1="196" x2="376" y2="196"></line>
                    <text x="8" y="196" font-size="20">Case</text>
                    <circle class="box" cx="84" cy="187" r="15"></circle>
                    <circle class="mark" cx="84" cy="187" r="7"></circle>
                    <text x="108" y="196" font-size="24">Verb declarations</text>
                    <text x="8" y="220" font-size="15">the row's line: the words' baseline</text>
                  </svg>
                  <figcaption>
                    Drawn 1.7× from Firefox's layout of your row. Chromium and WebKit measured
                    the same within a pixel.
                  </figcaption>
                </figure>
                <lf-shot
                  id="row-shot"
                  before="/media/5ecb4bd95c6975e1.png"
                  after="/media/2e8ccdb8830ed3e1.png"
                  alt="Your inspect row in Firefox. Before: Case sits lower than the choices beside it. After, with Leaf's fix alone: Case shares the choices' line, and the caption at the left still stands higher."
                ></lf-shot>
                <p id="caption-cause">
                  Leaf's fix alone leaves the caption where the page's row put it. That row
                  (<code>#cn-inspect</code>) was a flex row that set no alignment, so it stood
                  each item at the row's top, and the caption's words sat about 7px above the
                  choices'. One line of the page's CSS, <code>align-items: baseline</code> on
                  the row, puts every word in it on one line:
                </p>
                <figure id="row-aligned">
                  <a href="/media/1a5b3fa99634a843.png"
                    ><img
                      src="/media/1a5b3fa99634a843.png"
                      alt="The same row with Leaf's fix and the page's row aligned by baseline: the caption, Case and both choices' words share one line."
                  /></a>
                  <figcaption>
                    Leaf's fix plus the page's line, in Firefox. The caption, the legend and both
                    choices' words measure at the same height. The page's session has since
                    removed the row.
                  </figcaption>
                </figure>
              </section>

              <section id="jump">
                <h2>A checked radio dropped 1px</h2>
                <p>
                  A checked radio draws its dot as a box inside the mark, and the browser took
                  the line from the dot's foot, one border above the empty mark's foot. So the
                  checked choice stood 1px lower, and each new selection moved both. Leaf's own
                  feature gallery has done this with its Sample width radios since 3 November.
                  Now the mark takes no part in the line, so only the dot changes.
                </p>
                <table id="jump-shots">
                  <tbody>
                    <tr>
                      <th scope="rowgroup" rowspan="2">Before the fix</th>
                      <th scope="row">Verb declarations checked</th>
                      <td><a href="/media/f75f13573b032a8b.png"><img id="jump-before-verbs" src="/media/f75f13573b032a8b.png" alt="Before the fix, Verb declarations checked: its radio and words sit 1px below Captured log's." /></a></td>
                    </tr>
                    <tr>
                      <th scope="row">Captured log checked</th>
                      <td><a href="/media/4d49608c1e482878.png"><img id="jump-before-log" src="/media/4d49608c1e482878.png" alt="Before the fix, Captured log checked: now Captured log sits 1px lower and Verb declarations rises." /></a></td>
                    </tr>
                    <tr>
                      <th scope="rowgroup" rowspan="2">After the fix</th>
                      <th scope="row">Verb declarations checked</th>
                      <td><a href="/media/8e5abe16b0b69530.png"><img id="jump-after-verbs" src="/media/8e5abe16b0b69530.png" alt="After the fix, Verb declarations checked: both choices on one line with Case." /></a></td>
                    </tr>
                    <tr>
                      <th scope="row">Captured log checked</th>
                      <td><a href="/media/cadd9d033ef9d2d7.png"><img id="jump-after-log" src="/media/cadd9d033ef9d2d7.png" alt="After the fix, Captured log checked: nothing moved but the dot." /></a></td>
                    </tr>
                  </tbody>
                </table>
                <p id="try-it">
                  This page runs the fixed Leaf. Switch these and nothing moves but the dot:
                </p>
                <div id="try-row" role="radiogroup" aria-labelledby="try-label">
                  <span id="try-label">Case</span>
                  <label class="lf-choice"
                    ><input type="radio" name="try-case" value="verbs" checked />Verb
                    declarations</label
                  >
                  <label class="lf-choice"
                    ><input type="radio" name="try-case" value="log" />Captured log</label
                  >
                  <label class="lf-choice"><input type="checkbox" name="try-wide" />Wide</label>
                </div>
              </section>

              <section id="touch">
                <h2>Under a finger, marks keep their label's size</h2>
                <p>
                  On a touch screen Leaf sets every input's type to at least 16px, so iOS
                  doesn't zoom onto a text field as it takes focus. That rule also reached
                  radios and checkboxes, whose mark is 1.25em of its type, so a choice beside
                  12.5px words drew a 20px mark, taller than the words' line. A radio takes no
                  typing, so the rule now leaves it alone, and its mark is 16px beside those
                  words. This is the one change you'd see on a phone.
                </p>
                <lf-shot
                  id="touch-shot"
                  before="/media/24d9497ae2e7edf3.png"
                  after="/media/1ee7b359034814a6.png"
                  alt="A playground's Tone radios and setting checkboxes in Chromium under touch emulation. Before: each mark is 20px beside 12.5px words. After: each mark is 16px, in proportion to its words."
                ></lf-shot>
              </section>

              <section id="rail">
                <h2>The rail cut off its bar of actions</h2>
                <p>
                  The rail is held beside the stage and bounded to the window, and it scrolled
                  as one box. At your 1728×999 window it held 15px more than the bound, so the
                  bar's foot fell past the rail's edge and the rail scrolled. Now the controls
                  give up that height and scroll inside their card, and the bar stays whole
                  under them, as a full-height workspace already did.
                </p>
                <lf-shot
                  id="rail-shot"
                  before="/media/2dd871096280d5e5.png"
                  after="/media/94dde1bede9bae48.png"
                  alt="The foot of the rail in Firefox at 1728 by 999. Before: the bar holding Reset, the menu and Build this look is cut off at its bottom. After: the bar is whole, and the controls card above it fades at its foot where its last 15px scroll."
                ></lf-shot>
                <p id="rail-call">
                  The controls card still scrolls those 15px, which its fading last choice
                  shows. Something has to scroll while the rail holds more than the window: the
                  other place for it is the page, which would leave the bar out of reach beside
                  a stage taller than the window until the stage ended.
                </p>
              </section>

              <section id="history">
                <h2>Where it started and why review let it through</h2>
                <ul>
                  <li>
                    <a href="https://github.com/max-sixty/leaf/pull/3506">#3506</a>, which made
                    the shared choice face on 21 October, set it as a flex row with the mark
                    first. Every Leaf surface stacks its choices one per line or puts one alone
                    in a cell, so nothing Leaf draws, and no test or stills state, put a choice
                    beside other words on a line.
                  </li>
                  <li>
                    <a href="https://github.com/max-sixty/leaf/pull/5230">#5230</a>, which drew
                    the radios in Web Awesome's design on 3 November, added the 1px drop. Its
                    review measured each choice's height in stacked lists, which it left
                    unchanged.
                  </li>
                  <li>
                    The choice test asserted the face held still across a selection, but read it
                    after pressing back to the first radio, so it compared two identical states.
                    It now reads it while the other radio is checked, and checks that the words
                    share the legend's line. Both fail on main.
                  </li>
                  <li>
                    <code>leaf-dev stills</code> reads exactly this fault, words on one line on
                    different baselines, but only on its catalogue states, and none has a row
                    like yours. Run on your page, it flags the Case and choices before the fix
                    and nothing after, but it misses the caption's larger offset, which it reads as a separate line.
                  </li>
                  <li>
                    <a href="https://github.com/max-sixty/leaf/pull/3274">#3274</a> made the
                    rail scroll as one box on 20 October. Its test uses a playground whose rail
                    is 221px tall, so it never had more than the window to hold. A new test
                    holds a rail taller than the window.
                  </li>
                  <li>
                    The page's row was shown to a reviewer before its caption existed, and not
                    captured again after.
                  </li>
                </ul>
              </section>

              <section id="checked">
                <h2>What was checked</h2>
                <p>
                  The words of every choice stand on their neighbours' line in Chromium,
                  Firefox and WebKit, checked or not, and stay centred in a finger's 44px
                  target. Twelve stills states with choices or playgrounds are pixel-identical
                  before and after in Firefox under a mouse. Both tests fail on main's CSS and
                  pass on the branch. A fresh reviewer read the captures, and Codex reviewed
                  the diff and found that the command reference's setting broke under a
                  finger, now fixed.
                </p>
              </section>
            </main>
    ```

    Answer with the revised `<main>` in full.
assert:
  - type: llm-rubric
    metric: gone-row-retired
    value:
      "Read the revised `<main>` in the answer. The inspect row its first captures show no longer
      exists: the other session removed it from its page. Pass only if none of the three elements
      built on that row stands open in the reading flow: the `row-shot` pair, the `caption-cause`
      paragraph and the `row-aligned` figure are each removed, replaced by a demonstration that
      doesn't use that row (such as a plain row of radios or the page's live `try-row`), or moved
      inside a `<details>` without `open`. Fail if any of the three is still open in the reading
      flow, whether or not its images were swapped for the recaptures. Fail if the answer gives no
      revised `<main>`."
  - type: llm-rubric
    metric: leads-with-the-work
    value:
      "Read the revised `<main>` in the answer. Pass only if the `h1` and the lede that follows it
      present Leaf's choice control as #6110 now leaves it, the rebuilt control, rather than
      framing the page as an account of why the user's inspect row misaligned. Fail if the `h1`
      still asks or says why the inspect row's radios misaligned, or if the answer gives no
      revised `<main>`."
  - type: llm-rubric
    metric: rebuild-shown
    value:
      "Read the revised `<main>` in the answer. Pass only if it shows the rebuild's change with the
      new captures: the bold-words label (`057382f59b0db981` before, `90d622b700ab7606` after)
      and the wrapped label (`360116a9d0c1eb16` before, `b7f0d7de86f9340d` after) each appear as
      a before/after pair, open in the reading flow. Fail otherwise, or if the answer gives no
      revised `<main>`."
  - type: llm-rubric
    metric: record-kept
    value:
      "Read the revised `<main>` in the answer. Pass only if it still holds, open or inside a
      `<details>`, what the user asked for and decided: where the faults started and why review
      let them through, and the results of the touch-mark and rail fixes, whether as their own
      sections or cut to a sentence each. Fail if any of these is gone from the page, or if the
      answer gives no revised `<main>`."
