          <section id="keys">
            <h2>Next, <code>lf-code</code>: who defines a widget's keys</h2>
            <p id="keys-case">
              <code>lf-code</code> gives each code block one key: <code>w</code> wraps or
              unwraps long lines. Today it registers the key by calling into Leaf's key
              register:
            </p>
            <pre id="keys-today"><code class="language-javascript">commands(this, "On a code block", [
      {
        id: "code.wrap",
        keys: ["w"],
        title: () => (wrapped ? "unwrap lines" : "wrap lines"),
        run: toggleWrap,
      },
    ]);</code></pre>
            <p id="keys-why">
              <code>commands</code> lives in Leaf's keyboard modules, which read Leaf's page at
              load, so a widget that calls it can't load on a plain page. The register owns
              every key: it matches presses, lists keys in the command reference and hints,
              and writes <code>aria-keyshortcuts</code> onto controls as one of its outputs
              (<a href="https://github.com/max-sixty/leaf/blob/6c6ce9b43/browser/runtime/keyboard/bindings.js#L106"><code>bindings.js</code></a>).
            </p>

            <lf-ask id="keys-question">
              <h3>How should a portable widget declare its keys?</h3>
              <p>
                I'd have the widget declare its rows as data. It matches how Leaf already
                reads settling and failures from a widget, keeps the register the one place
                that defines a key, and adds no visible control to every code block. The
                markup route is what the issue proposed. It also gives the wrap toggle a
                click and touch route off Leaf. The cost is that
                <code>aria-keyshortcuts</code> becomes an input for some keys while staying the
                register's output for the rest: one attribute with two directions.
              </p>
              <lf-options id="keys-route" choose>
                <lf-option id="keys-route-calls">
                  <small class="tag">keyboard graph portable</small>
                  <strong>Keep the call; make the keyboard modules load anywhere</strong>
                  <code>commands(…)</code> stays. Leaf's keyboard modules stop reading the page
                  at load. Off Leaf the call does nothing, so <code>w</code> does nothing.
                </lf-option>
                <lf-option id="keys-route-data">
                  <small class="tag">register stays owner</small>
                  <small class="tag ok">recommended</small>
                  <strong>Declare the rows as data that Leaf reads</strong>
                  The widget exposes the same rows as a property, for example
                  <code>this.commands = [{ id: "code.wrap", keys: ["w"], … }]</code>, and
                  fires an event when they change. Leaf binds them as it does today. Off Leaf
                  nothing reads them.
                </lf-option>
                <lf-option id="keys-route-markup">
                  <small class="tag">attribute both ways</small>
                  <strong>Declare keys in markup on a button</strong>
                  The block draws
                  <code>&lt;button commandfor="…" command="--wrap" aria-keyshortcuts="w"&gt;Wrap&lt;/button&gt;</code>.
                  Leaf binds <code>w</code> from the attribute. Off Leaf the button still
                  works by click and touch.
                </lf-option>
              </lf-options>
            </lf-ask>
