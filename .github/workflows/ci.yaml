name: ci

# Pull requests keep the landing signal narrow. Main adds the nightly surface in
# four isolated groups, and the scheduled run guarantees one uncancelled daily
# checkpoint even when main is moving continuously.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

# A newer revision replaces obsolete work for the same pull request or main.
# Schedule and manual runs have distinct groups and are allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      has-test-modules: ${{ steps.select.outputs.has-test-modules }}
      test-modules: ${{ steps.select.outputs.test-modules }}

    steps:
      # Two commits give a pull request's merge commit its base parent.
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Choose test surface
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            {
              echo "full=true"
              echo "has-test-modules=false"
              echo "test-modules=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selection=$(git diff --name-only -z HEAD^1 HEAD | python3 tests/ci_selection.py)
          echo "Changed-path selection: $selection"
          {
            echo "full=$(jq -r .full <<< "$selection")"
            echo "has-test-modules=$(jq -r '.test_modules | length > 0' <<< "$selection")"
            echo "test-modules=$(jq -c .test_modules <<< "$selection")"
          } >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # The runner supplies installed Chrome for the two launcher tests. The rest of
      # the browser suite uses the headless shell matching the locked Playwright.
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Everyday suite
        run: uv run pytest tests -v --junitxml=.tmp/test-results/everyday.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-everyday-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/everyday.xml
          if-no-files-found: error
          retention-days: 30

  touched-nightly:
    if: github.event_name == 'pull_request' && needs.changes.outputs.full == 'false' && needs.changes.outputs.has-test-modules == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1
      TEST_GROUP: ${{ matrix.group }}
      TEST_MODULES_JSON: ${{ needs.changes.outputs.test-modules }}

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Touched nightly cases · group ${{ matrix.group }}
        run: |
          test_modules=()
          while IFS= read -r module; do
            test_modules+=("$module")
          done < <(jq -r '.[]' <<< "$TEST_MODULES_JSON")
          echo "Touched test modules: ${test_modules[*]}"
          uv run pytest "${test_modules[@]}" -m nightly -v \
            --splits 4 --group "$TEST_GROUP" --splitting-algorithm least_duration \
            --durations-path .test_durations \
            --junitxml=".tmp/test-results/touched-nightly-$TEST_GROUP.xml" \
            || [ $? -eq 5 ]

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-touched-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/touched-nightly-${{ matrix.group }}.xml
          if-no-files-found: error
          retention-days: 30

  nightly:
    if: needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      PYTEST_ADDOPTS: --durations=25 --durations-min=1
      TEST_GROUP: ${{ matrix.group }}

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium --only-shell

      - name: 🧪 Nightly suite · group ${{ matrix.group }}
        run: |
          uv run pytest tests -m nightly -v \
            --splits 4 --group "$TEST_GROUP" --splitting-algorithm least_duration \
            --durations-path .test_durations \
            --junitxml=".tmp/test-results/nightly-$TEST_GROUP.xml"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-nightly-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/test-results/nightly-${{ matrix.group }}.xml
          if-no-files-found: error
          retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1

  website-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: 🖼 Build site
        run: uv run scripts/site.py

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Build website deploy artifact
        run: npx wrangler deploy --dry-run --outdir ../.tmp/worker-deploy
        working-directory: worker
