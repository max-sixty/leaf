# Leaf keeps the user on their item across a draw of a widget's view, and the widget's
# author owns where focus goes when the widget's own popover closes. An author whose
# list widget moves or removes rows, asked to keep a keyboard user on their item, is
# pulled to hold focus by hand: to call `holdFocus` around the redraw, remember the
# focused row and move focus back with `focusDestination`, or compute the nearest
# surviving row itself. A component marks each row with `data-lf-datum`, by which the
# element `defineWidget` defines lands the user on the row carrying that key after a
# move, or on the nearest row after a removal (`module-input.md`, "Focus and layers"),
# and writes a row that moves to another section as a keep-alive child (`h.keepAlive`)
# where the user should stay on its control, so it writes no focus code for either.
# Where a removal leaves no row, Leaf has nowhere to land the user, and where they go
# is the author's choice. The Add item popover is the widget's own layer: a choice in
# it closes it, and the widget puts the user back on Add item with `focusDestination`,
# since a pointer press in Safari or Firefox on macOS leaves no focus inside the
# popover for the browser's own return. The page test reads the rows once the change
# has drawn, which a component does in Effect UI's flush, before the next frame.
description: widget-list-keeps-focus
metadata:
  purpose: A list widget written as a defineWidget component writes no focus code for a draw that moves or removes rows, and returns the user to Add item when a choice closes its own popover.
  tags:
    - packages
    - keyboard
vars:
  prompt: |
    I'm writing a Leaf package widget, lf-shortlist. It shows the candidates a
    reviewer has sorted into two sections, Shortlist and Maybe. Each row, keyed by
    the candidate's id, has a Move button that moves the candidate to the other
    section and a Remove button that drops it. Its Add item button opens a small
    popup list of the other candidates inside the widget; a choice adds that
    candidate to Shortlist and closes the popup, as Escape does. Which candidates
    stand in which section has to reach the reviewer's other tabs and the agent.

    A keyboard user who moves or removes a row should stay in the list: after a move,
    on the moved row's Move button in its new section; after a removal, on the
    nearest remaining row. Closing the popup should put them back on the Add
    item button that opened it. Our page test presses Move, Remove or a choice and,
    once the widget has drawn the change, reads the rows it shows. Show the registry
    entry and the module's JavaScript.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if all of these hold:
      - the module defines the widget with `defineWidget`, imported from
        /runtime/effect-widget.js, as an Effect UI component, and imports neither Lit
        nor `LeafElement`;
      - a press records the change through a Command such as `RecordAction`, or a
        verb's record, and the view draws both sections from the `state` Leaf sets,
        so the change draws in the component's next draw; nothing in the press
        handler draws or reads the list itself for the test's receipt;
      - each row is keyed by the candidate's id and carries `data-lf-datum` with that
        id, by which the element `defineWidget` defines lands the user on the nearest
        row after a removal; and the user stays on the moved row's Move button,
        because the rows of both sections stand under one parent, where a keyed move
        keeps the row's nodes, because the row is a keep-alive child (`h.keepAlive`),
        whose nodes move with it, or because the Move button itself carries the row's
        `data-lf-datum`, on which the element lands them;
      - the module has no focus code for a move, or for a removal that leaves rows:
        it calls neither `holdFocus` nor `focusDestination` nor `.focus()` around one,
        keeps no record of the focused row to restore, and adds no focus or keydown
        listeners. Code that places the user only once no row remains, such as on
        Add item after the last row goes, passes, since no row is left for Leaf to
        land them on;
      - the popup is a native popover that Add item opens through `popovertarget`, or
        with itself as `showPopover`'s `source`; a choice hides it with
        `hidePopover()` and puts the user back on Add item with
        `focusDestination(addItem, "return")`, from a Command the widget defines or a
        Mount, since the browser's own return needs focus inside the popover, which a
        pointer press in Safari or Firefox on macOS doesn't keep; Escape, if the
        module handles it, is the browser's own for an auto popover or a command row
        in an element's `lfCommands`, not a listener.
      Fail if it holds or moves focus by hand after a move or a removal that leaves
      rows, computes the nearest surviving row itself, calls `.focus()` anywhere, or
      closes the popup by any means but a native popover.
      Execution is unavailable, so not running checks is not a failure.
