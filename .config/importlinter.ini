# import-linter (https://import-linter.readthedocs.io/), run by the pre-commit hook
# of that name.
#
# `src/leaf`'s modules stand in layer packages, listed below from the top, and a module
# imports only from its own package and the packages below it; within a package any
# module may import another. Each package's `__init__.py` says what it holds. The
# packages group modules by concern, ordered so that the imports between them point
# down, and `exhaustive` fails a module at the top of `src/leaf` that no layer names.
# Imports under `TYPE_CHECKING` load nothing and don't count.
#
# When the contract breaks:
#
# - On a new module, put it in the package whose concern it serves. If its imports
#   point up from there, what it needs belongs lower, or the module belongs higher.
# - On an import that points up, make it point down: pass the value or callback in,
#   or move what it needs to a module below both. Where a module's package is wrong,
#   move the module; the check then says whether the new place holds.
# - On an allowance that matches nothing, delete it: its import is gone.
#
# `ignore_imports` allows the backward imports that remain. It only shrinks: an
# allowance goes when its import does, and a new backward import is fixed rather than
# allowed.

[importlinter]
root_package = leaf
exclude_type_checking_imports = True

[importlinter:contract:layers]
name = src/leaf packages import only themselves and packages below them (.config/importlinter.ini)
type = layers
containers = leaf
exhaustive = true
layers =
    __main__
    commands
    pages
    serving
    agents
    records
    log
    source
    base
ignore_imports =
    leaf.agents.clerk -> leaf.commands.agent_state
    leaf.agents.codex_adapter -> leaf.commands.session
    leaf.agents.delivery -> leaf.commands.hook_transport
    leaf.agents.delivery -> leaf.serving.served_state.context
    leaf.agents.presence -> leaf.commands.session
    leaf.agents.thread -> leaf.pages.render_gate.command
    leaf.base.harness -> leaf.agents.codex_state
    leaf.base.leases -> leaf.source.registry.kernel
    leaf.records.authored_checks.source -> leaf.agents.server
    leaf.records.page_view -> leaf.agents.delivery
    leaf.source.data -> leaf.records.transaction
    leaf.source.data_contracts -> leaf.log.thread_context
    leaf.source.passages -> leaf.log.obligations
