# From session 2dbc39a0, which generated a TODO-decisions page from a Python script and,
# when the user said the undo-reach Ask lacked context, rewrote its options with their
# effort as trailing prose ("Small.", "Medium.") rather than as labels. The script's
# option helper took labels as an optional argument no decision had used.
# The label rule then lived only in the lf-option registry entry, and these children
# read authoring-decisions.md alone, which said to add words for a tradeoff: base
# f7750a988 labelled every differing fact in 0 of 10 Claude Code runs (most labelled
# effort and left reach in prose). With the rule in authoring-decisions.md, 11 of 12
# across three wordings of it, and 5 of 5 after that section was rewritten around its
# goals. Runs that read no reference (2 of 9 there) can't see either wording.
# Asked the same of the HTML rather than the script, base labelled both in 3 of 3,
# so the script's unused labels argument is what reproduces the session.
# When the rule was cut back to its goal (labels for the facts the user weighs, with no
# order or every-option requirement) the rubric came to check that goal: base and
# candidate 5 of 5 each. Under the rubric before it, candidate runs left the reach label
# off the keep-today option in 2 of 5.
# The compact-title allowance still conflicted with this rubric's title prohibition.
# Saved-output calibration now accepts facts in compact titles or labels and rejects
# both original responses with reach only in option bodies; no new author runs.
description: options-label-what-sets-them-apart
metadata:
  purpose:
    "Asks: when alternatives differ on facts the user compares across them, such as effort or
    reach, compact titles or labels make those facts comparable without reading each
    option's explanatory prose."
  tags:
    - asks
vars:
  prompt: |
    Earlier in this session you read the `lf-ask`, `lf-options` and `lf-option`
    entries in `../../packages/default/registry.json` relative to the skill's base directory, and
    `references/authoring-on-me.md`, and wrote a Leaf page of decisions about
    Leaf's TODO list. The page is generated by `gen.py`, which begins:

    ```python
      import html, sys
      E=html.escape
      def opt(i, title, body, rec=False, tags=()):
          t=''.join(f'<small class="tag">{E(x)}</small>' for x in tags)
          r='<small class="tag ok">recommended</small>' if rec else ''
          return f'      <lf-option id="{i}">{t}{r}<strong>{E(title)}</strong> {body}</lf-option>\n'
      def dec(i, q, ctx, opts):
          o=''.join(opt(f"{i}-{k}", *v) for k,v in opts)
          return f'''  <lf-ask id="{i}-ask">
          <h3>{E(q)}</h3>
          {ctx}
          <lf-options id="{i}" choose>
      {o}    </lf-options>
        </lf-ask>
      '''
      D=[]
      def section(i, h, lede, decs):
          D.append(f'<section id="{i}">\n  <h2>{E(h)}</h2>\n  <p>{lede}</p>\n'+''.join(decs)+'</section>\n')

      KEEP="Keep it"
      # ... the "remove" section ...

      section("notes","Notes and TODO items that wait on your intent",
       "Each of these is parked because nothing in the code says whether you still want it. Removing one deletes its note and its TODO entry together.",
       [
       dec("undo-reach","Decide how far back <code>z</code> reaches, or drop the question?".replace("<code>","").replace("</code>",""),
        "<p><code>z</code> takes back your newest gesture however old, so on a page left for weeks it can reopen a thread you resolved then, out of view. The playground in <code>notes/undo-reach/</code> has waited on your pick since about 7 October. Its own recommendation is <em>Show, then take</em> plus <em>Say what z takes</em>; #3271 already names a widget's gesture in the tab that made it. I recommend building <em>Say what z takes</em> now: it is small, Show-then-take needs it anyway, and it alone tells you what <code>z</code> is about to undo.</p>",
        [("name",("Build “Say what z takes”, then Show-then-take","The undo notice names the gesture and its age from the server, after a reload too; then a target out of view is shown on the first press and taken on the second.",True)),
         ("pick",("I'll pick in the playground","The note stays; I'll serve the playground.")),
         ("drop",("Keep today's undo; drop the note","<code>z</code> keeps taking the newest gesture; the note and TODO item go."))]),
       dec("ui-quality","Keep the agent-driven UI diagnosis calibration?",
        "<p><code>notes/agent-driven-ui-quality.md</code> proposes an explorer-plus-cold-user pilot on a known miss, and a Tend acceptance-policy change. Since it was written (6 October), <code>leaf-dev eval-ui-review</code> shipped the known-miss-plus-control design, <code>/ui-sweep</code> requires a disposition per finding, and today's bad-pages eval measured what it proposed. The policy change was never adopted.</p>",
        [("drop",("Delete the note and the TODO item","The pilot and the Tend policy proposal go; eval-ui-review and /ui-sweep stay.",True)),
         ("pilot",("Keep the pilot only","The note shrinks to the pilot; the Tend proposal goes.")),
         ("keep",(KEEP,"Both stay parked."))]),
       # ... six more decisions ...
       ])
    ```

    The user commented on the undo-reach decision: "these need more context, how am
    I supposed to know what 'Show, then take' plus 'Say what z takes' means??"

    Your notes:
    - Today, pressing `z` undoes the user's most recent gesture on the page
      (resolving a thread, picking an option, ending a to-do), however long ago.
      After three weeks away, the first `z` can reopen a thread resolved back then,
      possibly off-screen, and the notice says only "Undid: resolved a thread".
      Nothing can redo an undo.
    - The alternatives:
      - Name the gesture and its age in the notice and the panel menu, after a
        reload too ("Undo: resolved 'Rollout safety' · 3 weeks ago"); `z` still
        acts on the first press. A small change; no limit on how far back.
      - The same, and when the target is out of view the first `z` scrolls to it
        and highlights it, and the second press undoes it. A medium change; no
        limit on how far back. Your recommendation: it never changes something
        the user can't see.
      - `z` reaches only gestures made since the page was opened; older ones need
        the widget's own Undo. A small change, but a tab left open for weeks is
        still one visit.
      - Keep today's undo and delete the note and its TODO item. No work.

    Rewrite the undo-reach decision so the user can answer it where On me takes
    them. The script is not reachable from here, so reply with the replacement
    `dec("undo-reach", ...)` call.
assert:
  - type: llm-rubric
    metric: facts-labelled
    value: |
      The reply is a Python call to the script's `dec` helper, whose options are
      tuples passed to `opt(i, title, body, rec=False, tags=())`; the `tags`
      argument becomes `small.tag` labels before the option's title. The
      alternatives differ in how much work each is and in how far back `z` can
      reach. Pass only if a reader can compare the options on both differences
      from compact titles or labels, such as "effort: small" and "reach: no limit",
      without reading the options' explanatory prose. Labels may use `tags` or
      literal `<small class="tag">` markup and need not repeat facts supplied by
      titles. An option that keeps today's behavior may leave a value to the
      context that describes today. Fail if an option leaves its differing effort
      or reach only in its body text, such as a trailing "Small." or "No age limit."
      The `recommended` label alone does not count.
  - type: llm-rubric
    metric: reason-beside-options
    value: |
      Find why the author recommends scrolling to an off-screen target before
      undoing it. Pass only if that reason is in the decision's context paragraph,
      outside every option's title and body, and only that option is marked
      recommended. Fail if any option's title or body holds the author's argument
      for picking it, or if the reason is missing.
  - type: llm-rubric
    metric: labels-fit-one-line
    value: |
      Find every option's labels: its `tags` values or literal `<small class="tag">`
      text, plus "recommended" on the advised option. Pass only if each label is a
      word or two of at most about 16 characters, such as "effort: small" or
      "1 day", so a card's labels could share one line. Fail if any label is a
      phrase or clause, such as "about two days of work" or "reaches every gesture
      ever made".
