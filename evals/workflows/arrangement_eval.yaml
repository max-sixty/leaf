preference:
  "A lasting preference for all my pages from now on: I use them in these windows:
  {windows}. Make evidence, decisions and
  navigation comfortable to work through at those sizes, using the available space
  where it helps the task."
reachable:
  A labeled control whose content is out of view, such as a collapsed section, an unselected
  item or a scroll region's remainder, counts as reachable but costs the user a step; content
  cut off with no visible way to reach it does not count.
prompts:
  first:
    leaf: |-
      Use Leaf for this page. Write it at {page}/index.html and send me its URL; I'll open it.
      Use headless browser tooling for your own inspection. Installed headless Chrome executable: {browser}

      {request}
    html: |-
      Build this page with HTML, CSS and JavaScript at {page}/index.html. Send me the file path; I'll open it.
      Use headless browser tooling for your own inspection. Installed headless Chrome executable: {browser}

      {request}
  preference: "{preference} Please revise the page to follow it."
  comment: "On {target}: {text}"
  apply:
    page:
      "I've made my decisions on the page. Apply them: update the page so it records them
      as final."
    copied: |-
      I've made my decisions on the page, and this is what it gave me to copy:

      {copied}

      Apply them: update the page so it records them as final.
    typed: |-
      {typed}

      Apply them: update the page so it records them as final.
  quality:
    At every declared width, substantive evidence and navigation are readable and reachable.
    Each decision can be answered where the user lands on it, without asking what something
    it names is or does.
    In a workspace, read each pane's whole content through the pane's own scroll, and count
    a pane the keyboard can't reach, or one left mostly empty while another is
    cramped, against the page where it affects the task.
    The final page incorporates the user's comment and lasting width preference, and clearly
    preserves the final decision the user supplied. On the before_decision page, exercise the
    original browser decision task through the offered controls, including keyboard routes; judge the actual outcome, not a settings summary or a claim of success. On the final
    page, inspect the resulting record without replacing it with your own choices. The author's
    quoted comment answer should accurately describe the change. A recorded plan or approval
    does not imply execution, deployment or sending a message.
cases:
  changing-feedback-keeps-place:
    inputs:
      comment: null
      decision: null
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric: |
            At every declared viewport, operate Replay all, change speed, pause,
            resume using the keyboard, seek, and let playback finish naturally.
            Measure the playback buttons, speed control, timeline and comparison
            positions and sizes before and through ready, playing, paused, resumed
            and finished states. Changing labels, status messages or numeric values
            must not move or resize these controls or displace the comparison.
            Observe delayed completion rather than checking only immediately after
            a click. A broken or disabled control that prevents a required transition
            is a defect, not evidence of layout stability. Keep the viewport fixed
            within each comparison and account for scrolling when measuring positions.
            Open Show observations and verify the entire paragraph supplied in the
            request is visible as readable, wrapping content without clipping or
            ellipsis. This deliberate reveal may grow the page; changing feedback
            must not silently consume or hide substantive results.
            Judge the rendered behavior and cite measured geometry and observed
            states. No particular CSS technique, attribute, widget or DOM structure
            is required. Source code and a settled screenshot alone cannot establish
            stability; unvisited required states leave insufficient evidence.
  document:
    inputs:
      comment: &document-comment
        target: the recommendation's ask of the database owners
        quotes:
          - the database owners to say whether 55% peak CPU is acceptable
          - whether 55% peak CPU is acceptable
          - 55% peak CPU
        text:
          The database owners are Mei Tanaka's team. Name them here and ask for their answer
          by Wednesday, the day before the decision.
      decision: &document-decision
        task:
          "As the platform team, decide the review's question: choose option 1, staying
          on managed Redis and shortening the TTL to 7 days."
        typed: "We've decided: stay on managed Redis and shorten the TTL to 7 days."
      reveal: ""
    assert:
      - &id001
        type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric: ""
  dashboard:
    inputs:
      comment: &dashboard-comment
        target: the follow-up to confirm the timeout change with the payments team
        quotes:
          - Confirm the timeout change with the payments team (Dana).
          - Confirm the timeout change with the payments team
          - timeout change with the payments team
        text:
          Dana confirmed at 15:52 that 7.2's 3 s connect timeout is the cause. Mark this
          follow-up done and say so where the page explains the cause.
      decision: &dashboard-decision
        task: "Decide eu-west: roll it back to 4.11 and ship 4.12.1 with the old timeout."
        typed: Roll eu-west back to 4.11 and ship 4.12.1 with the old timeout.
      reveal: ""
    assert:
      - *id001
  draft-review:
    inputs:
      comment:
        target: the number of customer workspaces affected by delayed CSV exports
        quotes:
          - 43 customer workspaces
          - 43 workspaces
        text:
          "Correction: 34 customer workspaces were affected, not 43. Update the incident
          facts and proposed reply to use 34 workspaces. Keep the incident window,
          completion and data-loss facts, retry advice, investigation status and next-update
          deadline unchanged."
      decision:
        task: |-
          Edit the customer reply through the page's own text-editing controls.
          Replace its complete contents with the exact two paragraphs below,
          including their wording and punctuation, then finish recording that
          complete reply for internal review using the page's offered route.
          You must enter the text; merely selecting a supplied reply alternative
          does not complete this task. Do not send a customer message.

          Hi Morgan — between 09:10 and 09:42 UTC, CSV exports were delayed for 34 customer workspaces. All queued exports have now completed, and no files were lost. I’m sorry for the disruption this caused your team.

          We’re reviewing the queue-capacity issue and will share another update by 11:00 UTC, even if that review is still underway. You don’t need to retry any exports. Thank you for your patience while we work through the follow-up.
        typed: |-
          My approved reply for internal review is exactly these two paragraphs.
          Keep this wording and punctuation; it has not been sent:

          Hi Morgan — between 09:10 and 09:42 UTC, CSV exports were delayed for 34 customer workspaces. All queued exports have now completed, and no files were lost. I’m sorry for the disruption this caused your team.

          We’re reviewing the queue-capacity issue and will share another update by 11:00 UTC, even if that review is still underway. You don’t need to retry any exports. Thank you for your patience while we work through the follow-up.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "At every declared width, the final record visibly preserves the complete two-paragraph
            reply the browser user entered, with the exact supplied wording and punctuation and
            the paragraph break between “team.” and “We’re”. Assess the visible approved text
            itself, not only a claim that it was saved, a hidden value or an uninspected claim.
            Ordinary line wrapping is allowed. The page identifies it as approved for internal
            review and not sent to the customer. Corrected current facts remain readable and reachable:
            34 affected workspaces, 09:10–09:42 UTC incident, completed queued exports, no files
            lost, no retry needed, root cause not yet confirmed and next update by 11:00 UTC.
            Older proposed wording is not presented as the current approved reply.
            On the before-decision page, complete the offered action that approves or records
            the reply for internal review. Then change and save the wording where offered, without
            approving it again; the changed wording must not be presented as approved.
            Judge usable editing and recording outcomes, not a particular widget, editor engine or layout geometry."
  queue:
    inputs:
      comment: &queue-comment
        target: ESC-4110 (Brightline Dental)'s suggested action
        quotes:
          - point to the feature request board, already planned for Q4
          - point to the feature request board
          - feature request board
        text:
          "Brightline is on a Team trial that converts next week, so don't just close it:
          route it to their account manager, Sam Okafor, with the Q4 plan."
      decision: &queue-decision
        task:
          "Work through the queue and decide each ticket: ESC-4107: fix; ESC-4108: close;
          ESC-4109: fix; ESC-4111: escalate to engineering; ESC-4112: escalate to engineering;
          ESC-4113: refund; ESC-4114: escalate to engineering. ESC-4110 is settled by your earlier
          comment; leave it as it is."
        typed:
          "My decisions: ESC-4107: fix; ESC-4108: close; ESC-4109: fix; ESC-4111: escalate
          to engineering; ESC-4112: escalate to engineering; ESC-4113: refund; ESC-4114: escalate
          to engineering. ESC-4110 as I said in my comment."
      reveal: ESC-4110
    assert:
      - *id001
  configuration:
    inputs:
      comment:
        target: the ledger-reconciliation-lag alert
        quotes:
          - minutes since the last successful ledger reconciliation run
          - last successful ledger reconciliation run
          - ledger-reconciliation-lag
        text:
          Finance owns this alert. If it pages, it pages the finance-ops rotation, not payments
          on-call; show that beside its routing.
      decision:
        task:
          "Set each alert's threshold and routing: payments-5xx-rate: over 2%, pages; payments-p99-latency:
          over 1,200 ms, opens a ticket; card-auth-decline-spike: over 3×, opens a ticket; webhook-backlog:
          over 20,000, pages; ledger-reconciliation-lag: over 180 min, pages; gateway-cert-expiry:
          under 30 days, opens a ticket."
        typed:
          "Final settings: payments-5xx-rate: over 2%, pages; payments-p99-latency: over
          1,200 ms, opens a ticket; card-auth-decline-spike: over 3×, opens a ticket; webhook-backlog:
          over 20,000, pages; ledger-reconciliation-lag: over 180 min, pages; gateway-cert-expiry:
          under 30 days, opens a ticket."
      reveal: ledger-reconciliation-lag
    assert:
      - *id001
  sidebar-page-at-900px:
    inputs:
      comment: null
      decision: null
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            At every declared width, the error-rate chart and all forty rollout entries are
            comfortably readable. The reader can follow the entries from oldest to newest,
            with a usable reading area and a discoverable route through the complete log.
            Judge whether scrolling preserves context and lets the reader
            continue to related content and navigation without awkward switching or lost position.
            At desktop sizes, all six checks and their failing result stay
            accessible beside the log as it scrolls. Page navigation and any supporting sidebar
            content remain reachable; a sticky box must not hold them below the window. At phone sizes,
            the regions stack without covering the log or hiding its entries.
  patch-review:
    inputs:
      comment:
        target: the claim that job IDs are globally unique and the proposed idempotency key
        quotes:
          - job.id is globally unique
          - globally unique
        text:
          "Correction: job IDs are tenant-local. The key must include tenant_id and job.id,
          computed once before the loop. Update the proposed code and add a check that the same
          job ID in two tenants produces different keys."
      decision:
        task:
          "Approve shipping with both changes: a stable tenant-and-job idempotency key and
          a default cap of two attempts. Complete the page's offered review route."
        typed: Approve with the stable tenant-and-job key and a default cap of two attempts.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "At the declared window sizes, the substantive review evidence and navigation remain
            readable and reachable, and the final decision is clear. Inspect the implementation,
            acceptance tests and both documentation files through the offered directory and file
            navigation. Every file is reachable and selectable by pointer and keyboard through
            discoverable controls. The selected path matches the displayed change, and switching
            files makes the selected change's heading and beginning visible. Inspect
            whether the code uses the available reading area and whether navigation, code and
            review controls remain usable as content grows. Judge wasted space or clipped focus
            by its effect on reading, navigation and decisions, without requiring a particular
            pane arrangement, widget, pixel dimension or visual style. Exercise meaningful offered
            controls, inspect keyboard focus, and report a runtime limitation separately from an
            authoring choice where the evidence establishes the distinction. The displayed selected patch
            agrees with that decision: its default cap is two attempts, and its stable idempotency
            key includes tenant_id and job.id and is computed once before the retry loop. The
            cross-tenant same-job-ID check is included. Proposed tests and approval remain distinct
            from tests having run or code having deployed."
  motion-design:
    inputs:
      comment: null
      decision:
        task: >-
          Compare the panel recordings using their shared playback controls, including
          quarter speed and seeking. Then choose B · Balanced where its recording is
          shown and complete the page's offered route for recording that design choice.
        typed: My final choice is B · Balanced, the 260 ms panel timing.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric: >-
            Operate the before_decision page at every declared viewport. The actual supplied
            recordings play, with Baseline visibly distinguished from the three alternatives
            and each candidate's meaningful difference explained. The evidence must make
            the motion being decided inspectable: the complete moving panel, its travel,
            reversal and settling, at a scale that lets the reader compare those features.
            All candidates can be compared together without switching a single view between
            them. Replay, pause, quarter-speed playback and seeking operate every recording
            at the same moment; establish this by operating them and inspecting the media,
            not only their labels. While scrolling to a lower candidate, shared playback
            and seeking remain available without returning to the top. A recording's own
            displayed candidate provides its selection action, and choosing works by keyboard
            as well as pointer or touch. Playback and seeking must not accidentally change
            or submit the choice. On the phone, controls remain usable and the complete
            motion stays visible during playback without panning to follow it. Judge
            legibility by the movement this decision concerns; incidental recorded text
            and icons need not be readable unless the choice depends on them. On the
            final page, B · Balanced
            at 260 ms is clearly recorded as the user's choice and its actual recording
            remains available. The page must not claim the choice has been implemented or
            shipped. Judge these user outcomes rather than particular widgets, CSS properties,
            a prescribed grid or exact wording. An untested required interaction is
            insufficient evidence, not a pass.
  notification-design:
    inputs:
      comment:
        target: the notification body saying payments settle within five minutes
        quotes:
          - five minutes
        text:
          'Replace the body with: "Payments may take up to twenty minutes; do not retry
          a payment already submitted." Keep the headline and detail facts unchanged.'
      decision:
        task:
          Choose Status strip, Compact density, 12px corners, and details visible. Complete
          the page's offered route for finishing the design choice.
        typed:
          My final design is Status strip, Compact density, 12px corners, with details
          visible.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "At every declared width, the substantive information and navigation remain
            readable and reachable, and the final design choice is clear. The actual visible notification
            agrees with the selected appearance: Status strip format, Compact density, 12px corner
            radius and visible details. It retains the headline and detail facts and displays
            the corrected body about twenty minutes and not retrying a submitted payment. A settings
            summary alone does not establish that the preview matches. Recording the design remains
            distinct from implementation or deployment."
  dependency-review:
    inputs:
      comment:
        target: the Receipt index and its incoming data flow
        quotes:
          - Receipt index
          - receipt index
        text:
          "Correction: the Receipt index consumes a changefeed directly from the Primary
          database, independently of the Delivery worker. Update both the diagram and the nearby
          explanation: replace worker-to-index with database-to-index, labeled changefeed. Keep
          the other relationships."
      decision:
        task:
          Choose to pause partner delivery for ten minutes and complete the page's offered
          decision route. This records a plan; do not execute it.
        typed:
          My decision is to pause partner delivery for ten minutes, as a plan that has
          not been executed.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            At every declared width, the substantive evidence, corrected diagram and final
            choice remain readable and reachable. The diagram shows the Receipt index consuming
            the Primary database's changefeed, not updates from the Delivery worker, with the
            other relationships preserved. The final plan pauses partner delivery for ten minutes,
            keeps order capture continuing, and retains the 8,000-row and 27-minute estimates,
            10,000-row limit, existing delivery-objective breach and unknown partner recovery
            ETA. Recording the plan does not imply the pause was executed or the partner recovered.
            Assess relationships rather than literal arrow count.
  latency-review:
    inputs:
      comment:
        target: configuration A with 4 workers and its p99 latency
        quotes:
          - A with 4 workers
          - A / 4
          - 180 ms
        text:
          "Correction: A with 4 workers has p99 latency 1800 ms, not 180 ms. Its throughput
          remains 1240 requests/s and its error rate remains 0.04%. Update the
          chart, exact run data and current assessment to use the corrected measurement. Keep
          the other measurements unchanged."
      decision:
        task:
          Choose configuration B with 2 workers for the next production-like validation
          run and complete the page's offered recording route. Record a plan only; do not execute
          a run or deploy anything.
        typed:
          My decision is configuration B with 2 workers for the next production-like validation
          run. This is a plan, not an executed run or deployment.
      reveal: ""
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            At every declared width, the final record identifies B with 2 workers for another
            production-like validation, with readable access to all nine measurements, chart,
            corrected p99 of 1800 ms for A with 4 workers, and current screening assessment.
            Any retained original 180 ms measurement is clearly
            superseded. B with 2 workers remains the highest-throughput feasible measured run
            under p99 at most 700 ms and errors at most 0.1%. The record distinguishes the selected
            future validation from an executed run or deployment and retains the single synthetic
            five-minute run per cell limitation, without claiming production performance, uncertainty
            estimates or SLO proof.
  # Revisions that change what a page is for, kept when they compose by Layouts
  # (TODO.md, "Test the Layouts on agents"). Each reuses its task's request,
  # comment and decision, then sends one revision.
  document-live-status:
    inputs:
      request: document
      comment: *document-comment
      decision: *document-decision
      reveal: ""
      revision:
        "We've gone ahead with that, and the TTL change rolls out region by region this
        week. Make this the page the platform team follows during the rollout: add its
        live status, which you'll keep current as regions finish, and keep the review
        and its comment thread as they are, since it's still the record of why. Status
        now: us-east finished Monday, and the cluster's memory is down from 81% to 58%;
        eu-west has been rolling out since 09:00 today; ap-southeast starts Thursday.
        Logout-everywhere still lags up to 90 s during failover, as expected."
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "The final page is the review turned into the page the platform team follows
            during the TTL rollout. On arrival, at every declared width, the rollout's
            current status reads at a glance: us-east finished with memory down from 81%
            to 58%, eu-west in progress since 09:00, ap-southeast starting Thursday, and
            logout lag unchanged. It is presented as current status the author will keep
            up to date, distinct from the review's analysis. The review remains readable
            in order as the record: its question, measurements, options, risks and the
            recorded decision to stay on managed Redis with a 7-day TTL. The user's comment
            thread about the database owners is still reachable with its answer, attached
            to its passage where that passage still stands. The status does not crowd the
            review out of view or overlap it."
  dashboard-write-up:
    inputs:
      request: dashboard
      comment: *dashboard-comment
      decision: *dashboard-decision
      reveal: ""
      revision:
        "16:35: eu-west is back on 4.11 and its error rate is down to 0.33%. 4.12.1, with
        the 10 s connect timeout pinned, is building and goes to eu-west at 1% at 17:30;
        the other regions carry on with 4.12 meanwhile. Keep this page for the rest of the
        rollout, and add the eu-west write-up the team reads tomorrow: what happened, the
        cause, what we decided and the follow-ups. Keep the comment thread where it is."
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "The final page serves both uses. On arrival, at every declared width, the
            rollout's live state as of 16:35 reads at a glance: eu-west back on 4.11 at
            0.33%, 4.12.1 with the 10 s timeout going to eu-west at 1% at 17:30, the other
            regions continuing on 4.12. Figures from 15:40 that are no longer current are
            labelled with their time or replaced. The eu-west write-up makes the incident understandable to the team
            reading it tomorrow: what happened, the cause (payments-sdk 7.2's 3 s connect timeout,
            confirmed by Dana at 15:52), the decision to roll eu-west back and ship 4.12.1,
            and the follow-ups with the confirmed one marked done. The prose has enough width to read
            comfortably at every declared viewport.
            The user's comment thread on the follow-up remains reachable with its answer."
  queue-hand-off:
    inputs:
      request: queue
      comment: *queue-comment
      decision: *queue-decision
      reveal: ESC-4110
      revision:
        "Thanks. Add a hand-off for Lena Park, the support lead, who reads it tomorrow
        morning before stand-up: for each of the eight tickets, its outcome, why, and who
        owns it next, and what is still waiting on someone. Keep the queue as it is, threads
        included; I'll come back to it if anything reopens."
    assert:
      - type: javascript
        metric: quality
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric:
            "The hand-off reads in order for a reader who did not work the queue: all eight
            tickets with the recorded outcome (ESC-4110 routed to Sam Okafor with the Q4
            plan, as the user's comment asked), its reason and its next owner, and what is
            still waiting on someone. The queue still works as before: its list beside the
            selected ticket, each ticket's recorded decision visible with it, and the
            earlier comment thread reachable. Neither use squeezes the other: the hand-off
            is not confined to a narrow pane or tab strip beside the queue, and the queue
            keeps the room to read a ticket and its decision."
