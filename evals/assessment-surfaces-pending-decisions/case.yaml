        <section id="discussion-choice">
          <h2>#58 · Deferred: keep code reading and replies available</h2>
          <p>The problem is recorded under User continuity and mobile access in <code>TODO.md</code>. No separate extract or review is planned for this proposal.</p>
          <details id="deferred-discussion-evidence"><summary>Archived comparison of the deferred solution</summary>
          <p>These are the conversations attached to a file or code line, displayed immediately beneath the code. The Threads side panel already folds conversations; this change adds a way to fold an active discussion while reading the diff itself.</p>
          <section id="discussion-evidence">
            <h3>Before → after: keep reading without losing your reply</h3>
            <p><strong>Before:</strong> the active discussion and unfinished reply stay expanded. <strong>After:</strong> the discussion folds to one row; Draft tells you the reply is still there. Drag the divider to compare the same code and discussion.</p>
            <lf-shot id="discussion-fold-comparison" before="/media/4a05d15596683044.png" after="/media/cd2bfd93868abda9.png" alt="The same diff discussion before and after folding: the expanded reply becomes a compact topic row marked Draft."></lf-shot>
            <lf-shot id="discussion-fold-phone" before="/media/c82493ed7ccff428.png" after="/media/47cb7558b2d15b52.png" alt="Narrow window comparison: the expanded reply becomes a folded discussion marked Draft."></lf-shot>
            <p class="caption">Same fictional discussion and reply, captured at matching window sizes for desktop and phone. Main snapshot <code>8d6898f29</code> versus this branch at <code>05a5008b3</code>. The comparison uses the full branch and is retained here as evidence of the deferred proposal. A browser check confirmed that expanding the row restores the exact reply words and folding does not resolve the discussion.</p>
            <details id="resolved-discussion-evidence"><summary>Also: recognizing a resolved discussion and reopening it</summary>
              <p>Resolved discussions already fold on main. The proposed header shows the discussion’s topic and puts Reopen beside it when expanded.</p>
              <div class="comparison">
                <figure><figcaption>Before · Reopen below the messages</figcaption><img src="/media/3af1b645aa1670bb.png" alt="Main: resolved discussion with a message count and Reopen below its message."></figure>
                <figure><figcaption>After · topic and Reopen together</figcaption><img src="/media/2a3d2c8a10769fb0.png" alt="Branch: resolved discussion with its topic and Reopen in the header."></figure>
              </div>
            </details>
            <h3>Try the actual controls</h3>
            <p><a href="https://review.example.test/#controls">Open the practice diff</a>, choose Full view, and type in Reply. Click the triangle beside Discussion to hide it, then expand it again: your words should remain. Expand Resolved to try Reopen. Reset restores the example.</p>
            <p class="caption">The practice page contains fictional messages. Comments on this briefing steer our work.</p>
          </section>
          <details id="discussion-behavior-map"><summary>Compare all three states: active, draft and resolved</summary>
          <div class="scopes"><table id="discussion-map">
            <thead><tr><th>When</th><th>Today on main</th><th>Proposed behavior on this branch</th></tr></thead>
            <tbody>
              <tr><td>The discussion is still open</td><td><span class="mobile-label">Today</span>Its messages stay expanded beneath the code.</td><td><span class="mobile-label">Proposed</span>Click the triangle beside Discussion to hide the messages; click again to show them. Resolve remains a separate control.</td></tr>
              <tr><td>You have started a reply</td><td><span class="mobile-label">Today</span>The open discussion keeps the reply box visible.</td><td><span class="mobile-label">Proposed</span>Hide the discussion to keep reading code, then reopen it and continue the same words. A Draft label marks the folded discussion.</td></tr>
              <tr><td>The discussion is resolved</td><td><span class="mobile-label">Today</span>Its folded row says Resolved and a message count; Reopen is below the expanded messages.</td><td><span class="mobile-label">Proposed</span>The folded row shows the topic so you can recognize it. Expand to read the history; Reopen sits beside the topic.</td></tr>
            </tbody>
          </table></div>
          </details>
          </details>
        </section>

        <details id="deferred-draft-plan"><summary>Deferred: draft recovery waits for visible annotations</summary>
        <section id="draft-sequence">
          <h2>Deferred: drafts need a visible route back <span class="tag">updated</span></h2>
          <p>Keep <strong>#47</strong> and <strong>#48</strong> in TODO until unfinished drafts have visible annotations at their source elements. The user must be able to find the exact element, reopen its draft and continue the saved edit. Preserving separate drafts is useful only when returning to them is straightforward.</p>
          <lf-diagram id="next-order" parts="all" data-height="300"><pre>
        ---
        config:
          flowchart:
            nodeSpacing: 16
            padding: 8
        ---
        flowchart TD
          accTitle: Dependencies of the deferred draft work
          accDescr: Draft ownership and exact source recovery are deferred until visible draft annotations make their targets easy to find. Inline reading continuity still depends on draft ownership.
          Drafts["#47 · Deferred"] --> Recovery["#48 · Deferred"]
          Drafts --> Continuity["#50 · Waiting"]
          Recovery ~~~ Continuity
          </pre></lf-diagram>
          <section id="independent-drafts">
            <h3>#47 · Independent drafts and Resume — deferred</h3>
            <p><strong>Before → after:</strong> opening another comment context must not transfer the first draft into it. Write in A, open B once, write in B, and return to A: each retains its own edit. Sending B leaves Resume able to recover A.</p>
            <p><strong>Before resuming:</strong> show a draft annotation on the original element and make it reopen that element’s saved edit. Keep draft ownership and the shared unfinished-draft reading together when this work resumes.</p>
            <details><summary>Parked implementation boundary and acceptance journey</summary>
              <p>Keep the integrity guarantee together: each context owns its words, caret and attachments, and Resume chooses from actual unfinished edits. Remove cross-target draft transfer; move per-draft writing metadata, own-context adoption, reply handoff, composed edit events, attachment undo/redo and upload retirement together. The canonical anchor key supplies identity. Resume uses the registered composer destination and existing anchor travel; it does not depend on #48's new datum contract. Move the canonical held-composer-draft reading and its subscription here, including the drawing-controller caller cutover, while retaining main's drawing v3 format. Remove the drawing-only projection rather than leaving two readings alive.</p>
              <p>Primary owners: <code>drafts.js</code>, <code>selection.js</code>, <code>surface.js</code>, <code>input.js</code>, editor edit propagation and <code>leaf.js</code> and the drawing controller's held-draft consumer. Take selected hunks: those files also hold drawing and layout work. Roughly 350–500 changed runtime lines before its tests; medium/high integration risk.</p>
              <p><strong>Acceptance journey:</strong> write A, open B once and write B, open reply C, then find A through its visible draft annotation and reopen it. Words and carets stay separate. Send B; Resume returns to A. Repeat after reload, across tabs, after attachment undo and during an upload. Use the existing draft ownership, suggestion, upload replacement and Resume tests.</p>

            </details>
          </section>
          <section id="draft-cues">
            <h3>#48 · Recover the selected source draft — deferred</h3>
            <p><strong>Before → after:</strong> a generic file comment control should not choose whichever draft happened to be newest. Explicit file and line cues recover the chosen draft, including one tied to an earlier source revision.</p>
            <p>Resume with #47 once draft annotations make the original target discoverable. Keep the chooser, line marks, source labels and exact-anchor opening together so the destination and its caption agree.</p>
            <details><summary>Parked implementation boundary and acceptance journey</summary>
              <p>Build on #47. Keep the file chooser, line marks, subscription, intrinsic action allocation and retained-anchor opening together. Move the <code>readAnchorDatum</code>/<code>lfDataDatum → {element,label}</code> contract with its captions, exports and module-authoring reference. Extend main's canonical <code>threadSurface(owner).open(fullAnchor)</code> here, where the chooser calls it; retain main's automatic surface registration. A cue must open the saved context, including an earlier source revision.</p>
              <p>Primary owners: public widget exposure of #47's draft reading, <code>lf-diff.js</code>, thread placement, datum resolution and <code>thread/messages.js</code>. Roughly 400–600 runtime/contract lines plus tests; high risk around lazy hydration and replaced sources. Do not interpret the generic file control as “resume whichever draft is newest.”</p>
              <p><strong>Acceptance journey:</strong> make two line drafts and one file draft; collapse, reload, find each draft through its annotation and choose it explicitly. Revise the source and recover the earlier draft without rebinding it to today's line. Carry source cues, exact file-menu recovery, lazy captions/navigation and addressed-anchor tests. Drawing-specific fixture arms belong with #49.</p>

            </details>
          </section>
          <p class="boundary">These are proposed extraction boundaries supported by the call paths, not standalone patches already built and tested. Each extract needs its own focused journey, review and landing gates.</p>
        </section>

        </details>

        <section id="what-remains">
          <h2>What is still on the branch</h2>
          <p>The work began with diff comment controls and highlight boxes. The later UI sweep expanded into the shared composer, threads, drawings and review tooling. Splitting out the small fixes reduced the breadth of each landed change; it left the larger shared guarantees here.</p>
          <div class="scopes"><table id="remaining-map">
            <thead><tr><th>Work</th><th>Result for the user</th><th>Extraction</th></tr></thead>
            <tbody>
              <tr><td>Draft integrity and recovery</td><td>Separate words, caret and attachments per context; Resume and source cues open the intended unfinished edit.</td><td><a href="#draft-sequence">#47 / #48 deferred</a></td></tr>
              <tr><td>Drawing anchors</td><td>Separate pen strokes keep their own source coverage through replay, reflow and source return.</td><td>#49; blocked by <a href="#drawing-coordinate-blocker">#43</a></td></tr>
              <tr><td>Inline reading continuity</td><td>Preserve the reader’s place and writing context when a discussion moves or disappears.</td><td>#50 waits for deferred #47</td></tr>
              <tr><td>Conversation presentation</td><td>Stable receipt widths, narrow writing actions, standard expand/collapse controls and correct touch selection.</td><td>#56, #57 and #59 separately; #58 deferred</td></tr>
              <tr><td>Menu, tabs and margin</td><td>Menu-local focus; correct sticky layers; comment markers avoid nearby controls.</td><td>#53–#55, separately</td></tr>
              <tr><td>Inspection and review tools</td><td>Inspect captured drawings and review scrolling or frame lifetimes with better evidence.</td><td>#51–#52</td></tr>
            </tbody>
          </table></div>
          <h3>Tests account for most added lines</h3>
          <p>About 61% of the added lines are in tests. The chart groups the patch by file family; runtime/support includes schemas, comments and rearrangements as well as executable changes.</p>
          <lf-chart id="patch-shape" data-height="240"><pre>
        (() =&gt; {
          const rows = [{kind:"Tests",lines:5532},{kind:"Runtime / tools",lines:2919},{kind:"Generated",lines:553},{kind:"Docs",lines:82}];
          return {
