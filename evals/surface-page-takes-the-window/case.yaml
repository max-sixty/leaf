# From session e8a66e47, whose design-review page put its main item, a playground
# sketching a redesigned panel, in a column page as a breakout between the review's
# prose, so the playground's edges matched nothing above it and the review pushed it
# down. The user wanted the playground to lead, with the review split out. Claude Code:
# base (c20bf406f) 0/6 across two runs, every page a column; candidate 6/6, each a
# workspace whose first page tab is the playground's Ask.
description: surface-page-takes-the-window
metadata:
  purpose: 'Arranging a page: a page whose main item is one surface the user works gives that surface the window, a workspace, and moves its supporting reading into page tabs after it.'
  tags:
  - layout
  - playground
vars:
  prompt: |
    The user asked you to review the floating comment panel in their web app, which
    they dislike, and to propose a new look they can try before you build it. Write
    one Leaf page that hands this over. It holds:

    - A playground sketching the proposed panel at desktop size, where the user
      switches it between its three sizes (folded, row, expanded), tunes its surface
      (paper, lifted, ink), corner radius and width, and submits the look to build.
    - What is wrong with today's panel: five problems, each with its screenshot
      (`/media/today-1.png` to `/media/today-5.png`) and a sentence.
    - What three comparable products do, a short paragraph each.
    - The proposal's reasoning: eight bullet points on the sizes, the status line,
      the menu and the motion.

    Read references/page-authoring.md and packages/playground/instructions/author.md
    inside the leaf skill's base directory. The page directory is not reachable from
    here, so reply with the complete `index.html`, with a placeholder element for the
    sketch inside the playground's preview, rather than writing a file.
assert:
- type: llm-rubric
  metric: judgment
  value: |
    Read the HTML. Pass only if the playground leads the page as its main surface:
    `main` is a `layout-workspace`; the `lf-ask` holding the `lf-playground` is either
    the workspace's body or the only block in the first tab of an `lf-tabs` set placed
    directly in `main`, whose later tabs hold the review of today's panel, the
    comparisons and the reasoning; and the `lf-playground` carries
    `data-width="available"`. Fail if `main` is a `layout-column` or `layout-sidebar` page with the
    playground set among the review's sections, or if the review, comparisons or
    reasoning stand before the playground in the same view.
