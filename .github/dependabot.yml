version: 2

# The uv entry watches the repository's Python lock. Its runtime packages are what
# an install of leaf actually resolves — a bump there changes what every harness
# runs — and the dev group is the suite's; the lock records both.
#
# The npm ecosystem also supports pnpm: it watches the root `package.json` and
# `pnpm-lock.yaml`, which name the browser, Worker and eval dependencies. The
# dependency-bundles workflow rebuilds every committed browser bundle (`pnpm run
# build:browser`) and updates the same PR. The compilers, esbuild and Rolldown, are
# left out: upgrade them when a build needs it rather than regenerating the payload on
# every compiler release. Dependabot can't move pnpm itself; the pnpm-update workflow
# does, in a weekly PR of its own.
#
# Every ecosystem proposes only releases at least three days old (`cooldown`), the
# window `minimumReleaseAge` in `pnpm-workspace.yaml` and `exclude-newer` in
# `pyproject.toml` hold every other pnpm and uv update to. A longer npm cooldown would
# fail an npm update whenever the lockfile holds a version between the two ages, as
# `pnpm-workspace.yaml` says.
#
# Grouped so each ecosystem opens one PR a week rather than one per dependency;
# on a repo this size the review cost of a group is the same as a single bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # These names resolve to this workspace, not packages on PyPI. In particular,
    # trying to upgrade the root leaf package to PyPI's leaf breaks uv lock.
    ignore:
      - dependency-name: leaf
      - dependency-name: leaf-dev
      - dependency-name: leaf-website
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: esbuild
      - dependency-name: rolldown
    groups:
      dependencies:
        patterns: ["*"]
