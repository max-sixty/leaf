# From the arrangement eval's `document` subject (#45), where
# Leaf pages kept putting the whole "Plan if we pick Postgres" in a collapsed
# `<details>` at the foot of a review the team reads top to bottom and comments on.
# Base at 75da924af, whose Reading cost sent "exhaustive support" under `<details>`,
# collapsed the plan's steps in 8 of 19 runs (11 passed); the change, which keeps open
# what readers are asked to review or comment on, passed 10 of 10.
description: review-plan-stays-open
metadata:
  purpose: 'Reading cost: what a review asks its readers to weigh and comment on, a proposed plan included,
    stands open; only what they can skip goes under a disclosure.'
  tags:
  - reading-cost
vars:
  prompt: "Write this up as a page for me. It's the review I'll send to the platform team before\nThursday's\
    \ decision; they read it top to bottom and reply with comments.\n\n## Working notes\n\n**Question.**\
    \ Should we move web sessions off the Redis cluster `sess-redis-prod` and,\nif so, onto what? The\
    \ cluster's memory is at 81% of its 64 GB, the vendor contract for\nthe managed Redis renews on 1\
    \ November at +38%, and logout-everywhere has been\nunreliable since the June incident.\n\n**What\
    \ I measured (14\u201327 September, production, all regions).**\n\n- Median session read: 0.4 ms.\
    \ p95: 1.9 ms. p99: 7.8 ms, driven by evictions during\n  the 02:00 UTC batch window.\n- 312k active\
    \ sessions at the daily peak; 1.9M sessions total in the keyspace, 71% of\n  them idle for more than\
    \ 7 days but not yet expired (TTL is 30 days).\n- Logout-everywhere took effect within 1 s in 96.1%\
    \ of 4,210 requests; the other 3.9%\n  took up to 90 s because replicas lag during failover.\n- Two\
    \ failovers in the window (17 Sept, 23 Sept), each dropping 0.3% of sessions.\n\nDaily p95 read latency\
    \ in ms, 14\u201327 Sept:\n\n```\nday,p95_ms\n14,1.7\n15,1.8\n16,1.8\n17,3.9\n18,1.9\n19,1.8\n20,1.7\n\
    21,1.7\n22,1.8\n23,4.4\n24,1.9\n25,1.8\n26,1.7\n27,1.8\n```\n\n**Options.**\n\n1. *Stay on managed\
    \ Redis, shorten TTL to 7 days.* Frees about 70% of memory, so no\n   resize. Cost goes up 38% at\
    \ renewal regardless. Does nothing for logout lag.\n2. *Postgres (`accounts-db`), sessions table with\
    \ an index on user id.* Logout is one\n   `DELETE \u2026 WHERE user_id = $1`, consistent immediately.\
    \ Read p95 in a load test was\n   3.1 ms (vs 1.9 ms now). Adds ~9k QPS to a database at 40% CPU. Cost:\
    \ roughly zero\n   marginal. Migration: dual-write for 30 days, then cut reads over.\n3. *Signed stateless\
    \ tokens (15 min) plus a revocation list in Postgres.* No session\n   reads on the hot path at all.\
    \ Logout-everywhere waits up to 15 minutes unless every\n   service checks the revocation list, which\
    \ puts us back at option 2's read load.\n   Largest change: every service that reads a session changes.\n\
    \n| | Stay on Redis | Postgres | Stateless + revocation |\n|---|---|---|---|\n| Read p95 | 1.9 ms\
    \ | 3.1 ms | 0 ms (hot path) |\n| Logout-everywhere | lags up to 90 s | immediate | up to 15 min,\
    \ or option 2's load |\n| Yearly cost | $148k | ~$0 marginal | ~$0 marginal |\n| Services changed\
    \ | 0 | 1 (auth) | 23 |\n| Migration length | none | 30 days dual-write | 1\u20132 quarters |\n\n\
    **Risks.**\n\n- Postgres: `accounts-db` hits 55% CPU at peak under the load test; our alert fires\
    \ at\n  70%. The 02:00 batch window overlaps with vacuum on the accounts table.\n- Postgres: a bad\
    \ index or bloat makes every request slow, not only logins.\n- Stateless: the 15-minute window is\
    \ a security-review finding waiting to happen.\n\n**Plan if we pick Postgres.**\n\n1. Create `sessions`\
    \ table and index; ship dual-write behind a flag (1 week).\n2. Backfill the 312k sessions active in\
    \ the last 7 days; let older ones lapse.\n3. Dual-write for 30 days, comparing reads in shadow mode.\n\
    4. Cut reads over region by region, us-east last.\n5. Downsize the Redis cluster to cache-only, renegotiate\
    \ at the smaller tier.\n\n**My recommendation.** Postgres. The latency cost is 1.2 ms at p95, which\
    \ no page\nbudget notices; the logout fix is the thing security has asked for twice. Need the\nteam\
    \ to pick one of the three, and the database owners to say whether 55% peak CPU is\nacceptable.\n\n\
    The page directory is not reachable from here, so reply with the complete `<main>`\nelement, and any\
    \ `<style>` the page needs, rather than writing a file.\n"
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-page-authoring
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/page-authoring\.md
- type: llm-rubric
  metric: judgment
  value: |
    Read the HTML as a reader who goes top to bottom without opening anything. Content
    is hidden if it sits inside a `<details>` without the `open` attribute, inside an
    element carrying `collapsed` or `hidden`, or in an `lf-tabs` panel other than the
    one shown first. Pass only if none of these is hidden: the recommendation
    (Postgres), each of the three options and what tells them apart, the risks, and
    the five steps of the Postgres migration plan. Raw measurements, such as the daily
    latency series, the full measurement list, or method notes, may be hidden. Fail if
    the plan's steps, or any of the options or risks, are hidden.
