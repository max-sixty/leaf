# Added with the one-row workspace header (#1301). Base at cd1d37b0d 0 of 3 (one run
# put a lede in the header), the change 3 of 3.
# Those historical scores required particular header contents and density-working.
# The current rubric judges usable working space and understandable context instead.
description: workspace-header-is-one-row
metadata:
  purpose: "Writing a workspace: context leaves room to read and decide in the working regions."
  tags:
    - layout
vars:
  prompt: |
    Write a Leaf page for the user as a workspace. It reviews 14 flaky tests from last
    week's CI: a list of the tests on the left, ordered by how often each failed, and on
    the right the selected test's failure log excerpt with a choice of what to do with it
    (quarantine, fix now, or delete). Three are already quarantined and five fail more
    than half the time; the page should say so. The user reads it on a laptop at about
    1280 by 800, and asked you to explain in a sentence or two what the page is for and
    what you will do once they have chosen.

    The page directory is not reachable from here, so reply with the complete
    `index.html`, rather than writing a file.
assert:
  - type: llm-rubric
    metric: working-space-and-context
    value: |
      Read the HTML and CSS as the user reviewing tests on the requested laptop.
      Pass if the list and selected test's evidence and decision are usable together,
      with room to read the log and reach its actions, and the page explains its purpose
      and what follows the choices. The reported counts must also be available.
      Fail if introductory or status material crowds the working regions so the user
      cannot read and decide there, or if the requested explanation is omitted or hidden
      away from the working view. Judge the space and information the design gives the
      user, not the header's tag names, number of rows, or a particular density class.
variants:
  shared-instruction:
    metadata:
      purpose: A rule applying to every review choice remains available while the reader works across items.
      authoring: true
      tags: [layout, asks]
    vars:
      prompt: |
        Write a Leaf workspace for reviewing 14 flaky tests from last week's CI on a
        laptop at about 1280 by 800. Put the test list beside the selected test's log
        and its Quarantine, Fix now, or Delete decision. Three are already quarantined
        and five fail more than half the time; make these counts available.

        Explain what the workspace is for and this shared rule: "Choices save proposals
        only. Nothing changes in CI until I submit the whole review." Keep that rule
        available while I switch tests and read long logs, so I can tell what choosing
        Delete will do without searching another test or opening help. Include the
        action that submits the review. Keep enough room to read the selected test's
        evidence and make its decision.
    assert:
      - type: javascript
        metric: shared-rule-during-review
        value: file://../dev/leaf_dev/authoring_assertion.mjs
        config:
          rubric: |
            At the requested 1280 by 800 laptop viewport, switch tests and read a long log. The
            rule that choices save proposals and CI changes require whole-review submission
            remains visible, and list/evidence/decisions remain usable together. Choose Delete
            for one test, switch away and back, and reload: the proposal remains saved in Leaf
            state. Complete remaining choices if required, then Submit; verify the complete
            review is recorded as a canonical Leaf submission and handed to the agent, with its
            proposal values preserved after reload. A button that only changes local browser
            state, writes localStorage, or announces success without a Leaf submission fails. No
            real CI side effect is required for this illustrative task. Do not prescribe
            header/footer/pane/tag location. Observe canonical proposal and submission state
            through the page server as well as visible UI; reload alone can preserve
            browser-local state. The page server's /api/state is available through browser
            fetch. Do not infer submission from its confirmation label alone.
