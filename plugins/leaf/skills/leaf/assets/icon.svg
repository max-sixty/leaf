<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="leaf">
<!-- A page with one line marked and a comment in its margin: the gesture the
     whole product is. Transparent, and the two palettes are the values
     theme.css states for paper, muted, accent and the mark, spelled out because a
     favicon cannot link a stylesheet.

     The margin comment is `lf-tone`, and that is a contract with the runtime:
     a served page paints this element in whatever colour the banner's dot is
     wearing, so the tab says what the leaf is doing (paintTab). A layer
     overriding this file keeps the class or the tab stops saying anything. -->
<style>
  .page { fill: #faf9f5; stroke: #6f6a60; }
  .line { stroke: #6f6a60; }
  .mark { stroke: #dfd1ed; }
  .lf-tone { fill: #2f5480; }
  @media (prefers-color-scheme: dark) {
    .page { fill: #191815; stroke: #a09889; }
    .line { stroke: #a09889; }
    .mark { stroke: #6152a0; }
    .lf-tone { fill: #8fb0d8; }
  }
</style>
<rect class="page" x="3.5" y="3.5" width="18" height="25" rx="2.5"
      stroke-width="2"/>
<path class="mark" d="M8 16 h9" stroke-width="4" stroke-linecap="round"/>
<g class="line" stroke-width="2" stroke-linecap="round">
  <path d="M8 10 h9"/>
  <path d="M8 16 h9"/>
  <path d="M8 22 h5"/>
</g>
<path class="lf-tone" d="M23 11 h6 a2 2 0 0 1 2 2 v5 a2 2 0 0 1 -2 2 h-3 l-3 3 v-3
      a2 2 0 0 1 -2 -2 v-5 a2 2 0 0 1 2 -2 z"/>
</svg>
