# Native authoring-scope comparison (2026-10-14, Codex): base 0/3, candidate 3/3.
description: page-css-names-leaf-controls
metadata:
  purpose:
    "Restyling Leaf's controls requires an explicit native CSS scope, while ordinary
    page rules stop at Leaf controls. A local sizing request leaves other surfaces alone."
  tags:
    - theme
vars:
  prompt: |
    You are revising a Leaf page for the user. It has a triage board
    (`<lf-board id="triage">` with three columns of cards) and, below it, an Ask whose
    answer is an `<lf-options id="next-step" choose>` with three options. The page's own
    `<style>` is empty.

    The user commented on the board: "The buttons on the board and the pick buttons in
    the question are too small for me to hit on my trackpad. Make those bigger. Leave
    the rest of the page as it is."

    The page directory is not reachable from here, so reply with the complete `<style>`
    element the page needs, rather than writing a file.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Read the CSS. Pass only if the rules enlarging the board and options controls
      are inside explicit native @scope blocks that select the requested widgets or
      regions, such as @scope (lf-board, lf-options). A bare button rule inside such
      a scope is valid. A selector naming the widget without an explicit scope cannot
      reach generated controls and fails. Also fail if the enlargement reaches unrelated
      page or chrome controls, or changes the page-wide type scale or size tokens read
      by every surface when the user asked to leave the rest of the page as it is.
