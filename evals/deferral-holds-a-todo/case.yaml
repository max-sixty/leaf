# From a review page on 2026-10-19: the user commented on a case's section, "we're
# changing the backing box, so push this off until that's done", and the agent answered
# `--done` with "Held: ... stays an open item until then", keeping the deferral in its
# own closeout's open items. Nothing on the page held it, so the case's decision stood on
# On me while the user had put it off. The prompt pastes the closeout rule that pulled
# that way. Cold, both arms reply with a to-do. At 4782f9761, where the to-do left the
# decision on On me, all 3 base runs also withdrew `c13-pick` in a revision and planned
# to ask again under a new id; with the to-do holding the decision, all 3 candidate runs
# left the widget alone. Those 6 runs were graded on a rubric without the withdrawal
# clause, and read by hand for it.
description: deferral-holds-a-todo
metadata:
  purpose: "Conversation loop: a decision the user puts off until other work lands is
    held by a to-do on their thread, not by the agent's own notes, so it stays off On
    me until the agent ends the to-do."
  tags:
    - wait-loop
vars:
  prompt: |
    You are a Claude Code session driving a live Leaf review page at
    ~/.local/state/leaf/pages/ui-review, served with `leaf server start`. Section `c13`
    of the page presents one design case, with an `lf-options` group `c13-pick`
    (`choose`, options "Build it" and "Leave it") asking whether to build it. The user
    picked "Build it", then cleared the pick, and the delivery brought one user comment,
    id da47301f, opening thread da47301f on section `c13`: "we're changing the backing
    box, so push this off until that's done". Its answer is
    `{kind: reply, writer: agent, ref: "5d02c7e1:0:da47301f"}`.

    The backing-box change is another session's open pull request; you will hear when it
    merges. Your own instructions for ending a turn say:

    > Each thing the user asked for and hasn't got, each follow-up the work uncovers,
    > and each decision waiting on them is its own open item. It stays open through
    > narrower questions, handoffs, and compaction until it's done, decided, or handed
    > over. List open items at the end of your reply in the terminal.

    Read whatever instructions you need. Only Skill and Read run here, so write out, in
    order, each command you would run on the page in this turn, and what you would do on
    the page once you hear the backing-box change has merged.
assert:
  - type: llm-rubric
    metric: judgment
    value: |
      Pass only if this turn answers da47301f with `leaf thread reply` carrying
      `--todo "<title>"` (or otherwise opens a to-do on that thread) that holds the c13
      decision until the backing-box change lands, and if, once it merges, the agent
      ends that to-do with `leaf task end` so the decision comes back to the user
      (revising the case first is fine). Fail if the reply is `--done` or carries no
      to-do, leaving the deferral only in the agent's own notes or open items, or if the
      decision is never put back to the user. Fail too if this turn withdraws,
      restates or removes `c13-pick` to take it off On me: the user put the decision
      off, not away, and the to-do is what holds it.
