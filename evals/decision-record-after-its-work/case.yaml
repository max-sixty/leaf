            </lf-ask>

            <lf-ask id="transcript-question">
              <h3>Should find-in-page reach folded thread messages?</h3>
              <p>
                A thread folds older messages with plain <code>hidden</code>, which find
                can't see, and unfolds one for Leaf's travel through an internal hook,
                <code>revealedBy</code>, whose only user is the transcript. Folding with
                <code>until-found</code> instead lets ⌘F find and unfold a folded message
                and deletes that second reveal mechanism. It costs teaching about five thread
                readers that an until-found message isn't shown (which message is first,
                where a reply lands). I'd make the change.
              </p>
              <lf-options id="transcript-folds" choose>
                <lf-option id="transcript-folds-hidden">
                  <small class="tag">today</small>
                  <strong>Find skips folded messages</strong>
