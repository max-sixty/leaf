name: tend-review-runs
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

jobs:
  review-runs:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --no-dev playwright install-deps webkit
        name: Install WebKit's system libraries

      - uses: max-sixty/tend/claude@0.2.10
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: leaf-agent
          model: opus
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          sandbox_setup: |2
            uv sync --frozen
            uv run playwright install chromium webkit --only-shell
            uv run python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.webkit.launch().close(); p.stop()"
          prompt: |2
            /tend-ci-runner:review-runs
