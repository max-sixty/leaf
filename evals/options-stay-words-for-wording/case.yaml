# Guardrail for options-draw-their-arrangement: on the same layout-shift page, a choice
# between two messages differs only in wording, so its options stay words. With the
# child reading the registry entries, base 4c29f3003 and the drawn-option entry both
# kept every option words (3 of 3).
# Under the earlier labels-first rubric, the label/recommendation checks failed at
# e9c98892c (0/2) and passed with comparison labels first and literal recommendation
# markup (2/2); matching the source's high effort reproduced that contrast.
# d38eba87a later left label placement to the author, but this case and the registry
# retained the old sequence. They now follow the adopted goal: the alternatives'
# factual difference is apparent from titles or labels, including candidate wording
# used as titles. Saved-output calibration accepts both title forms and rejects
# indistinguishable titles, a recommendation on the wrong option and an invented pick.
# Those calibration results are rubric checks, not new authoring samples or evidence
# of general instruction reliability.
# Once SKILL.md asked every page for pictures, the section drew the 68px shift above
# the options (2/2) while the options stayed words; options-draw-nothing alone judges
# the drawing, so comparison-labels no longer forbids a figure outside the options.
# reason-beside-options: while the registry's examples wrote the reason into the
# recommended card (`<em>My take: …</em>`), base 2c52f93ec kept it out of the cards
# in 1 of 5 Claude Code runs; with the reason in the lf-ask's prose, 5 of 5.
description: options-stay-words-for-wording
metadata:
  purpose:
    "Asks: when the alternatives differ only in wording, each lf-option stays a title and a sentence,
    with no drawing."
  tags:
    - asks
    - drawing
vars:
  prompt: |
    You are writing a Leaf page that records the layout shifts left in Leaf's
    widgets, one section per item, each ending in a question for the user. Write
    the section for this item, after reading the `lf-ask`, `lf-options` and
    `lf-option` entries in `../../packages/default/registry.json` relative to the skill's base
    directory.

    Your notes:
    - Item #14: `leaf page check --render` will report a widget whose box changes
      size between first paint and presentation. It reports, and never fails the
      check.
    - The user decides what the report says. Two wordings:
      - "lf-diff grew 68px after it upgraded; give it its final size before
        upgrade." (your recommendation: it names the widget, the size and the fix);
      - "Layout shift at upgrade: lf-diff (68px)." (shorter, and matches the other
        render findings' form).

    The page directory is not reachable from here, so reply with the section's HTML
    fragment rather than writing a file.
assert:
  - type: llm-rubric
    metric: options-draw-nothing
    value: |
      Pass only if each `lf-option` in the wording choice is words: its labels, a
      title and a sentence or two, with the wording itself as text or code. Fail if
      any option holds a drawing of the report, such as an inline `<svg>`, an `<img>`,
      an `lf-diagram`, or an HTML mockup of how the finding would look.
  - type: llm-rubric
    metric: comparison-labels
    value: |
      Pass only if titles or comparison labels make the alternatives' factual
      distinction clear without reading their explanatory prose, for example actionable
      detail versus concise reporting. The candidate wording itself may supply the
      title when it shows that distinction.
      Labels need not duplicate information already supplied by titles, nor appear in
      a fixed order. Only the detailed, actionable wording has a recommended small.tag.
      Neither option has chosen, since the user has not picked.
  - type: llm-rubric
    metric: reason-beside-options
    value: |
      Find why the author recommends the detailed wording. Pass only if that reason is
      prose outside every `lf-option`, such as a paragraph in the `lf-ask` before or
      after the `lf-options` group. Inside the cards, each option may state its own
      properties and consequences at a similar depth, such as naming the widget or
      matching the other findings' form. Fail if any `lf-option` holds the author's
      argument for picking it, such as "My take: …", "I'd pick this", or "recommended
      because …", even when the same reason also appears outside, and fail if the
      reason is missing.
