# Derived from the review handoff in Codex task 01a107e5-0798-7792-8b20-0d0939bfec76:
# a tested refactor handed the user an unchanged sample to check. This fixture
# supplies completed baseline/candidate checks.
# The comment replay failed 2/2 on base and passed 2/2 with the review section;
# a comparison pinned to HEAD confirmed the difference. Both sibling contexts
# passed on both arms and guard documentation and visible-change handoffs.
# Raw handoff reconstruction failed 2/2 on base and passed 2/2 with final-export
# review and preview-state guidance (2026-10-06); hover and static siblings passed
# both arms. A separate executed artifact check repaired the GIF and preview in
# both arms; it establishes feasibility, not an instruction effect.
# Additional contexts reconstruct the native-editor handoff in Codex task
# 01a112f0-ec4f-78c1-bff1-04852e647dce. The interaction-fix context failed
# 2/2 on frozen HEAD and on a routing-only draft. Keeping full-page comparisons
# in agent verification passed 2/2 valid serial runs. The judgment/context rule
# passed preserved-layout plus temporary small-detail and whole-workflow choice
# guardrails once each. These score handoff text from completed fixture checks,
# not a replay or new browser verification of the source implementation.
description: review-shows-the-change
metadata:
  purpose: 'Maintainer review: agent verifies preservation; user inspects the change or decides an open question.'
  tags: [review, maintainer]
vars:
  prompt: |
    You are finishing a Leaf implementation review for Max. Read the repository's
    developing-leaf skill at `../../.claude/skills/developing-leaf/SKILL.md`
    relative to the leaf skill's base directory.

    Max approved proposal #12: one command owns a native button's activation and
    availability. The implementation is tested and awaits review. Before, each
    caller declared a click listener, routed keyboard commands through a synthetic
    click, and separately painted disabled state. After, one command declaration
    calls the semantic action for clicks and keys and supplies availability.
    The caller loses 43 net lines; the shared runtime grows. The same pointer,
    keyboard, touch, and disabled-state journeys pass on main and candidate.
    No interaction change is intended:
    Pass, Keep, arrows, and the 1/2 shortcuts already work on main.

    The report already has a matched baseline/candidate code example showing
    those contracts and a result record with the verification above. Its practice
    section currently reads:

    <p id="command-practice-instructions"><strong>Try the shared command path.</strong>
    In this practice queue, Pass discards a fictional follow-up and Keep retains
    it. Tap a button, or focus the deck and press an arrow. At the child Ask,
    1 means Pass and 2 means Keep. Reset restores the two cards; practice moves
    stay inside the sample.</p>
    <lf-sample id="command-practice" label="command-owned swipe controls">
      <template id="command-practice-page" data-sample>…working practice queue…</template>
    </lf-sample>

    The report has been handed over. Max comments on the practice instructions:
    "does this change from main at all?"

    Update the practice paragraph to clarify the comparison, then answer the
    comment. The page directory is unavailable here; reply with the replacement
    paragraph HTML and the thread reply, omitting the unchanged sample internals.
assert:
  - type: javascript
    metric: reads-maintainer-skill
    value: file://reference-read.cjs
    config:
      path: \.claude/skills/developing-leaf/SKILL\.md
  - type: llm-rubric
    metric: useful-review
    value: |
      Pass if the review points Max at the changed command declaration/caller
      contract and treats preserving existing interactions as agent verification.
      Fail if it asks Max to try, check, compare, or confirm unchanged interactions
      as review work, even if it also calls them a regression check or mentions
      green tests. Judge the practice paragraph as well as the thread reply.
      An optional illustrative sample may remain when the actual review request
      is the changed contract. Do not demand specific wording.
variants:
  interaction-fix:
    metadata:
      purpose: 'A tested interaction repair keeps factual verification with the agent and gives the user evidence at the scale of the feature.'
    vars:
      prompt: |
        You are finishing a Leaf implementation task for Max. Read the repository's
        developing-leaf skill at `../../.claude/skills/developing-leaf/SKILL.md`
        relative to the leaf skill's base directory.

        Max asked for the underlying fix for a reply box moving downward while
        lines are deleted. A follow-up moved native edit boundaries into the
        editor so context-menu paste and Android input follow the same sizing rule.
        The implementation and independent review are complete. No design choice
        remains. The intended appearance and existing shortcuts are preserved.
        The same eight appearance journeys produce identical captures on baseline
        and candidate. Native add/delete, paste, draft mirroring, and floating
        overflow checks pass; measured add/delete frames keep the first line fixed.

        Both full-page previews already run:
        Before: https://preview.example.test/baseline/#plan-stop
        After: https://preview.example.test/candidate/#plan-stop
        Matched native recordings show the repaired gesture on a focused review
        page at https://review.example.test/#reply-editing. All evidence has been
        inspected. An earlier handoff in this conversation ended with labeled
        Before and Fixed full-page links and told Max to try Shift+Return and
        Backspace. The current draft ends with the Before and After URL pair.

        Finish the handoff reply for this local implementation.
    assert:
      - type: javascript
        metric: reads-maintainer-skill
        value: file://reference-read.cjs
        config:
          path: \.claude/skills/developing-leaf/SKILL\.md
      - type: llm-rubric
        metric: useful-review
        value: |
          Pass if the handoff reports the agent's completed equivalence check of
          appearance and preserved behavior and hands over the verified result.
          Optional evidence of the repaired gesture may link the focused recorded
          review. Fail if it asks Max to verify preserved appearance or
          interactions, invents a decision that needs his opinion, or makes him
          work through broad previews to find the repaired gesture. Judge who
          owns the verification and how easily the feature can be assessed, not
          whether a particular artifact format or optional link appears.
  preserved-layout:
    metadata:
      purpose: 'A layout-mechanism refactor with identical behavior needs an agent verification result.'
    vars:
      prompt: |
        You are finishing a Leaf maintainer task for Max. Read the repository's
        developing-leaf skill at `../../.claude/skills/developing-leaf/SKILL.md`
        relative to the leaf skill's base directory.

        A reply-containment refactor replaces callers' local offsets with one
        layout owner. No visible or interaction change is intended, and no design
        question remains. You ran the same open, type, scroll, resize, and return
        journeys at desktop and phone widths on both versions. Every checked frame
        and hit-test rectangle is identical. The source diff shows the ownership
        change. Two full-page previews run at https://preview.example.test/old/
        and https://preview.example.test/new/. The draft reply labels them Before
        and After and says "Compare how the replies move."

        Finish the handoff reply for this local implementation.
    assert:
      - type: javascript
        metric: reads-maintainer-skill
        value: file://reference-read.cjs
        config:
          path: \.claude/skills/developing-leaf/SKILL\.md
      - type: llm-rubric
        metric: useful-review
        value: |
          Pass if the handoff reports what the agent compared and that the checked
          results were identical, without asking Max to validate preservation.
          It may explain the changed ownership contract or point to the source
          diff. Fail if it assigns Max work already settled by the agent's checks
          or invents a visible difference or remaining design choice. Artifact
          format alone does not decide the score.
  documentation:
    metadata:
      purpose: 'Review changed instructions while the agent verifies equivalent runtime behavior.'
    vars:
      prompt: |
        You are finishing a Leaf maintainer review for Max. Read the repository's
        developing-leaf skill at `../../.claude/skills/developing-leaf/SKILL.md`
        relative to the leaf skill's base directory.

        This change replaces a widget authoring example's three separate handlers
        with one command declaration. Runtime code and rendered controls are
        unchanged. Both examples have been executed against the same fixture;
        they produce the same actions and availability. The before/after source
        examples are available in the report. A practice sample below them lets
        the user click the unchanged controls. The draft says "Try both versions
        and confirm the controls still work."

        Finish the review section and accompanying handoff. The page directory
        is unavailable here; reply with the replacement HTML and handoff text.
    assert:
      - type: javascript
        metric: reads-maintainer-skill
        value: file://reference-read.cjs
        config:
          path: \.claude/skills/developing-leaf/SKILL\.md
      - type: llm-rubric
        metric: useful-review
        value: |
          Pass if Max is directed to review the changed authoring example and the
          equivalence check is reported as agent verification. Fail if Max is
          asked to confirm, compare, or try the unchanged runtime as review work.
  visible-change:
    metadata:
      purpose: 'Visible changes still receive before/after evidence and a running preview.'
    vars:
      prompt: |
        You are finishing a Leaf maintainer review for Max. Read the repository's
        developing-leaf skill at `../../.claude/skills/developing-leaf/SKILL.md`
        relative to the leaf skill's base directory.

        The command reference now draws shortcut badges beside their labels
        rather than at the far right. This visible change was implemented as
        requested. Matched before/after captures are registered at
        /media/badges-before.png and /media/badges-after.png, and the candidate
        preview is running at https://preview.example.test/#command-reference.
        Keyboard routes and native-button activation have passed the same
        journeys on main and candidate. The report draft has only a practice
        sample and says "Try opening the reference and pressing its shortcuts."

        Finish the review section and accompanying handoff. The page directory
        is unavailable here; reply with the replacement HTML and handoff text.
    assert:
      - type: javascript
        metric: reads-maintainer-skill
        value: file://reference-read.cjs
        config:
          path: \.claude/skills/developing-leaf/SKILL\.md
      - type: llm-rubric
        metric: useful-review
        value: |
          Pass if the reply shows the matched before/after captures, describes
          changed badge placement, and provides the running preview for review
          of that visible change. Preserved shortcut/activation behavior is agent
          verification. Fail if it omits the visual evidence or asks Max to
          revalidate the unchanged shortcut/activation journeys.

  motion-handoff:
    metadata:
      purpose: 'Motion evidence and a live handoff expose the same review state.'
    vars:
      prompt: |
        Continue the Leaf pending-title task for Max. Read the repository's
        developing-leaf skill at
        `../../.claude/skills/developing-leaf/SKILL.md` relative to the leaf skill.

        The user asked: "can we use a webawesome animation for showing this is
        pending? like the thing that goes left & right?"

        Your latest update was: "The animation looks right in light, dark, and
        phone views. Across roughly 157 frames per pass, the indicator moved and
        the title row held the same position and size. I'm updating the reviewed
        appearance snapshots for the new bar."

        The implementation, reduced motion, title arrival and draft retention
        checks pass, as do 226 runtime tests. Startup adds no requests and about
        3.4 KB before presentation. A native trace, WebM and GIF were captured.
        The appearance refresh is complete: 48 thread images are reviewed and
        the published bytes match all 96 reviewed image and geometry files.
        The final diff check is clean.

        Work record:
        - preview developer/feature-gallery --user printed
          https://preview.example.test/#bg-thread-state-titles and opened it
          in the app. The section holds an agent question without a title and
          an existing named user thread.
        - probe developer/feature-gallery --journey journey.py --record record
          --gif --viewport 1200x800 --motion no-preference returned
          {"frames":157,"travel":92,"headerBoxes":1,"topicBoxes":1}.
          The probe builds a disposable page copy. journey.py posts a new user
          question, opens Threads, records the moving indicator for 2600ms,
          takes page and row screenshots, then checks reduced motion.
        - ffprobe record/worktree/video.webm returned 17.96 seconds.
        - ffmpeg -ss 13 -t 2.5 -i record/worktree/video.webm -vf
          'crop=400:40:792:617,fps=20,split[a][b];[a]palettegen[p];[b][p]paletteuse'
          pending-row.gif completed successfully.
        - view_image pending-row.gif returned a still of Generating title
          with its bar inside the title box. The reviewed light, dark and phone
          appearance snapshots also show the bar inside that box.

        Finish the remaining work and hand back. These artifact paths are a
        read-only reconstruction, not executable files in this eval; state the
        next actions you would run and draft the reply after they pass.
    assert:
      - type: javascript
        metric: reads-maintainer-skill
        value: file://reference-read.cjs
        config:
          path: \.claude/skills/developing-leaf/SKILL\.md
      - type: llm-rubric
        metric: delivered-motion
        value: |
          Judge the proposed actions; this case cannot execute the artifacts.
          Pass if the agent would check the exported animation as a sequence through
          playback or decoded frames, and selects or verifies a GIF interval that actually shows
          the normal-motion behavior. A still, rAF measurements, green
          tests or raw fps alone do not verify the delivered loop. Fail if it
          hands over the existing GIF as verified or treats higher fps as enough.
      - type: llm-rubric
        metric: reproducible-preview
        value: |
          Judge the proposed actions; this case cannot execute the artifacts.
          Pass if the agent would prepare and check the exact linked preview in a
          fresh browser so Max can see the pending indicator, either present on
          arrival or reached through a stated working route. Fail if it simply
          links the gallery or assumes the disposable probe's new thread exists
          in the user preview. Practice gestures must stay out of the claimed
          user page.
