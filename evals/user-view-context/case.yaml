# Added for the 2026-10-02 actual-view context capability. This case asks about
# the shipped reading, without supplying its fields or a preferred layout.
description: user-view-context
metadata:
  purpose: 'Handoff: explains the available actual browser context while leaving composition to its author.'
  tags:
  - handoff
  - view-context
vars:
  prompt: |
    You authored a Leaf report, already handed over and open in the user's browser.
    The user asks: "Rather than trying at every width, could we observe what width
    I'm using and adapt to that? Start with context for the agent, not rules."
    Explain what Leaf already makes available and where you would read it. The
    user may have two visible browser windows, and you have revised the report
    since the first handover. Do not invent an observed width.

    Use the leaf skill and read the instructions that own this workflow.
    Only Skill and Read run here; write the requested answer in your reply.
assert:
- type: javascript
  metric: loads-leaf
  value: file://reference-read.cjs
  config:
    path: skills/leaf/SKILL\.md
- type: javascript
  metric: reads-conversation-loop
  value: file://reference-read.cjs
  config:
    path: skills/leaf/references/conversation-loop\.md
- type: llm-rubric
  metric: actual-view-context
  value: |
    The answer identifies user_views in leaf page state as the reading of actual
    browser documents, with viewport sizes. It preserves distinct visible tabs or
    windows, and explains checking freshness and revision identity before treating
    a reading as the user's current view. It describes passive check findings as
    author context that leaves composition to the agent, not a mandate or a complete
    substitute for the headless render gate. It invents no current width.
