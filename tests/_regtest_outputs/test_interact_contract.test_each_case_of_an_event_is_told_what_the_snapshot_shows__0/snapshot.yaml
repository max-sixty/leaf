# What the agent is told when a user acts on a page
# ===================================================
#
# A test records this file; nobody writes it by hand. The lines starting with `#`
# explain it, and everything else is the recorded data. The walkthrough below is
# one real run: the test serves a page, posts a comment to it the way the browser
# does, and runs `leaf wait`. Only the id, the times and the page's path are
# pinned, so the file stays the same from run to run.
#
# How this text reaches the agent, by example
# -------------------------------------------
#
# 1. The page's `plan` section reads "The nightly backfill moves to Tuesdays so it
#    stops colliding with the report run." The user selects "moves to Tuesdays"
#    and comments "why here?". The page's JavaScript sends this to the page's
#    server as POST /api/event:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015"}
#
# 2. The server checks the comment against the page, adds who wrote it (`author`),
#    when (`ts`) and an `id`, and appends it to the page's event log, events.jsonl,
#    as this one line:
#
#      {"kind": "comment", "revision": 1, "text": "why here?", "anchor": {"section": "plan", "quote": "moves to Tuesdays"}, "attempt": "9f86d081884c7d659a2feaa0c55ad015", "author": "user", "id": "1946b466", "ts": "2026-09-21T20:12:30-07:00"}
#
# 3. Earlier, the agent started `leaf wait` in the background and went idle. The
#    agent does nothing in this step: `leaf wait`, a leaf process, notices the new
#    line and builds a delivery for it. The comment is owed a reply, which the
#    delivery records as its `answer` (step 4): a `reply` for `leaf thread reply` here,
#    where the Codex App Server route would record a `turn`, which the turn's own
#    messages write. For the instructions, `leaf wait` reads the clauses under
#    `$events.handling.comment` in the page's copy of registry.json, then those
#    under `$events.answering.reply`, the answer it owes. Each clause has a `text`
#    and may have a `when`, a JSON Schema that must hold for the clause to apply.
#    It is tested against the log line together with its `answer` and its
#    `thread`'s entry in the delivery's `threads` (step 4). There are
#    9; here they all are, with whether the comment satisfies each `when`:
#
#      clause 1, does not apply:
#        when: {"required": ["drawing"]}
#        text: The user drew on the page. `drawing.says`, when present, holds the
#              page's words from the first to the last inside the ink's extents: the
#              neighbourhood of the mark rather than the mark, so an arrow across a
#              paragraph says the whole paragraph. It is absent where the extents hold
#              no words, as over a picture or in a margin. On a drawing anchored to an
#              element, `drawing.strokes` are offsets from that element's top-left
#              corner and `drawing.box` is its width and height, so a stroke's share
#              of the box says which part of a picture it marks; a drawing on the
#              whole page has no `box`, and its offsets start at the page's top-left
#              corner. Any `text` explains the mark. Otherwise it is an ordinary
#              comment, answered the same way.
#      clause 2, does not apply:
#        when: {"required": ["text"], "properties": {"text": {"pattern": "\\]\\(/media/"}}}
#        text: The message carries an image as a Markdown link to
#              `/media/<digest>.<ext>`, a path under the page directory the batch
#              names. Open the image itself before answering: its alt text is a label,
#              not a description of what it shows.
#      clause 3, does not apply:
#        when: {"required": ["suggestion"], "properties": {"suggestion": {"const": true}}}
#        text: A suggestion proposes exact replacement text. Apply it verbatim, or
#              reply with your reason for declining.
#      clause 4, does not apply:
#        when: {"required": ["about"], "properties": {"about": {"const": "design"}}}
#        text: A design comment is about how the page looks or behaves rather than
#              what it says. Its anchor's `section` is a widget's id or, when it
#              starts `lf-`, a part of Leaf's own chrome, such as `lf-banner`,
#              `lf-threads` (the Threads panel), `lf-asks`, `lf-versions` or
#              `lf-composer`; `part`, when present, names the control the click landed
#              on. Find the source that produces what it names and fix it in this
#              page's own source, unless the behavior belongs to a package's widget or
#              the user asks for a wider fix: then change the package as the Leaf
#              skill's `references/packages.md` says, re-vendor, and note the
#              re-vendor on the stamp. A fix that belongs in Leaf itself is the user's
#              to raise, as the Leaf skill's "Improve Leaf through use" says. The
#              stamped version that carries the fix is the result the reply reports.
#      clause 5, applies:
#        when: {"required": ["thread"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}}, "not": {"required": ["token"]}}
#        text: This event's thread has no title yet: name it with `leaf thread title
#              <page> <thread-id> --text "<a few words>"`, so the thread panel lists
#              its subject rather than its opening words.
#      clause 6, does not apply:
#        when: {"required": ["token"]}
#        text: A reaction is a mark, not a question. Read the token and the `means`
#              its package gives, if any, and act on it if it calls for a change;
#              reply only if its meaning is unclear. Once the page reflects it, close
#              it with `leaf thread resolve <page> --to <event-id>`. It never blocks
#              publishing a version, and it does not wait on an answer.
#      clause 7, applies:
#        (no `when`, so it always applies)
#        text: Answer with `leaf thread reply <page> --for <event-id>` before any
#              other work, including the work this event asks for: give the answer, or
#              say what you are about to do and where the result will appear. When
#              work follows, name it on the page in the same command, as in `leaf
#              thread reply <page> --for <event-id> --text "…" && leaf status <page>
#              working "<the work, in a line>" --on <address>`, where `<address>` is
#              the event's `answer.to`: the line stands beside the thread and in the
#              banner until your next reply there. Once that work lands, put its
#              result on the page, with whatever shows it (captures, a figure, the
#              numbers), then report it with `leaf thread reply <page> --to
#              <address>`: what changed, in a sentence or two, linking the section
#              that shows it. The page carries the work, and the thread only the
#              conversation about it. `leaf thread reply` checks any saved page edit
#              and makes it live before posting. If a revision removes what the thread
#              is anchored on, move the thread in the reply that reports it with
#              `--section <id>` (narrowed by `--quote` or `--part` if needed), or
#              `--detach` it if its subject has left the page. Add `--awaits` only if
#              your reply's prose asks the user something.
#      clause 8, applies:
#        (no `when`, so it always applies)
#        text: Your reply renders as Markdown, so show code or markup in a fenced
#              block.
#      clause 9, does not apply:
#        when: {"required": ["meaning"], "properties": {"meaning": {"required": ["scope"], "properties": {"scope": {"const": "thread"}}}}}
#        text: The widget is in a thread message: continue the work the user's answer
#              selects or unblocks, and answer in that thread.
#
# 4. `leaf wait` prints the delivery as JSON and exits. The agent's host hands that
#    output to the agent as the result of the background command, which wakes it.
#    The delivery's event is the log line from step 2 less `attempt`, the
#    browser's retry key, and with these fields added:
#    `seq`, `subject`, `threads`, `handling` and `answer`.
#    The batch's `handling` maps clause ids to their text, each distinct text
#    appearing once. The event's `handling` names its applicable clauses in order.
#    The envelope's `acknowledge` says once, for the whole delivery, how the agent
#    confirms it. The whole output, indented here (leaf prints it on one line):
#
#      {
#        "format": "leaf-delivery-v3",
#        "id": "e8417b8a-6e03-45ad-b7bd-c0f0eceb1a92",
#        "created_at": 1790046750.29,
#        "carrier": "wait",
#        "acknowledge": "Whoever ran the `leaf wait` that printed this delivery acknowledges it; until then the user's moves read Sent rather than Picked up. If the output was cut off, acknowledge nothing and rerun the wait with room for the whole envelope. If you handle it, acknowledge before any other work; if you forward it, acknowledge once it durably arrives there. To acknowledge, start `leaf wait --ack e8417b8a-6e03-45ad-b7bd-c0f0eceb1a92` as the next background task: it confirms this delivery and waits for the next.",
#        "batches": [
#          {
#            "page": "/path/to/page",
#            "through_seq": 2,
#            "threads": [
#              {
#                "id": "1946b466",
#                "title": null,
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "detached_from": null,
#                "resolved": null,
#                "elided": {
#                  "messages": 0,
#                  "actions": 0
#                },
#                "messages": [],
#                "summaries": [],
#                "actions": []
#              }
#            ],
#            "handling": {
#              "h1": "This event's thread has no title yet: name it with `leaf thread title <page> <thread-id> --text \"<a few words>\"`, so the thread panel lists its subject rather than its opening words.",
#              "h2": "Answer with `leaf thread reply <page> --for <event-id>` before any other work, including the work this event asks for: give the answer, or say what you are about to do and where the result will appear. When work follows, name it on the page in the same command, as in `leaf thread reply <page> --for <event-id> --text \"\u2026\" && leaf status <page> working \"<the work, in a line>\" --on <address>`, where `<address>` is the event's `answer.to`: the line stands beside the thread and in the banner until your next reply there. Once that work lands, put its result on the page, with whatever shows it (captures, a figure, the numbers), then report it with `leaf thread reply <page> --to <address>`: what changed, in a sentence or two, linking the section that shows it. The page carries the work, and the thread only the conversation about it. `leaf thread reply` checks any saved page edit and makes it live before posting. If a revision removes what the thread is anchored on, move the thread in the reply that reports it with `--section <id>` (narrowed by `--quote` or `--part` if needed), or `--detach` it if its subject has left the page. Add `--awaits` only if your reply's prose asks the user something.",
#              "h3": "Your reply renders as Markdown, so show code or markup in a fenced block."
#            },
#            "events": [
#              {
#                "kind": "comment",
#                "revision": 1,
#                "text": "why here?",
#                "anchor": {
#                  "section": "plan",
#                  "quote": "moves to Tuesdays"
#                },
#                "author": "user",
#                "id": "1946b466",
#                "ts": "2026-09-21T20:12:30-07:00",
#                "seq": 2,
#                "subject": {
#                  "kind": "thread",
#                  "id": "1946b466"
#                },
#                "threads": [
#                  "1946b466"
#                ],
#                "handling": [
#                  "h1",
#                  "h2",
#                  "h3"
#                ],
#                "answer": {
#                  "kind": "reply",
#                  "to": "1946b466",
#                  "for": "1946b466"
#                }
#              }
#            ]
#          }
#        ]
#      }
#
# 5. The agent follows `acknowledge`: it starts `leaf wait --ack <delivery-id>` to
#    confirm receipt and wait for the next one. It follows `handling`: it replies in
#    the thread with `leaf thread reply` and edits the page if warranted.
#
# What this file records
# ----------------------
#
# Step 3, for one example of every case, using the clauses in
# skills/leaf/assets/registry.json (the file `leaf page init` copies into a page).
# Each top-level key below names a case and holds:
#
#   event:  the input: a log line's `kind`, the kind of answer its delivery
#           says it owes (`answer`), and the fields some `when` reads, its
#           `thread`'s among them, and nothing else. A field no `when`
#           names, such as a comment's `anchor` or `text`, cannot change what
#           the agent is told, so it is left out; the test checks both halves of
#           that.
#   told:   the output, the clauses that apply to that line, in order. Each
#           clause has a `text` and may have a `when`:
#   when:   the clause's `when`, exactly as registry.json writes it: a JSON
#           Schema the log line must satisfy for the clause to apply. A clause
#           with no `when` always applies, and has no `when` key here either.
#   text:   the clause's text.
#
# The walkthrough's comment is the first case. No `when` reads any field of its
# log line from step 2 except `kind`, so the case is that line cut down to `kind`,
# the reply it owes and its new thread's missing title, and it gets the
# clauses marked "applies" in step 3. It is recorded as:
#
#      comment:
#        event:
#          kind: comment
#          thread:
#            title: null
#          answer:
#            kind: reply
#        told:
#          - when: {"required": ["thread"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}}, "not": {"required": ["token"]}}
#            text: >-
#              This event's thread has no title yet: name it with `leaf thread title <page>
#              <thread-id> --text "<a few words>"`, so the thread panel lists its subject
#              rather than its opening words.
#          - text: >-
#              Answer with `leaf thread reply <page> --for <event-id>` before any other
#              work, including the work this event asks for: give the answer, or say what
#              you are about to do and where the result will appear. When work follows,
#              name it on the page in the same command, as in `leaf thread reply <page>
#              --for <event-id> --text "…" && leaf status <page> working "<the work, in
#              a line>" --on <address>`, where `<address>` is the event's `answer.to`:
#              the line stands beside the thread and in the banner until your next reply
#              there. Once that work lands, put its result on the page, with whatever shows
#              it (captures, a figure, the numbers), then report it with `leaf thread reply
#              <page> --to <address>`: what changed, in a sentence or two, linking the
#              section that shows it. The page carries the work, and the thread only the
#              conversation about it. `leaf thread reply` checks any saved page edit and
#              makes it live before posting. If a revision removes what the thread is anchored
#              on, move the thread in the reply that reports it with `--section <id>` (narrowed
#              by `--quote` or `--part` if needed), or `--detach` it if its subject has
#              left the page. Add `--awaits` only if your reply's prose asks the user something.
#          - text: >-
#              Your reply renders as Markdown, so show code or markup in a fenced block.
#
# After changing a clause, re-record this file and review the diff:
#
#   uv run pytest --regtest-reset -n0 tests/test_interact_contract.py::test_each_case_of_an_event_is_told_what_the_snapshot_shows

comment:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: reply
  told:
    - when: {"required": ["thread"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}}, "not": {"required": ["token"]}}
      text: >-
        This event's thread has no title yet: name it with `leaf thread title <page>
        <thread-id> --text "<a few words>"`, so the thread panel lists its subject
        rather than its opening words.
    - text: >-
        Answer with `leaf thread reply <page> --for <event-id>` before any other
        work, including the work this event asks for: give the answer, or say what
        you are about to do and where the result will appear. When work follows,
        name it on the page in the same command, as in `leaf thread reply <page>
        --for <event-id> --text "…" && leaf status <page> working "<the work, in
        a line>" --on <address>`, where `<address>` is the event's `answer.to`:
        the line stands beside the thread and in the banner until your next reply
        there. Once that work lands, put its result on the page, with whatever shows
        it (captures, a figure, the numbers), then report it with `leaf thread reply
        <page> --to <address>`: what changed, in a sentence or two, linking the
        section that shows it. The page carries the work, and the thread only the
        conversation about it. `leaf thread reply` checks any saved page edit and
        makes it live before posting. If a revision removes what the thread is anchored
        on, move the thread in the reply that reports it with `--section <id>` (narrowed
        by `--quote` or `--part` if needed), or `--detach` it if its subject has
        left the page. Add `--awaits` only if your reply's prose asks the user something.
    - text: >-
        Your reply renders as Markdown, so show code or markup in a fenced block.

comment over App Server:
  event:
    kind: comment
    thread:
      title: null
    answer:
      kind: turn
  told:
    - when: {"required": ["thread"], "properties": {"thread": {"required": ["title"], "properties": {"title": {"type": "null"}}}}, "not": {"required": ["token"]}}
      text: >-
        This event's thread has no title yet: name it with `leaf thread title <page>
        <thread-id> --text "<a few words>"`, so the thread panel lists its subject
        rather than its opening words.
    - text: >-
        Your turn's first and final messages are the reply, and `leaf thread reply`
        refuses this event. Before your first tool call, open with a short message
        to the user: the answer, or what you are about to do. Leaf streams it into
        the thread at once, and later working messages stay in Codex. Finish the
        reply in your final message: the answer, or what changed and where it appears.
        The reply leaves the thread on its anchor.
    - text: >-
        Your reply renders as Markdown, so show code or markup in a fenced block.

comment with a drawing:
  event:
    kind: comment
    drawing:
      format: leaf-drawing/2
      strokes: [[[0, 0], [9, 9]]]
    answer:
      kind: reply
  told:
    - when: {"required": ["drawing"]}
      text: >-
        The user drew on the page. `drawing.says`, when present, holds the page's
        words from the first to the last inside the ink's extents: the neighbourhood
        of the mark rather than the mark, so an arrow across a paragraph says the
        whole paragraph. It is absent where the extents hold no words, as over a
        picture or in a margin. On a drawing anchored to an element, `drawing.strokes`
        are offsets from that element's top-left corner and `drawing.box` is its
        width and height, so a stroke's share of the box says which part of a picture
        it marks; a drawing on the whole page has no `box`, and its offsets start
        at the page's top-left corner. Any `text` explains the mark. Otherwise it
        is an ordinary comment, answered the same way.
    - text: >-
        Answer with `leaf thread reply <page> --for <event-id>` before any other
        work, including the work this event asks for: give the answer, or say what
        you are about to do and where the result will appear. When work follows,
        name it on the page in the same command, as in `leaf thread reply <page>
        --for <event-id> --text "…" && leaf status <page> working "<the work, in
        a line>" --on <address>`, where `<address>` is the event's `answer.to`:
        the line stands beside the thread and in the banner until your next reply
        there. Once that work lands, put its result on the page, with whatever shows
        it (captures, a figure, the numbers), then report it with `leaf thread reply
        <page> --to <address>`: what changed, in a sentence or two, linking the
        section that shows it. The page carries the work, and the thread only the
        conversation about it. `leaf thread reply` checks any saved page edit and
        makes it live before posting. If a revision removes what the thread is anchored
        on, move the thread in the reply that reports it with `--section <id>` (narrowed
        by `--quote` or `--part` if needed), or `--detach` it if its subject has
        left the page. Add `--awaits` only if your reply's prose asks the user something.
    - text: >-
        Your reply renders as Markdown, so show code or markup in a fenced block.

