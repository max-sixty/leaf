bot_name: leaf-agent
harness: codex
model: gpt-6.1-sol
codex:
  auth_refresh: false
merge: yolo

# Use the same toolchain and dependency setup as the test job and local checkouts.
# This runs on the trusted checkout before the sandbox starts: system package
# installation needs privileges the agent does not have.
setup:
  - uses: ./.github/actions/setup
  # The `tend` environment's Cloudflare token reads every Worker's logs and
  # Analytics Engine events on the account and cannot change a Worker or a
  # zone (`worker/README.md`). Tend's proxy injects GitHub and harness
  # credentials, so this token reaches the agent through the job's
  # environment. Every step after this export can read it, and so can
  # anything the agent runs, which is why it comes last.
  #
  # The expression hands it only to agents answering an issue, which is when
  # `running-tend` sends an agent to the logs: `issues` and `issue_comment` on
  # an issue rather than a pull request, and every `tend-triage` run, since a
  # CI failure report and its cause issues reach triage as `workflow_dispatch`
  # runs that carry no issue in their event. Every other agent may run a pull
  # request's code: a review, a landing, and a mention on a pull request start
  # with it in the workspace, and the notifications poll reviews fork pull
  # requests. The empty value has to be the `||` arm, because
  # `cond && '' || secret` yields the secret either way.
  - name: Export the Cloudflare log token for agents that read the logs
    run: echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
    env:
      CLOUDFLARE_API_TOKEN: "${{ (github.workflow == 'tend-triage' || (github.event.issue && !github.event.issue.pull_request)) && secrets.CLOUDFLARE_API_TOKEN || '' }}"

workflows:
  triage:
    max_parallel: 10
  # Review acts on completed checks; tend-land owns later CI and landing.
  review:
    await_ci: false
  ci-failures:
    watched_workflows:
      - ci
      # A red `publish-site` leaves <https://leaf.page/> stale on whatever it
      # last built, which is invisible from the repo — worth a fix PR.
      - publish-site
